/* ---------- Hauptbereich ---------- */
function render(gewaehlt){
  const kopf = document.getElementById("kopf");
  const fussEl = document.getElementById("fussleiste");

  /* Harte Wartung: gar nichts anderes zeigen. */
  if (WARTUNG_HART){
    if (kopf) kopf.innerHTML = "";
    if (fussEl) fussEl.innerHTML = "";
    const sh = document.getElementById("shell");
    if (sh) sh.classList.add("voll");
    const demo = document.querySelector(".demo");
    if (demo) demo.style.display = "none";
    el.innerHTML = wartungSeiteHtml();
    return;
  }

  if (kopf) kopf.innerHTML = wartungBandHtml() + kopfleisteHtml() + menueHtml() + wartungTorHtml();
  if (fussEl) fussEl.innerHTML = fussleisteHtml();

  /* Der Satz unter dem Inhalt soll den echten Stand zeigen, nicht einen fest
     eingetippten — sonst stimmt er nach dem nächsten Umbau nicht mehr. */
  const demoEl = document.querySelector(".demo");
  if (demoEl){
    const st = baustelleStand();
    demoEl.textContent = WARTUNG
      ? `Stand heute: ${st.fertig} von ${st.gesamt} Themen sind fertig — die übrigen kommen nach und nach.`
      : "";
  }

  /* Wer unten in der Fußleiste etwas anklickt, soll die neue Seite auch sehen
     und nicht erst nach oben wischen müssen. */
  const ansichtWechsel = ansicht !== letzteAnsicht;
  if (ansichtWechsel){
    letzteAnsicht = ansicht;
    try { window.scrollTo(0, 0); } catch(e){}
  }
  /* Nach einer falschen Antwort steht die Erklärung unter den Möglichkeiten und
     kann dadurch unter dem Bildrand liegen — dann tippt jemand daneben und sieht
     scheinbar nichts passieren. Deshalb holen wir sie sanft ins Bild. */
  if (insBildHolen){
    const auswahl = insBildHolen;
    insBildHolen = "";
    requestAnimationFrame(() => {
      const treffer = document.querySelectorAll(auswahl);
      const rm = treffer[treffer.length - 1];   // der unterste Kasten ist der kritische
      if (!rm) return;
      const r = rm.getBoundingClientRect();
      const rand = 24;
      if (r.bottom > window.innerHeight - rand)
        rm.scrollIntoView({ behavior: "smooth", block: "end" });
    });
  }
  /* Adresse aktualisieren: bei Ansichtswechsel UND bei Pfadänderung —
     auch wenn die Ansicht gleich bleibt (z. B. Klassenwechsel über das Menü). */
  if (ansicht !== "laden"){
    const pfad = aktuellerPfad();
    if (navPop){ letzterPfad = pfad; ladebalkenStart(); }
    else if (ansichtWechsel || pfad !== letzterPfad){ navSpeichern(); letzterPfad = pfad; ladebalkenStart(); }
  }
  renderSeite();
  const shell = document.getElementById("shell");
  shell.classList.toggle("voll", ["laden","willkommen","anmelden","uebersicht","fachwahl","klassenwahl","melden","feedback","faq","ueber","impressum","datenschutz","agb","konto","anfragen","baustelle","serie","passwortNeu","registrieren"].includes(ansicht));
  /* Fachfarbe nur zur Orientierung — beim Suchen und Auswählen.
     Auf dem Aufgabenbildschirm bewusst NICHT: dort heißt Rot „falsch“ und
     Grün „richtig“. Wäre Deutsch dort rot, könnte man die Fachfarbe für eine
     Bewertung halten. Bedeutung geht vor Wiedererkennung. */
  const mitFach = ["start","klassenwahl"].includes(ansicht);
  document.documentElement.dataset.fach = (mitFach && fach) ? fach : "";

  if (ansicht === "laden"){
    el.innerHTML = `<div class="card"><p class="laden">Einen Moment …</p></div>`;
    return;
  }

  if (ansicht === "willkommen"){ el.innerHTML = willkommenHtml(); return; }
  if (ansicht === "anmelden"){ el.innerHTML = anmeldenHtml(); return; }
  if (ansicht === "registrieren"){ el.innerHTML = registrierenHtml(); return; }

  /* ---- Übersicht: die Startseite der App (siehe start.js) ---- */

    el.innerHTML = uebersichtHtml();
    if (benutzer && !aktivitaet.geladen) ladeAktivitaet().then(() => { if (ansicht === "uebersicht") render(); });
    return;
  }

  /* ---- Fachwahl ---- */
  if (ansicht === "fachwahl"){

        ${navLink("/feedback", "zeigeFeedback()", "Feedback", "btn ghost full", "margin-top:10px")}
        ${istAdmin ? navLink("/dashboard", "zeigeDashboard()", "Dashboard öffnen", "btn full admin planbtn", "margin-top:10px;text-align:center") : ""}

  /* ---- Themenliste ---- */

        ${navLink("/registrieren", "zeigeRegistrierung()", "Konto anlegen", "btn full", "margin-top:12px")}
      </div>`;
    } else if (!fortschritt.length){
      inhalt = `<div class="card">
        <h4 style="margin:0 0 8px">Noch nichts drin</h4>
        <p class="small soft">Sobald du dein erstes Thema durchgearbeitet hast, taucht es hier auf — mit dem Datum, an dem es wieder dran ist.</p>
        ${navLink("/start", "zurUebersicht()", "Erstes Thema üben", "btn full", "margin-top:12px")}
      </div>`;
    } else {
      inhalt = `<div class="card">
        ${fortschritt.map(z=>{
          const w = wannText(z);
          const fname = KATALOG[z.fach] ? KATALOG[z.fach].name : z.fach;
          return `<div class="zeile">
            <div><b>${z.thema}</b><span>${fname} ${z.klasse} · ${z.versuche}× geübt${z.fehler ? `, ${z.fehler}× gehakt` : ""}</span></div>
            <div class="wann ${w.stil}">${w.text}</div>
          </div>`;
        }).join("")}
      </div>`;
    }
    el.innerHTML = `
      <div class="card">
        <span class="tag">Der eigentliche Trick</span>
        <h1>Dein Wiederholungsplan</h1>
        <p class="soft">Alles, woran du hängengeblieben bist, kommt von allein wieder — nach einem Tag, nach drei Tagen, nach einer Woche, immer weiter auseinander. So lange, bis es sitzt.</p>
      </div>
      ${inhalt}`;
    return;
  }

  if (ansicht === "dashboard"){ el.innerHTML = dashboardHtml(); return; }
  if (ansicht === "konto"){ el.innerHTML = kontoHtml(); return; }
  if (ansicht === "anfragen"){ el.innerHTML = anfragenHtml(); return; }
  if (ansicht === "baustelle"){ el.innerHTML = baustelleSeiteHtml(); return; }
  if (ansicht === "faq"){ el.innerHTML = faqHtml(); return; }
  if (ansicht === "ueber"){ el.innerHTML = ueberHtml(); return; }
  if (ansicht === "impressum"){ el.innerHTML = impressumHtml(); return; }
  if (ansicht === "datenschutz"){ el.innerHTML = datenschutzHtml(); return; }
  if (ansicht === "agb"){ el.innerHTML = agbHtml(); return; }
  if (ansicht === "melden"){ el.innerHTML = meldenHtml(); return; }
  if (ansicht === "feedback"){ el.innerHTML = feedbackHtml(); return; }

  /* ---- Einstellungen ---- */
  if (ansicht === "serie"){ el.innerHTML = serieHtml(); return; }
  if (ansicht === "passwortNeu"){ el.innerHTML = passwortNeuHtml(); return; }

  if (ansicht === "einstellungen"){
    const wahl = (feld, wert, titel, unter) => `
      <button class="option ${einstellungen[feld] === wert ? "an" : ""}" onclick="setzeEinstellung('${feld}', ${typeof wert === "string" ? `'${wert}'` : wert})">
        <b>${titel}</b>${unter ? `<span>${unter}</span>` : ""}
      </button>`;
    el.innerHTML = `
      <div class="card">
        ${navLink(pfadFuer(vorEinstellungen, fach, klasse), "zurueckVonEinstellungen()", "← Zurück", "zurueck")}
        <span class="tag">Einstellungen</span>
        <h1>Wie hättest du es gern?</h1>
        <p class="soft">Alles hier lässt sich jederzeit wieder ändern.</p>
      </div>

      <div class="card">
        <p class="ueberschrift">Aussehen</p>
        <div class="optionen3">
          ${wahl("modus","hell","Hell","Heller Hintergrund")}
          ${wahl("modus","dunkel","Dunkel","Schont die Augen abends")}
          ${wahl("modus","auto","Automatisch","Wie dein Gerät eingestellt ist")}
        </div>
      </div>

      <div class="card">
        <p class="ueberschrift">Schriftgröße</p>
        <div class="reglerreihe">
          <span class="reglerklein">A</span>
          <input class="schriftregler" type="range" min="${SCHRIFT_MIN}" max="${SCHRIFT_MAX}" step="0.05"

      ${erinnerungenHtml()}

      <div class="card">
        <p class="ueberschrift">Bundesland</p>
        <p class="small soft" style="margin:0 0 12px">Damit wir die Themen später an deinen Lehrplan anpassen können.</p>
        <select class="feld" onchange="setBundesland(this.value)">${bundeslandOptionen()}</select>
      </div>

      <div class="card">
        <p class="ueberschrift">Antworten</p>
        <div class="optionen3">
          ${wahl("eingabe","gemischt","Gemischt","Zwischenschritte auswählen, Ergebnis selbst eintippen")}
          ${wahl("eingabe","auswahl","Immer auswählen","Aus mehreren Möglichkeiten anklicken")}
          ${wahl("eingabe","tippen","Immer eintippen","Schwerer, aber ohne Rateglück")}
        </div>
      </div>

      <div class="card">
        <p class="ueberschrift">Hilfe beim Üben</p>
        <div class="optionen3">
          ${wahl("autoTipp",true,"Tipp kommt von allein","Nach dem ersten Fehler")}
          ${wahl("autoTipp",false,"Tipp nur auf Knopfdruck","Ich will es erst selbst versuchen")}
        </div>
        <p class="small soft" style="margin-top:14px">Nach dem zweiten Fehler wird dir die Erklärung zum Thema angeboten. Nach dem dritten wird die Lösung gezeigt, damit du nicht stecken bleibst.</p>
      </div>`;
    return;
  }

  /* ---- Erklärung ---- */
  if (ansicht === "erklaerung"){
    const e = ERKLAERUNGEN[aktuellName];
    if (!e){
      el.innerHTML = `<div class="card"><h2>Für dieses Thema gibt es noch keine Erklärung</h2>
        ${navLink(pfadFuer(vorErklaerung === "erklaerung" ? "start" : vorErklaerung, fach, klasse), "zurueckVonErklaerung()", "Zurück", "btn full", "margin-top:12px")}</div>`;
      return;
    }
    el.innerHTML = `
      <div class="card">
        ${navLink(pfadFuer(vorErklaerung === "erklaerung" ? "start" : vorErklaerung, fach, klasse), "zurueckVonErklaerung()", "← Zurück", "zurueck")}
        <span class="tag">Erklärung</span>
        <h1>${aktuellName}</h1>
        <p class="soft">${e.worum}</p>
      </div>
      <div class="card">
        <p class="ueberschrift">Von vorn erklärt</p>

      <div class="card">
        <p class="ueberschrift">Das Wichtigste</p>
        <ul class="liste">${e.regeln.map(r => `<li>${r}</li>`).join("")}</ul>
      </div>
      <div class="card">
        <p class="ueberschrift">Ein Beispiel</p>
        <div class="probe">
          <div class="auf" style="font-size:20px">${e.beispiel.aufgabe}</div>
          <ol class="beispielschritte">${e.beispiel.schritte.map(x => `<li>${x}</li>`).join("")}</ol>
          <div class="ergebnis">${e.beispiel.ergebnis}</div>
        </div>
      </div>
      <div class="card" style="text-align:center">
        <p class="soft" style="margin:0 auto 16px;max-width:42ch">Alles klar? Dann probier es an einer Aufgabe — du wirst Schritt für Schritt hingeführt.</p>
        <button class="btn" onclick="starte(aktuellName)">Jetzt üben</button>
      </div>`;
    return;
  }

  /* ---- Fertig ---- */
  if (ansicht === "fertig"){
    const n = anzahlAufgaben(aktuellName);
    const gespeichert = benutzer
      ? `<div class="feedback ok" style="margin-bottom:18px"><b>${aktuellName}</b> ist gespeichert. Du siehst dieses Thema automatisch wieder — je sicherer du wirst, desto später.</div>`
      : `<div class="feedback tipp" style="margin-bottom:18px">Ohne Konto wird nichts gespeichert. Mit Konto käme <b>${aktuellName}</b> jetzt auf deinen Wiederholungsplan.</div>`;
    /* Der Moment, auf den alles zuläuft. Vorher stand hier nur „Geschafft" —
       jetzt sieht und liest man, was man gerade geschafft hat. */
    const anlaeufe = fehlversuche;
    const lob = anlaeufe === 0
      ? "Durch, ohne einen einzigen Fehltritt."
      : anlaeufe <= 2 ? "Ein paar Anläufe gebraucht — genau so lernt man."

            heuteZahl > 0 ? `<div><b>${heuteZahl}</b><span>heute gelöst</span></div>` : ""}
          ${serieZahl > 0 ? `<div><b>${serieZahl}</b><span>${serieZahl === 1 ? "Tag" : "Tage"} in Folge</span></div>` : ""}
        </div>
        <p class="geschafftlob">${lob}</p>
      </div>

        ${n > 1 ? `<button class="btn full" onclick="naechsteVariante()">Noch eine Aufgabe zu diesem Thema</button>
                   ${navLink("/plan", "zeigePlan()", "Meinen Plan ansehen", "btn ghost full", "margin-top:10px")}`
                : navLink("/plan", "zeigePlan()", "Meinen Plan ansehen", "btn full")}
        ${navLink(`/${fach}/${klasse}`, "ansicht='start';render()", "Anderes Thema", "btn ghost full", "margin-top:10px")}
      </div>`;
    return;
  }

  /* ---- Aufgabe lösen ---- */
  const s = aktuell.schritte[schrittNr];
  const balken = aktuell.schritte.map((_,i) => `<i class="${i <= schrittNr ? "an" : ""}"></i>`).join("");
  const tippen = tippModus();
  const richtigeOption = s.optionen.find(o => o.ok);
  if (reihenfolge.length !== s.optionen.length) neueReihenfolge();
  const optionenHtml = tippen ? `
    <div class="eingabezeile">
      <input class="feld antwortfeld" id="antwortFeld" type="text" inputmode="decimal"

             onkeydown="if(event.key==='Enter')eingabePruefen()">
      ${beantwortet ? "" : `<button class="btn" onclick="eingabePruefen()">Prüfen</button>`}
    </div>
    ${beantwortet ? `<div class="pick richtig" style="cursor:default"><span class="pickbuchstabe">✓</span><span class="picktext">${s.tippAntwort || richtigeOption.t}</span></div>` : ""}
    <p class="small soft" style="margin-top:10px">Hier gibt es nichts zum Anklicken — schreib das Ergebnis selbst hin.</p>`
   : reihenfolge.map((i, platz) => {
    const o = s.optionen[i];
    let cls = "";
    if (falschGeklickt.includes(i)) cls = "falsch";
    else if (beantwortet && o.ok) cls = "richtig";
    const gesperrt = beantwortet || falschGeklickt.includes(i);
    /* Die Begründung hängt direkt an der angetippten Antwort. Früher stand sie
       weit darunter in einem eigenen Kasten — man sah nicht, worauf sie sich
       bezieht, und auf dem Handy war sie oft gar nicht im Bild. */
    return `<div class="pickblock${cls ? " mitgrund" : ""}">
              <button class="pick ${cls}" ${gesperrt ? "disabled" : ""} onclick="antwort(${i})">
                <span class="pickbuchstabe">${"ABCDEFGH"[platz] || "•"}</span>
                <span class="picktext">${o.t}</span>
              </button>
              ${cls ? `<div class="pickgrund ${cls}">${o.fb}</div>` : ""}
            </div>`;
  }).join("");

  let fb = "";
  if (tippen && letzteEingabe && !beantwortet)
    fb += `<div class="feedback nope">„${letzteEingabe}“ stimmt noch nicht. Schau dir den Tipp an und versuch es noch einmal.</div>`;
  if (tippen && beantwortet && !aufgeloest && letzteEingabe)
    fb += `<div class="feedback ok">Richtig — und diesmal ohne Auswahl. Das kannst du wirklich.</div>`;
  /* Die Rückmeldung zur angetippten Antwort steht jetzt an der Antwort selbst
     (siehe .pickgrund oben) — hier braucht es keinen eigenen Kasten mehr. */
  if (hilfeStufe >= 1 && !aufgeloest) fb += `<div class="feedback tipp"><b>Tipp:</b> ${s.tipp}</div>`;
  if (hilfeStufe >= 2 && !aufgeloest && zweiterTipp())
    fb += `<div class="feedback tipp tipp2"><b>Noch ein Tipp:</b> ${zweiterTipp()}</div>`;
  if (hilfeStufe >= 3 && !aufgeloest && regelnZumThema().length)
    fb += `<div class="feedback regel">
             <b>Und das gilt beim Thema ${aktuellName}:</b>
             <ul>${regelnZumThema().map(r => `<li>${r}</li>`).join("")}</ul>
           </div>`;
  if (erklaerungAngeboten && !beantwortet && hatErklaerung(aktuellName))
    fb += `<div class="feedback hilfe">
             <b>Kommst du nicht weiter?</b> Dann liegt es vielleicht am Thema, nicht an der Aufgabe.
             <button class="btn ghost full" style="margin-top:12px" onclick="zeigeErklaerung()">${aktuellName} von vorn erklärt</button>
           </div>`;
  if (aufgeloest)
    fb += `<div class="feedback ok"><b>Kein Problem.</b> Die richtige Antwort ist grün markiert — schau sie dir in Ruhe an und geh dann weiter.</div>`;

  const anz = anzahlAufgaben(aktuellName);
  el.innerHTML = `
    <div class="card">
      ${navLink(pfadFuer("start", fach, klasse), "ansicht='start';render()", "← Zurück zur Übersicht", "zurueck")}
      <div class="fortschritt">${balken}</div>
      <div class="kopf">
        <span class="tag" style="margin-bottom:0">${aktuellName}${anz > 1 ? ` · Aufgabe ${variante + 1} von ${anz}` : ""}</span>
        <span class="small soft">Schritt ${schrittNr + 1} von ${aktuell.schritte.length}</span>
      </div>
      <div class="aufg klebt ${aufgabenGroesse(aktuell)}"><div class="zeile1">${aktuell.text}</div></div>
      <p class="frage">${s.frage}</p>
      <div class="optionen ${tippen ? "" : "breit"}">${optionenHtml}</div>
      ${fb}
      ${beantwortet
        ? `<button class="btn full" id="weiterBtn" style="margin-top:18px" onclick="weiter()">Weiter</button>`
        : `<div class="hilfezeile">
             <button class="hilfeknopf" id="tippBtn" onclick="hilfeWeiter()">${naechsteHilfe().text}</button>
             ${/* nicht doppelt anbieten: weder wenn die Stufenleiter selbst schon
                   dorthin führt, noch wenn der Hinweiskasten sie schon vorschlägt */
               hatErklaerung(aktuellName) && !erklaerungAngeboten
               && naechsteHilfe().art !== "erklaerung"
               ? `<button class="hilfeknopf" id="erklBtn" onclick="zeigeErklaerung()">Ich verstehe das Thema gar nicht</button>` : ""}
           </div>`}
    </div>
    <div class="card">
      <p class="small soft" style="margin:0">Auch nach allen Hinweisen bekommst du nie die Lösung. Den letzten Schritt machst immer du.</p>
    </div>`;
}

/* ---------- Startseite und Anmeldung ---------- */
/* ---------- Mitmach-Probe ganz oben ----------
   Kein Bild vom Produkt, sondern das Produkt selbst: eine echte Aufgabe aus
   demselben Erzeuger wie im Übungsteil, mit echten Fragen, echten Antworten
   und echten Rückmeldungen. Wer hier vier Mal tippt, hat eine Gleichung
   gelöst — ohne Anmeldung und ohne dass ihm jemand die Lösung gezeigt hat. */
const PROBE_THEMA = "Gleichungen umstellen";
let probeAufgabe = null, probeSchritt = 0, probeFalsch = [], probeFertig = false, probeOrdnung = [];

function probeNeu(neuZeichnen){
  const erzeuger = AUFGABEN[PROBE_THEMA];
  if (!erzeuger || !erzeuger.length){ probeAufgabe = null; return; }
  try { probeAufgabe = erzeuger[0](); }
  catch(e){ probeAufgabe = null; return; }
  probeSchritt = 0; probeFalsch = []; probeFertig = false;
  probeOrdnung = probeAufgabe.schritte.map(s => mischeReihenfolge(s.optionen.length));
  if (neuZeichnen) render();
}
function probeAntwort(i){
  if (!probeAufgabe || probeFertig) return;
  const s = probeAufgabe.schritte[probeSchritt];
  if (s.optionen[i].ok){
    if (probeSchritt + 1 >= probeAufgabe.schritte.length) probeFertig = true;
    else { probeSchritt++; probeFalsch = []; }
  } else if (!probeFalsch.includes(i)) probeFalsch.push(i);
  render();
}
function probeHtml(){
  if (!probeAufgabe) probeNeu();
  if (!probeAufgabe) return "";
  const a = probeAufgabe;
  if (probeFertig)
    return `<div class="probe probefertig">
      <div class="probehaken">✓</div>
      <div class="probeloesung">${a.loesung}</div>
      <p class="probesatz">Das hast du gerade selbst gelöst. Niemand hat dir die Lösung gezeigt.</p>
      <button class="btn ghost probeneu" onclick="probeNeu(true)">Noch eine — mit neuen Zahlen</button>
    </div>`;
  const s = a.schritte[probeSchritt];
  return `<div class="probe">
      <div class="probeaufgabe">${a.text}</div>
      <div class="probeleiste">
        <span class="probepunkte">${a.schritte.map((_, i) =>
          `<i class="${i < probeSchritt ? "fertig" : i === probeSchritt ? "an" : ""}"></i>`).join("")}</span>
        <span class="probezaehler">Frage ${probeSchritt + 1} von ${a.schritte.length}</span>
      </div>
      <p class="probefrage">${s.frage}</p>
      <div class="optionen">
        ${probeOrdnung[probeSchritt].map((idx, platz) => {
          const o = s.optionen[idx];
          const falsch = probeFalsch.includes(idx);
          return `<div class="pickblock${falsch ? " mitgrund" : ""}">
                    <button class="pick ${falsch ? "falsch" : ""}" ${falsch ? "disabled" : ""} onclick="probeAntwort(${idx})">
                      <span class="pickbuchstabe">${"ABCDEFGH"[platz] || "•"}</span>
                      <span class="picktext">${o.t}</span>
                    </button>
                    ${falsch ? `<div class="pickgrund falsch">${o.fb}</div>` : ""}
                  </div>`;
        }).join("")}
      </div>
      ${probeFalsch.length ? `<p class="probetipp"><b>Tipp:</b> ${s.tipp}</p>` : ""}
    </div>`;
}

    <div class="card abschnitt himmel">
      <p class="ueberschrift">Was drin ist</p>
      <div class="zahlen">
        <div><b>2</b><span>Fächer</span></div>
        <div><b>6</b><span>Klassenstufen</span></div>
        <div><b>${anzahlGeplant()}</b><span>Themen</span></div>
        <div><b>0 €</b><span>zum Ausprobieren</span></div>
      </div>
      <p class="small soft" style="margin-top:14px">Mathe und Deutsch von Klasse 5 bis 10. Englisch, Französisch, Geschichte und Erdkunde kommen dazu.</p>
    </div>

    <div class="card" style="text-align:center">
      <h2 style="margin-bottom:8px">Probier es einfach aus</h2>
      <p class="soft" style="margin:0 auto 18px;max-width:44ch">Ohne Anmeldung, ohne Kosten. Ein Konto brauchst du erst, wenn die App sich deinen Fortschritt merken soll.</p>
      <button class="btn" onclick="alsGast()">Jetzt ausprobieren</button>
    </div>

    `;
}

/* Anmelden — nur für bestehende Konten */
function anmeldenHtml(){
  return `
    <div class="card">
      ${navLink("/", "zeigeWillkommen()", "← Zur Startseite", "zurueck")}
      <span class="tag">Anmelden</span>
      <h1>Willkommen zurück</h1>
      <p class="soft">Melde dich mit deinem Konto an, damit dein Wiederholungsplan wieder da ist.</p>
    </div>
    <div class="card">
      <input class="feld" id="mail" type="email" placeholder="E-Mail-Adresse" autocomplete="email">
      <input class="feld" id="pw" type="password" placeholder="Passwort"
             autocomplete="current-password"
             onkeydown="if(event.key==='Enter')meldeAn()">
      ${hinweis ? `<div class="feedback ${hinweis.startsWith("Fast") ? "ok" : "nope"}" style="margin-top:4px">${hinweis}</div>` : ""}
      <button class="btn full" style="margin-top:14px" onclick="meldeAn()">Anmelden</button>
      <button class="textlink" style="margin-top:12px" onclick="passwortVergessen()">Passwort vergessen?</button>
    </div>
    <div class="card" style="text-align:center">
      <p class="small soft" style="margin:0 0 12px">Noch kein Konto?</p>
      ${navLink("/registrieren", "zeigeRegistrierung()", "Neues Konto anlegen", "btn ghost full")}
      <button class="btn ghost full" style="margin-top:10px" onclick="alsGast()">Ohne Konto ausprobieren</button>
    </div>`;
}

/* Registrieren — nur für neue Konten */
function registrierenHtml(){
  return `
    <div class="card">
      ${navLink("/", "zeigeWillkommen()", "← Zur Startseite", "zurueck")}
      <span class="tag">Registrieren</span>
      <h1>Neues Konto anlegen</h1>
      <p class="soft">Mit einem Konto merkt sich die App, was du nicht konntest, und legt es dir später wieder vor.</p>
    </div>
    <div class="card">
      <input class="feld" id="mail" type="email" placeholder="E-Mail-Adresse" autocomplete="email">
      <input class="feld" id="pw" type="password" placeholder="Passwort (mindestens 6 Zeichen)"
             autocomplete="new-password"
             onkeydown="if(event.key==='Enter')registriere()">
      <p class="small soft" style="margin:4px 0 8px">Dein Bundesland <span style="opacity:.7">(freiwillig)</span> — damit wir die Themen an deinen Lehrplan anpassen können:</p>
      <select class="feld" onchange="setBundesland(this.value)" aria-label="Bundesland">${bundeslandOptionen()}</select>
      ${hinweis ? `<div class="feedback ${hinweis.startsWith("Fast") ? "ok" : "nope"}" style="margin-top:4px">${hinweis}</div>` : ""}
      <button class="btn full" style="margin-top:14px" onclick="registriere()">Konto anlegen</button>
    </div>
    <div class="card" style="text-align:center">
      <p class="small soft" style="margin:0 0 12px">Schon ein Konto?</p>
      ${navLink("/anmelden", "zeigeAnmeldung()", "Zum Anmelden", "btn ghost full")}
      <button class="btn ghost full" style="margin-top:10px" onclick="alsGast()">Ohne Konto ausprobieren</button>
    </div>`;
}

ladeEinstellungen();
wendeEinstellungenAn();
/* Wenn jemand den Link aus einer Passwort-Reset-Mail öffnet: Formular zum
   Setzen eines neuen Passworts zeigen. */
db.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY"){ resetHinweis = ""; ansicht = "passwortNeu"; render(); }
});
render();
pruefeAnmeldung();

/* App installierbar / offline-tauglich machen */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js")
      .then(() => pushStandPruefen().then(() => { if (pushAn) render(); }))
      .catch(() => {});
  });
}
</script>
