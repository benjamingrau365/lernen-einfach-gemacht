      <div class="card">
        <h2>Was du gemacht hast</h2>
        <ul class="schritte-log">
          ${aktuell.schritte.map(s => `<li>${s.frage.replace(/<[^>]+>/g,"")}</li>`).join("")}
        </ul>
        ${gespeichert}
        ${n > 1 ? `<button class="btn full" onclick="naechsteVariante()">Noch eine Aufgabe zu diesem Thema</button>
                   ${navLink("/plan", "zeigePlan()", "Meinen Plan ansehen", "btn ghost full", "margin-top:10px")}`
                : navLink("/plan", "zeigePlan()", "Meinen Plan ansehen", "btn full")}
        ${navLink(`/${fach}/${klasse}`, "ansicht='start';render()", "Anderes Thema", "btn ghost full", "margin-top:10px")}
      </div>`;
    return;
  }

  /* ---- Aufgabe lösen ---- */
  const s = aktuell.schritte[schrittNr];
  const balken = aktuell.schritte.map((_,i) => `<i class="${i <= schrittNr ? "an" : ""}"></i>`).join("");
  const tippen = tippModus();
  const richtigeOption = s.optionen.find(o => o.ok);
  if (reihenfolge.length !== s.optionen.length) neueReihenfolge();
  const optionenHtml = tippen ? `
    <div class="eingabezeile">
      <input class="feld antwortfeld" id="antwortFeld" type="text" inputmode="decimal"
             placeholder="Deine Antwort" value="${letzteEingabe.replace(/"/g,"&quot;")}"
             ${beantwortet ? "disabled" : ""}
             onkeydown="if(event.key==='Enter')eingabePruefen()">
      ${beantwortet ? "" : `<button class="btn" onclick="eingabePruefen()">Prüfen</button>`}
    </div>
    ${beantwortet ? `<div class="pick richtig" style="cursor:default">${s.tippAntwort || richtigeOption.t}</div>` : ""}
    <p class="small soft" style="margin-top:10px">Hier gibt es nichts zum Anklicken — schreib das Ergebnis selbst hin.</p>`
   : reihenfolge.map(i => {
    const o = s.optionen[i];
    let cls = "";
    if (falschGeklickt.includes(i)) cls = "falsch";
    else if (beantwortet && o.ok) cls = "richtig";
    const gesperrt = beantwortet || falschGeklickt.includes(i);
    return `<button class="pick ${cls}" ${gesperrt ? "disabled" : ""} onclick="antwort(${i})">${o.t}</button>`;
  }).join("");

  let fb = "";
  if (tippen && letzteEingabe && !beantwortet)
    fb += `<div class="feedback nope">„${letzteEingabe}“ stimmt noch nicht. Schau dir den Tipp an und versuch es noch einmal.</div>`;
  if (tippen && beantwortet && !aufgeloest && letzteEingabe)
    fb += `<div class="feedback ok">Richtig — und diesmal ohne Auswahl. Das kannst du wirklich.</div>`;
  if (gewaehlt !== undefined){
    const o = s.optionen[gewaehlt];
    fb = `<div class="feedback ${o.ok ? "ok" : "nope"}">${o.fb}</div>`;
  }
  if (tippOffen && !aufgeloest) fb += `<div class="feedback tipp"><b>Tipp:</b> ${s.tipp}</div>`;
  if (erklaerungAngeboten && !beantwortet && hatErklaerung(aktuellName))
    fb += `<div class="feedback hilfe">
             <b>Kommst du nicht weiter?</b> Dann liegt es vielleicht am Thema, nicht an der Aufgabe.
             <button class="btn ghost full" style="margin-top:12px" onclick="zeigeErklaerung()">${aktuellName} von vorn erklärt</button>
           </div>`;
  if (aufgeloest)
    fb += `<div class="feedback ok"><b>Kein Problem.</b> Die richtige Antwort ist grün markiert — schau sie dir in Ruhe an und geh dann weiter.</div>`;

  const anz = anzahlAufgaben(aktuellName);
  el.innerHTML = `
    <div class="card">
      ${navLink(pfadFuer("start", fach, klasse), "ansicht='start';render()", "← Zurück zur Übersicht", "zurueck")}
      <div class="fortschritt">${balken}</div>
      <div class="kopf">
        <span class="tag" style="margin-bottom:0">${aktuellName}${anz > 1 ? ` · Aufgabe ${variante + 1} von ${anz}` : ""}</span>
        <span class="small soft">Schritt ${schrittNr + 1} von ${aktuell.schritte.length}</span>
      </div>
      <div class="aufg ${aktuell.typ === "text" ? "text" : ""}"><div class="zeile1">${aktuell.text}</div></div>
      <p class="frage">${s.frage}</p>
      <div class="optionen ${tippen ? "" : "breit"}">${optionenHtml}</div>
      ${fb}
      ${beantwortet
        ? `<button class="btn full" id="weiterBtn" style="margin-top:18px" onclick="weiter()">Weiter</button>`
        : `<button class="btn ghost full" id="tippBtn" style="margin-top:12px" onclick="tippOffen=true;render()">Ich weiß nicht weiter</button>`}
      ${hatErklaerung(aktuellName) && !beantwortet
        ? `<button class="btn ghost full" id="erklBtn" style="margin-top:10px" onclick="zeigeErklaerung()">Ich verstehe das Thema gar nicht</button>` : ""}
    </div>
    <div class="card">
      <p class="small soft" style="margin:0">Auch beim Tipp bekommst du keine Lösung — nur einen Hinweis. Den letzten Schritt machst immer du.</p>
    </div>`;
}

          <span><i>✓</i> Fehler kommen von allein zurück</span>
          <span><i>✓</i> Erklärung von null an</span>
        </div>
      </div>
    </div>

    ${baustelleBoxHtml()}

    <div class="card">
      <p class="ueberschrift">Kennst du das?</p>
      <ul class="liste">
        <li>Die Lösung steht da — aber du verstehst nicht, wie man darauf kommt.</li>
        <li>Bei Textaufgaben weißt du nicht mal, was du überhaupt rechnen sollst.</li>
        <li>Du hast es verstanden. Eine Woche später ist es wieder weg.</li>
        <li>Du nimmst dir vor zu üben — und machst es dann doch nicht.</li>
      </ul>
    </div>

    <div class="card">
      <p class="ueberschrift">So funktioniert es</p>
      <ol class="schritte">
        <li><b>Du suchst dir dein Thema</b><span>Fach wählen, Klasse wählen, Thema antippen.</span></li>
        <li><b>Du wirst hingeführt, nicht bedient</b><span>Statt einer fertigen Lösung bekommst du kleine Fragen. Auch wenn du auf „Ich weiß nicht weiter“ drückst, kommt nur ein Hinweis — den letzten Schritt machst immer du.</span></li>
        <li><b>Es kommt von allein wieder</b><span>Was du nicht konntest, legt dir die App nach einem Tag wieder vor. Dann nach drei Tagen, nach einer Woche, nach einem Monat — bis es wirklich sitzt.</span></li>
      </ol>
    </div>

    <div class="card">
      <p class="ueberschrift">So sieht das aus</p>
      <div class="probe">
        <div class="auf">3x + 5 = 20</div>
        <p class="fr">Am Ende soll nur noch <b>x</b> alleine dastehen. Was steht ihm auf der linken Seite gerade im Weg?</p>
        <div class="opt gut">Die + 5</div>
        <div class="opt">Die 3 vor dem x</div>
        <div class="opt">Die 20 auf der rechten Seite</div>
      </div>
      <p class="small soft" style="margin-top:14px">Vier solcher Fragen — und du hast die Gleichung selbst gelöst.</p>
    </div>

    <div class="card">
      <p class="ueberschrift">Warum nicht einfach eine Lösungs-App?</p>
      <div class="gegen">
        <div class="andere"><b>Andere Apps</b>Du fotografierst die Aufgabe, bekommst das Ergebnis und schreibst es ab. Bei der nächsten Aufgabe stehst du genauso da wie vorher.</div>
        <div class="wir"><b>Endlich kapiert</b>Du kommst selbst darauf — und wirst daran erinnert, bevor du es vergessen hast. Beim nächsten Mal weißt du, wie es geht.</div>
      </div>
    </div>

    <div class="card">
      <p class="ueberschrift">Was drin ist</p>
      <div class="zahlen">
        <div><b>2</b><span>Fächer</span></div>
        <div><b>6</b><span>Klassenstufen</span></div>
        <div><b>${anzahlGeplant()}</b><span>Themen</span></div>
        <div><b>0 €</b><span>zum Ausprobieren</span></div>
      </div>
      <p class="small soft" style="margin-top:14px">Mathe und Deutsch von Klasse 5 bis 10. Englisch, Französisch, Geschichte und Erdkunde kommen dazu.</p>
    </div>

    <div class="card" style="text-align:center">
      <h2 style="margin-bottom:8px">Probier es einfach aus</h2>
      <p class="soft" style="margin:0 auto 18px;max-width:44ch">Ohne Anmeldung, ohne Kosten. Ein Konto brauchst du erst, wenn die App sich deinen Fortschritt merken soll.</p>
      <button class="btn" onclick="alsGast()">Jetzt ausprobieren</button>
    </div>

    `;
}

/* Anmelden — nur für bestehende Konten */
function anmeldenHtml(){
  return `
    <div class="card">
      ${navLink("/", "zeigeWillkommen()", "← Zur Startseite", "zurueck")}
      <span class="tag">Anmelden</span>
      <h1>Willkommen zurück</h1>
      <p class="soft">Melde dich mit deinem Konto an, damit dein Wiederholungsplan wieder da ist.</p>
    </div>
    <div class="card">
      <input class="feld" id="mail" type="email" placeholder="E-Mail-Adresse" autocomplete="email">
      <input class="feld" id="pw" type="password" placeholder="Passwort"
             autocomplete="current-password"
             onkeydown="if(event.key==='Enter')meldeAn()">
      ${hinweis ? `<div class="feedback ${hinweis.startsWith("Fast") ? "ok" : "nope"}" style="margin-top:4px">${hinweis}</div>` : ""}
      <button class="btn full" style="margin-top:14px" onclick="meldeAn()">Anmelden</button>
      <button class="textlink" style="margin-top:12px" onclick="passwortVergessen()">Passwort vergessen?</button>
    </div>
    <div class="card" style="text-align:center">
      <p class="small soft" style="margin:0 0 12px">Noch kein Konto?</p>
      ${navLink("/registrieren", "zeigeRegistrierung()", "Neues Konto anlegen", "btn ghost full")}
      <button class="btn ghost full" style="margin-top:10px" onclick="alsGast()">Ohne Konto ausprobieren</button>
    </div>`;
}

  return `

      <span class="tag">Registrieren</span>
      <h1>Neues Konto anlegen</h1>
      <p class="soft">Mit einem Konto merkt sich die App, was du nicht konntest, und legt es dir später wieder vor.</p>
    </div>
    <div class="card">
      <input class="feld" id="mail" type="email" placeholder="E-Mail-Adresse" autocomplete="email">
      <input class="feld" id="pw" type="password" placeholder="Passwort (mindestens 6 Zeichen)"
             autocomplete="new-password"
             onkeydown="if(event.key==='Enter')registriere()">
      <p class="small soft" style="margin:4px 0 8px">Dein Bundesland <span style="opacity:.7">(freiwillig)</span> — damit wir die Themen an deinen Lehrplan anpassen können:</p>
      <select class="feld" onchange="setBundesland(this.value)" aria-label="Bundesland">${bundeslandOptionen()}</select>
      ${hinweis ? `<div class="feedback ${hinweis.startsWith("Fast") ? "ok" : "nope"}" style="margin-top:4px">${hinweis}</div>` : ""}
      <button class="btn full" style="margin-top:14px" onclick="registriere()">Konto anlegen</button>
    </div>
    <div class="card" style="text-align:center">
      <p class="small soft" style="margin:0 0 12px">Schon ein Konto?</p>
      ${navLink("/anmelden", "zeigeAnmeldung()", "Zum Anmelden", "btn ghost full")}

}

wendeEinstellungenAn();
/* Wenn jemand den Link aus einer Passwort-Reset-Mail öffnet: Formular zum
   Setzen eines neuen Passworts zeigen. */
db.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY"){ resetHinweis = ""; ansicht = "passwortNeu"; render(); }
});
render();
pruefeAnmeldung();

/* App installierbar / offline-tauglich machen */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}
