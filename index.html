<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endlich kapiert</title>
<meta name="description" content="Endlich kapiert: Du bekommst nie die Lösung, nur Fragen, die dich hinführen. Mathe und Deutsch, Klasse 5 bis 10.">
<meta name="theme-color" content="#10a37f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Endlich kapiert">
<!-- Solange gebaut wird: nicht bei Google aufnehmen. Wird automatisch entfernt,
     sobald WARTUNG im Code auf false steht. -->
<meta name="robots" content="noindex, nofollow" id="robots">
<style>
  :root{
    --bg:#f4f8f7; --card:#ffffff; --ink:#16211e; --soft:#5b6b66; --line:#dfe8e5;
    --ac:#10a37f; --ac-soft:#e4f5ef; --ac-dark:#0b7a5f;
    --red:#b3382f; --red-soft:#fdecea;
    --amber:#8a5a09; --amber-soft:#fdf3e0;
    /* Farben für die große Titelfläche auf der Startseite */
    --hero1:#ffffff; --hero2:#eaf8f2; --hero3:#d3eee4;
    --heroink:#0b5c48; --heroglanz1:#10a37f; --heroglanz2:#43c79c;
    --bau1:#f6c453; --bau2:#eda92c; --bauink:#3d2c05;
  }
  html.dunkel{
    --bg:#131a18; --card:#1b2422; --ink:#e9f1ee; --soft:#9cb0a9; --line:#2c3a36;
    --ac:#2ebd95; --ac-soft:#17322a; --ac-dark:#6fdcbb;
    --red:#ff9b90; --red-soft:#3a2220;
    --amber:#e6bd6d; --amber-soft:#332a17;
    --hero1:#1e2b28; --hero2:#17322a; --hero3:#123a2d;
    --heroink:#eafaf4; --heroglanz1:#3fd3a7; --heroglanz2:#7ff0cb;
    --bau1:#d9a63c; --bau2:#b8862a; --bauink:#241a03;
  }
  /* Schriftgröße-Regler: skaliert den gesamten Inhalt über die Variable --fs */
  .reglerreihe{display:flex;align-items:center;gap:14px}
  .reglerreihe .reglerklein{font-size:15px;color:var(--soft);font-weight:800;flex:none}
  .reglerreihe .reglergross{font-size:27px;color:var(--soft);font-weight:800;flex:none;line-height:1}
  .schriftregler{flex:1;-webkit-appearance:none;appearance:none;height:8px;border-radius:999px;
    background:var(--line);outline:none;margin:0}
  .schriftregler::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;
    border-radius:50%;background:var(--ac);border:3px solid var(--card);
    box-shadow:0 2px 8px -2px rgba(0,0,0,.4);cursor:pointer}
  .schriftregler::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--ac);
    border:3px solid var(--card);box-shadow:0 2px 8px -2px rgba(0,0,0,.4);cursor:pointer}
  .schriftregler:focus-visible{outline:2px solid var(--ac);outline-offset:4px}
  .schriftvorschau{border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    margin-top:14px;background:var(--bg)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  /* Schriftgröße skaliert die GANZE Seite (inkl. Kopfleiste und Menü) … */
  html{zoom:var(--fs,1)}
  /* … nur das Logo bleibt konstant (Gegen-Zoom) */
  .marke{zoom:calc(1 / var(--fs,1))}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}

  .shell{max-width:1140px;margin:0 auto;padding:14px 20px 64px;display:grid;grid-template-columns:1fr;gap:0}

  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;
    letter-spacing:-.01em;padding:20px 2px 18px;line-height:1.25}
  .logo .dot{width:30px;height:30px;border-radius:9px;background:var(--ac);flex:none;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:800;letter-spacing:.02em}

  /* Auf dem Handy steht die Seitenleiste UNTER dem Inhalt — sonst muss man
     erst an „Mein Plan / Einstellungen / Hilfe" vorbeiscrollen. Am Computer
     bleibt sie links (siehe @media weiter unten). */
  .side{display:none}   /* Seitenleiste entfernt — alles steckt im ☰-Menü */
  main{order:1}
  .sidebox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .sidelabel{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--soft);margin:0 0 9px 2px}

  .fachliste{display:flex;gap:8px}
  .fachliste button{flex:1;border:1.5px solid var(--line);background:var(--card);font:inherit;
    font-size:16px;font-weight:600;color:var(--soft);padding:11px 8px;border-radius:11px;
    cursor:pointer;text-align:center}
  .fachliste button.an{border-color:var(--ac);background:var(--ac-soft);color:var(--ac-dark)}
  .fachliste button:hover:not(.an){border-color:var(--ac)}

  .klassenliste{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:14px}
  .klassenliste button{border:1.5px solid var(--line);background:var(--card);font:inherit;
    font-size:15.5px;font-weight:600;color:var(--soft);padding:10px 2px;border-radius:10px;cursor:pointer}
  .klassenliste button.an{border-color:var(--ac);background:var(--ac-soft);color:var(--ac-dark)}
  .klassenliste button:hover:not(.an){border-color:var(--ac)}

  .planbtn{display:block;width:100%;text-align:left;background:var(--card);
    border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;
    font-size:16px;font-weight:600;color:var(--ink);cursor:pointer}
  .planbtn:hover{border-color:var(--ac);background:var(--ac-soft)}
  .planbtn small{display:block;font-weight:400;font-size:13.5px;color:var(--soft)}

  main{min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:26px;margin-bottom:14px}
  h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 10px}
  h2{font-size:20px;margin:0 0 16px}
  p{margin:0 0 14px} p:last-child{margin-bottom:0}
  .soft{color:var(--soft)} .small{font-size:14.5px}

  .tag{display:inline-block;background:var(--ac-soft);color:var(--ac-dark);font-size:12.5px;
    font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;
    border-radius:999px;margin-bottom:12px}

  .kopf{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}

  /* Aufgabe: ganz ohne Kasten */
  .aufg{padding:14px 0 22px;border-bottom:1px solid var(--line);margin-bottom:24px}
  .aufg .zeile1{font-size:38px;font-weight:600;text-align:center;letter-spacing:-.01em;line-height:1.25}
  .aufg.text .zeile1{font-size:22px;font-weight:500;text-align:left;line-height:1.5;letter-spacing:0}
  .aufg .luecke{color:var(--ac);font-weight:700}

  .frage{font-size:19.5px;margin:0 0 18px;line-height:1.45}

  .optionen{display:grid;gap:10px}
  button.pick{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
    border-radius:13px;padding:15px 17px;font:inherit;font-size:16.5px;color:var(--ink);
    cursor:pointer;transition:border-color .12s,background .12s;line-height:1.4}
  button.pick:not(:disabled):not(.richtig):not(.falsch):hover{border-color:var(--ac);background:var(--ac-soft)}
  button.pick:disabled{cursor:default;opacity:.5}
  button.pick.richtig{border-color:var(--ac);background:var(--ac-soft);opacity:1}
  button.pick.falsch{border-color:var(--red);background:var(--red-soft);opacity:1}

  .btn{display:inline-block;background:var(--ac);color:#fff;border:none;border-radius:12px;
    padding:14px 24px;font:inherit;font-weight:600;font-size:16.5px;cursor:pointer}
  .btn:hover{background:var(--ac-dark)}
  .btn.ghost{background:none;color:var(--soft);border:1.5px solid var(--line);font-weight:500}
  .btn.ghost:hover{color:var(--ac-dark);border-color:var(--ac);background:none}
  .btn.full{display:block;width:100%;text-align:center}

  .fortschritt{display:flex;gap:5px;margin-bottom:18px}
  .fortschritt i{flex:1;height:5px;border-radius:3px;background:var(--line)}
  .fortschritt i.an{background:var(--ac)}

  .feedback{border-radius:12px;padding:15px 17px;margin:16px 0 0;font-size:16px}
  .feedback.ok{background:var(--ac-soft);color:var(--ac-dark)}
  .feedback.nope{background:var(--red-soft);color:var(--red)}
  .feedback.tipp{background:var(--amber-soft);color:var(--amber)}

  .themen{display:grid;gap:9px}
  .thema{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
    text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:13px;
    padding:14px 16px;font:inherit;font-size:16.5px;color:var(--ink);cursor:pointer}
  .thema:hover{border-color:var(--ac);background:var(--ac-soft)}
  .thema.aus{cursor:default;color:var(--soft);background:var(--bg);border-style:dashed}
  .thema.aus:hover{border-color:var(--line);background:var(--bg)}
  .pill{font-size:12px;font-weight:700;white-space:nowrap;padding:5px 11px;border-radius:999px;
    background:var(--ac-soft);color:var(--ac-dark)}
  .pill.bald{background:var(--bg);color:var(--soft);border:1px solid var(--line)}

  .zeile{display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:14px 0;border-bottom:1px solid var(--line)}
  .zeile:last-child{border-bottom:none}
  .nutzerzeile{flex-wrap:wrap}
  .nutzerzeile > div:first-child{flex:1 1 200px;min-width:0}
  .nutzeraktionen{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-start;flex:0 1 auto}
  .miniaktion{background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:6px 11px;font:inherit;font-size:13px;font-weight:600;color:var(--soft);
    cursor:pointer;text-decoration:none;white-space:nowrap}
  .miniaktion:hover{border-color:var(--ac);color:var(--ac-dark)}
  .miniaktion.gefahr{color:var(--red);border-color:var(--red-soft)}
  .miniaktion.gefahr:hover{border-color:var(--red);background:var(--red-soft)}
  .zeile b{display:block;font-size:16.5px}
  .zeile span{font-size:13.5px;color:var(--soft)}
  .wann{font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--amber-soft);
    color:var(--amber);padding:6px 12px;border-radius:999px}
  .wann.spaeter{background:var(--bg);color:var(--soft);border:1px solid var(--line)}
  .wann.sitzt{background:var(--ac-soft);color:var(--ac-dark)}

  .schritte-log{margin:0 0 18px;padding:0;list-style:none}
  .schritte-log li{font-size:15px;color:var(--soft);padding:7px 0 7px 27px;position:relative}
  .schritte-log li::before{content:"✓";position:absolute;left:0;top:6px;color:var(--ac);font-weight:700}

  .zahlen{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
  .zahlen div{background:var(--bg);border-radius:13px;padding:16px 8px}
  .zahlen b{display:block;font-size:26px;line-height:1.1}
  .zahlen span{font-size:12.5px;color:var(--soft)}

  .demo{text-align:center;font-size:13px;color:var(--soft);padding:18px 10px 0;line-height:1.5}

  input.feld{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;
    font:inherit;font-size:16.5px;margin-bottom:10px;background:var(--card);color:var(--ink)}
  input.feld:focus{outline:none;border-color:var(--ac)}
  .userbox{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 15px;margin-bottom:12px;font-size:14.5px}
  .userbox b{display:block;font-size:15px;overflow-wrap:anywhere;margin-bottom:6px}
  .userbox button{background:none;border:none;padding:0;font:inherit;font-size:14px;
    color:var(--soft);text-decoration:underline;cursor:pointer}
  .userbox button:hover{color:var(--ac-dark)}
  .gast{background:var(--amber-soft);border-color:#f0dcae;color:var(--amber)}
  .gast b{color:var(--amber)}
  .laden{text-align:center;color:var(--soft);padding:40px 0}
  .zurueck{background:none;border:none;font:inherit;font-size:15px;color:var(--soft);
    cursor:pointer;padding:0;margin-bottom:14px;text-decoration:underline}
  .zurueck:hover{color:var(--ac-dark)}

  /* ---------- Startseite: die große Titelfläche ----------
     Der Titel steht mittig auf einer farbigen Fläche, nicht mehr
     einfach links in der Ecke. */
  .hero{position:relative;overflow:hidden;text-align:center;border-radius:24px;
    border:1px solid var(--line);margin:0 0 14px;
    padding:clamp(48px,8vw,88px) clamp(18px,4vw,40px) clamp(40px,6vw,64px);
    background:radial-gradient(900px 460px at 50% -12%,
      var(--hero1) 0%, var(--hero2) 46%, var(--hero3) 100%)}
  /* zwei weiche Farbkleckse im Hintergrund */
  .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;
    filter:blur(58px);opacity:.5;pointer-events:none}
  .hero::before{width:300px;height:300px;left:-130px;top:-130px;background:var(--heroglanz2);opacity:.3}
  .hero::after{width:320px;height:320px;right:-150px;bottom:-170px;background:var(--heroglanz1);opacity:.22}
  .heroinhalt{position:relative;max-width:760px;margin:0 auto}

  .hero .tag{background:var(--card);border:1px solid var(--line);
    box-shadow:0 6px 18px -14px rgba(0,0,0,.5);margin-bottom:18px}

  .hero h1{font-size:clamp(48px,11vw,92px);line-height:1.0;letter-spacing:-.04em;
    font-weight:900;margin:0 auto;color:var(--heroink);max-width:14ch;
    text-wrap:balance;text-shadow:0 2px 22px rgba(16,163,127,.12)}
  .glanz{display:inline-block;position:relative;
    background:linear-gradient(100deg,var(--heroglanz1) 0%,var(--heroglanz2) 50%,var(--heroglanz1) 100%);
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:glanzschimmer 5s ease-in-out infinite}
  @keyframes glanzschimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  @media(prefers-reduced-motion:reduce){.glanz{animation:none}}
  .glanz::after{content:"";position:absolute;left:0;right:0;bottom:-.14em;
    height:.16em;border-radius:999px;
    background:linear-gradient(90deg,transparent,var(--heroglanz1),var(--heroglanz2),transparent);opacity:.85}

  /* Markentitel als eigener Hero-Block (v. a. Handy) */
  .startkopf{text-align:center;margin:14px 0 18px;padding:clamp(30px,7vw,46px) 20px;
    border-radius:24px;border:1px solid var(--line);overflow:hidden;
    background:radial-gradient(120% 150% at 50% -10%,var(--hero1) 0%,var(--hero2) 55%,var(--hero3) 100%)}
  .startkopf .grosstitel{font-size:clamp(44px,10vw,84px);line-height:1.0;letter-spacing:-.04em;
    font-weight:900;margin:0 auto;color:var(--heroink);max-width:14ch;text-wrap:balance;
    text-shadow:0 2px 22px rgba(16,163,127,.12)}
  .startkopf .startkopfsub{margin:14px 0 0;color:var(--soft);font-size:clamp(14px,3.6vw,17px);font-weight:600}

  .hero .lede{font-size:clamp(17px,2.4vw,20px);color:var(--soft);
    max-width:52ch;margin:26px auto 0}
  .hero .lede b{color:var(--ac-dark)}
  .knopfreihe{display:flex;gap:12px;flex-wrap:wrap}
  .hero .knopfreihe{justify-content:center;margin-top:28px}
  .hero .btn{padding:15px 26px}
  .hero .btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
  .hero .btn.ghost:hover{color:var(--ac-dark)}

  .heromerkmale{display:flex;flex-wrap:wrap;justify-content:center;
    gap:10px 26px;margin-top:30px;color:var(--soft);font-size:15px}
  .heromerkmale span{display:inline-flex;align-items:center;gap:8px}
  .heromerkmale i{flex:none;width:20px;height:20px;border-radius:50%;background:var(--ac-soft);
    color:var(--ac-dark);font-style:normal;font-size:11px;font-weight:900;
    display:flex;align-items:center;justify-content:center}
  @media(max-width:560px){
    .heromerkmale{flex-direction:column;align-items:center;gap:9px}
    .hero .knopfreihe{flex-direction:column}
    .hero .knopfreihe .btn{width:100%}
  }
  .abschnitt{margin-bottom:16px}
  .ueberschrift{font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ac-dark);font-weight:700;margin:0 0 10px}
  .liste{list-style:none;padding:0;margin:0}
  .liste li{padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--line);
    font-size:16.5px}
  .liste li:last-child{border-bottom:none}
  .liste li::before{content:"";position:absolute;left:6px;top:21px;width:8px;height:8px;
    border-radius:50%;background:var(--ac)}
  .schritte{list-style:none;padding:0;margin:0;counter-reset:st}
  .schritte li{counter-increment:st;position:relative;padding-left:52px;margin-bottom:24px}
  .schritte li:last-child{margin-bottom:0}
  .schritte li::before{content:counter(st);position:absolute;left:0;top:0;width:34px;height:34px;
    border-radius:50%;background:var(--ac-soft);color:var(--ac-dark);font-weight:800;font-size:15px;
    display:flex;align-items:center;justify-content:center}
  .schritte b{display:block;font-size:18px;margin-bottom:4px}
  .schritte span{color:var(--soft);font-size:16px}
  .gegen{display:grid;gap:12px}
  .gegen>div{border-radius:13px;padding:18px 20px}
  .gegen .andere{background:var(--bg);border:1px solid var(--line)}
  .gegen .wir{background:var(--ac-soft);border:1px solid var(--ac)}
  .gegen b{display:block;font-size:15px;margin-bottom:6px}
  .gegen .andere b{color:var(--soft)}
  .gegen .wir b{color:var(--ac-dark)}
  .probe{border:1px dashed var(--line);border-radius:14px;padding:20px;background:var(--bg)}
  .probe .auf{font-size:26px;font-weight:600;text-align:center;padding:6px 0 16px;
    border-bottom:1px solid var(--line);margin-bottom:16px}
  .probe .fr{font-size:17px;margin:0 0 12px}
  .probe .opt{background:var(--card);border:1.5px solid var(--line);border-radius:11px;
    padding:11px 14px;margin-bottom:8px;font-size:15.5px}
  .probe .opt.gut{border-color:var(--ac);background:var(--ac-soft);color:var(--ac-dark);font-weight:600}
  .fuss{text-align:center;color:var(--soft);font-size:14px;padding:26px 10px 0;line-height:1.6}

  /* ---------- geführte Auswahl ---------- */
  .wahlgitter{display:grid;gap:12px;margin-bottom:14px}
  .grosswahl{display:block;width:100%;text-align:left;background:var(--card);
    border:1.5px solid var(--line);border-radius:16px;padding:20px 22px;font:inherit;
    color:var(--ink);cursor:pointer;transition:border-color .12s,background .12s}
  .grosswahl:hover{border-color:var(--ac);background:var(--ac-soft)}
  .grosswahl b{display:block;font-size:21px;letter-spacing:-.01em;margin-bottom:3px}
  .grosswahl span{font-size:14.5px;color:var(--soft)}
  .pfad{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .pfad button,.pfad a{background:var(--ac-soft);border:none;border-radius:999px;padding:5px 13px;
    font:inherit;font-size:13.5px;font-weight:700;color:var(--ac-dark);cursor:pointer;text-decoration:none}
  .pfad button:hover,.pfad a:hover{background:var(--ac);color:#fff}
  .pfad span{color:var(--soft);font-size:15px}
  .wechseln{background:none;border:none;padding:0;font:inherit;font-size:14px;
    color:var(--soft);text-decoration:underline;cursor:pointer}
  .wechseln:hover{color:var(--ac-dark)}
  .pill.neutral{background:var(--bg);color:var(--soft);border:1px solid var(--line)}

  /* ---------- Erklärung ---------- */
  .themazeile{display:flex;gap:8px;align-items:stretch}
  .themazeile .thema{flex:1;margin:0}
  .erklknopf{flex:none;width:46px;border:1.5px solid var(--line);background:var(--card);
    border-radius:13px;font:inherit;font-size:19px;font-weight:800;color:var(--soft);cursor:pointer}
  .erklknopf:hover{border-color:var(--ac);background:var(--ac-soft);color:var(--ac-dark)}
  ol.beispielschritte{margin:0 0 16px;padding-left:22px}
  ol.beispielschritte li{padding:5px 0;font-size:16px;color:var(--soft)}
  .ergebnis{background:var(--ac-soft);color:var(--ac-dark);border-radius:11px;
    padding:13px 16px;font-weight:700;font-size:17px;text-align:center}

  /* ---------- Erklärung und Einstellungen ---------- */
  .einfachtext{font-size:17px;line-height:1.7;margin:0 0 14px;max-width:62ch}
  .einfachtext:last-child{margin-bottom:0}
  .begriffe{display:grid;gap:0}
  .begriff{padding:12px 0;border-bottom:1px solid var(--line)}
  .begriff:last-child{border-bottom:none}
  .begriff b{display:block;font-size:16.5px;color:var(--ac-dark)}
  .begriff span{font-size:16px;color:var(--soft)}
  .feedback.hilfe{background:var(--amber-soft);color:var(--amber)}
  .optionen3{display:grid;gap:10px}
  .option{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
    border-radius:13px;padding:14px 16px;font:inherit;color:var(--ink);cursor:pointer}
  .option:hover{border-color:var(--ac)}
  .option.an{border-color:var(--ac);background:var(--ac-soft)}
  .option b{display:block;font-size:16.5px}
  .option span{font-size:14px;color:var(--soft)}
  .option.an b{color:var(--ac-dark)}

  /* ---------- Dashboard ---------- */
  .planbtn.admin{border-color:var(--ac);background:var(--ac-soft)}
  .planbtn.admin small{color:var(--ac-dark)}
  .balken{display:flex;gap:5px;align-items:flex-end;height:130px}
  .balkensaeule{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
  .balkensaeule .saeule{width:100%;background:var(--ac);border-radius:5px 5px 0 0;min-height:3px}
  .balkensaeule span{font-size:10px;color:var(--soft);margin-top:6px;white-space:nowrap}
  .rangzeile{display:flex;align-items:center;gap:10px;padding:7px 0}
  .rangname{flex:0 0 40%;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rangbalken{flex:1;background:var(--bg);border-radius:999px;height:10px;overflow:hidden}
  .rangbalken i{display:block;height:100%;background:var(--ac);border-radius:999px}
  .rangzahl{flex:0 0 42px;text-align:right;font-size:14px;color:var(--soft);font-variant-numeric:tabular-nums}
  .meldung{border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px}
  .meldung.erledigt{opacity:.55}
  /* Admin: Werkzeugleiste, Filter-Reiter, Bauplan */
  .dashwerkzeug{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
  .dashwerkzeug .btn{padding:9px 16px}
  .dashwerkzeug .stand{font-size:13px;color:var(--soft)}
  .tickettabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
  .tickettab{background:var(--bg);border:1px solid var(--line);border-radius:999px;
    padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--soft);cursor:pointer;
    display:inline-flex;align-items:center;gap:7px}
  .tickettab:hover{color:var(--ac-dark);border-color:var(--ac)}
  .tickettab.an{background:var(--ac-soft);border-color:var(--ac);color:var(--ac-dark)}
  .tickettab span{background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:0 7px;font-size:12px;min-width:20px;text-align:center}
  .tickettab.an span{background:var(--ac);color:#fff;border-color:transparent}
  .luecke{padding:10px 0;border-top:1px solid var(--line)}
  .luecke:first-of-type{border-top:none}
  .lueckekopf{font-weight:700;font-size:14.5px;margin-bottom:8px;display:flex;
    justify-content:space-between;gap:10px}
  .lueckekopf span{color:var(--soft);font-weight:500;font-size:13px}
  .lueckechips{display:flex;flex-wrap:wrap;gap:6px}
  .lueckechips .chip{background:var(--amber-soft);color:var(--amber);border-radius:999px;
    padding:4px 11px;font-size:12.5px;font-weight:600}
  .meldungkopf{display:flex;justify-content:space-between;gap:10px;font-size:14px}
  .meldungkopf b{color:var(--ac-dark)}
  .meldungkopf span{color:var(--soft)}
  .meldungtext{margin:8px 0;font-size:16px;white-space:pre-wrap}
  .meldungmail{display:block;font-size:14px;color:var(--ac-dark);margin-bottom:8px}
  textarea.feld{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;
    font:inherit;font-size:16.5px;margin-bottom:10px;background:var(--card);color:var(--ink);
    resize:vertical;line-height:1.5}
  textarea.feld:focus{outline:none;border-color:var(--ac)}
  select.feld{-webkit-appearance:none;appearance:none;width:100%;
    padding:13px 42px 13px 15px;border:1.5px solid var(--line);border-radius:12px;
    font:inherit;font-size:16.5px;margin-bottom:10px;background-color:var(--card);color:var(--ink);
    cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238c9a95' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;background-size:16px}
  select.feld:focus{outline:none;border-color:var(--ac)}
  .sterne{display:flex;gap:4px}
  .stern{background:none;border:none;font-size:38px;line-height:1;color:var(--line);
    cursor:pointer;padding:0 3px}
  .stern.an{color:#f6b73c}
  .stern:hover{color:#f6b73c}
  .fusslink{background:none;border:none;font:inherit;font-size:14px;color:var(--soft);
    text-decoration:underline;cursor:pointer;padding:6px 0}
  .fusslink:hover{color:var(--ac-dark)}

  /* ---------- Antwort eintippen ---------- */
  .eingabezeile{display:flex;gap:10px;align-items:stretch}
  .antwortfeld{margin-bottom:0;font-size:19px;font-weight:600}
  .eingabezeile .btn{flex:none;padding:13px 22px}
  @media(max-width:480px){
    .eingabezeile{flex-direction:column}
    .eingabezeile .btn{width:100%}
  }

  /* ---------- Baustellenband und Hinweis ---------- */
  .baustelle{position:relative;background:linear-gradient(90deg,var(--bau1),var(--bau2));
    color:var(--bauink);display:flex;align-items:center;justify-content:center;
    gap:10px;flex-wrap:wrap;padding:10px 20px;font-size:14.5px;line-height:1.4;
    font-weight:600;text-align:center}
  /* die schrägen Streifen wie am Absperrband */
  .baustelle::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(135deg,rgba(0,0,0,.07) 0 14px,transparent 14px 28px)}
  .baustelle .bzeichen{position:relative;flex:none;display:flex}
  .baustelle svg{width:19px;height:19px}
  .baustelle .btext{position:relative}
  .baustelle b{font-weight:800}
  .bknopf{position:relative;flex:none;background:rgba(255,255,255,.75);
    border:1.5px solid rgba(0,0,0,.18);color:var(--bauink);
    border-radius:999px;font:inherit;font-size:13.5px;font-weight:700;
    padding:4px 13px;cursor:pointer;text-decoration:none}
  .bknopf:hover{background:#fff}
  /* auf dem Handy soll das Band nicht den halben Bildschirm einnehmen */
  @media(max-width:560px){
    .baustelle{padding:8px 14px;gap:8px;font-size:13.5px}
    .baustelle .bknopf:last-child{display:none}
  }

  /* Hinweiskasten auf der Startseite */
  .baubox{background:var(--amber-soft);border:1px solid var(--amber);border-radius:18px;
    padding:22px 24px;margin-bottom:14px}
  .baubox .baukopf{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .baubox .bausymbol{flex:none;width:44px;height:44px;border-radius:14px;
    background:linear-gradient(145deg,var(--bau1),var(--bau2));color:var(--bauink);
    display:flex;align-items:center;justify-content:center}
  .baubox .bausymbol svg{width:23px;height:23px}
  .baubox h2{margin:0;font-size:20px;letter-spacing:-.015em;color:var(--amber)}
  .baubox p{color:var(--amber);opacity:.92}

  .baugitter{display:grid;grid-template-columns:1fr;gap:8px;margin:16px 0 4px}
  @media(min-width:620px){ .baugitter{grid-template-columns:1fr 1fr} }
  .bauzeile{display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:13px;padding:11px 13px;font-size:15.5px}
  .bauzeile .bauname{flex:1;min-width:0}
  .baustand{flex:none;font-size:11px;font-weight:800;letter-spacing:.05em;
    text-transform:uppercase;padding:3px 9px;border-radius:999px}
  .baustand.fertig{background:var(--ac-soft);color:var(--ac-dark)}
  .baustand.arbeit{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber)}
  .baustand.geplant{background:var(--bg);color:var(--soft);border:1px solid var(--line)}

  .baubalken{height:8px;border-radius:999px;background:var(--bg);
    border:1px solid var(--line);overflow:hidden;margin:10px 0 6px}
  .baubalken i{display:block;height:100%;background:var(--ac);border-radius:999px}

  /* je Fach ein kleiner Block mit den sechs Klassen als Plättchen */
  .baufaecher{display:grid;grid-template-columns:1fr;gap:10px;margin:16px 0 4px}
  @media(min-width:620px){ .baufaecher{grid-template-columns:1fr 1fr} }
  .baufach{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 16px}
  .baufachkopf{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .baufachkopf b{font-size:16.5px}
  .baufachkopf span{font-size:13.5px;color:var(--soft)}
  .bauchips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .bauchip{flex:1;min-width:38px;text-align:center;border-radius:9px;padding:7px 4px;
    font-size:14px;font-weight:700;border:1.5px solid var(--line);
    background:var(--bg);color:var(--soft)}
  .bauchip.fertig{border-color:var(--ac);background:var(--ac-soft);color:var(--ac-dark)}
  .bauchip.arbeit{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
  .baulegende{display:flex;gap:8px 18px;flex-wrap:wrap;margin-top:12px;
    font-size:13.5px;color:var(--amber)}
  .baulegende span{display:inline-flex;align-items:center;gap:7px}
  .baulegende i{width:13px;height:13px;border-radius:4px;border:1.5px solid var(--line);
    background:var(--bg);display:block}
  .baulegende i.fertig{border-color:var(--ac);background:var(--ac-soft)}
  .baulegende i.arbeit{border-color:var(--amber);background:var(--amber-soft)}
  .baubox .btn.ghost{background:var(--card);color:var(--amber);border-color:var(--amber)}
  .baubox .btn.ghost:hover{background:var(--card);color:var(--amber);border-color:var(--amber)}

  .torgrund{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80}
  .tor{position:fixed;z-index:90;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(560px,92vw);max-height:88vh;overflow-y:auto;
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:26px 24px;box-shadow:0 18px 50px rgba(0,0,0,.28);zoom:calc(1 / var(--fs,1))}
  .tor h2{margin:10px 0 8px;font-size:25px;letter-spacing:-.01em}
  .torliste{margin:14px 0 16px;padding-left:20px}
  .torliste li{margin-bottom:9px}
  .wartungmitte{min-height:70vh;display:flex;align-items:center;justify-content:center;
    max-width:560px;margin:0 auto;padding:40px 0}

  /* ---------- Kopfleiste und Menü ---------- */
  .kopfleiste{position:sticky;top:0;z-index:40;background:var(--bg);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:18px 20px;max-width:1140px;margin:0 auto}
  .kopfspacer{width:46px;flex:none}
  .kopfleiste a{text-decoration:none}
  .fussleiste a,.menue a{text-decoration:none}
  a.btn,a.grosswahl,a.planbtn,a.fachzeile,a.thema,a.wechseln,a.zurueck{text-decoration:none}
  .marke{flex:none;display:flex;align-items:center;justify-content:flex-start;gap:12px;
    background:none;border:none;font:inherit;color:var(--ink);cursor:pointer;padding:4px;text-align:left}
  .marke .ekkuerzel{font-size:clamp(23px,6.2vw,34px);font-weight:900;letter-spacing:.03em;
    color:var(--ink);white-space:nowrap}
  .marke .ekkuerzel .kap{color:var(--ac-dark)}
  .marke .markewort{display:flex;flex-direction:column;line-height:1.12;min-width:0}
  .marke .markewort b{font-size:clamp(20px,5.4vw,28px);font-weight:900;letter-spacing:-.02em;
    color:var(--ink);white-space:nowrap}
  .marke .markewort .kap{color:var(--ac-dark)}
  .marke .slogan{font-size:clamp(11px,3vw,14px);font-weight:600;letter-spacing:.01em;
    color:var(--soft);white-space:nowrap}
  .marke .markentext{white-space:nowrap;letter-spacing:.03em}
  /* Wortmarke in der Leiste (nur Desktop) */
  .marke .markewortmark{display:none;font-size:24px;font-weight:900;letter-spacing:-.02em;
    color:var(--ink);white-space:nowrap}
  .marke .markewortmark .kap{color:var(--ac-dark)}
  /* Kleiner Zusatz „Schritt für Schritt" neben der Glühbirne — NUR auf dem
     Handy, in den Markenfarben (grün→türkis) mit demselben Schimmer wie
     „kapiert" im Hero. Auf dem Desktop ausgeblendet (siehe 820px-Query). */
  .marke .markeslogan{display:inline-flex;align-items:baseline;gap:.34em;
    font-size:clamp(11px,2.9vw,13px);line-height:1.15;white-space:nowrap;
    padding-left:9px;margin-left:1px;border-left:1.5px solid var(--ac-soft)}
  /* die beiden „Schritt" sind die eigentlichen Stufen: kräftig, grün→türkis, schimmernd */
  .marke .markeslogan .stap{font-weight:900;letter-spacing:-.01em;
    background:linear-gradient(100deg,var(--heroglanz1) 0%,var(--heroglanz2) 50%,var(--heroglanz1) 100%);
    background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:glanzschimmer 5s ease-in-out infinite}
  .marke .markeslogan .stap2{transform:translateY(-.18em)}   /* zweite Stufe „steigt" */
  /* das „für" tritt zurück — zierlich, kursiv, gedämpft */
  .marke .markeslogan .fuer{font-weight:600;font-style:italic;font-size:.82em;
    letter-spacing:.01em;color:var(--soft);opacity:.85}
  @media(prefers-reduced-motion:reduce){.marke .markeslogan .stap{animation:none}}
  /* Menü-Links in der Mitte (nur Desktop) */
  .kopfnav{display:none;align-items:center;gap:4px}
  .kopflink{background:none;border:none;font:inherit;font-size:18px;font-weight:600;
    color:var(--soft);cursor:pointer;padding:10px 16px;border-radius:11px}
  .kopflink:hover{color:var(--ac-dark);background:var(--ac-soft)}
  @media(min-width:820px){
    .marke .markewortmark{display:inline}
    .marke .markeslogan{display:none}   /* Desktop: Zusatz aus, nur Wortmarke */
    .kopfnav{display:flex}
    .startkopf{display:none}
  }
  /* rechte Gruppe: Serie + Aktions-Button + Menü */
  .kopfrechts{display:flex;align-items:center;gap:9px;flex:none}
  .kopfrechts .serie--mini{flex-direction:row;gap:6px;min-width:0;padding:8px 13px;border-radius:999px;
    font:inherit;cursor:pointer}
  .kopfrechts .serie--mini:hover{background:var(--ac-soft)}
  .kopfrechts .serie--mini svg{width:19px;height:19px}
  .kopfrechts .serie--mini b{font-size:16px}
  .kopfrechts .kopfcta{padding:11px 19px;font-size:clamp(14px,3.6vw,15.5px);white-space:nowrap}
  @media(max-width:640px){
    .kopfleiste{padding:14px 14px}
    .marke .slogan{display:none}
    .marke{gap:10px}
    .kopfrechts{gap:7px}
    .kopfrechts .kopfcta{padding:9px 12px;font-size:13px}
  }
  @media(max-width:400px){
    .kopfrechts .serie--mini{padding:7px 10px}
    .kopfrechts .serie--mini b{font-size:15px}
    .kopfrechts .kopfcta{padding:8px 10px;font-size:12px}
    .marke .ahabirne{width:48px;height:48px}
    .marke .ekkuerzel{font-size:22px}
  }
  /* nur auf extrem schmalen Geräten ausblenden, damit die Leiste nicht überläuft */
  @media(max-width:359px){ .marke .markeslogan{display:none} }
  .marke .glanz::after{display:none}
  .marke .dot{width:clamp(42px,11vw,48px);height:clamp(42px,11vw,48px);border-radius:14px;
    background:linear-gradient(135deg,var(--heroglanz1),var(--heroglanz2));flex:none;
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-size:clamp(16px,4.4vw,19px);font-weight:900;letter-spacing:.02em;
    box-shadow:0 8px 20px -8px var(--heroglanz1)}
  /* Idee 5: Glühbirne + Kürzel */
  .marke .bulb{width:clamp(40px,10vw,46px);height:clamp(40px,10vw,46px);border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:var(--ac-soft);border:1.5px solid var(--line);color:var(--ac-dark)}
  .marke .bulb svg{width:clamp(22px,5.5vw,26px);height:clamp(22px,5.5vw,26px)}
  /* Idee 4: gestapelte Marke */
  .marke .stapel{display:flex;flex-direction:column;line-height:1;text-align:left}
  .marke .stapel .o{font-size:clamp(10px,2.8vw,12px);font-weight:800;letter-spacing:.22em;
    text-transform:uppercase;color:var(--soft)}
  .marke .stapel .u{font-size:clamp(20px,5.4vw,26px);font-weight:900;letter-spacing:-.02em;
    background:linear-gradient(100deg,var(--heroglanz1),var(--heroglanz2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  /* Idee 6: Marke als Pille */
  .marke .pille{display:inline-flex;align-items:center;gap:10px;padding:7px 18px 7px 7px;
    border-radius:999px;background:var(--ac-soft);border:1px solid var(--line);
    box-shadow:0 6px 18px -14px rgba(0,0,0,.5)}
  .marke .pille .dot{width:clamp(30px,7.5vw,34px);height:clamp(30px,7.5vw,34px);border-radius:10px;
    font-size:clamp(12px,3.2vw,14px);box-shadow:none}
  .marke .pille b{font-size:clamp(15px,4vw,18px);font-weight:800;letter-spacing:-.01em;
    color:var(--ink);white-space:nowrap}
  /* Idee B: leuchtende Glühbirne + Kürzel */
  .marke .leuchtbirne{width:clamp(48px,12vw,56px);height:clamp(48px,12vw,56px);border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;color:#fff;
    background:linear-gradient(140deg,var(--heroglanz1),var(--heroglanz2));
    box-shadow:0 0 20px -1px var(--heroglanz2),0 10px 24px -9px var(--heroglanz1)}
  .marke .leuchtbirne svg{width:clamp(28px,7vw,32px);height:clamp(28px,7vw,32px)}
  /* A + B kombiniert: heller XL-Kreis mit Rahmen, Verlauf-Birne und Leuchten */
  .marke .ahabirne{width:clamp(48px,12vw,62px);height:clamp(48px,12vw,62px);border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 120% at 50% 32%,var(--ac-soft),var(--card));
    border:1.5px solid var(--line);
    box-shadow:0 0 22px -2px var(--heroglanz2),0 12px 28px -10px var(--heroglanz1)}
  .marke .ahabirne svg{width:clamp(29px,7vw,37px);height:clamp(29px,7vw,37px)}
  .burger{background:none;border:1.5px solid var(--line);border-radius:11px;
    width:46px;height:42px;display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:5px;cursor:pointer;padding:0}
  .burger:hover{border-color:var(--ac)}
  .burger i{display:block;width:20px;height:2.5px;border-radius:2px;background:var(--ink);
    transition:transform .18s, opacity .18s}
  .burger.offen i:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
  .burger.offen i:nth-child(2){opacity:0}
  .burger.offen i:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}

  .menuegrund{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50}
  /* Menü gegen-zoomen, damit das feste Panel bildschirmbreit bleibt;
     die Schrift skaliert stattdessen über var(--fs). */
  .menue{position:fixed;top:0;right:0;bottom:0;width:min(340px,86vw);z-index:60;
    background:var(--card);border-left:1px solid var(--line);
    padding:calc(74px * var(--fs,1)) 16px 30px;overflow-y:auto;box-shadow:-6px 0 26px rgba(0,0,0,.14);
    zoom:calc(1 / var(--fs,1))}
  .mtitel{font-size:calc(11.5px * var(--fs,1));letter-spacing:.13em;text-transform:uppercase;color:var(--soft);
    font-weight:700;margin:20px 0 6px 10px}
  .mtitel:first-child{margin-top:0}
  .mpunkt{display:flex;justify-content:space-between;align-items:center;gap:10px;
    width:100%;text-align:left;background:none;border:none;border-radius:11px;
    padding:calc(12px * var(--fs,1)) 12px;font:inherit;font-size:calc(16.5px * var(--fs,1));color:var(--ink);cursor:pointer}
  .mpunkt:hover{background:var(--ac-soft);color:var(--ac-dark)}
  .mpunkt.an{background:var(--ac-soft);color:var(--ac-dark);font-weight:600}
  .mpunkt.unter{padding-left:26px;font-size:calc(15.5px * var(--fs,1));color:var(--soft)}

  .mpunkt span{font-size:calc(14px * var(--fs,1));color:var(--soft)}

  .faq{padding:16px 0;border-bottom:1px solid var(--line)}
  .faq:last-child{border-bottom:none}
  .faq b{display:block;font-size:17px;margin-bottom:6px}

  /* Einklappbare Frage/Antwort (Akkordeon) */

  .klapp:last-child{border-bottom:none}
  .klapp > summary{list-style:none;cursor:pointer;font-weight:700;font-size:17px;

  .klapp > summary::after{content:"▾";position:absolute;right:4px;top:15px;
    color:var(--soft);font-size:16px;transition:transform .2s}
  .klapp[open] > summary::after{transform:rotate(180deg)}
  .klapp > summary:hover{color:var(--ac-dark)}
  .klapp > p{margin:0 0 16px;color:var(--soft);font-size:16px;line-height:1.6}
  .platzhalter{background:var(--amber-soft);color:var(--amber);border-radius:5px;
    padding:1px 7px;font-weight:700;font-size:14px}

  /* ---------- Dashboard, zweiter Teil ---------- */
  .wochentage{display:grid;gap:4px}
  .wtag{display:flex;align-items:center;gap:10px}
  .wname{flex:0 0 30px;font-size:14px;color:var(--soft)}
  .wbalken{flex:1;background:var(--bg);border-radius:999px;height:12px;overflow:hidden}
  .wbalken i{display:block;height:100%;background:var(--ac);border-radius:999px}
  .wzahl{flex:0 0 42px;text-align:right;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
  .todo{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px}
  .todo:last-child{border-bottom:none}
  .todo .haken{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff}
  .todo.fertig .haken{background:var(--ac);border-color:var(--ac)}
  .todo.fertig{color:var(--soft);text-decoration:line-through}

  /* ---------- Tickets und Support ---------- */
  .code{background:var(--ac-soft);color:var(--ac-dark);border-radius:12px;padding:14px 18px;
    font-size:19px;margin:14px 0;text-align:center}
  .code b{font-size:24px;letter-spacing:.04em}
  .kontext{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .kontext span{background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:4px 9px;font-size:12.5px;color:var(--soft)}
  .kontext b{color:var(--ink);font-weight:600;margin-right:5px}
  .antwort{background:var(--ac-soft);border-radius:11px;padding:12px 15px;margin:10px 0}
  .antwort b{display:block;font-size:13px;color:var(--ac-dark);margin-bottom:4px;
    text-transform:uppercase;letter-spacing:.08em}
  .antwort p{margin:0;font-size:16px;white-space:pre-wrap}
  .statuspille{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;
    background:var(--amber-soft);color:var(--amber)}
  .statuspille.beantwortet{background:var(--ac-soft);color:var(--ac-dark)}
  .statuspille.fertig{background:var(--bg);color:var(--soft);border:1px solid var(--line)}
  .freigabeliste{display:flex;flex-direction:column;gap:5px;margin:8px 0}
  .fpunkt{font-size:14px;color:var(--soft);background:var(--bg);border-radius:8px;padding:6px 10px}

  /* ---------- Fußleiste ---------- */
  .fussleiste{border-top:1px solid var(--line);background:var(--card);margin-top:30px;padding:34px 20px 26px}
  .fussinhalt{max-width:1140px;margin:0 auto;display:grid;gap:26px}
  .fussspalte{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
  .fusstitel{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--soft);
    font-weight:700;margin:0 0 8px}
  .fusslink{background:none;border:none;padding:5px 0;font:inherit;font-size:15px;
    color:var(--ink);text-align:left;cursor:pointer}
  .fusslink:hover{color:var(--ac-dark);text-decoration:underline}
  .fussschluss{max-width:1140px;margin:26px auto 0;padding-top:20px;border-top:1px solid var(--line);
    font-size:13.5px;color:var(--soft);text-align:center}
  .card.faellig{border-color:var(--ac)}
  .btn.admin{background:var(--ac-dark)}

  /* ---------- Startseite (Übersicht) ---------- */
  .ueberschrift svg{width:16px;height:16px;vertical-align:-3px;margin-right:7px;
    color:var(--ac);flex:none}
  .kopfkarte{background:linear-gradient(150deg,var(--ac-soft) 0%,var(--card) 62%)}
  .kopfzeile{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .kopfzeile h1{margin:8px 0 6px}
  .serie{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:0;background:var(--card);border:1.5px solid var(--ac);border-radius:16px;
    padding:9px 14px;min-width:74px}
  .serie svg{width:22px;height:22px;color:var(--ac)}
  .serie b{font-size:22px;line-height:1.1;color:var(--ac-dark)}
  .serie span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  .ziel{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
  .zielkopf{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15.5px}
  .zielkopf svg{width:18px;height:18px;color:var(--ac);flex:none}
  .zielpunkte{display:flex;gap:7px}
  .zielpunkte i{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);display:block}
  .zielpunkte i.voll{background:var(--ac);border-color:var(--ac)}
  /* Streak-Ansicht */
  .seriekarte{text-align:center}
  .serieflamme{display:inline-flex;color:var(--ac)}
  .serieflamme svg{width:52px;height:52px}
  .seriezahl{font-size:64px;font-weight:900;line-height:1;color:var(--ac-dark);letter-spacing:-.03em;margin-top:4px}
  .serietage{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-top:6px}
  /* Meilenstein-Feier + Badges */
  .feierkarte{text-align:center;position:relative;border:1.5px solid var(--ac);
    background:linear-gradient(160deg,var(--ac-soft),var(--card))}
  .feierkarte h2{margin:6px 0 6px}
  .feierkarte p{color:var(--soft);margin:0 0 14px}
  .feieremoji{font-size:44px;line-height:1}
  .feierzu{position:absolute;top:8px;right:12px;background:none;border:none;font-size:26px;
    color:var(--soft);cursor:pointer;line-height:1}
  .msreihe{display:flex;flex-wrap:wrap;gap:8px}
  .msbadge{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;
    font-weight:700;color:var(--soft)}
  .msbadge.erreicht{background:var(--ac-soft);border-color:var(--ac);color:var(--ac-dark)}
  .textlink{background:none;border:none;font:inherit;color:var(--ac-dark);font-weight:600;
    cursor:pointer;text-decoration:underline;padding:6px;width:100%;text-align:center}

  .kachelpaar{display:grid;grid-template-columns:1fr;gap:0}
  /* Dünner Ladebalken oben — Feedback beim Seitenwechsel (wie bei anderen Seiten) */
  #ladebalken{position:fixed;top:0;left:0;height:3.5px;width:0;z-index:100;opacity:0;
    background:linear-gradient(90deg,#0a8f5f,#18c169,#12b5c9,#4f7cf7,#18c169,#0a8f5f);
    background-size:220% 100%;animation:ladefarbe 1s linear infinite;
    box-shadow:0 0 10px #22d16e;pointer-events:none}
  @keyframes ladefarbe{0%{background-position:0% 0}100%{background-position:220% 0}}
  @media(prefers-reduced-motion:reduce){#ladebalken{animation:none}}
  .kachel{display:flex;flex-direction:column}
  .kachel .small{flex:1}
  .fachknoepfe{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
  .fachknoepfe .btn{text-align:center}

  .empfehlung{background:var(--bg);border-radius:13px;padding:14px 16px}
  .empfehlung b{display:block;font-size:19px;letter-spacing:-.01em}
  .empfehlung span{font-size:14px;color:var(--soft)}

  .merksatz{border-left:4px solid var(--ac)}
  .merktext{font-size:19.5px;line-height:1.5;margin:4px 0 10px}

  .fachzeile{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .fachzeile:last-of-type{border-bottom:none}
  .fachzeile:hover .fachname{color:var(--ac-dark)}
  .fachname{font-weight:600;font-size:17px}
  .fachzahl{font-size:13.5px;color:var(--soft);white-space:nowrap;text-align:right}
  .fachbalken{grid-column:1 / -1;height:9px;border-radius:999px;background:var(--bg);
    border:1px solid var(--line);overflow:hidden;display:block}
  .fachbalken i{display:block;height:100%;background:var(--ac);border-radius:999px;min-width:0}

  /* ---------- breiter Bildschirm ---------- */
  @media(min-width:900px){
    .shell{grid-template-columns:1fr;max-width:880px}
    main{order:0}
    .logo{padding-top:24px}
    .fachliste{flex-direction:column}
    .optionen.breit{grid-template-columns:repeat(auto-fit,minmax(215px,1fr));align-items:stretch}
    .optionen.breit button.pick{height:100%}
    .card{padding:30px 32px}
    h1{font-size:32px}
    .aufg .zeile1{font-size:44px}
    .aufg.text .zeile1{font-size:24px;text-align:center}
    .themen{grid-template-columns:1fr 1fr}
    .themen{align-items:start}
    .shell.voll{grid-template-columns:1fr;max-width:880px}
    .gegen{grid-template-columns:1fr 1fr}
    .hero{padding:34px 0 14px}
    .wahlgitter{grid-template-columns:1fr 1fr}
    .fussinhalt{grid-template-columns:repeat(4,1fr);gap:30px}
    .wahlgitter.drei{grid-template-columns:1fr 1fr 1fr}
    .kachelpaar{grid-template-columns:1fr 1fr;gap:14px}
    .kachelpaar .card{margin-bottom:0}
    .merktext{font-size:21px}
    .optionen3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  }
</style>
</head>
<body>
<div id="ladebalken"></div>
<div id="kopf"></div>
<div class="shell" id="shell">
  <aside class="side">
    <div id="seite"></div>
  </aside>
  <main>
    <div id="screen"></div>
    <p class="demo">Mathe Klasse 5 bis 7 und Deutsch Klasse 5 bis 7 sind fertig — die übrigen Klassen kommen nach und nach.</p>
  </main>
</div>
<div id="fussleiste"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------- Themenkatalog ---------- */
const KATALOG = {
  mathe: {
    name:"Mathe",
    themen:{
      5:["Natürliche Zahlen","Grundrechenarten","Größen und Einheiten","Flächen und Umfang","Symmetrie"],
      6:["Brüche","Dezimalzahlen","Teilbarkeit","Dreisatz","Winkel messen"],
      7:["Gleichungen umstellen","Prozent und Zinsen","Zuordnungen","Dreiecke","Wahrscheinlichkeit"],
      8:["Terme umformen","Binomische Formeln","Lineare Funktionen","Kreis","Gleichungssysteme"],
      9:["Quadratische Gleichungen","Satz des Pythagoras","Potenzen und Wurzeln","Körper berechnen","Strahlensätze"],
      10:["Quadratische Funktionen","Trigonometrie","Exponentielles Wachstum","Kugel und Kegel","Statistik"]
    }
  },
  deutsch: {
    name:"Deutsch",
    themen:{
      5:["Wortarten erkennen","Satzglieder bestimmen","Groß- und Kleinschreibung","Wörtliche Rede","Erzählen"],
      6:["das oder dass","Zeitformen","Kommas bei Aufzählungen","Berichten","Adjektive steigern"],
      7:["Nominalisierung","Kommas bei Nebensätzen","Aktiv und Passiv","Inhaltsangabe","Argumentieren"],
      8:["Konjunktiv","Satzreihe und Satzgefüge","Kommas bei Infinitivgruppen","Erörterung","Sachtexte auswerten"],
      9:["Stilmittel erkennen","Gedichte deuten","Bewerbung schreiben","Textgebundene Erörterung","Fremdwörter"],
      10:["Literaturepochen","Interpretation","Sprachwandel","Rede und Rhetorik","Facharbeit"]
    }
  }
};

/* ---------- Werkzeuge für die Aufgabenerzeugung ---------- */
const rnd  = (a,b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
/* deutsche Zahlschreibweise: 3.847 und 12,5 */
const z = n => Number(n).toLocaleString("de-DE", {maximumFractionDigits: 4});
/* Euro mit zwei Nachkommastellen */
const eur = n => Number(n).toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";
/* zieht `anzahl` verschiedene Elemente aus einer Liste */
function zieheVerschiedene(liste, anzahl){
  const kopie = liste.slice(), raus = [];
  while (raus.length < anzahl && kopie.length) raus.push(kopie.splice(rnd(0, kopie.length-1), 1)[0]);
  return raus;
}
function ggt(a,b){ return b ? ggt(b, a % b) : a; }
function kgv(a,b){ return a * b / ggt(a,b); }
/* Option-Kurzschreibweise */
const R = (t, fb) => ({t, ok:1, fb});
const F = (t, fb) => ({t, ok:0, fb});

/* ---------- Aufgabenerzeuger ---------- */
const AUFGABEN = {

/* ===================== MATHE · KLASSE 5 ===================== */

"Natürliche Zahlen":[

 /* Runden auf Hunderter */
 () => {
   let n, t, h, e;
   do { n = rnd(1000, 9999); t = Math.floor(n/1000); h = Math.floor(n/100)%10; e = Math.floor(n/10)%10; }
   while (new Set([t,h,e]).size < 3);
   const auf = e >= 5;
   const erg = Math.round(n/100) * 100;
   const gegen = auf ? erg - 100 : erg + 100;
   return {
    typ:"formel", text:`Runde ${z(n)} auf Hunderter`, loesung: z(erg),
    schluss:"Beim Runden zählt immer nur die eine Ziffer rechts neben der Rundungsstelle.",
    schritte:[
     {frage:`Welche Ziffer steht bei <b>${z(n)}</b> an der <b>Hunderterstelle</b>?`,
      tipp:"Von rechts: Einer, Zehner, Hunderter.",
      optionen:[R(`Die ${h}`, "Richtig. Das ist die Stelle, auf die gerundet wird."),
                F(`Die ${e}`, "Die steht an der Zehnerstelle."),
                F(`Die ${t}`, "Die steht an der Tausenderstelle.")]},
     {frage:"Welche Ziffer <b>entscheidet</b>, ob auf- oder abgerundet wird?",
      tipp:"Immer die Ziffer direkt rechts neben der Rundungsstelle.",
      optionen:[R(`Die ${e} rechts daneben`, "Genau. Nur diese eine Ziffer entscheidet."),
                F(`Die ${n%10} ganz rechts`, "Die steht zu weit weg, sie spielt keine Rolle."),
                F("Alle Ziffern zusammen", "Nein — nur die eine direkt rechts daneben.")]},
     {frage:`Die entscheidende Ziffer ist eine <b>${e}</b>. Was heißt das?`,
      tipp:"0 bis 4 heißt abrunden, 5 bis 9 heißt aufrunden.",
      optionen: zieheVerschiedene(auf
        ? [R("Aufrunden", `${e} ist 5 oder größer — also aufrunden.`),
           F("Abrunden", `Abgerundet wird nur bis 4. Die ${e} liegt darüber.`),
           F("Die Ziffer stehen lassen", "Beim Runden verschwindet alles rechts der Rundungsstelle.")]
        : [R("Abrunden", `${e} liegt unter 5 — also abrunden.`),
           F("Aufrunden", "Aufgerundet wird erst ab 5."),
           F("Die Ziffer stehen lassen", "Beim Runden verschwindet alles rechts der Rundungsstelle.")], 3)},
     {frage:"Wie heißt das Ergebnis?",
      tipp:"Die Hunderterziffer bleibt oder wächst um eins, dahinter stehen zwei Nullen.",
      optionen:[R(z(erg), "Richtig."),
                F(z(gegen), auf ? "Das wäre abgerundet." : "Das wäre aufgerundet."),
                F(z(Math.floor(n/10)*10), "Beim Runden auf Hunderter müssen hinten zwei Nullen stehen.")]}]};
 },

 /* Stellenwert einer Ziffer */
 () => {
   const stellen = [
     {name:"Einer", wert:1, pos:0}, {name:"Zehner", wert:10, pos:1},
     {name:"Hunderter", wert:100, pos:2}, {name:"Tausender", wert:1000, pos:3}
   ];
   const st = pick(stellen.slice(1));
   let n, ziffer;
   do { n = rnd(10000, 99999); ziffer = Math.floor(n / st.wert) % 10; } while (ziffer === 0);
   const erg = ziffer * st.wert;
   const andere = pick(stellen.filter(x => x.name !== st.name));
   return {
    typ:"text", text:`Welchen <b>Wert</b> hat die Ziffer <b>${ziffer}</b> in der Zahl ${z(n)}?`,
    loesung: z(erg),
    schluss:"Der Wert einer Ziffer hängt davon ab, an welcher Stelle sie steht — nicht davon, wie groß die Ziffer selbst ist.",
    schritte:[
     {frage:`An welcher Stelle steht die <b>${ziffer}</b> in ${z(n)}?`,
      tipp:"Zähl von rechts: Einer, Zehner, Hunderter, Tausender, Zehntausender.",
      optionen: (() => {
        const kand = [R(st.name, "Richtig."),
                      F(andere.name, `Nein, das ist die Stelle mit dem Wert ${z(andere.wert)}.`),
                      F("Zehntausender", "Das wäre die Ziffer ganz links.")];
        const einmalig = kand.filter((o,i,arr) => arr.findIndex(x => x.t === o.t) === i);
        return zieheVerschiedene(einmalig, einmalig.length);
      })()},
     {frage:`Wie viel ist <b>ein einzelner ${st.name}</b> wert?`,
      tipp:"Einer = 1, Zehner = 10, Hunderter = 100, Tausender = 1000.",
      optionen:[R(z(st.wert), "Genau."),
                F(z(st.wert*10), "Das ist die nächsthöhere Stelle."),
                F(z(st.wert/10), "Das ist die nächstniedrigere Stelle.")]},
     {frage:`Du hast <b>${ziffer}</b> davon. Welche Rechnung ergibt den Wert?`,
      tipp:"Anzahl mal Stellenwert.",
      optionen:[R(`${ziffer} · ${z(st.wert)}`, "Richtig."),
                F(`${ziffer} + ${z(st.wert)}`, "Addieren passt hier nicht."),
                F(`${z(st.wert)} : ${ziffer}`, "Geteilt würde den Wert verkleinern.")]},
     {frage:`Und das ergibt?`,
      tipp:`${ziffer} mal ${z(st.wert)}.`,
      optionen:[R(z(erg), "Fertig."),
                F(z(ziffer), "Das ist nur die Ziffer selbst, ohne ihren Stellenwert."),
                F(z(erg*10), "Eine Stelle zu weit.")]}]};
 }
],

"Grundrechenarten":[

 /* Punkt vor Strich */
 () => {
   const a = rnd(5, 30), b = rnd(2, 9), c = rnd(2, 9);
   const erg = a + b*c, falsch = (a + b) * c;
   return {
    typ:"formel", text:`${a} + ${b} · ${c}`, loesung: z(erg),
    schluss:"Punkt vor Strich — Mal und Geteilt kommen immer vor Plus und Minus.",
    schritte:[
     {frage:"Welche Rechnung machst du <b>zuerst</b>?",
      tipp:"Es gibt eine feste Reihenfolge, egal wie die Aufgabe dasteht.",
      optionen:[R(`${b} · ${c}`, "Richtig — Punkt vor Strich."),
                F(`${a} + ${b}`, `Das wäre von links nach rechts. Dann käme ${z(falsch)} heraus, und das ist falsch.`),
                F(`${a} · ${c}`, `Die ${a} und die ${c} stehen nicht nebeneinander — dazwischen steht ein Pluszeichen.`)]},
     {frage:`Was ergibt <b>${b} · ${c}</b>?`,
      tipp:`${b} mal die ${c}.`,
      optionen:[R(z(b*c), "Ja."),
                F(z(b+c), "Das wäre plus statt mal."),
                F(z(b*c + 1), "Rechne das kleine Einmaleins noch mal nach.")]},
     {frage:`Jetzt steht da <b>${a} + ${z(b*c)}</b>. Wie viel ist das?`,
      tipp:"Ganz normal zusammenzählen.",
      optionen:(() => {
        const kand = [a*b*c, erg-2, erg+2, erg-1].filter((x,i,arr) => x !== erg && arr.indexOf(x) === i);
        return [R(z(erg), "Genau."),
                F(z(kand[0]), kand[0] === a*b*c ? "Hier wird zum Schluss addiert, nicht multipliziert."
                                                : `Rechne noch mal nach: ${a} + ${z(b*c)}.`),
                F(z(kand[1]), `Rechne noch mal nach: ${a} + ${z(b*c)}.`)];
      })()}]};
 },

 /* Klammer, dann Punkt, dann Strich */
 () => {
   let a, b;
   do { a = rnd(2, 12); b = rnd(2, 12); } while (a + b === a * b);
   const c = rnd(2, 8), d = rnd(2, 20);
   const erg = (a + b) * c - d;
   return {
    typ:"formel", text:`(${a} + ${b}) · ${c} − ${d}`, loesung: z(erg),
    schluss:"Erst Klammer, dann Punkt, dann Strich. In dieser Reihenfolge, immer.",
    schritte:[
     {frage:"Womit fängst du an?",
      tipp:"Eine Sache hat immer Vorrang, sogar vor dem Malzeichen.",
      optionen:[R("Mit der Klammer", "Richtig. Klammer schlägt alles."),
                F(`Mit ${b} · ${c}`, `Die ${b} steht in der Klammer und gehört zur ${a}.`),
                F(`Mit ${c} − ${d}`, "Minus kommt zuletzt.")]},
     {frage:"Was kommt in der Klammer heraus?",

"Brüche":[

 /* Brüche addieren */
 () => {
   const nenner = [2,3,4,6,8,12];
   let b, d, a, c, summe;
   do {
     [b, d] = zieheVerschiedene(nenner, 2);
     a = rnd(1, b-1); c = rnd(1, d-1);
     summe = a/b + c/d;
   } while (summe >= 1 || kgv(b,d) === Math.max(b,d));
   const n = kgv(b, d), fb = n/b, fd = n/d;
   const zaehler = a*fb + c*fd;
   return {
    typ:"formel", text:`${a}/${b} + ${c}/${d}`, loesung:`${zaehler}/${n}`,
    schluss:"Brüche addieren ist immer derselbe Ablauf: gleicher Nenner, dann Zähler addieren.",
    schritte:[
     {frage:`Warum kannst du hier nicht einfach ${a} + ${c} rechnen?`,
      tipp:"Schau auf die Zahlen unter dem Strich.",
      optionen:[R("Weil die Nenner verschieden sind", "Genau. Die Stücke sind unterschiedlich groß."),
                F("Weil die Zähler verschieden sind", "Die oberen Zahlen dürfen ruhig verschieden sein."),
                F("Weil man Brüche nie addieren kann", "Doch — man muss sie nur erst passend machen.")]},
     {frage:`Du brauchst einen gemeinsamen Nenner für ${b} und ${d}. Welcher ist der <b>kleinste</b>?`,
      tipp:`Such die kleinste Zahl, in der ${b} und ${d} ohne Rest aufgehen.`,
      optionen: zieheVerschiedene([
        R(String(n), `Richtig — ${b} · ${fb} = ${n} und ${d} · ${fd} = ${n}.`),
        F(String(b*d === n ? n + b : b*d), "Das ist zwar ein gemeinsamer Nenner, aber nicht der kleinste."),
        F(String(b + d), "Einfach addieren ergibt keinen gemeinsamen Nenner.")], 3)},
     {frage:`Was wird aus <b>${a}/${b}</b> mit dem Nenner ${n}?`,
      tipp:`Der Nenner wird mal ${fb} genommen. Mit dem Zähler machst du dasselbe.`,
      optionen:[R(`${a*fb}/${n}`, `Ja — oben und unten mal ${fb}.`),
                F(`${a}/${n}`, "Du hast nur unten erweitert. Oben muss dasselbe passieren."),
                F(`${n}/${n}`, "Das wäre genau 1.")]},
     {frage:`Und <b>${c}/${d}</b> mit dem Nenner ${n}? Dann kannst du addieren.`,
      tippAntwort: `${zaehler}/${n}`,
      tipp:`Der Nenner wird mal ${fd} genommen — der Zähler auch.`,
      optionen:(() => {
        const richtigZ = c*fd;
        const kand = [c, fd, richtigZ+1, richtigZ-1].filter((x,i,arr) => x > 0 && x !== richtigZ && arr.indexOf(x) === i);
        return [R(`${richtigZ}/${n} — zusammen also ${zaehler}/${n}`, "Genau. Gleiche Nenner, dann Zähler addieren."),
                F(`${kand[0]}/${n} — zusammen also ${a*fb + kand[0]}/${n}`, `Der Zähler muss auch mal ${fd} genommen werden.`),
                F(`${kand[1]}/${n} — zusammen also ${a*fb + kand[1]}/${n}`, "Nicht ganz — rechne die Erweiterung noch einmal nach.")];
      })()}]};
 },

 /* Bruchteil von einer Zahl */
 () => {

      optionen:[R("Die Quersumme muss durch 3 teilbar sein", "Genau — alle Ziffern zusammenzählen."),
                F("Die letzte Ziffer muss durch 3 teilbar sein", "Das gilt bei 2, 5 und 10 — bei der 3 nicht."),
                F("Die Zahl muss gerade sein", "Das ist die Regel für die 2.")]},
     {frage:`Wie groß ist die <b>Quersumme von ${z(n)}</b>?`,
      tipp: String(n).split("").join(" + "),
      optionen: zieheVerschiedene([
        R(String(q), "Richtig."),
        F(String(q + 1), `Rechne noch mal: ${String(n).split("").join(" + ")}.`),
        F(String(n), "Die Quersumme ist die Summe der einzelnen Ziffern, nicht die Zahl selbst.")], 3)},
     {frage:`Ist <b>${q}</b> durch 3 teilbar?`,
      tipp:"3, 6, 9, 12, 15, 18, 21 …",
      optionen: zieheVerschiedene(q % 3 === 0
        ? [R("Ja", `Ja — 3 · ${q/3} = ${q}.`),
           F("Nein", `Doch, ${q} : 3 = ${q/3} geht glatt auf.`),
           F("Nur mit Rest", `Nein, ${q} : 3 = ${q/3} geht genau auf.`)]
        : [R("Nein", `Richtig, ${q} liegt zwischen ${Math.floor(q/3)*3} und ${Math.ceil(q/3)*3}.`),
           F("Ja", `Nein, ${q} : 3 geht nicht ohne Rest auf.`),
           F("Nur wenn man aufrundet", "Teilbarkeit hat mit Runden nichts zu tun.")], 3)},
     {frage:`Also ist ${z(n)} …`,
      tipp:"Quersumme teilbar heißt Zahl teilbar.",
      optionen: teilbar
        ? [R("durch 3 teilbar", `Richtig. ${z(n)} : 3 = ${z(n/3)}.`), F("nicht durch 3 teilbar", "Die Quersumme sagt eindeutig ja.")]
        : [R("nicht durch 3 teilbar", "Richtig."), F("durch 3 teilbar", "Die Quersumme geht nicht auf, also die Zahl auch nicht.")]}]};
 },

 /* Teilbarkeit durch 4 */
 () => {
   const teilbar = Math.random() < 0.5;
   let n;
   do { n = rnd(1000, 9999); } while ((n % 4 === 0) !== teilbar);
   const letzte = n % 100;
   const letzteText = String(letzte).padStart(2, "0");
   return {
    typ:"text", text:`Ist <b>${z(n)}</b> ohne Rest durch <b>4</b> teilbar?`,
    loesung: teilbar ? "Ja" : "Nein",
    schluss:"Bei der 4 musst du nie die ganze Zahl anschauen — die letzten beiden Ziffern genügen.",
    schritte:[
     {frage:"Welche Regel gilt für die <b>4</b>?",
      tipp:"Es reicht ein kleiner Teil der Zahl.",
      optionen:[R("Die letzten beiden Ziffern müssen durch 4 teilbar sein", "Genau, alles davor ist immer durch 4 teilbar."),
                F("Die Quersumme muss durch 4 teilbar sein", "Die Quersumme hilft bei 3 und 9, nicht bei 4."),
                F("Die letzte Ziffer muss gerade sein", "Das ist nur die Regel für 2.")]},
     {frage:`Welche Zahl bilden die <b>letzten beiden Ziffern</b> von ${z(n)}?`,
      tipp:"Die beiden ganz rechts.",
      optionen: zieheVerschiedene([
        R(letzteText, "Richtig."),
        F(String(Math.floor(n/100)), "Das sind die ersten beiden."),
        F(String(n % 10), "Es sind zwei Ziffern, nicht eine.")], 3)},
     {frage:`Ist <b>${letzteText}</b> durch 4 teilbar?`,
      tipp:"4, 8, 12, 16, 20, 24 …",
      optionen: letzte % 4 === 0
        ? [R("Ja", `Ja — 4 · ${letzte/4} = ${letzte}.`), F("Nein", `Doch: ${letzte} : 4 = ${letzte/4}.`)]
        : [R(`Nein, es bleibt ein Rest von ${letzte % 4}`, `Genau — ${letzte} liegt zwischen ${Math.floor(letzte/4)*4} und ${Math.ceil(letzte/4)*4}.`),
           F("Ja", `${letzte} : 4 geht nicht glatt auf.`)]},
     {frage:`Also ist ${z(n)} …`,
      tipp:"Letzte zwei Ziffern teilbar heißt Zahl teilbar.",
      optionen: teilbar
        ? [R("durch 4 teilbar", `Richtig. ${z(n)} : 4 = ${z(n/4)}.`), F("nicht durch 4 teilbar", "Die letzten beiden Ziffern gehen auf.")]
        : [R("nicht durch 4 teilbar", "Richtig."), F("durch 4 teilbar", "Der Rest überträgt sich auf die ganze Zahl.")]}]};
 }
],

"Dreisatz":[

 /* Preis über den Einzelwert */
 () => {
   const ware = pick([
     {ein:"Heft", mehr:"Hefte"}, {ein:"Brötchen", mehr:"Brötchen"},
     {ein:"Stift", mehr:"Stifte"}, {ein:"Apfel", mehr:"Äpfel"}
   ]);
   const stueck = pick([0.25, 0.35, 0.5, 0.75, 1.2, 1.5, 2.5]);
   const k = rnd(3, 6), m = rnd(7, 12);
   const preisK = Math.round(stueck * k * 100) / 100;
   const erg = Math.round(stueck * m * 100) / 100;
   return {
    typ:"text",
    text:`${k} ${ware.mehr} kosten ${eur(preisK)}. Was kosten <b>${m} ${ware.mehr}</b>?`,
    loesung: eur(erg),
    schluss:"Der Dreisatz geht immer über den Einzelwert: erst herunter auf eins, dann hoch auf die gesuchte Anzahl.",
    schritte:[
     {frage:"Was ist der übliche <b>erste Schritt</b> beim Dreisatz?",
      tipp:"Eine bestimmte Menge ist besonders praktisch.",
      optionen:[R(`Ausrechnen, was ein einzelnes ${ware.ein} kostet`, "Genau — über den Einzelwert geht es immer."),
                F(`Sofort mal ${m} rechnen`, `Dann hättest du den Preis für ${k*m} ${ware.mehr}.`),
                F(`${eur(preisK)} und ${m} addieren`, "Preise und Stückzahlen kann man nicht addieren.")]},
     {frage:`Wie kommst du auf den Preis für <b>ein</b> ${ware.ein}?`,
      tipp:`Aus ${k} ${ware.mehr} wird 1 ${ware.ein}.`,
      optionen:[R(`${eur(preisK)} : ${k}`, "Richtig."),
                F(`${eur(preisK)} · ${k}`, `Ein ${ware.ein} ist billiger als ${k}, nicht teurer.`),
                F(`${eur(preisK)} − ${k}`, "Von einem Preis eine Stückzahl abzuziehen ergibt keinen Sinn.")]},
     {frage:`<b>${eur(preisK)} : ${k}</b> ergibt?`,
      tipp:`${Math.round(preisK*100)} Cent durch ${k}.`,
      optionen: zieheVerschiedene([
        R(eur(stueck), "Genau."),
        F(eur(Math.round(stueck*100 + 10)/100), "Rechne noch mal in Cent nach."),
        F(eur(Math.round(preisK*k*100)/100), "Das wäre mal statt geteilt.")], 3)},
     {frage:`Letzter Schritt: ${m} ${ware.mehr} zu je ${eur(stueck)}`,
      tipp:"Jetzt wird multipliziert.",
      optionen: zieheVerschiedene([
        R(eur(erg), "Fertig."),
        F(eur(Math.round(stueck*(m-1)*100)/100), `Das wären ${m-1} ${ware.mehr}.`),
        F(eur(Math.round(stueck*(m+2)*100)/100), `Das wären ${m+2} ${ware.mehr}.`)], 3)}]};
 },

 /* Mengen umrechnen */
 () => {
   const proStueck = rnd(2, 9);
   const k = rnd(3, 8), m = rnd(9, 15);
   const gesamtK = proStueck * k, erg = proStueck * m;
   const sache = pick([
     {ding:"Packungen", inhalt:"Kekse"}, {ding:"Kisten", inhalt:"Flaschen"},
     {ding:"Beutel", inhalt:"Murmeln"}, {ding:"Tüten", inhalt:"Bonbons"}
   ]);
   return {
    typ:"text",
    text:`In ${k} ${sache.ding} sind ${z(gesamtK)} ${sache.inhalt}. Wie viele ${sache.inhalt} sind in <b>${m} ${sache.ding}</b>?`,
    loesung: z(erg) + " " + sache.inhalt,
    schluss:"Immer derselbe Weg: durch die gegebene Anzahl teilen, mal die gesuchte Anzahl nehmen.",
    schritte:[
     {frage:"Womit fängst du an?",
      tipp:"Wieder über den Wert für ein einzelnes Stück.",
      optionen:[R(`${z(gesamtK)} : ${k}`, `Genau, die Anzahl pro ${sache.ding.slice(0,-1)}.`),
                F(`${z(gesamtK)} · ${m}`, "Das wäre viel zu viel."),
                F(`${m} − ${k}`, "Die Differenz hilft hier nicht weiter.")]},
     {frage:`<b>${z(gesamtK)} : ${k}</b> ergibt?`,
      tipp:"Einmaleins rückwärts.",
      optionen: zieheVerschiedene([
        R(z(proStueck), "Richtig."),
        F(z(proStueck + 1), "Rechne noch mal nach."),
        F(z(gesamtK - k), "Hier wird geteilt, nicht abgezogen.")], 3)},
     {frage:`Und ${m} ${sache.ding} zu je ${z(proStueck)} ${sache.inhalt}?`,
      tipp:"Jetzt multiplizieren.",
      optionen: zieheVerschiedene([
        R(z(erg), "Fertig."),
        F(z(proStueck * (m - 1)), `Das wären ${m-1} ${sache.ding}.`),
        F(z(erg + proStueck * 2), `Das wären ${m+2} ${sache.ding}.`)], 3)}]};
 }
],

"Winkel messen":[

"Gleichungen umstellen":[

 () => {
   const a = rnd(2, 9), x = rnd(2, 12), b = rnd(2, 20);

   return {
    typ:"formel", text:`${a}x + ${b} = ${c}`, loesung:`x = ${x}`,
    schluss:"Immer dieselbe Reihenfolge: zuerst das Plus oder Minus wegräumen, dann die Zahl vor dem x.",
    schritte:[
     {frage:"Am Ende soll nur noch <b>x</b> alleine dastehen. Was steht ihm auf der linken Seite gerade im Weg?",
      tipp:`Schau dir die linke Seite an: ${a}x + ${b}.`,
      optionen:[R(`Die + ${b}`, "Genau. Erst das, was addiert wird."),
                F(`Die ${a} vor dem x`, "Die kommt dran — aber erst später."),
                F(`Die ${c} auf der rechten Seite`, "Die steht auf der anderen Seite, die stört das x nicht.")]},

 },

 /* a·x − b = c */
 () => {

      tipp:"Erst das, was addiert oder abgezogen wird.",

     {frage:`Wie wirst du die <b>− ${b}</b> los?`,

"Prozent und Zinsen":[

 /* Rabatt */
 () => {
   const preis = rnd(4, 40) * 20;             // glatte Preise
   const rabatt = pick([5, 10, 15, 20, 25, 30, 40]);
   const rest = 100 - rabatt;
   const erg = Math.round(preis * rest) / 100;
   const ware = pick(["Ein Handy","Ein Fahrrad","Ein Rucksack","Ein Kopfhörer","Eine Jacke"]);
   return {
    typ:"text",
    text:`${ware} kostet ${eur(preis)}. Im Angebot ist ${ware.startsWith("Eine") ? "sie" : "es"} ${rabatt} % günstiger. Was kostet ${ware.startsWith("Eine") ? "sie" : "es"} jetzt?`,
    loesung: eur(erg),
    schluss:"Der schwierige Teil ist nicht das Rechnen — sondern herauszufinden, was überhaupt gerechnet werden muss.",
    schritte:[
     {frage:"Bevor du rechnest: Was ist überhaupt <b>gesucht</b>?",
      tipp:"Lies den letzten Satz der Aufgabe.",
      optionen:[R("Der neue Preis", "Richtig. Nicht der Rabatt — der neue Preis."),
                F("Wie viel Euro gespart wird", "Das ist ein Zwischenschritt, aber nicht die Frage."),
                F("Wie viel Prozent Rabatt es gibt", `Die ${rabatt} % stehen schon da, die sind gegeben.`)]},
     {frage:"Bei Prozent gilt immer: irgendetwas sind die <b>100 %</b>. Was ist hier 100 %?",
      tipp:"100 % ist immer der volle Wert — bevor sich etwas ändert.",
      optionen:[R(`Die ${eur(preis)}`, "Genau. Der alte Preis ist der ganze Kuchen."),
                F(`Die ${rabatt} %`, "Das ist der Anteil, der wegfällt — nicht das Ganze."),
                F("Der neue Preis", "Den suchen wir gerade.")]},
     {frage:`${rabatt} % gehen weg. <b>Wie viel Prozent zahlst du dann noch?</b>`,
      tipp:`Das Ganze sind 100 %. Davon fallen ${rabatt} % weg.`,
      optionen:[R(`${rest} %`, "Ja. Damit rechnest du weiter — in einem Schritt statt in zweien."),
                F(`${rabatt} %`, "Das ist der Rabatt, nicht der Rest."),
                F(`${100 + rabatt} %`, "Es wird günstiger, nicht teurer.")]},
     {frage:`Du zahlst ${rest} % von ${eur(preis)}. <b>Welche Rechnung</b> ist das?`,
      tipp:`${rest} % = ${z(rest/100)}. Und „von“ heißt beim Rechnen: mal.`,
      optionen:[R(`${z(preis)} · ${z(rest/100)}`, "Perfekt. Das ist der ganze Trick bei Prozent-Textaufgaben."),
                F(`${z(preis)} · ${z(rabatt/100)}`, "Das wäre der Rabatt in Euro — nur ein Zwischenschritt."),
                F(`${z(preis)} : ${z(rest/100)}`, "Geteilt brauchst du, wenn du rückwärts rechnest.")]},
     {frage:`Rechne aus: <b>${z(preis)} · ${z(rest/100)}</b>`,
      tipp:`1 % von ${eur(preis)} sind ${eur(preis/100)}.`,
      optionen: zieheVerschiedene([
        R(eur(erg), `Fertig. Gespart hast du ${eur(preis - erg)}.`),
        F(eur(Math.round(preis * rabatt) / 100), "Das ist der Rabatt, nicht der neue Preis."),
        F(eur(preis), "Das ist der alte Preis.")], 3)}]};
 },

 () => {

     {frage:`Wie schreibst du <b>${p} %</b> als Kommazahl?`,

"Terme umformen":[

 /* gleichartige Glieder zusammenfassen */
 () => {
   /* 2+2 und 2·2 ergeben beides 4 — diesen einen Fall meiden, sonst
      wäre eine falsche Antwort zufällig genauso richtig wie die richtige */
   let a, c, b, d;
   do { a = rnd(2, 9); c = rnd(2, 9); } while (a + c === a * c);
   do { b = rnd(2, 15); d = rnd(2, 15); } while (b + d === b * d);
   const xs = a + c, zs = b + d;
   return {
    typ:"formel", text:`${a}x + ${b} + ${c}x + ${d}`, loesung:`${xs}x + ${zs}`,
    schluss:"Nur Gleichartiges darf zusammen: x zu x, Zahl zu Zahl. Ein x ist keine Zahl — deshalb bleiben zwei Teile stehen.",
    schritte:[
     {frage:"Der Term hat vier Teile. <b>Welche davon gehören zusammen?</b>",
      tipp:"Schau, welche Teile ein x dabeihaben und welche nicht.",
      optionen:[R(`${a}x und ${c}x — und davon getrennt ${b} und ${d}`, "Genau. Zusammenfassen darf man nur Gleichartiges."),
                F(`${a}x und ${b} — und ${c}x und ${d}`, "Die stehen zwar nebeneinander, aber ein x und eine Zahl sind nichts Gleichartiges."),
                F("Alle vier auf einmal", "Dann würdest du x-Teile und reine Zahlen vermischen — das geht nicht.")]},

      optionen:[R(`${xs}x`, "Richtig. Die Anzahl der x wird addiert, das x bleibt stehen."),
                F(`${a*c}x`, "Hier wird addiert, nicht multipliziert."),

     {frage:`Und jetzt die reinen Zahlen: <b>${b} + ${d}</b>`,

 },

 /* Klammer ausmultiplizieren */
 () => {
   const a = rnd(2, 8), b = rnd(2, 12), c = rnd(2, 9);
   return {

"Lineare Funktionen":[

 /* Steigung aus zwei Punkten */

   let x1, m, b, dx, x2, y1, y2;
   do {
     x1 = rnd(-4, 2); m = rnd(2, 6); b = rnd(-6, 6); dx = rnd(2, 4);
     x2 = x1 + dx; y1 = m*x1 + b; y2 = m*x2 + b;
   } while (x1 === 0 || x2 === 0 || y1 === 0 || y2 === 0 || m === dx);
   return {
    typ:"formel", text:`Gerade durch P(${x1} | ${y1}) und Q(${x2} | ${y2}) — wie groß ist die Steigung m?`,

"Quadratische Gleichungen":[

 /* x² + px + q = 0 mit ganzzahligen Lösungen */
 () => {
   /* Lösungen so ziehen, dass p und q nicht null werden und p ≠ 2 bleibt —
      sonst fallen im Aufgabentext Antwortmöglichkeiten zusammen. */
   let x1, x2;
   do { x1 = rnd(-8, 8); x2 = rnd(-8, 8); }
   while (x1 === x2 || x1 === 0 || x2 === 0 || x1 + x2 === 0 || x1 + x2 === -2);
   const p = -(x1 + x2), q = x1 * x2;
   /* bei |p| = 1 schreibt man „x" statt „1x" — so steht es auch im Heft */
   const pZahl = Math.abs(p) === 1 ? "" : Math.abs(p);
   const pT = p < 0 ? `− ${pZahl}x` : `+ ${pZahl}x`;
   const qT = q < 0 ? `− ${Math.abs(q)}` : `+ ${q}`;
   const halb = p / 2;
   const unterWurzel = halb*halb - q;
   const klein = Math.min(x1, x2), gross = Math.max(x1, x2);
   return {
    typ:"formel", text:`x² ${pT} ${qT} = 0`, loesung:`x₁ = ${klein}, x₂ = ${gross}`,
    schluss:"Die p-q-Formel funktioniert immer, wenn die Gleichung mit einem reinen x² anfängt. Erst p und q ablesen, dann einsetzen.",
    schritte:[
     {frage:"Bevor du rechnest: <b>Was sind hier p und q?</b>",
      tipp:"In der Form x² + px + q = 0 ist p die Zahl vor dem x und q die Zahl ganz hinten.",
      optionen:[R(`p = ${p} und q = ${q}`, "Genau — mit Vorzeichen abgelesen, das ist die häufigste Fehlerquelle."),
                F(`p = ${q} und q = ${p}`, "Vertauscht: p gehört zum x, q steht allein."),
                F(`p = ${Math.abs(p)} und q = ${Math.abs(q)}`, "Die Vorzeichen gehören dazu, sonst stimmt das Ergebnis nicht.")]},
     {frage:`Die p-q-Formel beginnt mit <b>−p/2</b>. Was ist das hier?`,
      tipp:`p ist ${p}. Also −(${p}) geteilt durch 2.`,
      optionen: zieheVerschiedene([
        R(String(-halb), "Richtig — auf das Minus vor dem p achten."),
        F(String(halb), "Das Minus vor dem p wurde vergessen."),
        F(String(-p), "Es muss noch durch 2 geteilt werden.")], 3)},
     {frage:`Unter der Wurzel steht <b>(p/2)² − q</b>. Was kommt da heraus?`,
      tipp:`(${halb})² ist ${halb*halb}, davon ${q < 0 ? Math.abs(q) + " dazu" : q + " abziehen"}.`,
      optionen: zieheVerschiedene([
        R(String(unterWurzel), "Genau."),
        F(String(halb*halb + q), `Hier wurde q addiert — in der Formel steht aber minus q.`),
        F(String(halb - q), "Der Teil p/2 muss noch quadriert werden.")], 3)},
     {frage:`Also <b>x = ${-halb} ± √${unterWurzel}</b>. <b>Wie heißen die beiden Lösungen?</b>`,
      tippAntwort:`${klein} und ${gross}`,
      tipp:`√${unterWurzel} ist ${Math.sqrt(unterWurzel)}. Einmal dazu, einmal davon abziehen.`,
      optionen:[R(`x₁ = ${klein} und x₂ = ${gross}`, `Richtig. Probe: ${klein} · ${gross} = ${q}, und das ist genau q.`),
                F(`x₁ = ${-halb} und x₂ = ${Math.sqrt(unterWurzel)}`, "Die beiden Teile gehören zusammen — einmal mit Plus, einmal mit Minus."),
                F(`x = ${-halb}`, "Eine quadratische Gleichung hat hier zwei Lösungen, nicht eine.")]}]};
 },

 /* Produktform: (x − a)(x − b) = 0 */
 () => {
   /* keine Null und keine gespiegelten Werte — sonst wären zwei Antworten gleich */
   let a, b;
   do { a = rnd(-7, 7); b = rnd(-7, 7); }
   while (a === b || a === 0 || b === 0 || a === -b);
   const t = (v) => v < 0 ? `(x + ${Math.abs(v)})` : `(x − ${v})`;
   const klein = Math.min(a, b), gross = Math.max(a, b);

"Satz des Pythagoras":[

 /* Hypotenuse gesucht */
 () => {
   const tripel = [[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[12,16,20],[7,24,25],[20,21,29]];
   const [a, b, c] = pick(tripel);
   return {
    typ:"formel", text:`Rechtwinkliges Dreieck mit den Katheten a = ${a} cm und b = ${b} cm — wie lang ist die Hypotenuse c?`,
    loesung:`c = ${c} cm`,
    schluss:"a² + b² = c² gilt nur im rechtwinkligen Dreieck — und c ist immer die Seite gegenüber dem rechten Winkel.",
    schritte:[
     {frage:"<b>Welche Seite ist die Hypotenuse?</b>",
