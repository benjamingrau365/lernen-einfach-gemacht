"Brüche":[

 /* Brüche addieren */
 () => {
   const nenner = [2,3,4,6,8,12];
   let b, d, a, c, summe;
   do {
     [b, d] = zieheVerschiedene(nenner, 2);
     a = rnd(1, b-1); c = rnd(1, d-1);
     summe = a/b + c/d;
   } while (summe >= 1 || kgv(b,d) === Math.max(b,d));
   const n = kgv(b, d), fb = n/b, fd = n/d;
   const zaehler = a*fb + c*fd;
   return {
    typ:"formel", text:`${a}/${b} + ${c}/${d}`, loesung:`${zaehler}/${n}`,
    schluss:"Brüche addieren ist immer derselbe Ablauf: gleicher Nenner, dann Zähler addieren.",
    schritte:[
     {frage:`Warum kannst du hier nicht einfach ${a} + ${c} rechnen?`,
      tipp2:"Zwei Brüche darf man erst zusammenzählen, wenn beide dieselbe Sorte von Teilen beschreiben.",
      tipp:"Schau auf die Zahlen unter dem Strich.",
      optionen:[R("Weil die Nenner verschieden sind", "Genau. Die Stücke sind unterschiedlich groß."),
                F("Weil die Zähler verschieden sind", "Die oberen Zahlen dürfen ruhig verschieden sein."),
                F("Weil man Brüche nie addieren kann", "Doch — man muss sie nur erst passend machen.")]},
     {frage:`Du brauchst einen gemeinsamen Nenner für ${b} und ${d}. Welcher ist der <b>kleinste</b>?`,
      tipp2:"Geh die Vielfachen der größeren Zahl durch und prüfe bei jedem, ob die kleinere hineinpasst.",
      tipp:`Such die kleinste Zahl, in der ${b} und ${d} ohne Rest aufgehen.`,
      optionen: zieheVerschiedene([
        R(String(n), `Richtig — ${b} · ${fb} = ${n} und ${d} · ${fd} = ${n}.`),
        F(String(b*d === n ? n + b : b*d), "Das ist zwar ein gemeinsamer Nenner, aber nicht der kleinste."),
        F(String(b + d), "Einfach addieren ergibt keinen gemeinsamen Nenner.")], 3)},
     {frage:`Was wird aus <b>${a}/${b}</b> mit dem Nenner ${n}?`,
      tipp2:"Erweitern heißt: oben und unten mit derselben Zahl malnehmen. Der Wert des Bruchs ändert sich dadurch nicht.",
      tipp:`Der Nenner wird mal ${fb} genommen. Mit dem Zähler machst du dasselbe.`,
      optionen:[R(`${a*fb}/${n}`, `Ja — oben und unten mal ${fb}.`),
                F(`${a}/${n}`, "Du hast nur unten erweitert. Oben muss dasselbe passieren."),
                F(`${n}/${n}`, "Das wäre genau 1.")]},
     {frage:`Und <b>${c}/${d}</b> mit dem Nenner ${n}? Dann kannst du addieren.`,
      tippAntwort: `${zaehler}/${n}`,
      tipp2:"Haben beide denselben Nenner, werden nur noch die Zähler zusammengezählt.",
      tipp:`Der Nenner wird mal ${fd} genommen — der Zähler auch.`,
      optionen:(() => {
        const richtigZ = c*fd;
        const kand = [c, fd, richtigZ+1, richtigZ-1].filter((x,i,arr) => x > 0 && x !== richtigZ && arr.indexOf(x) === i);
        return [R(`${richtigZ}/${n} — zusammen also ${zaehler}/${n}`, "Genau. Gleiche Nenner, dann Zähler addieren."),
                F(`${kand[0]}/${n} — zusammen also ${a*fb + kand[0]}/${n}`, `Der Zähler muss auch mal ${fd} genommen werden.`),
                F(`${kand[1]}/${n} — zusammen also ${a*fb + kand[1]}/${n}`, "Nicht ganz — rechne die Erweiterung noch einmal nach.")];
      })()}]};
 },

 /* Bruchteil von einer Zahl */
 () => {
   const b = pick([3,4,5,6,8]);
   const a = rnd(1, b-1);
   const teil = rnd(2, 12);
   const N = b * teil;
   const erg = a * teil;
   return {
    typ:"text", text:`Wie viel sind <b>${a}/${b} von ${z(N)}</b>?`, loesung: z(erg),
    schluss:"„von“ heißt beim Rechnen immer: mal. Am einfachsten gehst du über einen einzelnen Teil.",
    schritte:[
     {frage:"Was bedeutet das Wort <b>von</b> in dieser Aufgabe?",
      tipp2:"Bei Brüchen und bei Prozenten steht dieses Wörtchen immer für dieselbe Rechenart.",
      tipp:"Es ist eine Rechenanweisung.",
      optionen:[R("Mal", `Richtig: ${a}/${b} · ${z(N)}.`),
                F("Minus", "Nein, abgezogen wird hier nichts."),
                F("Plus", "Addiert wird hier auch nichts.")]},
     {frage:`Rechne zuerst <b>ein ${b}tel</b> von ${z(N)}. Wie kommst du da hin?`,
      tipp2:"Erst in gleich große Teile zerlegen — geteilt wird durch die Zahl unter dem Bruchstrich.",
      tipp:"Der Nenner sagt dir, in wie viele gleiche Teile du zerlegst.",
      optionen:[R(`${z(N)} : ${b}`, "Genau — durch den Nenner teilen."),
                F(`${z(N)} · ${b}`, "Dann würde es größer statt kleiner."),
                F(`${z(N)} : ${a}`, `Die ${a} ist der Zähler, nicht der Nenner.`)]},
     {frage:`<b>${z(N)} : ${b}</b> ergibt?`,
      tipp2:"Frag dich: Mal was ergibt der Teiler die große Zahl?",
      tipp:"Kleines Einmaleins rückwärts.",
      optionen:[R(z(teil), `Ja, ein ${b}tel von ${z(N)} sind ${z(teil)}.`),
                F(z(teil + 1), "Rechne noch mal nach."),
                F(z(N - b), "Hier wird geteilt, nicht abgezogen.")]},
     {frage:`Du brauchst aber <b>${a}</b> davon. Wie viel ist das?`,
      tippAntwort: String(erg),
      tipp2:"Ein einzelnes Teil ist jetzt bekannt. Nimm es so oft, wie der Zähler sagt.",
      tipp:"Der Zähler sagt, wie viele dieser Teile du nimmst.",
      optionen:[R(`${z(teil)} · ${a} = ${z(erg)}`, "Fertig."),
                F(`${z(teil)} : ${a} = ${z(teil/a)}`, `${a} Teile sind mehr als einer, nicht weniger.`)]}]};
 }
],

"Dezimalzahlen":[

 /* Addition mit unterschiedlich vielen Nachkommastellen */
 () => {
   const a = rnd(1, 9) / 10;                 // z. B. 0,7
   const b = rnd(11, 89) / 100;              // z. B. 0,25
   const erg = Math.round((a + b) * 100) / 100;
   const fehlerhaft = Number(String(rnd(1,9)) + String(rnd(10,99))) / 100;
   return {
    typ:"formel", text:`${z(a)} + ${z(b)}`, loesung: z(erg),
    schluss:"Bei Dezimalzahlen zählt die Stelle, nicht die Ziffernanzahl — Komma unter Komma.",
    schritte:[
     {frage:`Warum darfst du die Ziffern nicht einfach von rechts untereinanderschreiben?`,
      tipp2:"Zusammenzählen darf man nur Ziffern, die für dieselbe Stelle stehen.",
      tipp:`Was bedeutet die ${Math.round(a*10)} bei ${z(a)} — Zehntel oder Hundertstel?`,

 /* Multiplikation mit Stufenzahlen */
 () => {

    typ:"formel", text:`${z(grund)} · ${z(faktor)}`, loesung: z(erg),

"Teilbarkeit":[

 /* Teilbarkeit durch 3 */
 () => {
   const teilbar = Math.random() < 0.5;
   let n;
   do { n = rnd(100, 999); } while ((n % 3 === 0) !== teilbar);
   const q = String(n).split("").reduce((s,x) => s + Number(x), 0);
   return {
    typ:"text", text:`Ist <b>${z(n)}</b> ohne Rest durch <b>3</b> teilbar?`,
    loesung: teilbar ? "Ja" : "Nein",
    schluss:"Für die 3 gibt es eine Abkürzung: die Quersumme. Damit sparst du dir das Ausrechnen.",
    schritte:[
     {frage:"Es gibt eine Regel für die 3. Welche?",
      tipp2:"Nicht die letzte Ziffer entscheidet wie bei der 2 oder der 5, sondern alle Ziffern zusammen.",
      tipp:"Man addiert etwas an der Zahl.",
      optionen:[R("Die Quersumme muss durch 3 teilbar sein", "Genau — alle Ziffern zusammenzählen."),
                F("Die letzte Ziffer muss durch 3 teilbar sein", "Das gilt bei 2, 5 und 10 — bei der 3 nicht."),
                F("Die Zahl muss gerade sein", "Das ist die Regel für die 2.")]},
     {frage:`Wie groß ist die <b>Quersumme von ${z(n)}</b>?`,
      tipp2:"Alle Ziffern einzeln zusammenzählen — die Stellenwerte spielen dabei keine Rolle.",
      tipp: String(n).split("").join(" + "),
      optionen: zieheVerschiedene([
        R(String(q), "Richtig."),
        F(String(q + 1), `Rechne noch mal: ${String(n).split("").join(" + ")}.`),
        F(String(n), "Die Quersumme ist die Summe der einzelnen Ziffern, nicht die Zahl selbst.")], 3)},
     {frage:`Ist <b>${q}</b> durch 3 teilbar?`,
      tipp2:"Geh die Dreierreihe durch und schau, ob die Zahl darin vorkommt.",
      tipp:"3, 6, 9, 12, 15, 18, 21 …",
      optionen: zieheVerschiedene(q % 3 === 0
        ? [R("Ja", `Ja — 3 · ${q/3} = ${q}.`),
           F("Nein", `Doch, ${q} : 3 = ${q/3} geht glatt auf.`),
           F("Nur mit Rest", `Nein, ${q} : 3 = ${q/3} geht genau auf.`)]

           F("Ja", `Nein, ${q} : 3 geht nicht ohne Rest auf.`),

"Dreisatz":[

 /* Preis über den Einzelwert */
 () => {
   const ware = pick([
     {ein:"Heft", mehr:"Hefte"}, {ein:"Brötchen", mehr:"Brötchen"},
     {ein:"Stift", mehr:"Stifte"}, {ein:"Apfel", mehr:"Äpfel"}
   ]);
   const stueck = pick([0.25, 0.35, 0.5, 0.75, 1.2, 1.5, 2.5]);
   const k = rnd(3, 6), m = rnd(7, 12);
   const preisK = Math.round(stueck * k * 100) / 100;
   const erg = Math.round(stueck * m * 100) / 100;
   return {
    typ:"text",
    text:`${k} ${ware.mehr} kosten ${eur(preisK)}. Was kosten <b>${m} ${ware.mehr}</b>?`,
    loesung: eur(erg),
    schluss:"Der Dreisatz geht immer über den Einzelwert: erst herunter auf eins, dann hoch auf die gesuchte Anzahl.",
    schritte:[
     {frage:"Was ist der übliche <b>erste Schritt</b> beim Dreisatz?",
      tipp2:"Such dir die kleinstmögliche Menge — von der aus lässt sich jede andere leicht ausrechnen.",
      tipp:"Eine bestimmte Menge ist besonders praktisch.",
      optionen:[R(`Ausrechnen, was ein einzelnes ${ware.ein} kostet`, "Genau — über den Einzelwert geht es immer."),
                F(`Sofort mal ${m} rechnen`, `Dann hättest du den Preis für ${k*m} ${ware.mehr}.`),
                F(`${eur(preisK)} und ${m} addieren`, "Preise und Stückzahlen kann man nicht addieren.")]},
     {frage:`Wie kommst du auf den Preis für <b>ein</b> ${ware.ein}?`,
      tipp2:"Aus vielen wird eins. Dafür wird geteilt, nicht malgenommen.",
      tipp:`Aus ${k} ${ware.mehr} wird 1 ${ware.ein}.`,
      optionen:[R(`${eur(preisK)} : ${k}`, "Richtig."),
                F(`${eur(preisK)} · ${k}`, `Ein ${ware.ein} ist billiger als ${k}, nicht teurer.`),
                F(`${eur(preisK)} − ${k}`, "Von einem Preis eine Stückzahl abzuziehen ergibt keinen Sinn.")]},
     {frage:`<b>${eur(preisK)} : ${k}</b> ergibt?`,
      tipp2:"Rechne in Cent weiter, dann musst du dich nicht mit dem Komma herumschlagen.",
      tipp:`${Math.round(preisK*100)} Cent durch ${k}.`,
      optionen: zieheVerschiedene([
        R(eur(stueck), "Genau."),
        F(eur(Math.round(stueck*100 + 10)/100), "Rechne noch mal in Cent nach."),
        F(eur(Math.round(preisK*k*100)/100), "Das wäre mal statt geteilt.")], 3)},
     {frage:`Letzter Schritt: ${m} ${ware.mehr} zu je ${eur(stueck)}`,
      tipp2:"Der Preis für ein Stück steht fest — jetzt so oft nehmen, wie gefragt ist.",
      tipp:"Jetzt wird multipliziert.",
      optionen: zieheVerschiedene([
        R(eur(erg), "Fertig."),
        F(eur(Math.round(stueck*(m-1)*100)/100), `Das wären ${m-1} ${ware.mehr}.`),
        F(eur(Math.round(stueck*(m+2)*100)/100), `Das wären ${m+2} ${ware.mehr}.`)], 3)}]};
 },

 /* Mengen umrechnen */
 () => {
   const proStueck = rnd(2, 9);
   const k = rnd(3, 8), m = rnd(9, 15);
   const gesamtK = proStueck * k, erg = proStueck * m;
   const sache = pick([
     {ding:"Packungen", inhalt:"Kekse"}, {ding:"Kisten", inhalt:"Flaschen"},
     {ding:"Beutel", inhalt:"Murmeln"}, {ding:"Tüten", inhalt:"Bonbons"}
   ]);
   return {
    typ:"text",
    text:`In ${k} ${sache.ding} sind ${z(gesamtK)} ${sache.inhalt}. Wie viele ${sache.inhalt} sind in <b>${m} ${sache.ding}</b>?`,
    loesung: z(erg) + " " + sache.inhalt,
    schluss:"Immer derselbe Weg: durch die gegebene Anzahl teilen, mal die gesuchte Anzahl nehmen.",
    schritte:[
     {frage:"Womit fängst du an?",
      tipp2:"Erst herunterrechnen auf eins, dann hochrechnen auf die gesuchte Anzahl.",
      tipp:"Wieder über den Wert für ein einzelnes Stück.",
      optionen:[R(`${z(gesamtK)} : ${k}`, `Genau, die Anzahl pro ${sache.ding.slice(0,-1)}.`),
                F(`${z(gesamtK)} · ${m}`, "Das wäre viel zu viel."),
                F(`${m} − ${k}`, "Die Differenz hilft hier nicht weiter.")]},
     {frage:`<b>${z(gesamtK)} : ${k}</b> ergibt?`,
      tipp2:"Frag dich: Mal was ergibt der Teiler die große Zahl?",
      tipp:"Einmaleins rückwärts.",
      optionen: zieheVerschiedene([
        R(z(proStueck), "Richtig."),
        F(z(proStueck + 1), "Rechne noch mal nach."),
        F(z(gesamtK - k), "Hier wird geteilt, nicht abgezogen.")], 3)},
     {frage:`Und ${m} ${sache.ding} zu je ${z(proStueck)} ${sache.inhalt}?`,
      tipp2:"Der Wert für ein Stück ist bekannt. Es bleibt eine einzige Malaufgabe.",
      tipp:"Jetzt multiplizieren.",
      optionen: zieheVerschiedene([
        R(z(erg), "Fertig."),
        F(z(proStueck * (m - 1)), `Das wären ${m-1} ${sache.ding}.`),
        F(z(erg + proStueck * 2), `Das wären ${m+2} ${sache.ding}.`)], 3)}]};
 }
],

 /* Rabatt */

   return {
    typ:"text",
    text:`${ware} kostet ${eur(preis)}. Im Angebot ist ${ware.startsWith("Eine") ? "sie" : "es"} ${rabatt} % günstiger. Was kostet ${ware.startsWith("Eine") ? "sie" : "es"} jetzt?`,
    loesung: eur(erg),
    schluss:"Der schwierige Teil ist nicht das Rechnen — sondern herauszufinden, was überhaupt gerechnet werden muss.",
    schritte:[
     {frage:"Bevor du rechnest: Was ist überhaupt <b>gesucht</b>?",

"Terme umformen":[

 /* gleichartige Glieder zusammenfassen */
 () => {
   /* 2+2 und 2·2 ergeben beides 4 — diesen einen Fall meiden, sonst
      wäre eine falsche Antwort zufällig genauso richtig wie die richtige */
   let a, c, b, d;
   do { a = rnd(2, 9); c = rnd(2, 9); } while (a + c === a * c);
   do { b = rnd(2, 15); d = rnd(2, 15); } while (b + d === b * d);
   const xs = a + c, zs = b + d;
   return {
    typ:"formel", text:`${a}x + ${b} + ${c}x + ${d}`, loesung:`${xs}x + ${zs}`,
    schluss:"Nur Gleichartiges darf zusammen: x zu x, Zahl zu Zahl. Ein x ist keine Zahl — deshalb bleiben zwei Teile stehen.",
    schritte:[
     {frage:"Der Term hat vier Teile. <b>Welche davon gehören zusammen?</b>",
      tipp2:"Es entstehen zwei Gruppen: die Teile mit x und die ohne. Über Kreuz geht nichts zusammen.",
      tipp:"Schau, welche Teile ein x dabeihaben und welche nicht.",
      optionen:[R(`${a}x und ${c}x — und davon getrennt ${b} und ${d}`, "Genau. Zusammenfassen darf man nur Gleichartiges."),
                F(`${a}x und ${b} — und ${c}x und ${d}`, "Die stehen zwar nebeneinander, aber ein x und eine Zahl sind nichts Gleichartiges."),
                F("Alle vier auf einmal", "Dann würdest du x-Teile und reine Zahlen vermischen — das geht nicht.")]},
     {frage:`Fass zuerst die x-Teile zusammen: <b>${a}x + ${c}x</b>`,
      tipp2:"Nur die Zahlen davor werden zusammengezählt. Das x bleibt einfach stehen.",
      tipp:`Denk es als „${a} Stück x“ plus „${c} Stück x“.`,
      optionen:[R(`${xs}x`, "Richtig. Die Anzahl der x wird addiert, das x bleibt stehen."),
                F(`${a*c}x`, "Hier wird addiert, nicht multipliziert."),
                F(`${xs}x²`, "Beim Addieren ändert sich die Hochzahl nicht.")]},
     {frage:`Und jetzt die reinen Zahlen: <b>${b} + ${d}</b>`,
      tipp2:"Diese beiden haben kein x — deshalb dürfen sie zusammen.",
      tipp:"Ganz normale Addition.",
      optionen: zieheVerschiedene([
        R(String(zs), "Genau."),
        F(String(b * d), "Das wäre mal gerechnet."),
        F(String(Math.abs(b - d)), "Da wurde abgezogen statt addiert.")], 3)},
     {frage:"<b>Wie lautet der fertige Term?</b>",
      tippAntwort:`${xs}x + ${zs}`,
      tipp2:"Erst das x-Glied, dann die Zahl. Weiter zusammenfassen lässt sich das nicht.",
      tipp:"Beide Ergebnisse hinschreiben — mehr geht nicht zusammen.",
      optionen:[R(`${xs}x + ${zs}`, "Fertig. Weiter kann man nicht kürzen, weil x und Zahl verschieden sind."),
                F(`${xs + zs}x`, "Hier wurde die Zahl noch ans x gehängt — sie gehört aber nicht dazu."),
                F(String(xs + zs), "Das x ist verschwunden, es gehört aber in den Term.")]}]};
 },

 /* Klammer ausmultiplizieren */
 () => {
   const a = rnd(2, 8), b = rnd(2, 12), c = rnd(2, 9);
   return {
    typ:"formel", text:`${a} · (x + ${b}) + ${c}`, loesung:`${a}x + ${a*b + c}`,
    schluss:"Die Zahl vor der Klammer trifft jeden Teil in der Klammer — keinen darf man auslassen.",
    schritte:[
     {frage:`Zuerst muss die Klammer weg. <b>Was macht die ${a} vor der Klammer?</b>`,
      tipp2:"Sie trifft jeden einzelnen Teil in der Klammer, nicht nur den ersten.",
      tipp:"Sie steht vor der ganzen Klammer, nicht nur vor einem Teil davon.",
      optionen:[R(`Sie wird mit <b>jedem</b> Teil in der Klammer malgenommen`, "Genau — das nennt man ausmultiplizieren."),
                F("Sie wird nur mit dem x malgenommen", `Dann würde die ${b} leer ausgehen, obwohl sie auch in der Klammer steht.`),
                F("Sie wird zu allem addiert", "Zwischen Zahl und Klammer steht ein Mal, kein Plus.")]},
     {frage:`Rechne aus: <b>${a} · x</b> und <b>${a} · ${b}</b>`,
      tipp2:"Es entstehen zwei Einzelprodukte: eines mit dem x und eines mit der Zahl.",
      tipp:`${a} mal x schreibt man kurz als ${a}x.`,
      optionen:[R(`${a}x und ${a*b}`, "Richtig."),
                F(`${a}x und ${a + b}`, "Der zweite Teil wurde addiert statt malgenommen."),
                F(`${a + 1}x und ${a*b}`, "Beim ersten Teil wurde dazugezählt statt malgenommen.")]},
     {frage:`Jetzt steht da: <b>${a}x + ${a*b} + ${c}</b>. Was geht noch zusammen?`,
      tipp2:"Das x-Glied steht allein da. Zusammenfassen lassen sich nur die beiden reinen Zahlen.",
      tipp:"Suche wieder Gleichartiges.",
      optionen:[R(`Die ${a*b} und die ${c}`, "Genau, das sind beides reine Zahlen."),
                F(`Die ${a}x und die ${a*b}`, "Eins hat ein x, das andere nicht — das ist nicht gleichartig."),
                F("Nichts mehr", `Doch — ${a*b} und ${c} sind beide reine Zahlen.`)]},
     {frage:"<b>Wie lautet der fertige Term?</b>",
      tippAntwort:`${a}x + ${a*b + c}`,
      tipp2:"Das x-Glied bleibt unverändert stehen, dahinter kommt die zusammengefasste Zahl.",
      tipp:`${a*b} + ${c} zusammenrechnen, das x-Glied bleibt stehen.`,
      optionen:[R(`${a}x + ${a*b + c}`, `Fertig. Probe mit x = 1: ${a} · (1 + ${b}) + ${c} = ${a*(1+b)+c}. Stimmt.`),
                F(`${a}x + ${b + c}`, `Die ${b} wurde nicht mit ${a} malgenommen.`),
                F(`${a + a*b + c}x`, "Die Zahlen wurden ans x gehängt — sie gehören aber nicht dazu.")]}]};
 }
],

"Lineare Funktionen":[

 /* Steigung aus zwei Punkten */
 () => {
   /* keine Null bei den Punktwerten und m ≠ Schrittweite — sonst fallen
      im Aufgabentext richtige und falsche Antworten zusammen */
   let x1, m, b, dx, x2, y1, y2;
   do {
     x1 = rnd(-4, 2); m = rnd(2, 6); b = rnd(-6, 6); dx = rnd(2, 4);
     x2 = x1 + dx; y1 = m*x1 + b; y2 = m*x2 + b;
   } while (x1 === 0 || x2 === 0 || y1 === 0 || y2 === 0 || m === dx);
   return {
    typ:"formel", text:`Gerade durch P(${x1} | ${y1}) und Q(${x2} | ${y2}) — wie groß ist die Steigung m?`,
    loesung:`m = ${m}`,
    schluss:"Steigung heißt immer: wie viel geht es hoch, geteilt durch wie weit es nach rechts geht.",
    schritte:[
     {frage:"<b>Was beschreibt die Steigung einer Geraden?</b>",
      tipp2:"Es geht um ein Verhältnis: wie viel nach oben auf wie viel nach rechts.",
      tipp:"Stell dir vor, du läufst die Gerade entlang nach rechts.",
      optionen:[R("Wie viel die Gerade nach oben geht, wenn man ein Stück nach rechts geht", "Genau — Höhenunterschied geteilt durch Schritt nach rechts."),
                F("Wie weit die Gerade von der Null entfernt ist", "Das ist der y-Achsenabschnitt, nicht die Steigung."),
                F("Wie lang die Gerade ist", "Eine Gerade ist unendlich lang — das kann es nicht sein.")]},
     {frage:`Wie weit geht es von P nach Q <b>nach rechts</b>? (von x = ${x1} bis x = ${x2})`,
      tipp2:"Achte auf die Vorzeichen: Minus einer negativen Zahl bedeutet plus.",
      tipp:`Rechne ${x2} − (${x1}).`,
      optionen: zieheVerschiedene([
        R(String(dx), "Richtig."),
        F(String(x1 + x2), "Die beiden Werte wurden addiert statt voneinander abgezogen."),
        F(String(Math.abs(x2) + Math.abs(x1) + 1), "Rechne genau: hinterer x-Wert minus vorderer x-Wert.")], 3)},
     {frage:`Und wie viel geht es <b>nach oben</b>? (von y = ${y1} bis y = ${y2})`,
      tipp2:"Kommt etwas Negatives heraus, geht die Gerade nach unten statt nach oben.",
      tipp:`Rechne ${y2} − (${y1}).`,
      optionen: zieheVerschiedene([
        R(String(y2 - y1), "Genau."),

     {frage:`<b>Wie groß ist die Steigung?</b> (${y2 - y1} nach oben auf ${dx} nach rechts)`,
      tippAntwort:String(m),
      tipp2:"Die Höhe kommt in den Zähler, die Breite in den Nenner — nicht umgekehrt.",
      tipp:"Nach oben geteilt durch nach rechts.",
      optionen:[R(`m = ${m}`, `Genau: ${y2 - y1} geteilt durch ${dx} ist ${m}.`),
                F(`m = ${y2 - y1}`, `Das ist nur der Höhenunterschied — er muss noch durch ${dx} geteilt werden.`),
                F(`m = ${dx}`, "Das ist der Schritt nach rechts, nicht die Steigung.")]}]};
 },

 /* Punkt auf der Geraden prüfen */
 () => {
   /* b ≠ 0, sonst wäre „ohne den hinteren Teil" dasselbe wie das richtige Ergebnis */
   let m, b, px;
   do { m = rnd(2, 7); b = rnd(-8, 8); px = rnd(2, 8); }
   while (b === 0 || m * px === m + px);
   const richtig = m*px + b, falsch = richtig + rnd(1, 2) * (rnd(0,1) ? 1 : -1) * rnd(2, 5);
   const drauf = rnd(0, 1) === 1;
   const py = drauf ? richtig : falsch;
   const vz = b < 0 ? `− ${Math.abs(b)}` : `+ ${b}`;
   return {
    typ:"formel", text:`Liegt der Punkt P(${px} | ${py}) auf der Geraden y = ${m}x ${vz} ?`,
    loesung: drauf ? "Ja, er liegt darauf" : "Nein, er liegt nicht darauf",
    schluss:"Ein Punkt liegt genau dann auf einer Geraden, wenn seine beiden Werte die Gleichung erfüllen. Einsetzen, ausrechnen, vergleichen.",
    schritte:[
     {frage:"<b>Wie findet man heraus, ob ein Punkt auf einer Geraden liegt?</b>",
      tipp2:"Man rechnet mit dem x-Wert nach, welches y die Gerade an dieser Stelle hätte.",
      tipp:"Der Punkt hat einen x-Wert und einen y-Wert. Die Gleichung auch.",

                F("Man zeichnet und schaut hin", "Zeichnen ist ungenau — rechnen ist sicher."),
                F("Man vergleicht den Punkt mit der Steigung", "Die Steigung allein sagt nichts über einen einzelnen Punkt.")]},
     {frage:`Setz <b>x = ${px}</b> in <b>y = ${m}x ${vz}</b> ein. Was steht dann da?`,
      tipp2:"Setz die Zahl überall dort ein, wo x steht. Der Rest der Gleichung bleibt unverändert.",
      tipp:`Erst ${m} mal ${px} rechnen.`,
      optionen:[R(`y = ${m} · ${px} ${vz}`, "Richtig — nur das x wird ersetzt."),

     {frage:"<b>Was kommt heraus?</b>",
      tipp2:"Erst Punktrechnung, dann Strichrechnung.",
      tipp:`${m} · ${px} = ${m*px}, und davon dann ${b < 0 ? Math.abs(b) + " abziehen" : b + " dazu"}.`,
      optionen: zieheVerschiedene([
        R(String(richtig), "Genau."),
        F(String(m*px), `Der Teil ${vz} fehlt noch.`),
        F(String(m + px + b), "Hier wurde addiert statt malgenommen.")], 3)},
     {frage:`Herausgekommen ist <b>${richtig}</b>, der Punkt hat aber <b>y = ${py}</b>. <b>Liegt er auf der Geraden?</b>`,
      tipp2:"Fast gleich reicht nicht. Es muss genau derselbe Wert sein.",

      optionen: drauf

"Quadratische Gleichungen":[

 /* x² + px + q = 0 mit ganzzahligen Lösungen */
 () => {
   /* Lösungen so ziehen, dass p und q nicht null werden und p ≠ 2 bleibt —
      sonst fallen im Aufgabentext Antwortmöglichkeiten zusammen. */
   let x1, x2;
   do { x1 = rnd(-8, 8); x2 = rnd(-8, 8); }
   while (x1 === x2 || x1 === 0 || x2 === 0 || x1 + x2 === 0 || x1 + x2 === -2);
   const p = -(x1 + x2), q = x1 * x2;
   /* bei |p| = 1 schreibt man „x" statt „1x" — so steht es auch im Heft */
   const pZahl = Math.abs(p) === 1 ? "" : Math.abs(p);
   const pT = p < 0 ? `− ${pZahl}x` : `+ ${pZahl}x`;
   const qT = q < 0 ? `− ${Math.abs(q)}` : `+ ${q}`;
   const halb = p / 2;
   const unterWurzel = halb*halb - q;
   const klein = Math.min(x1, x2), gross = Math.max(x1, x2);
   return {
    typ:"formel", text:`x² ${pT} ${qT} = 0`, loesung:`x₁ = ${klein}, x₂ = ${gross}`,
    schluss:"Die p-q-Formel funktioniert immer, wenn die Gleichung mit einem reinen x² anfängt. Erst p und q ablesen, dann einsetzen.",
    schritte:[
     {frage:"Bevor du rechnest: <b>Was sind hier p und q?</b>",
      tipp2:"Das Vorzeichen gehört zur Zahl dazu: Steht ein Minus davor, ist der Wert negativ.",
      tipp:"In der Form x² + px + q = 0 ist p die Zahl vor dem x und q die Zahl ganz hinten.",
      optionen:[R(`p = ${p} und q = ${q}`, "Genau — mit Vorzeichen abgelesen, das ist die häufigste Fehlerquelle."),
                F(`p = ${q} und q = ${p}`, "Vertauscht: p gehört zum x, q steht allein."),
                F(`p = ${Math.abs(p)} und q = ${Math.abs(q)}`, "Die Vorzeichen gehören dazu, sonst stimmt das Ergebnis nicht.")]},
     {frage:`Die p-q-Formel beginnt mit <b>−p/2</b>. Was ist das hier?`,
      tipp2:"Erst das Vorzeichen umdrehen, dann halbieren.",
      tipp:`p ist ${p}. Also −(${p}) geteilt durch 2.`,
      optionen: zieheVerschiedene([
        R(String(-halb), "Richtig — auf das Minus vor dem p achten."),
        F(String(halb), "Das Minus vor dem p wurde vergessen."),
        F(String(-p), "Es muss noch durch 2 geteilt werden.")], 3)},
     {frage:`Unter der Wurzel steht <b>(p/2)² − q</b>. Was kommt da heraus?`,
      tipp2:"Erst quadrieren, dann q abziehen. Ein negatives q wird dabei zu einem Plus.",
      tipp:`(${halb})² ist ${halb*halb}, davon ${q < 0 ? Math.abs(q) + " dazu" : q + " abziehen"}.`,
      optionen: zieheVerschiedene([
        R(String(unterWurzel), "Genau."),
        F(String(halb*halb + q), `Hier wurde q addiert — in der Formel steht aber minus q.`),
        F(String(halb - q), "Der Teil p/2 muss noch quadriert werden.")], 3)},
     {frage:`Also <b>x = ${-halb} ± √${unterWurzel}</b>. <b>Wie heißen die beiden Lösungen?</b>`,
      tippAntwort:`${klein} und ${gross}`,
      tipp2:"Zwei Rechnungen mit derselben Zahl: einmal dazuzählen, einmal abziehen.",
      tipp:`√${unterWurzel} ist ${Math.sqrt(unterWurzel)}. Einmal dazu, einmal davon abziehen.`,
      optionen:[R(`x₁ = ${klein} und x₂ = ${gross}`, `Richtig. Probe: ${klein} · ${gross} = ${q}, und das ist genau q.`),
                F(`x₁ = ${-halb} und x₂ = ${Math.sqrt(unterWurzel)}`, "Die beiden Teile gehören zusammen — einmal mit Plus, einmal mit Minus."),
                F(`x = ${-halb}`, "Eine quadratische Gleichung hat hier zwei Lösungen, nicht eine.")]}]};
 },

 /* Produktform: (x − a)(x − b) = 0 */
 () => {
   /* keine Null und keine gespiegelten Werte — sonst wären zwei Antworten gleich */
   let a, b;
   do { a = rnd(-7, 7); b = rnd(-7, 7); }
   while (a === b || a === 0 || b === 0 || a === -b);
   const t = (v) => v < 0 ? `(x + ${Math.abs(v)})` : `(x − ${v})`;
   const klein = Math.min(a, b), gross = Math.max(a, b);
   return {
    typ:"formel", text:`${t(a)} · ${t(b)} = 0`, loesung:`x₁ = ${klein}, x₂ = ${gross}`,
    schluss:"Steht ein Produkt auf null, reicht es, wenn ein Faktor null wird. Deshalb darf man hier jede Klammer einzeln betrachten.",
    schritte:[
     {frage:"Hier ist ein <b>Produkt gleich null</b>. Was folgt daraus?",
      tipp2:"Sobald ein einziger Faktor null ist, ist das ganze Produkt null. Auf die anderen kommt es dann nicht mehr an.",
      tipp:"Wann wird ein Produkt überhaupt null?",
      optionen:[R("Mindestens einer der beiden Faktoren muss null sein", "Genau — das ist der Satz vom Nullprodukt."),
                F("Beide Faktoren müssen null sein", "Einer reicht schon: null mal irgendetwas ist null."),
                F("Man muss zuerst ausmultiplizieren", "Man darf — aber man macht sich damit unnötig Arbeit.")]},
     {frage:`Wann wird die erste Klammer <b>${t(a)}</b> null?`,
      tipp2:"Setz die Klammer für sich allein gleich null und stell nach x um.",
      tipp:`Welche Zahl muss x sein, damit ${a < 0 ? "x + " + Math.abs(a) : "x − " + a} null ergibt?`,
      optionen: zieheVerschiedene([
        R(`x = ${a}`, "Richtig."),
        F(`x = ${-a}`, "Vorzeichen vertauscht — setz die Zahl einmal probeweise ein."),
        F(`x = 0`, `Dann stünde in der Klammer ${a < 0 ? Math.abs(a) : -a}, nicht null.`)], 3)},
     {frage:`Und wann wird die zweite Klammer <b>${t(b)}</b> null?`,
      tipp2:"Dieselbe Überlegung noch einmal, nur mit der anderen Zahl.",
      tipp:"Genauso wie eben.",
      optionen: zieheVerschiedene([
        R(`x = ${b}`, "Genau."),
        F(`x = ${-b}`, "Vorzeichen vertauscht."),
        F(`x = ${a}`, "Das war die Lösung der ersten Klammer.")], 3)},
     {frage:"<b>Wie lauten also beide Lösungen?</b>",
      tippAntwort:`${klein} und ${gross}`,
      tipp2:"Üblicherweise schreibt man die kleinere Lösung zuerst.",
      tipp:"Beide Klammern liefern je eine Lösung.",
      optionen:[R(`x₁ = ${klein} und x₂ = ${gross}`, "Fertig — ohne einmal die p-q-Formel zu brauchen."),
                F(`x = ${klein}`, "Es gibt zwei Klammern, also auch zwei Lösungen."),
                F(`x₁ = ${-klein} und x₂ = ${-gross}`, "Die Vorzeichen sind gedreht — setz sie probeweise ein.")]}]};
 }
],

"Satz des Pythagoras":[

 /* Hypotenuse gesucht */
 () => {
   const tripel = [[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[12,16,20],[7,24,25],[20,21,29]];
   const [a, b, c] = pick(tripel);
   return {
    typ:"formel", text:`Rechtwinkliges Dreieck mit den Katheten a = ${a} cm und b = ${b} cm — wie lang ist die Hypotenuse c?`,
    loesung:`c = ${c} cm`,
    schluss:"a² + b² = c² gilt nur im rechtwinkligen Dreieck — und c ist immer die Seite gegenüber dem rechten Winkel.",
    schritte:[
     {frage:"<b>Welche Seite ist die Hypotenuse?</b>",

 /* Kathete gesucht */
 () => {

"Potenzen und Wurzeln":[

 /* Potenzgesetze: mal und geteilt */
 () => {
   /* 2+2 = 2·2 — dieser Fall würde zwei Antworten gleich machen */
   let m, n;
   do { m = rnd(2, 7); n = rnd(2, 6); } while (m + n === m * n);
   const malRechnen = rnd(0, 1) === 1;
   const gross = Math.max(m, n) + 3, klein = Math.min(m, n);
   const e1 = malRechnen ? m : gross, e2 = malRechnen ? n : klein;
   const erg = malRechnen ? m + n : gross - klein;
   return {
    typ:"formel",
    text: malRechnen ? `a<sup>${m}</sup> · a<sup>${n}</sup>` : `a<sup>${gross}</sup> : a<sup>${klein}</sup>`,
    loesung:`a<sup>${erg}</sup>`,
    schluss:"Gleiche Grundzahl mal genommen: Hochzahlen addieren. Geteilt: Hochzahlen abziehen. Die Grundzahl bleibt immer stehen.",
    schritte:[
     {frage:`Was bedeutet <b>a<sup>${e1}</sup></b> ausgeschrieben?`,
      tipp2:"Die Grundzahl steht unten, die Hochzahl zählt nur, wie oft sie vorkommt.",
      tipp:"Die Hochzahl sagt, wie oft die Grundzahl als Faktor auftritt.",
      optionen:[R(`a mal a mal a … insgesamt ${e1}-mal`, "Genau. Mehr steckt hinter einer Potenz nicht."),
                F(`a mal ${e1}`, "Die Hochzahl ist kein Faktor, sondern eine Anzahl."),
                F(`${e1} mal ${e1}`, "Die Grundzahl ist a, nicht die Hochzahl.")]},
     {frage: malRechnen
        ? `Wenn du <b>${m} Stück a</b> und <b>${n} Stück a</b> aneinanderhängst — wie viele sind es dann?`
        : `Wenn du von <b>${gross} Stück a</b> jeweils <b>${klein} Stück a</b> wegkürzt — wie viele bleiben?`,
      tipp2:"Schreib beide Potenzen ausgeschrieben hintereinander und zähl, wie viele Faktoren insgesamt dastehen.",
      tipp: malRechnen ? "Einfach zusammenzählen." : "Einfach abziehen.",
      optionen: zieheVerschiedene([
        R(String(erg), "Richtig."),
        F(String(malRechnen ? m * n : gross * klein), malRechnen ? "Die Hochzahlen werden addiert, nicht malgenommen." : "Die Hochzahlen werden abgezogen, nicht malgenommen."),
        F(String(malRechnen ? Math.abs(m - n) : gross + klein), malRechnen ? "Beim Malnehmen kommen sie dazu." : "Beim Teilen gehen sie weg.")], 3)},
     {frage:"<b>Was passiert mit der Grundzahl a?</b>",
      tipp2:"Verrechnet werden nur die Hochzahlen. Die Grundzahl wird nie malgenommen.",
      tipp:"Sie ist bei beiden Potenzen dieselbe.",
      optionen:[R("Sie bleibt einfach a", "Genau — nur die Hochzahl ändert sich."),
                F(malRechnen ? "Sie wird zu a²" : "Sie fällt weg", "Die Grundzahl bleibt immer unverändert stehen."),
                F("Sie wird auch malgenommen", "Nur die Hochzahlen werden verrechnet.")]},
     {frage:"<b>Wie lautet das Ergebnis?</b>",
      tippAntwort:`a hoch ${erg}`,
      tipp2:"Gleiche Grundzahl und ein Malzeichen dazwischen: Dann werden die Hochzahlen zusammengezählt.",
      tipp:"Grundzahl a, dazu die neue Hochzahl.",
      optionen:[R(`a<sup>${erg}</sup>`, "Fertig."),
                F(`a<sup>${malRechnen ? m*n : gross+klein}</sup>`, malRechnen ? "Beim Malnehmen werden die Hochzahlen addiert." : "Beim Teilen werden sie abgezogen."),
                F(`${erg}a`, "Die Hochzahl darf nicht nach vorne rutschen — das wäre etwas ganz anderes.")]}]};
 },

"Quadratische Funktionen":[

 /* Scheitelpunkt aus der Scheitelform ablesen */
 () => {
   /* d und e verschieden und nicht null, damit x- und y-Wert unterscheidbar bleiben */
   let d, e;
   do { d = rnd(-7, 7); e = rnd(-8, 8); } while (d === 0 || e === 0 || d === e);
   const innen = d < 0 ? `x + ${Math.abs(d)}` : `x − ${d}`;
   const hinten = e < 0 ? `− ${Math.abs(e)}` : `+ ${e}`;
   return {
    typ:"formel", text:`f(x) = (${innen})² ${hinten}`, loesung:`S(${d} | ${e})`,
    schluss:"In der Scheitelform steht der Scheitelpunkt direkt da — man muss nur beim x-Wert das Vorzeichen umdrehen.",

 },

 /* Öffnung und Verschiebung deuten */
 () => {
   const a = pick([-3, -2, -0.5, 0.5, 2, 3]);
   const e = pick([-6, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 6]);   /* nicht null: sonst ist die Verschiebung kein Thema */

"Trigonometrie":[

   return {
    typ:"formel",

 },

 /* Seite mit Sinus berechnen */
 () => {

    typ:"formel",
    text:`Rechtwinkliges Dreieck: Hypotenuse c = ${hyp} cm, Winkel α = ${winkel}°. Wie lang ist die Gegenkathete a?`,

    schluss:"Wenn Hypotenuse und Winkel bekannt sind und die Gegenkathete gesucht ist, führt immer der Sinus zum Ziel.",

      tipp2:"Links steht die Funktion mit dem Winkel, rechts der Bruch aus den beiden Seiten.",
      tipp:"Gegenkathete geteilt durch Hypotenuse.",
      optionen:[R(`sin(${winkel}°) = a : ${hyp}`, "Richtig."),
                F(`sin(${winkel}°) = ${hyp} : a`, "Der Bruch steht auf dem Kopf — die Hypotenuse gehört nach unten."),
                F(`sin(${winkel}°) = a · ${hyp}`, "Es ist ein Verhältnis, also geteilt.")]},
     {frage:`Nach <b>a</b> umgestellt — was steht dann da?`,
      tipp2:"Die Hypotenuse steht im Nenner. Man wird sie los, indem man beide Seiten damit malnimmt.",
      tipp:"Beide Seiten mit " + hyp + " malnehmen.",
      optionen:[R(`a = ${hyp} · sin(${winkel}°)`, "Genau."),
                F(`a = ${hyp} : sin(${winkel}°)`, "Es wird malgenommen, nicht geteilt."),
                F(`a = sin(${winkel}°) − ${hyp}`, "Aus einem Mal wird beim Umstellen kein Minus.")]},
     {frage:`<b>Wie lang ist a?</b> (sin(${winkel}°) ≈ ${z(wert)})`,
      tippAntwort:z(geg),
      tipp2:"Setz den Zahlenwert der Funktion ein und rechne die Malaufgabe.",
      tipp:`${hyp} mal ${z(wert)} ausrechnen.`,
      optionen: zieheVerschiedene([
        R(`a ≈ ${z(geg)} cm`, "Richtig — und sie ist kürzer als die Hypotenuse, wie es sein muss."),
        F(`a ≈ ${z(Math.round(hyp / wert * 10) / 10)} cm`, "Hier wurde geteilt statt malgenommen — das Ergebnis wäre länger als die Hypotenuse, das geht nicht."),
        F(`a ≈ ${z(hyp)} cm`, "Das ist die Hypotenuse selbst.")], 3)}]};
 }
],

"Exponentielles Wachstum":[

 /* Zunahme mit festem Prozentsatz */
 () => {
   const start = pick([200, 500, 800, 1000, 1500, 2000]);
   const p = pick([5, 8, 10, 20, 25]);
   const faktor = 1 + p/100;
   const jahre = rnd(2, 4);
   const ende = Math.round(start * Math.pow(faktor, jahre));
   const linear = start + start * p/100 * jahre;
   return {
    typ:"formel",
    text:`Ein Betrag von ${z(start)} € wächst jedes Jahr um ${p} %. Wie viel sind es nach ${jahre} Jahren?`,
    loesung:`etwa ${z(ende)} €`,
    schluss:"Beim exponentiellen Wachstum wird jedes Jahr mit demselben Faktor malgenommen — nicht immer derselbe Betrag addiert.",
    schritte:[
     {frage:`Nach einem Jahr sind ${p} % dazugekommen. <b>Mit welcher Zahl nimmt man dafür mal?</b>`,
      tipp2:"Der alte Bestand bleibt vollständig erhalten, der Zuwachs kommt oben drauf. Beides steckt in einer einzigen Zahl.",
      tipp:"Das Ganze bleibt erhalten (100 %) und " + p + " % kommen dazu.",
      optionen: zieheVerschiedene([
        R(z(faktor), `Richtig: 100 % + ${p} % = ${100+p} %, also mal ${z(faktor)}.`),
        F(z(p/100), `Das wären nur die ${p} % Zuwachs — der ursprüngliche Betrag fehlt.`),
        F(String(p), "Das ist die Prozentzahl selbst, kein Faktor.")], 3)},
     {frage:`Und im <b>zweiten</b> Jahr — wovon werden die ${p} % berechnet?`,
      tipp2:"Der Prozentsatz bezieht sich immer auf den Stand vom Jahresanfang, nicht auf den Startwert.",
      tipp:"Der Betrag ist ja inzwischen größer geworden.",
      optionen:[R("Vom neuen, bereits gewachsenen Betrag", "Genau das macht den Unterschied zum gleichmäßigen Wachstum."),
                F("Immer vom ursprünglichen Betrag", `Dann wäre es lineares Wachstum und es käme ${z(linear)} € heraus.`),
                F("Von der Differenz des ersten Jahres", "Nein, immer vom aktuellen Gesamtbetrag.")]},
     {frage:`<b>Wie rechnet man ${jahre} Jahre auf einmal?</b>`,
      tipp2:"Derselbe Faktor mehrfach hintereinander — dafür gibt es die Hochzahl.",
      tipp:"Jedes Jahr derselbe Faktor.",
      optionen:[R(`${z(start)} · ${z(faktor)}<sup>${jahre}</sup>`, "Richtig — der Faktor kommt in die Hochzahl."),
                F(`${z(start)} · ${z(faktor)} · ${jahre}`, "Hier würde der Faktor nur einmal wirken und dann verdoppelt — das ist lineares Denken."),
                F(`${z(start)} + ${z(faktor)}<sup>${jahre}</sup>`, "Der Startwert wird malgenommen, nicht addiert.")]},
     {frage:"<b>Wie viel ist es am Ende ungefähr?</b>",
      tippAntwort:z(ende),
      tipp2:"Rechne notfalls Jahr für Jahr durch, das Ergebnis ist dasselbe.",
      tipp:`${z(start)} mal ${z(faktor)}, und das ${jahre}-mal hintereinander.`,
      optionen: zieheVerschiedene([
        R(`etwa ${z(ende)} €`, "Richtig — und mehr als bei gleichmäßigem Wachstum, weil der Zuwachs mitwächst."),
        F(`${z(linear)} €`, "Das wäre gleichmäßiges Wachstum, bei dem jedes Jahr derselbe Betrag dazukommt."),
        F(`${z(start)} €`, "Das ist der Startwert, da ist noch nichts gewachsen.")], 3)}]};
 },

 /* Abnahme / Halbierung */
 () => {

      optionen: zieheVerschiedene([

        F(z(p/100), `Das sind die ${p} %, die wegfallen.`)], 3)},
     {frage:`<b>Wie rechnet man ${schritte} Jahre?</b>`,
      tipp2:"Die Anzahl der Jahre wird zur Hochzahl.",
      tipp:"Denselben Faktor mehrfach anwenden.",
      optionen:[R(`${z(start)} · ${z(faktor)}<sup>${schritte}</sup>`, "Richtig."),
                F(`${z(start)} − ${p} · ${schritte}`, "Es wird malgenommen, nicht abgezogen."),
                F(`${z(start)} : ${schritte}`, "Teilen durch die Jahre hat damit nichts zu tun.")]},
     {frage:"<b>Wie groß ist der Bestand ungefähr?</b>",
      tippAntwort:z(ende),
      tipp2:"Beim Abnehmen muss das Ergebnis kleiner sein als der Startwert. Das ist eine gute Kontrolle.",
      tipp:`${z(start)} mal ${z(faktor)}, ${schritte}-mal hintereinander.`,
      optionen: zieheVerschiedene([
        R(`etwa ${z(ende)}`, "Richtig."),
        F(`${z(Math.round(start - start * p/100 * schritte))}`, "Das wäre gleichmäßige Abnahme mit immer demselben Betrag."),
        F("0", "Bei prozentualer Abnahme wird es zwar immer weniger, aber nie ganz null.")], 3)}]};
 }
],

/* Fach und Klasse zu einem Thema finden */
function themaInfo(name){
  for (const [fk, f] of Object.entries(KATALOG))
    for (const [kl, liste] of Object.entries(f.themen))
      if (liste.includes(name)) return {fach: fk, klasse: Number(kl)};
  return {fach:"mathe", klasse:5};
}
function anzahlAufgaben(name){ return AUFGABEN[name] ? AUFGABEN[name].length : 0; }
/* Sicherheitsnetz: entfernt Antwortmöglichkeiten, die zufällig gleich lauten.
   Beim Würfeln kann es passieren, dass eine falsche Antwort denselben Wert
   trifft wie die richtige — dann wäre die Frage nicht lösbar. */
function entdoppeln(aufgabe){
  (aufgabe.schritte || []).forEach(s => {
    const gesehen = new Set(), behalten = [];
    const schluessel = o => String(o.t).replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
    s.optionen.filter(o => o.ok).forEach(o => { gesehen.add(schluessel(o)); behalten.push(o); });
    s.optionen.filter(o => !o.ok).forEach(o => {
      const k = schluessel(o);
      if (!gesehen.has(k)){ gesehen.add(k); behalten.push(o); }
    });
    s.optionen = behalten;
  });
  return aufgabe;
}

/* ---------- Antwortmöglichkeiten auffüllen ----------
   Bei Zahlenantworten ergänzen wir automatisch weitere, knapp danebenliegende
   Werte, damit man sich nicht mit einem Drittel Wahrscheinlichkeit durchraten kann. */

const ZIEL_ANTWORTEN = 6;

/* Zerlegt "3.800 g" in {wert: 3800, suffix: " g", stellen: 0} — oder null, wenn es keine reine Zahl ist. */
function zahlTeile(text){
  const roh = String(text).replace(/<[^>]+>/g, "").trim();
  const m = roh.match(/^(-?\d{1,3}(?:\.\d{3})*(?:,\d+)?|-?\d+(?:,\d+)?)(\s*(?:cm²|cm³|cm|mm|km|m|kg|g|l|ml|min|h|s|°|%|€|Grad)?)$/);
  if (!m) return null;
  const zahlText = m[1];
  const wert = Number(zahlText.replace(/\./g, "").replace(",", "."));
  if (!Number.isFinite(wert)) return null;
  const komma = zahlText.split(",")[1];
  return {wert, suffix: m[2] || "", stellen: komma ? komma.length : 0};
}
function formatiereWie(wert, teile){
  const zahl = wert.toLocaleString("de-DE", {minimumFractionDigits: teile.stellen, maximumFractionDigits: teile.stellen});
  return zahl + teile.suffix;
}

function fuelleAuf(schritt, ziel){
  if (schritt.optionen.length >= ziel) return;
  const richtig = schritt.optionen.find(o => o.ok);
  if (!richtig) return;
  const teile = zahlTeile(richtig.t);
  if (!teile) return;                                   // keine reine Zahlenantwort
  const alleTeile = schritt.optionen.map(o => zahlTeile(o.t));
  if (!alleTeile.every(t => t && t.suffix === teile.suffix)) return;   // gleiche Einheit genügt

  const w = teile.wert;
  const b = Math.abs(w);
  /* Abstände passend zur Größenordnung, damit keine Ein-Cent-Ablenker entstehen */
  const spruenge = b >= 1000 ? [100, 200, 50, 500]
                 : b >= 100  ? [10, 20, 5, 50]
                 : b >= 10   ? [1, 2, 5, 10]
                 : b >= 1    ? [1, 2, 0.5, 3]
                 : [0.1, 0.05, 0.2, 0.5];
  const kandidaten = [];
  spruenge.forEach(d => { kandidaten.push(w + d, w - d); });
  kandidaten.push(w * 10, w / 10, w * 2, w / 2);
  const genutzteTexte = new Set(schritt.optionen.map(o => String(o.t).replace(/<[^>]+>/g, "").trim()));
  const genutzteWerte = alleTeile.map(t => t.wert);
  for (const k of kandidaten){
    if (schritt.optionen.length >= ziel) break;
    if (!Number.isFinite(k)) continue;
    if (w > 0 && k <= 0) continue;
    if (Math.abs(k) > 1e9) continue;
    const gerundet = Number(k.toFixed(teile.stellen + 2));
    if (genutzteWerte.some(v => Math.abs(v - gerundet) < 1e-9)) continue;   // Wert schon vorhanden
    const text = formatiereWie(gerundet, teile);
    if (genutzteTexte.has(text)) continue;
    genutzteTexte.add(text); genutzteWerte.push(gerundet);
    schritt.optionen.push({t: text, ok: 0, fb: "Knapp daneben — rechne den letzten Schritt noch einmal nach."});
  }
}

/* Kann man die Antwort dieses Schrittes auch eintippen? Nur bei reinen Werten. */
function istEintippbar(schritt){
  if (schritt.tippAntwort) return true;
  const richtig = schritt.optionen.find(o => o.ok);
  if (!richtig) return false;
  const roh = String(richtig.t).replace(/<[^>]+>/g, "").trim();
  if (/^\d+\/\d+$/.test(roh)) return true;             // Bruch wie 11/12
  if (/^x = -?\d+$/.test(roh)) return true;             // Gleichungslösung
  return !!zahlTeile(roh);
}
/* Vergleicht eine eingetippte Antwort mit der richtigen — großzügig bei Schreibweise. */
function eingabePasst(eingabe, richtigText){
  const putzen = t => String(t).replace(/<[^>]+>/g, "").replace(/\s/g, "").toLowerCase();
  const a = putzen(eingabe), b = putzen(richtigText);
  if (!a) return false;
  if (a === b) return true;
  const bruch = t => { const m = t.match(/^(\d+)\/(\d+)$/); return m ? Number(m[1])/Number(m[2]) : null; };
  const ba = bruch(a), bb = bruch(b);
  if (ba !== null && bb !== null) return Math.abs(ba - bb) < 1e-9;
  const zahl = t => {
    const m = t.replace(/x=/, "").match(/-?\d{1,3}(?:\.\d{3})+(?:,\d+)?|-?\d+(?:[.,]\d+)?/);
    if (!m) return null;
    return Number(m[0].replace(/\.(?=\d{3}\b)/g, "").replace(",", "."));
  };
  const za = zahl(a), zb = zahl(b);
  if (za === null || zb === null) return false;
  return Math.abs(za - zb) < 1e-6;
}

/* erzeugt eine frische Aufgabe (Zahlen und Wörter jedes Mal neu) */
function baueAufgabe(name, welche){
  const liste = AUFGABEN[name];
  const bauer = liste[welche % liste.length];
  const aufgabe = typeof bauer === "function" ? bauer() : JSON.parse(JSON.stringify(bauer));
  entdoppeln(aufgabe);
  (aufgabe.schritte || []).forEach(s => fuelleAuf(s, ZIEL_ANTWORTEN));
  return aufgabe;
}

    "Denn (a + b)² heißt: (a + b) · (a + b). Und beim Ausmultiplizieren trifft jeder Teil der ersten Klammer jeden Teil der zweiten — das sind vier Produkte, nicht zwei.",
    "Zwei dieser vier Produkte sind gleich (a·b und b·a). Zusammen ergeben sie den mittleren Teil: 2ab.",
    "Bei (a + b)(a − b) sind diese beiden mittleren Teile einmal plus und einmal minus — sie löschen sich aus. Deshalb bleibt nur a² − b² übrig."

  begriffe:[

"Satz des Pythagoras": {
  worum:"In jedem rechtwinkligen Dreieck hängen die drei Seitenlängen fest zusammen. Kennt man zwei, kann man die dritte ausrechnen.",
  einfach:[
    "Die Formel a² + b² = c² gilt nur, wenn im Dreieck ein rechter Winkel steckt. Sonst stimmt sie nicht.",
    "Die beiden Seiten, die den rechten Winkel bilden, heißen Katheten. Die Seite gegenüber heißt Hypotenuse — sie ist immer die längste.",
    "In der Formel steht c immer für die Hypotenuse. Wer hier vertauscht, bekommt Unsinn heraus.",
    "Suchst du die Hypotenuse, wird addiert. Suchst du eine Kathete, wird abgezogen."

"Potenzen und Wurzeln": {

    "Die Wurzel fragt umgekehrt: welche Zahl mit sich selbst malgenommen ergibt das? √49 = 7, weil 7 · 7 = 49."
  ],
  begriffe:[
    ["Basis","Die Zahl, die malgenommen wird — bei a⁵ ist das a."],

  beispiel:{aufgabe:"a⁴ · a³",

  bild:`<svg viewBox="0 0 400 185" ${SVG_STIL} role="img" aria-label="Potenz als wiederholtes Malnehmen, Wurzel als Umkehrung">

  worum:"Wann vor einer Wortgruppe mit „zu“ ein Komma stehen muss — und wann man es sich aussuchen darf.",

    "Anders als ein Nebensatz hat sie kein eigenes Subjekt — es steht kein „ich“, „er“ oder „sie“ darin.",
    "Seit der Rechtschreibreform ist das Komma in vielen Fällen freigestellt. Es gibt aber sechs Einleitewörter, bei denen es immer stehen muss.",
    "Diese sechs kann man sich als Reihe merken: um, ohne, statt, anstatt, außer, als. Wer die kennt, ist bei den Pflichtfällen auf der sicheren Seite."

  begriffe:[

  regeln:[
    "Komma-Pflicht bei: um, ohne, statt, anstatt, außer, als.",

  beispiel:{aufgabe:"Sie ging früher los um den Zug zu erreichen.",

"Stilmittel erkennen": {

  einfach:[

    "Tut etwas Unbelebtes etwas Menschliches („der Wind flüstert“), ist es eine Personifikation."
  ],
  begriffe:[

    ["Vergleich","Zwei Dinge mit „wie“ nebeneinandergestellt."],

    ["Alliteration","Mehrere Wörter mit gleichem Anfangslaut."],
    ["Hyperbel","Starke Übertreibung."]

  beispiel:{aufgabe:"„Der Wind flüsterte durch die Bäume.“",

/* Themen einer Klasse, für die es schon Aufgaben gibt */
function fertigeThemen(f, k){
  return (KATALOG[f] && KATALOG[f].themen[k] ? KATALOG[f].themen[k] : []).filter(t => anzahlAufgaben(t) > 0);
}
/* Für eine noch leere Klasse: die nächstgelegenen fertigen Themen aus den
   Klassen darunter — die Grundlagen, die man dafür ohnehin braucht.
   Es wird von unmittelbar darunter nach unten gesucht, damit die
   Vorschläge möglichst nah an der gewählten Klasse liegen. */
function grundlagenThemen(f, k, anzahl){
  const raus = [];
  for (let stufe = k - 1; stufe >= 5 && raus.length < anzahl; stufe--)
    for (const t of fertigeThemen(f, stufe)){
      raus.push({thema: t, klasse: stufe});
      if (raus.length >= anzahl) break;
    }
  return raus;
}
/* startet ein Thema und stellt Fach und Klasse passend dazu ein
   (nötig, wenn aus einer leeren Klasse ein Grundlagen-Thema geübt wird) */
function starteThemaAusKlasse(name){
  const info = themaInfo(name);
  fach = info.fach; klasse = info.klasse;
  starte(name);
}

/* ---------- Admin-Helfer: CSV, Filter, Bauplan ---------- */
function csvExport(dateiname, kopf, zeilen){
  const esc = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const txt = [kopf.map(esc).join(";"), ...zeilen.map(r => r.map(esc).join(";"))].join("\r\n");
  const blob = new Blob(["﻿" + txt], {type: "text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = dateiname;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ---------- Wann wird geübt ---------- */
function wannHtml(s){
  const tage = ["So","Mo","Di","Mi","Do","Fr","Sa"];
  const w = s.wochentage || [], h = s.stunden || [];
  if (!w.length && !h.length) return `
    <div class="card"><p class="ueberschrift">Wann wird geübt</p>
    <p class="small soft" style="margin:0">Sobald geübt wird, siehst du hier, an welchen Tagen und zu welchen Uhrzeiten.</p></div>`;
  const maxW = Math.max(1, ...w.map(x => x.anzahl));
  const maxH = Math.max(1, ...h.map(x => x.anzahl));
  const proStunde = nr => (h.find(x => x.stunde === nr) || {anzahl:0}).anzahl;
  const spitze = h.length ? h.slice().sort((a,b) => b.anzahl - a.anzahl)[0].stunde : null;
  return `
    <div class="card">
      <p class="ueberschrift">Wann wird geübt</p>
      <div class="wochentage">
        ${[1,2,3,4,5,6,0].map(nr => {
          const e = w.find(x => x.nr === nr) || {anzahl:0};
          return `<div class="wtag"><span class="wname">${tage[nr]}</span>
                   <span class="wbalken"><i style="width:${Math.round(e.anzahl/maxW*100)}%"></i></span>
                   <span class="wzahl">${e.anzahl}</span></div>`;
        }).join("")}
      </div>
      <p class="ueberschrift" style="margin-top:22px">Nach Uhrzeit</p>
      <div class="balken">
        ${Array.from({length:24}, (_,nr) => `
          <div class="balkensaeule" title="${nr}:00 — ${proStunde(nr)}">
            <div class="saeule" style="height:${Math.round(proStunde(nr)/maxH*100)}%"></div>
            <span>${nr % 3 === 0 ? nr : ""}</span>
          </div>`).join("")}
      </div>
      ${spitze !== null ? `<p class="small soft" style="margin-top:12px">Spitzenzeit: gegen ${spitze} Uhr. Dann lohnt es sich, Neues zu veröffentlichen.</p>` : ""}
    </div>`;
}

/* Echte Links: normaler Klick -> schnelle App-Navigation; Strg/Cmd/Mittelklick
   oder Long-Press/Rechtsklick -> der Browser öffnet die Adresse ganz normal
   (neuer Tab, Link kopieren, Kontextmenü …). */
function navKlick(e, fn){
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || (typeof e.button === "number" && e.button > 0)) return true;
  e.preventDefault();
  fn();
  return false;
}

/* Beim Rechnen soll nichts ablenken und nichts Platz wegnehmen: Über der
   Aufgabe standen sonst Baustellenband, Menüzeile und ein großer Anmelde-Knopf.
   Auf dem Handy begann die Aufgabe dadurch erst weit unten im Bild. */
function amLoesen(){ return ansicht === "loesen" || ansicht === "fertig"; }

/* Wie groß darf der Aufgabentext gesetzt werden? Eine Gleichung soll groß und
   ruhig dastehen, ein ganzer Satz nicht — sonst füllt er den halben Bildschirm
   und man sieht die Antwortmöglichkeiten nicht mehr. */
function aufgabenGroesse(a){
  if (a.typ === "text") return "text";
  const zeichen = String(a.text).replace(/<[^>]+>/g, "").trim().length;
  if (zeichen <= 24) return "";          /* „3x + 4 = 19“ */
  if (zeichen <= 60) return "mittel";
  return "lang";                          /* ganze Sätze */
}

      <p class="ueberschrift" style="margin-top:26px">3. Wenn du ohne Konto übst</p>
      <p class="einfachtext">Dann speichern wir über dich <b>gar nichts</b> auf unseren Servern. Welche Aufgabe du gerade löst, bleibt nur in deinem Browser und ist weg, sobald du die Seite schließt. Der Preis dafür: Es gibt keinen Wiederholungsplan, weil wir uns nichts merken können.</p>

      <p class="ueberschrift" style="margin-top:26px">4. Wenn du ein Konto anlegst</p>
      <p class="einfachtext">Für ein Konto brauchen wir:</p>
      <ul class="liste">
        <li><b>deine E-Mail-Adresse</b> — als Anmeldename und um dir den Bestätigungslink und ggf. ein neues Passwort schicken zu können</li>
        <li><b>dein Passwort</b> — nur in verschlüsselter Form (als sogenannter Hash). Niemand, auch wir nicht, kann es lesen.</li>
        <li><b>Zeitpunkt der Registrierung und der letzten Anmeldung</b></li>
      </ul>
      <p class="einfachtext">Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO — ohne diese Daten können wir dir das Konto, das du angefragt hast, nicht bereitstellen.</p>

      <p class="ueberschrift" style="margin-top:26px">5. Was beim Üben gespeichert wird</p>
      <p class="einfachtext">Damit der Wiederholungsplan funktioniert, merken wir uns zu deinem Konto:</p>
      <ul class="liste">
        <li>welches Fach, welche Klassenstufe und welches Thema du geübt hast</li>
        <li>wann das war und ob du dabei Fehler gemacht hast</li>
        <li>daraus berechnet: wie sicher ein Thema bei dir sitzt und wann es wieder drankommt</li>
      </ul>
      <p class="einfachtext">Wir speichern <b>nicht</b>, welche einzelne Antwort du angeklickt hast, und wir leiten daraus keine Bewertung deiner Person ab. Es findet keine automatisierte Entscheidung im Sinne von Art. 22 DSGVO statt. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO.</p>

      <p class="ueberschrift" style="margin-top:26px">6. Wenn du uns schreibst</p>
      <p class="einfachtext">Über „Hilfe und Feedback“ kannst du uns eine Nachricht schicken. Gespeichert werden dein Text, die angegebene E-Mail-Adresse für die Antwort und einige technische Angaben, die bei der Fehlersuche helfen: auf welcher Seite du warst, welches Thema geöffnet war, Gerätetyp, Browser und Fensterbreite. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO (Bearbeitung deiner Anfrage). Erledigte Anfragen löschen wir, sobald sie nicht mehr gebraucht werden.</p>

      <p class="ueberschrift" style="margin-top:26px">7. Support-Freigabe — nur, wenn du sie erteilst</p>
      <p class="einfachtext">Standardmäßig kann niemand in deinen Lernfortschritt sehen. Wenn du bei einem Problem Hilfe brauchst, kannst du unter <b>Mein Konto</b> eine Freigabe erteilen. Dann darf der Support <b>24 Stunden lang</b> deinen Lernfortschritt einsehen — nicht dein Passwort. Jeder Zugriff wird protokolliert, und du kannst die Freigabe jederzeit sofort wieder beenden. Rechtsgrundlage ist deine Einwilligung nach Art. 6 Abs. 1 lit. a DSGVO, die du jederzeit für die Zukunft widerrufen kannst.</p>

      <p class="ueberschrift" style="margin-top:26px">8. Wer die Daten sonst noch bekommt</p>
      <p class="einfachtext">Wir verkaufen keine Daten und geben sie nicht zu Werbezwecken weiter. Werbung gibt es auf dieser Seite nicht. Wir setzen aber zwei technische Dienstleister ein, die die Daten in unserem Auftrag und nach unseren Weisungen verarbeiten (Auftragsverarbeitung nach Art. 28 DSGVO):</p>
      <ul class="liste">
        <li><b>Vercel Inc.</b>, 340 S Lemon Ave #4133, Walnut, CA 91789, USA — liefert die Webseite aus. Dabei fallen die unter Punkt 2 genannten technischen Daten an.</li>
        <li><b>Supabase Inc.</b>, 970 Toa Payoh North #07-04, Singapur — betreibt die Datenbank und die Anmeldung. Hier liegen dein Konto und dein Lernfortschritt. Der von uns gewählte Serverstandort ist ${PLATZ} (Region im Supabase-Konto nachsehen und eintragen).</li>
        <li><b>ImprovMX Incorporated</b>, 8 The Green STE D, Dover, Delaware 19901, USA — leitet E-Mails an hilfe@endlichkapiert.com an unser Postfach weiter. Betroffen ist also nur Post, die du uns selbst schreibst. Die Zustellung läuft über Server in Frankreich.</li>
      </ul>
      <p class="einfachtext">Mit beiden Anbietern bestehen Verträge zur Auftragsverarbeitung.</p>

      <p class="ueberschrift" style="margin-top:26px">9. Übermittlung in Länder außerhalb der EU</p>
      <p class="einfachtext">Beide Anbieter sind Unternehmen außerhalb der EU. Auch wenn die Server in Europa stehen, lässt sich ein Zugriff aus dem Ausland — etwa im Rahmen von Wartung und Support — nicht vollständig ausschließen. Die Übermittlung wird abgesichert durch die Standardvertragsklauseln der EU-Kommission nach Art. 46 Abs. 2 lit. c DSGVO und, soweit einschlägig, durch die Zertifizierung nach dem EU-US Data Privacy Framework. In Drittländern gilt möglicherweise nicht dasselbe Datenschutzniveau wie in der EU; insbesondere können dort Behörden weitergehende Zugriffsrechte haben.</p>

      <p class="ueberschrift" style="margin-top:26px">10. Cookies und Speicherung im Browser</p>
      <p class="einfachtext">Wir verwenden <b>keine</b> Werbe-, Marketing- oder Analyse-Cookies und binden keine Zählpixel oder Social-Media-Buttons ein. Deshalb gibt es hier auch kein Cookie-Banner.</p>
      <p class="einfachtext">Gespeichert wird in deinem Browser nur, was für den Betrieb nötig ist: deine Einstellungen (Hell- oder Dunkelmodus, Schriftgröße, Art der Antwortabfrage), der Hinweis, dass du den Baustellen-Hinweis gesehen hast, und — wenn du angemeldet bist — die Information, die dich angemeldet hält. Das fällt unter § 25 Abs. 2 TDDDG (unbedingt erforderliche Speicherung). Du kannst das jederzeit über die Einstellungen deines Browsers löschen.</p>

      <p class="ueberschrift" style="margin-top:26px">11. Wie lange wir speichern</p>
      <ul class="liste">
        <li><b>Konto und Lernfortschritt:</b> solange dein Konto besteht.</li>

      <p class="ueberschrift" style="margin-top:26px">12. Kinder und Jugendliche</p>
      <p class="einfachtext">Diese Seite richtet sich an Schülerinnen und Schüler ab Klasse 5. Wenn du jünger als 16 Jahre bist, dürfen wir dein Konto nur mit Einverständnis deiner Eltern oder Erziehungsberechtigten anlegen (Art. 8 DSGVO). Frag sie also bitte vorher. <b>Ohne Konto kannst du die ganze Seite nutzen, ohne dass irgendetwas gespeichert wird</b> — das ist der einfachste Weg, wenn du dir unsicher bist.</p>

      <p class="ueberschrift" style="margin-top:26px">13. Deine Rechte</p>
      <p class="einfachtext">Du hast jederzeit das Recht auf:</p>
      <ul class="liste">
        <li><b>Auskunft</b> darüber, welche Daten wir zu dir gespeichert haben (Art. 15)</li>

      <p class="einfachtext">Für Auskunft oder Löschung reicht eine formlose Nachricht an hilfe@endlichkapiert.com. Löschen kannst du auch selbst und sofort: unter <b>Mein Konto → Konto löschen</b>.</p>

      <p class="ueberschrift" style="margin-top:26px">14. Beschwerderecht</p>

/* ---------- Aktivität: Serie und Tagesziel ---------- */
let aktivitaet = {serie: 0, heute: 0, geladen: false};
const TAGESZIEL = 5;
const MEILENSTEINE = [3, 7, 14, 30, 50, 100, 200, 365];
let neuerMeilenstein = 0;   // frisch erreichter Meilenstein für die Feier-Anzeige
function meilensteinPruefen(){
  const erreicht = MEILENSTEINE.filter(m => (aktivitaet.serie || 0) >= m);
  const hoechste = erreicht.length ? erreicht[erreicht.length - 1] : 0;
  let gefeiert = 0;
  try { gefeiert = parseInt(window.localStorage.getItem("ek_meilenstein") || "0", 10) || 0; } catch(e){}
  if (hoechste > gefeiert){
    neuerMeilenstein = hoechste;
    try { window.localStorage.setItem("ek_meilenstein", String(hoechste)); } catch(e){}
  }
}
function meilensteinWeg(){ neuerMeilenstein = 0; render(); }

async function ladeAktivitaet(){
  aktivitaet = {serie: 0, heute: 0, geladen: false};
  if (!benutzer) { aktivitaet.geladen = true; return; }
  try {
    const {data} = await db.from("uebungen").select("erstellt")
      .order("erstellt", {ascending:false}).limit(400);
    const zeilen = data || [];
    const tagText = d => new Date(d).toLocaleDateString("de-DE");
    const heuteText = new Date().toLocaleDateString("de-DE");
    aktivitaet.heute = zeilen.filter(z => tagText(z.erstellt) === heuteText).length;

    const tage = [...new Set(zeilen.map(z => tagText(z.erstellt)))];
    let serie = 0, joker = 1, jokerGenutzt = false;
    const pruef = new Date();
    /* Wer heute noch nicht geübt hat, verliert die Serie nicht — wir fangen bei gestern an. */
    if (!tage.includes(pruef.toLocaleDateString("de-DE"))) pruef.setDate(pruef.getDate() - 1);
    /* Streak-Schutz: ein ausgelassener Tag mitten in der Serie darf sie nicht sofort beenden. */
    while (true){
      const t = pruef.toLocaleDateString("de-DE");
      if (tage.includes(t)){ serie++; pruef.setDate(pruef.getDate() - 1); }
      else if (joker > 0 && serie > 0){ joker--; jokerGenutzt = true; pruef.setDate(pruef.getDate() - 1); }
      else break;
    }
    aktivitaet.serie = serie;
    aktivitaet.jokerGenutzt = jokerGenutzt;
  } catch(e){ /* dann eben ohne */ }
  aktivitaet.geladen = true;
  meilensteinPruefen();
}

/* ---------- Merksatz des Tages ---------- */
function merksatzDesTages(){
  const alle = [];
  for (const [thema, e] of Object.entries(ERKLAERUNGEN))
    (e.regeln || []).forEach(r => { if (r.length > 20 && r.length < 110) alle.push({thema, satz: r}); });
  if (!alle.length) return null;
  const tag = Math.floor(Date.now() / 86400000);
  return alle[tag % alle.length];
}

/* ---------- Empfehlung aus den eigenen Daten ---------- */
function empfehlung(){
  if (!benutzer || !fortschritt.length) return null;
  const mit = fortschritt.filter(z => (z.fehler || 0) > 0);
  if (!mit.length) return null;
  return mit.slice().sort((a,b) =>
    (b.fehler / Math.max(1,b.versuche)) - (a.fehler / Math.max(1,a.versuche)) || b.fehler - a.fehler)[0];
}

/* ---------- Überrasch mich ---------- */
function ueberraschMich(){
  const mitFehlern = fortschritt.filter(z => (z.fehler || 0) > 0 && AUFGABEN[z.thema]);
  if (mitFehlern.length && Math.random() < 0.6){
    starte(pick(mitFehlern).thema); return;
  }
  const alle = Object.keys(AUFGABEN);
  starte(pick(alle));
}

/* ---------- Fortschritt je Fach ---------- */
function fachFortschritt(){
  return Object.entries(KATALOG).map(([fk, f]) => {
    let moeglich = 0;
    for (const liste of Object.values(f.themen)) moeglich += liste.filter(t => AUFGABEN[t]).length;
    const zeilen = fortschritt.filter(z => z.fach === fk);
    const sicher = zeilen.filter(z => z.stufe >= 4).length;
    const begonnen = zeilen.length;
    return {schluessel: fk, name: f.name, moeglich, sicher, begonnen};
  });
}

/* ---------- Was ist wirklich fertig? ----------
   Wird aus dem Katalog und den vorhandenen Aufgaben ausgerechnet.
   Du musst hier also nichts von Hand nachpflegen: sobald du Aufgaben
   für eine Klasse ergänzt, ändert sich der Stand auf der Seite mit. */
function baustelleStand(){
  const faecher = Object.entries(KATALOG).map(([schluessel, f]) => {
    const klassen = [5,6,7,8,9,10].map(k => {
      const liste = f.themen[k] || [];
      const fertig = liste.filter(t => AUFGABEN[t]).length;
      const stand = fertig === 0 ? "geplant" : (fertig < liste.length ? "arbeit" : "fertig");
      return {klasse: k, fertig, gesamt: liste.length, stand};
    });
    const fertig = klassen.reduce((a,z) => a + z.fertig, 0);
    const gesamt = klassen.reduce((a,z) => a + z.gesamt, 0);
    return {schluessel, name: f.name, klassen, fertig, gesamt};
  });
  const fertig = faecher.reduce((a,f) => a + f.fertig, 0);
  const gesamt = faecher.reduce((a,f) => a + f.gesamt, 0);
  return {faecher, fertig, gesamt, prozent: gesamt ? Math.round(fertig / gesamt * 100) : 0};
}

  if (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1) return true;

/* ================================================================
   ERINNERUNGEN (Push)
   Der Wiederholungsplan kann nur wirken, wenn die App sich melden
   darf. Ohne eingetragenen Schlüssel bleibt der Bereich unsichtbar.
   Einrichtung: siehe ERINNERUNGEN.md
   ================================================================ */
const PUSH_KEY = "BOBZ2o0DUcvpV4Z9bUnJlGoiWMUpv2dZPDQ1bfR2RC3AMYWbJYnsph-oSKfxUZ0JPfNSuVlTeoR6Ld4OFbOMGDE";
let pushAn = false;
let pushHinweis = "";

function pushMoeglich(){
  return !!PUSH_KEY && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}
/* Apple erlaubt Mitteilungen nur, wenn die App auf dem Home-Bildschirm liegt */
function pushBrauchtInstallation(){ return istApple() && !istInstalliert(); }

function schluesselAlsBytes(k){
  const rand = "=".repeat((4 - k.length % 4) % 4);
  const roh = window.atob((k + rand).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...roh].map(c => c.charCodeAt(0)));
}
async function pushStandPruefen(){
  if (!pushMoeglich()) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    pushAn = !!(await reg.pushManager.getSubscription());
  } catch(e){ pushAn = false; }
}
async function pushEinschalten(){
  pushHinweis = "";
  if (pushBrauchtInstallation()){
    pushHinweis = "Auf dem iPhone gehen Mitteilungen erst, wenn die App auf dem Home-Bildschirm liegt.";
    return render();
  }
  try {
    const erlaubnis = await Notification.requestPermission();
    if (erlaubnis !== "granted"){
      pushHinweis = "Du hast Mitteilungen abgelehnt. Du kannst das in den Einstellungen deines Browsers ändern.";
      return render();
    }
    const reg = await navigator.serviceWorker.ready;
    const abo = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: schluesselAlsBytes(PUSH_KEY)
    });
    const daten = abo.toJSON();
    const {error} = await db.from("push_abos").upsert({
      endpunkt: daten.endpoint,
      p256dh: daten.keys.p256dh,
      auth: daten.keys.auth,
      benutzer_id: benutzer ? benutzer.id : null
    }, {onConflict: "endpunkt"});
    if (error){
      pushHinweis = "Das Speichern hat nicht geklappt: " + (error.message || "unbekannter Fehler");
      return render();
    }
    pushAn = true; render();
  } catch(e){
    pushHinweis = "Mitteilungen konnten nicht eingeschaltet werden: " + (e.message || e);
    render();
  }
}
async function pushAusschalten(){
  pushHinweis = "";
  try {
    const reg = await navigator.serviceWorker.ready;
    const abo = await reg.pushManager.getSubscription();
    if (abo){
      await db.from("push_abos").delete().eq("endpunkt", abo.endpoint);
      await abo.unsubscribe();
    }
    pushAn = false; render();
  } catch(e){ pushHinweis = "Ausschalten hat nicht geklappt."; render(); }
}
function erinnerungenHtml(){
  if (!pushMoeglich()) return "";
  return `

      ${pushHinweis ? `<div class="feedback nope">${pushHinweis}</div>` : ""}
      ${pushAn
        ? `<button class="btn ghost full" onclick="pushAusschalten()">Erinnerungen ausschalten</button>`

function setBundesland(v){ einstellungen.bundesland = v; speichereEinstellungen(); }
function ladeEinstellungen(){
  try {
    const roh = window.localStorage.getItem("ek-einstellungen");
    if (roh){
      const daten = JSON.parse(roh);
      Object.assign(einstellungen, daten);
      /* Alte Einstellung ("gross"/"normal") auf die neue Skala übertragen */
      if (daten.schriftSkala === undefined)
        einstellungen.schriftSkala = daten.schrift === "gross" ? 1.15 : 1;
    }
  } catch(e){ /* ohne Speicher geht es auch, nur nicht dauerhaft */ }
  einstellungen.schriftSkala = begrenzeSkala(einstellungen.schriftSkala);
}
function begrenzeSkala(v){
  v = parseFloat(v); if (isNaN(v)) v = 1;
  return Math.min(SCHRIFT_MAX, Math.max(SCHRIFT_MIN, v));
}
function speichereEinstellungen(){
  try { window.localStorage.setItem("ek-einstellungen", JSON.stringify(einstellungen)); }
  catch(e){ /* egal */ }
}

    dunkel = window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.classList.toggle("dunkel", dunkel);

}

/* Schriftgröße-Regler: live anwenden ohne render(), damit das Wischen flüssig bleibt.
   Die ganze Seite skaliert mit; wir gleichen das Scrollen aus, damit der Regler
   beim Ziehen an derselben Stelle unter dem Finger bleibt und nichts springt. */
function setSchriftSkala(v){
  const regler = document.querySelector(".schriftregler");
  const vorher = regler ? regler.getBoundingClientRect().top : null;
  einstellungen.schriftSkala = begrenzeSkala(v);
  document.documentElement.style.setProperty("--fs", einstellungen.schriftSkala);
  speichereEinstellungen();
  const anz = document.getElementById("schriftwert");
  if (anz) anz.textContent = Math.round(einstellungen.schriftSkala * 100) + " %";
  if (regler && vorher !== null){
    const diff = regler.getBoundingClientRect().top - vorher;
    if (diff) window.scrollBy(0, diff);
  }
}

function ladebalkenStart(){
  const b = document.getElementById("ladebalken");
  if (!b) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  clearTimeout(ladeT1); clearTimeout(ladeT2); clearTimeout(ladeT3); clearTimeout(ladeT4);
  const z = (min, max) => min + Math.random() * (max - min);   // Zufallswert
  b.style.transition = "none"; b.style.opacity = "1"; b.style.width = "0%";
  void b.offsetWidth;   // Neustart der Animation erzwingen
  /* Stufe 1: zügig auf einen zufälligen Anfangswert */
  b.style.transition = `width ${z(0.2, 0.35).toFixed(2)}s ease, opacity .35s ease`;
  b.style.width = z(30, 55).toFixed(0) + "%";
  /* Stufe 2: langsamer weiter — stockt zufällig bei ~80–92 % (wie echtes Laden) */
  const tMitte = Math.round(z(280, 620));
  const tVoll  = tMitte + Math.round(z(280, 700));
  const tWeg   = tVoll + Math.round(z(160, 320));
  const tReset = tWeg + 400;
  ladeT1 = setTimeout(() => {
    b.style.transition = `width ${z(0.35, 0.7).toFixed(2)}s ease`;
    b.style.width = z(80, 92).toFixed(0) + "%";
  }, tMitte);
  ladeT2 = setTimeout(() => { b.style.transition = "width .2s ease"; b.style.width = "100%"; }, tVoll);
  ladeT3 = setTimeout(() => { b.style.opacity = "0"; }, tWeg);
  ladeT4 = setTimeout(() => { b.style.transition = "none"; b.style.width = "0%"; }, tReset);
}

/* ---------- Hilfsfunktionen ---------- */
/* Mischt die Positionen 0..n-1 zufällig (Fisher-Yates).
   Wird einmal pro Schritt gezogen, damit sich die Reihenfolge
   beim erneuten Zeichnen nach einer falschen Antwort nicht ändert. */
function mischeReihenfolge(anzahl){
  const a = Array.from({length: anzahl}, (_, i) => i);
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function neueReihenfolge(){
  reihenfolge = mischeReihenfolge(aktuell.schritte[schrittNr].optionen.length);
}
function tageBis(z){ return Math.ceil((new Date(z).getTime() - Date.now()) / TAG); }
function wannText(z){
  const t = tageBis(z.naechste_wiederholung);
  if (z.stufe >= 4 && t > 20) return {text:"sitzt", stil:"sitzt"};
  if (t <= 0) return {text:"jetzt fällig", stil:""};
  if (t === 1) return {text:"morgen", stil:"spaeter"};
  if (t < 14) return {text:`in ${t} Tagen`, stil:"spaeter"};
  return {text:`in ${Math.round(t/7)} Wochen`, stil:"spaeter"};
}
function faellig(){ return fortschritt.filter(z => tageBis(z.naechste_wiederholung) <= 0).length; }

function zurKlassenwahl(){ ansicht = "klassenwahl"; render(); }
function zeigePlan(){ ansicht = ansicht === "plan" ? (klasse ? "start" : "uebersicht") : "plan"; render(); }

function starte(name, welche){
  aktuellName = name;
  const anzahl = anzahlAufgaben(name);
  if (welche === undefined){
    const alt = zeileZu(name);
    const basis = alt ? alt.versuche : (gastZaehler[name] || 0);
    welche = basis % anzahl;
  }
  variante = welche % anzahl;
  aktuell = baueAufgabe(name, variante);   // Zahlen werden hier frisch gewürfelt
  gastZaehler[name] = (gastZaehler[name] || 0) + 1;
  schrittNr = 0; beantwortet = false; hilfeStufe = 0; fehlversuche = 0;
  schrittZuruecksetzen();
  neueReihenfolge();
  ansicht = "loesen"; render();
}
function naechsteVariante(){ starte(aktuellName, variante + 1); }
let vorErklaerung = "start";
function zeigeErklaerung(thema){
  if (thema) aktuellName = thema;
  vorErklaerung = ansicht;
  ansicht = "erklaerung"; render();
}
function zurueckVonErklaerung(){ ansicht = vorErklaerung === "erklaerung" ? "start" : vorErklaerung; render(); }
let vorEinstellungen = "willkommen";
function zeigeEinstellungen(){
  if (ansicht !== "einstellungen") vorEinstellungen = ansicht;
  ansicht = "einstellungen"; render();
}

/* ---------- Passwort neu setzen (nach Reset-Mail) ---------- */
let resetHinweis = "";
function passwortNeuHtml(){
  return `
    <div class="card">
      <span class="tag">Passwort zurücksetzen</span>
      <h1>Neues Passwort festlegen</h1>
      <p class="soft">Du hast den Link aus der E-Mail geöffnet. Gib jetzt dein neues Passwort ein.</p>
    </div>
    <div class="card">
      <input class="feld" id="reset_pw" type="password" placeholder="Neues Passwort (mindestens 6 Zeichen)"
             autocomplete="new-password" onkeydown="if(event.key==='Enter')neuesPasswortSetzen()">
      ${resetHinweis ? `<div class="feedback ${resetHinweis.startsWith("✓") ? "ok" : "nope"}" style="margin-top:4px">${resetHinweis}</div>` : ""}
      <button class="btn full" style="margin-top:14px" onclick="neuesPasswortSetzen()">Passwort speichern</button>
    </div>`;
}
async function neuesPasswortSetzen(){
  const neu = document.getElementById("reset_pw").value;
  if (!neu || neu.length < 6){ resetHinweis = "Das Passwort muss mindestens 6 Zeichen haben."; return render(); }
  const {error} = await db.auth.updateUser({password: neu});
  if (error){ resetHinweis = "Das hat nicht geklappt: " + error.message; return render(); }
  resetHinweis = "";
  await pruefeAnmeldung();
}
function zurueckVonEinstellungen(){ ansicht = vorEinstellungen; render(); }
function nochmalGleichesThema(){ starte(aktuellName, variante); }

function antwort(i){
  if (beantwortet) return;
  if (falschGeklickt.includes(i)) return;          // dieselbe falsche Antwort nicht zweimal
  if (aktuell.schritte[schrittNr].optionen[i].ok){
    beantwortet = true;
    render(i);
    return;
  }
  falschGeklickt.push(i);
  fehlerImSchritt++;
  fehlversuche++;
  /* Der unterste neue Kasten muss ins Bild: die Begründung an der Antwort —
     oder, wenn der Tipp von allein aufgeht, dieser. */
  insBildHolen = "#screen .pickgrund, #screen .feedback";
  /* Stufe 1: Tipp erscheint von allein */
  if (fehlerImSchritt === 1 && einstellungen.autoTipp) hilfeStufe = Math.max(hilfeStufe, 1);
  /* Stufe 2: Erklärung zum Thema wird angeboten */
  if (fehlerImSchritt === 2) erklaerungAngeboten = true;
  /* Stufe 3: Lösung wird gezeigt, damit niemand hängen bleibt */
  if (fehlerImSchritt >= 3){ aufgeloest = true; beantwortet = true; }
  render(i);
}
/* ---------- Hilfe in Stufen ----------
   „Ich weiß nicht weiter“ bringt bei jedem Druck etwas Neues:
     Stufe 1  der erste Tipp zum Schritt   — worauf man schauen muss
     Stufe 2  der zweite Tipp zum Schritt  — wie man vorgeht
     Stufe 3  die Regeln zum Thema
     Stufe 4  die ganze Erklärung
   Die Lösung ist in keiner Stufe dabei — den letzten Schritt macht immer
   der Lernende selbst. */
function zweiterTipp(){
  const s = aktuell && aktuell.schritte[schrittNr];
  return s && s.tipp2 ? s.tipp2 : "";
}
function regelnZumThema(){
  const e = ERKLAERUNGEN[aktuellName];
  return e && e.regeln && e.regeln.length ? e.regeln : [];
}
function naechsteHilfe(){
  if (hilfeStufe === 0) return { text:"Ich weiß nicht weiter", art:"tipp" };
  if (hilfeStufe === 1 && zweiterTipp()) return { text:"Ich brauche noch einen Hinweis", art:"tipp2" };
  if (hilfeStufe <= 2 && regelnZumThema().length) return { text:"Zeig mir die Regeln zum Thema", art:"regeln" };
  if (hatErklaerung(aktuellName)) return { text:"Erklär mir das Thema von vorn", art:"erklaerung" };
  return { text:"Tipp noch einmal zeigen", art:"hin" };
}
function hilfeWeiter(){
  const naechste = naechsteHilfe();
  if (naechste.art === "tipp"){
    hilfeStufe = 1; insBildHolen = "#screen .feedback.tipp"; render(); return;
  }
  if (naechste.art === "tipp2"){
    hilfeStufe = 2; insBildHolen = "#screen .feedback.tipp2"; render(); return;
  }
  if (naechste.art === "regeln"){
    hilfeStufe = 3; insBildHolen = "#screen .feedback.regel"; render(); return;
  }
  if (naechste.art === "erklaerung"){ zeigeErklaerung(); return; }
  zumTippSpringen();
}
/* Es gibt nichts Neues mehr zu zeigen: dann wenigstens hinscrollen und kurz
   hervorheben, damit man sieht, wo der Tipp steht. */
function zumTippSpringen(){
  const el = document.querySelector("#screen .feedback.tipp");
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.remove("blinkt");
  void el.offsetWidth;             // Neustart der Animation erzwingen
  el.classList.add("blinkt");
}
function tippModus(){
  if (!aktuell) return false;
  const s = aktuell.schritte[schrittNr];
  if (!istEintippbar(s)) return false;
  if (einstellungen.eingabe === "auswahl") return false;
  if (einstellungen.eingabe === "tippen") return true;
  return schrittNr === aktuell.schritte.length - 1;   // gemischt: nur der letzte Schritt
}

function eingabePruefen(){
  const feld = document.getElementById("antwortFeld");
  if (!feld) return;
  const wert = feld.value.trim();
  if (!wert) return;
  const schritt = aktuell.schritte[schrittNr];
  const erwartet = schritt.tippAntwort || schritt.optionen.find(o => o.ok).t;
  if (eingabePasst(wert, erwartet)){
    beantwortet = true;
    letzteEingabe = wert;
    render();
    return;
  }
  letzteEingabe = wert;
  fehlerImSchritt++;
  fehlversuche++;
  insBildHolen = "#screen .feedback";   /* auch beim Eintippen darf die Erklärung nicht unten wegrutschen */
  if (fehlerImSchritt === 1 && einstellungen.autoTipp) hilfeStufe = Math.max(hilfeStufe, 1);
  if (fehlerImSchritt === 2) erklaerungAngeboten = true;
  if (fehlerImSchritt >= 3){ aufgeloest = true; beantwortet = true; }
  render();
}

function schrittZuruecksetzen(){
  falschGeklickt = []; fehlerImSchritt = 0; aufgeloest = false; erklaerungAngeboten = false; letzteEingabe = "";
}
async function weiter(){
  schrittNr++; beantwortet = false; hilfeStufe = 0;
  schrittZuruecksetzen();
  if (schrittNr < aktuell.schritte.length) neueReihenfolge();
  if (schrittNr >= aktuell.schritte.length){
    ansicht = "fertig"; render();
    await speichereErgebnis();
    render();
    return;
  }
  render();
}
function wechsleModus(){
  anmeldeModus = anmeldeModus === "anmelden" ? "registrieren" : "anmelden";
  hinweis = ""; render();
}

function registriere(){ anmeldeModus = "registrieren"; anmelden(); }

}
