<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endlich kapiert</title>
<meta name="description" content="Endlich kapiert: Du bekommst nie die Lösung, nur Fragen, die dich hinführen. Mathe und Deutsch, Klasse 5 bis 10.">
<meta name="theme-color" content="#10a37f">
<style>
  :root{
    --bg:#f4f8f7; --card:#ffffff; --ink:#16211e; --soft:#5b6b66; --line:#dfe8e5;
    --ac:#10a37f; --ac-soft:#e4f5ef; --ac-dark:#0b7a5f;
    --red:#b3382f; --red-soft:#fdecea;
    --amber:#8a5a09; --amber-soft:#fdf3e0;
  }
  html.dunkel{
    --bg:#131a18; --card:#1b2422; --ink:#e9f1ee; --soft:#9cb0a9; --line:#2c3a36;
    --ac:#2ebd95; --ac-soft:#17322a; --ac-dark:#6fdcbb;
    --red:#ff9b90; --red-soft:#3a2220;
    --amber:#e6bd6d; --amber-soft:#332a17;
  }
  html.grossschrift body{font-size:19.5px}
  html.grossschrift .frage{font-size:22px}
  html.grossschrift button.pick{font-size:18.5px}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}

  .shell{max-width:1140px;margin:0 auto;padding:0 20px 64px;display:grid;grid-template-columns:1fr;gap:0}

  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;
    letter-spacing:-.01em;padding:20px 2px 18px;line-height:1.25}
  .logo .dot{width:30px;height:30px;border-radius:9px;background:var(--ac);flex:none;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:800;letter-spacing:.02em}

  .side{align-self:start}
  .sidebox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .sidelabel{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--soft);margin:0 0 9px 2px}

  .fachliste{display:flex;gap:8px}
  .fachliste button{flex:1;border:1.5px solid var(--line);background:var(--card);font:inherit;
    font-size:16px;font-weight:600;color:var(--soft);padding:11px 8px;border-radius:11px;
    cursor:pointer;text-align:center}
  .fachliste button.an{border-color:var(--ac);background:var(--ac-soft);color:var(--ac-dark)}
  .fachliste button:hover:not(.an){border-color:var(--ac)}

  .klassenliste{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:14px}
  .klassenliste button{border:1.5px solid var(--line);background:var(--card);font:inherit;
    font-size:15.5px;font-weight:600;color:var(--soft);padding:10px 2px;border-radius:10px;cursor:pointer}
  .klassenliste button.an{border-color:var(--ac);background:var(--ac-soft);color:var(--ac-dark)}
  .klassenliste button:hover:not(.an){border-color:var(--ac)}

  .planbtn{display:block;width:100%;text-align:left;background:var(--card);
    border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;
    font-size:16px;font-weight:600;color:var(--ink);cursor:pointer}
  .planbtn:hover{border-color:var(--ac);background:var(--ac-soft)}
  .planbtn small{display:block;font-weight:400;font-size:13.5px;color:var(--soft)}

  main{min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:26px;margin-bottom:14px}
  h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 10px}
  h2{font-size:20px;margin:0 0 16px}
  p{margin:0 0 14px} p:last-child{margin-bottom:0}
  .soft{color:var(--soft)} .small{font-size:14.5px}

  .tag{display:inline-block;background:var(--ac-soft);color:var(--ac-dark);font-size:12.5px;
    font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;
    border-radius:999px;margin-bottom:12px}

  .kopf{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}

  /* Aufgabe: ganz ohne Kasten */
  .aufg{padding:14px 0 22px;border-bottom:1px solid var(--line);margin-bottom:24px}
  .aufg .zeile1{font-size:38px;font-weight:600;text-align:center;letter-spacing:-.01em;line-height:1.25}
  .aufg.text .zeile1{font-size:22px;font-weight:500;text-align:left;line-height:1.5;letter-spacing:0}
  .aufg .luecke{color:var(--ac);font-weight:700}

  .frage{font-size:19.5px;margin:0 0 18px;line-height:1.45}

  .optionen{display:grid;gap:10px}
  button.pick{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
    border-radius:13px;padding:15px 17px;font:inherit;font-size:16.5px;color:var(--ink);
    cursor:pointer;transition:border-color .12s,background .12s;line-height:1.4}
  button.pick:not(:disabled):not(.richtig):not(.falsch):hover{border-color:var(--ac);background:var(--ac-soft)}
  button.pick:disabled{cursor:default;opacity:.5}
  button.pick.richtig{border-color:var(--ac);background:var(--ac-soft);opacity:1}
  button.pick.falsch{border-color:var(--red);background:var(--red-soft);opacity:1}

  .btn{display:inline-block;background:var(--ac);color:#fff;border:none;border-radius:12px;
    padding:14px 24px;font:inherit;font-weight:600;font-size:16.5px;cursor:pointer}
  .btn:hover{background:var(--ac-dark)}
  .btn.ghost{background:none;color:var(--soft);border:1.5px solid var(--line);font-weight:500}
  .btn.ghost:hover{color:var(--ac-dark);border-color:var(--ac);background:none}
  .btn.full{display:block;width:100%;text-align:center}

  .fortschritt{display:flex;gap:5px;margin-bottom:18px}
  .fortschritt i{flex:1;height:5px;border-radius:3px;background:var(--line)}
  .fortschritt i.an{background:var(--ac)}

  .feedback{border-radius:12px;padding:15px 17px;margin:16px 0 0;font-size:16px}
  .feedback.ok{background:var(--ac-soft);color:var(--ac-dark)}
  .feedback.nope{background:var(--red-soft);color:var(--red)}
  .feedback.tipp{background:var(--amber-soft);color:var(--amber)}

  .themen{display:grid;gap:9px}
  .thema{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
    text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:13px;
    padding:14px 16px;font:inherit;font-size:16.5px;color:var(--ink);cursor:pointer}
  .thema:hover{border-color:var(--ac);background:var(--ac-soft)}
  .thema.aus{cursor:default;color:var(--soft);background:var(--bg);border-style:dashed}
  .thema.aus:hover{border-color:var(--line);background:var(--bg)}
  .pill{font-size:12px;font-weight:700;white-space:nowrap;padding:5px 11px;border-radius:999px;
    background:var(--ac-soft);color:var(--ac-dark)}
  .pill.bald{background:var(--bg);color:var(--soft);border:1px solid var(--line)}

  .zeile{display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:14px 0;border-bottom:1px solid var(--line)}
  .zeile:last-child{border-bottom:none}
  .zeile b{display:block;font-size:16.5px}
  .zeile span{font-size:13.5px;color:var(--soft)}
  .wann{font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--amber-soft);
    color:var(--amber);padding:6px 12px;border-radius:999px}
  .wann.spaeter{background:var(--bg);color:var(--soft);border:1px solid var(--line)}
  .wann.sitzt{background:var(--ac-soft);color:var(--ac-dark)}

  .schritte-log{margin:0 0 18px;padding:0;list-style:none}
  .schritte-log li{font-size:15px;color:var(--soft);padding:7px 0 7px 27px;position:relative}
  .schritte-log li::before{content:"✓";position:absolute;left:0;top:6px;color:var(--ac);font-weight:700}

  .zahlen{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
  .zahlen div{background:var(--bg);border-radius:13px;padding:16px 8px}
  .zahlen b{display:block;font-size:26px;line-height:1.1}
  .zahlen span{font-size:12.5px;color:var(--soft)}

  .demo{text-align:center;font-size:13px;color:var(--soft);padding:18px 10px 0;line-height:1.5}

  input.feld{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;
    font:inherit;font-size:16.5px;margin-bottom:10px;background:var(--card);color:var(--ink)}
  input.feld:focus{outline:none;border-color:var(--ac)}
  .userbox{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 15px;margin-bottom:12px;font-size:14.5px}
  .userbox b{display:block;font-size:15px;overflow-wrap:anywhere;margin-bottom:6px}
  .userbox button{background:none;border:none;padding:0;font:inherit;font-size:14px;
    color:var(--soft);text-decoration:underline;cursor:pointer}
  .userbox button:hover{color:var(--ac-dark)}
  .gast{background:var(--amber-soft);border-color:#f0dcae;color:var(--amber)}
  .gast b{color:var(--amber)}
  .laden{text-align:center;color:var(--soft);padding:40px 0}
  .zurueck{background:none;border:none;font:inherit;font-size:15px;color:var(--soft);
    cursor:pointer;padding:0;margin-bottom:14px;text-decoration:underline}
  .zurueck:hover{color:var(--ac-dark)}

  /* ---------- Startseite ---------- */
  .hero{padding:26px 0 10px}
  .hero h1{font-size:clamp(30px,5.4vw,46px);line-height:1.12;letter-spacing:-.025em;margin:0 0 18px}
  .hero .lede{font-size:19px;color:var(--soft);max-width:56ch;margin:0 0 26px}
  .knopfreihe{display:flex;gap:12px;flex-wrap:wrap}
  .abschnitt{margin-bottom:16px}
  .ueberschrift{font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ac-dark);font-weight:700;margin:0 0 10px}
  .liste{list-style:none;padding:0;margin:0}
  .liste li{padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--line);
    font-size:16.5px}
  .liste li:last-child{border-bottom:none}
  .liste li::before{content:"";position:absolute;left:6px;top:21px;width:8px;height:8px;
    border-radius:50%;background:var(--ac)}
  .schritte{list-style:none;padding:0;margin:0;counter-reset:st}
  .schritte li{counter-increment:st;position:relative;padding-left:52px;margin-bottom:24px}
  .schritte li:last-child{margin-bottom:0}
  .schritte li::before{content:counter(st);position:absolute;left:0;top:0;width:34px;height:34px;
    border-radius:50%;background:var(--ac-soft);color:var(--ac-dark);font-weight:800;font-size:15px;
    display:flex;align-items:center;justify-content:center}
  .schritte b{display:block;font-size:18px;margin-bottom:4px}
  .schritte span{color:var(--soft);font-size:16px}
  .gegen{display:grid;gap:12px}
  .gegen>div{border-radius:13px;padding:18px 20px}
  .gegen .andere{background:var(--bg);border:1px solid var(--line)}
  .gegen .wir{background:var(--ac-soft);border:1px solid var(--ac)}
  .gegen b{display:block;font-size:15px;margin-bottom:6px}
  .gegen .andere b{color:var(--soft)}
  .gegen .wir b{color:var(--ac-dark)}
  .probe{border:1px dashed var(--line);border-radius:14px;padding:20px;background:var(--bg)}
  .probe .auf{font-size:26px;font-weight:600;text-align:center;padding:6px 0 16px;
    border-bottom:1px solid var(--line);margin-bottom:16px}
  .probe .fr{font-size:17px;margin:0 0 12px}
  .probe .opt{background:var(--card);border:1.5px solid var(--line);border-radius:11px;
    padding:11px 14px;margin-bottom:8px;font-size:15.5px}
  .probe .opt.gut{border-color:var(--ac);background:var(--ac-soft);color:var(--ac-dark);font-weight:600}
  .fuss{text-align:center;color:var(--soft);font-size:14px;padding:26px 10px 0;line-height:1.6}

  /* ---------- geführte Auswahl ---------- */
  .wahlgitter{display:grid;gap:12px;margin-bottom:14px}
  .grosswahl{display:block;width:100%;text-align:left;background:var(--card);
    border:1.5px solid var(--line);border-radius:16px;padding:20px 22px;font:inherit;
    color:var(--ink);cursor:pointer;transition:border-color .12s,background .12s}
  .grosswahl:hover{border-color:var(--ac);background:var(--ac-soft)}
  .grosswahl b{display:block;font-size:21px;letter-spacing:-.01em;margin-bottom:3px}
  .grosswahl span{font-size:14.5px;color:var(--soft)}
  .pfad{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .pfad button{background:var(--ac-soft);border:none;border-radius:999px;padding:5px 13px;
    font:inherit;font-size:13.5px;font-weight:700;color:var(--ac-dark);cursor:pointer}
  .pfad button:hover{background:var(--ac);color:#fff}
  .pfad span{color:var(--soft);font-size:15px}
  .wechseln{background:none;border:none;padding:0;font:inherit;font-size:14px;
    color:var(--soft);text-decoration:underline;cursor:pointer}
  .wechseln:hover{color:var(--ac-dark)}
  .pill.neutral{background:var(--bg);color:var(--soft);border:1px solid var(--line)}

  /* ---------- Erklärung ---------- */
  .themazeile{display:flex;gap:8px;align-items:stretch}
  .themazeile .thema{flex:1;margin:0}
  .erklknopf{flex:none;width:46px;border:1.5px solid var(--line);background:var(--card);
    border-radius:13px;font:inherit;font-size:19px;font-weight:800;color:var(--soft);cursor:pointer}
  .erklknopf:hover{border-color:var(--ac);background:var(--ac-soft);color:var(--ac-dark)}
  ol.beispielschritte{margin:0 0 16px;padding-left:22px}
  ol.beispielschritte li{padding:5px 0;font-size:16px;color:var(--soft)}
  .ergebnis{background:var(--ac-soft);color:var(--ac-dark);border-radius:11px;
    padding:13px 16px;font-weight:700;font-size:17px;text-align:center}

  /* ---------- Erklärung und Einstellungen ---------- */
  .einfachtext{font-size:17px;line-height:1.7;margin:0 0 14px;max-width:62ch}
  .einfachtext:last-child{margin-bottom:0}
  .begriffe{display:grid;gap:0}
  .begriff{padding:12px 0;border-bottom:1px solid var(--line)}
  .begriff:last-child{border-bottom:none}
  .begriff b{display:block;font-size:16.5px;color:var(--ac-dark)}
  .begriff span{font-size:16px;color:var(--soft)}
  .feedback.hilfe{background:var(--amber-soft);color:var(--amber)}
  .optionen3{display:grid;gap:10px}
  .option{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
    border-radius:13px;padding:14px 16px;font:inherit;color:var(--ink);cursor:pointer}
  .option:hover{border-color:var(--ac)}
  .option.an{border-color:var(--ac);background:var(--ac-soft)}
  .option b{display:block;font-size:16.5px}
  .option span{font-size:14px;color:var(--soft)}
  .option.an b{color:var(--ac-dark)}

  /* ---------- Dashboard ---------- */
  .planbtn.admin{border-color:var(--ac);background:var(--ac-soft)}
  .planbtn.admin small{color:var(--ac-dark)}
  .balken{display:flex;gap:5px;align-items:flex-end;height:130px}
  .balkensaeule{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
  .balkensaeule .saeule{width:100%;background:var(--ac);border-radius:5px 5px 0 0;min-height:3px}
  .balkensaeule span{font-size:10px;color:var(--soft);margin-top:6px;white-space:nowrap}
  .rangzeile{display:flex;align-items:center;gap:10px;padding:7px 0}
  .rangname{flex:0 0 40%;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rangbalken{flex:1;background:var(--bg);border-radius:999px;height:10px;overflow:hidden}
  .rangbalken i{display:block;height:100%;background:var(--ac);border-radius:999px}
  .rangzahl{flex:0 0 42px;text-align:right;font-size:14px;color:var(--soft);font-variant-numeric:tabular-nums}
  .meldung{border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px}
  .meldung.erledigt{opacity:.55}
  .meldungkopf{display:flex;justify-content:space-between;gap:10px;font-size:14px}
  .meldungkopf b{color:var(--ac-dark)}
  .meldungkopf span{color:var(--soft)}
  .meldungtext{margin:8px 0;font-size:16px;white-space:pre-wrap}
  .meldungmail{display:block;font-size:14px;color:var(--ac-dark);margin-bottom:8px}
  textarea.feld{resize:vertical;font-family:inherit;line-height:1.5}
  select.feld{appearance:none;background-image:none}
  .fusslink{background:none;border:none;font:inherit;font-size:14px;color:var(--soft);
    text-decoration:underline;cursor:pointer;padding:6px 0}
  .fusslink:hover{color:var(--ac-dark)}

  /* ---------- breiter Bildschirm ---------- */
  @media(min-width:900px){
    .shell{grid-template-columns:262px 1fr;gap:32px;align-items:start}
    .side{position:sticky;top:20px}
    .logo{padding-top:24px}
    .fachliste{flex-direction:column}
    .optionen.breit{grid-template-columns:repeat(auto-fit,minmax(215px,1fr));align-items:stretch}
    .optionen.breit button.pick{height:100%}
    .card{padding:30px 32px}
    h1{font-size:32px}
    .aufg .zeile1{font-size:44px}
    .aufg.text .zeile1{font-size:24px;text-align:center}
    .themen{grid-template-columns:1fr 1fr}
    .themen{align-items:start}
    .shell.voll{grid-template-columns:1fr;max-width:880px}
    .gegen{grid-template-columns:1fr 1fr}
    .hero{padding:34px 0 14px}
    .wahlgitter{grid-template-columns:1fr 1fr}
    .wahlgitter.drei{grid-template-columns:1fr 1fr 1fr}
    .optionen3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  }
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside class="side">
    <div class="logo"><span class="dot">EK</span> <span>Endlich kapiert</span></div>
    <div id="seite"></div>
  </aside>
  <main>
    <div id="screen"></div>
    <p class="demo">Endlich kapiert · Mathe Klasse 5 bis 7 und Deutsch Klasse 5 bis 7 sind fertig — die übrigen Klassen kommen nach und nach.</p>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------- Themenkatalog ---------- */
const KATALOG = {
  mathe: {
    name:"Mathe",
    themen:{
      5:["Natürliche Zahlen","Grundrechenarten","Größen und Einheiten","Flächen und Umfang","Symmetrie"],
      6:["Brüche","Dezimalzahlen","Teilbarkeit","Dreisatz","Winkel messen"],
      7:["Gleichungen umstellen","Prozent und Zinsen","Zuordnungen","Dreiecke","Wahrscheinlichkeit"],
      8:["Terme umformen","Binomische Formeln","Lineare Funktionen","Kreis","Gleichungssysteme"],
      9:["Quadratische Gleichungen","Satz des Pythagoras","Potenzen und Wurzeln","Körper berechnen","Strahlensätze"],
      10:["Quadratische Funktionen","Trigonometrie","Exponentielles Wachstum","Kugel und Kegel","Statistik"]
    }
  },
  deutsch: {
    name:"Deutsch",
    themen:{
      5:["Wortarten erkennen","Satzglieder bestimmen","Groß- und Kleinschreibung","Wörtliche Rede","Erzählen"],
      6:["das oder dass","Zeitformen","Kommas bei Aufzählungen","Berichten","Adjektive steigern"],
      7:["Nominalisierung","Kommas bei Nebensätzen","Aktiv und Passiv","Inhaltsangabe","Argumentieren"],
      8:["Konjunktiv","Satzreihe und Satzgefüge","Kommas bei Infinitivgruppen","Erörterung","Sachtexte auswerten"],
      9:["Stilmittel erkennen","Gedichte deuten","Bewerbung schreiben","Textgebundene Erörterung","Fremdwörter"],
      10:["Literaturepochen","Interpretation","Sprachwandel","Rede und Rhetorik","Facharbeit"]
    }
  }
};

/* ---------- Werkzeuge für die Aufgabenerzeugung ---------- */
const rnd  = (a,b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
/* deutsche Zahlschreibweise: 3.847 und 12,5 */
const z = n => Number(n).toLocaleString("de-DE", {maximumFractionDigits: 4});
/* Euro mit zwei Nachkommastellen */
const eur = n => Number(n).toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";
/* zieht `anzahl` verschiedene Elemente aus einer Liste */
function zieheVerschiedene(liste, anzahl){
  const kopie = liste.slice(), raus = [];
  while (raus.length < anzahl && kopie.length) raus.push(kopie.splice(rnd(0, kopie.length-1), 1)[0]);
  return raus;
}
function ggt(a,b){ return b ? ggt(b, a % b) : a; }
function kgv(a,b){ return a * b / ggt(a,b); }
/* Option-Kurzschreibweise */
const R = (t, fb) => ({t, ok:1, fb});
const F = (t, fb) => ({t, ok:0, fb});

/* ---------- Aufgabenerzeuger ---------- */
const AUFGABEN = {

/* ===================== MATHE · KLASSE 5 ===================== */

"Natürliche Zahlen":[

 /* Runden auf Hunderter */
 () => {
   let n, t, h, e;
   do { n = rnd(1000, 9999); t = Math.floor(n/1000); h = Math.floor(n/100)%10; e = Math.floor(n/10)%10; }
   while (new Set([t,h,e]).size < 3);
   const auf = e >= 5;
   const erg = Math.round(n/100) * 100;
   const gegen = auf ? erg - 100 : erg + 100;
   return {
    typ:"formel", text:`Runde ${z(n)} auf Hunderter`, loesung: z(erg),
    schluss:"Beim Runden zählt immer nur die eine Ziffer rechts neben der Rundungsstelle.",
    schritte:[
     {frage:`Welche Ziffer steht bei <b>${z(n)}</b> an der <b>Hunderterstelle</b>?`,
      tipp:"Von rechts: Einer, Zehner, Hunderter.",
      optionen:[R(`Die ${h}`, "Richtig. Das ist die Stelle, auf die gerundet wird."),
                F(`Die ${e}`, "Die steht an der Zehnerstelle."),
                F(`Die ${t}`, "Die steht an der Tausenderstelle.")]},
     {frage:"Welche Ziffer <b>entscheidet</b>, ob auf- oder abgerundet wird?",
      tipp:"Immer die Ziffer direkt rechts neben der Rundungsstelle.",
      optionen:[R(`Die ${e} rechts daneben`, "Genau. Nur diese eine Ziffer entscheidet."),
                F(`Die ${n%10} ganz rechts`, "Die steht zu weit weg, sie spielt keine Rolle."),
                F("Alle Ziffern zusammen", "Nein — nur die eine direkt rechts daneben.")]},
     {frage:`Die entscheidende Ziffer ist eine <b>${e}</b>. Was heißt das?`,
      tipp:"0 bis 4 heißt abrunden, 5 bis 9 heißt aufrunden.",
      optionen: auf
        ? [R("Aufrunden", `${e} ist 5 oder größer — also aufrunden.`),
           F("Abrunden", `Abgerundet wird nur bis 4. Die ${e} liegt darüber.`)]
        : [R("Abrunden", `${e} liegt unter 5 — also abrunden.`),
           F("Aufrunden", "Aufgerundet wird erst ab 5.")]},
     {frage:"Wie heißt das Ergebnis?",
      tipp:"Die Hunderterziffer bleibt oder wächst um eins, dahinter stehen zwei Nullen.",
      optionen:[R(z(erg), "Richtig."),
                F(z(gegen), auf ? "Das wäre abgerundet." : "Das wäre aufgerundet."),
                F(z(Math.floor(n/10)*10), "Beim Runden auf Hunderter müssen hinten zwei Nullen stehen.")]}]};
 },

 /* Stellenwert einer Ziffer */
 () => {
   const stellen = [
     {name:"Einer", wert:1, pos:0}, {name:"Zehner", wert:10, pos:1},
     {name:"Hunderter", wert:100, pos:2}, {name:"Tausender", wert:1000, pos:3}
   ];
   const st = pick(stellen.slice(1));
   let n, ziffer;
   do { n = rnd(10000, 99999); ziffer = Math.floor(n / st.wert) % 10; } while (ziffer === 0);
   const erg = ziffer * st.wert;
   const andere = pick(stellen.filter(x => x.name !== st.name));
   return {
    typ:"text", text:`Welchen <b>Wert</b> hat die Ziffer <b>${ziffer}</b> in der Zahl ${z(n)}?`,
    loesung: z(erg),
    schluss:"Der Wert einer Ziffer hängt davon ab, an welcher Stelle sie steht — nicht davon, wie groß die Ziffer selbst ist.",
    schritte:[
     {frage:`An welcher Stelle steht die <b>${ziffer}</b> in ${z(n)}?`,
      tipp:"Zähl von rechts: Einer, Zehner, Hunderter, Tausender, Zehntausender.",
      optionen: zieheVerschiedene([R(st.name, "Richtig."), F(andere.name, `Nein, das ist die Stelle mit dem Wert ${z(andere.wert)}.`)], 2)},
     {frage:`Wie viel ist <b>ein einzelner ${st.name}</b> wert?`,
      tipp:"Einer = 1, Zehner = 10, Hunderter = 100, Tausender = 1000.",
      optionen:[R(z(st.wert), "Genau."),
                F(z(st.wert*10), "Das ist die nächsthöhere Stelle."),
                F(z(st.wert/10), "Das ist die nächstniedrigere Stelle.")]},
     {frage:`Du hast <b>${ziffer}</b> davon. Welche Rechnung ergibt den Wert?`,
      tipp:"Anzahl mal Stellenwert.",
      optionen:[R(`${ziffer} · ${z(st.wert)}`, "Richtig."),
                F(`${ziffer} + ${z(st.wert)}`, "Addieren passt hier nicht."),
                F(`${z(st.wert)} : ${ziffer}`, "Geteilt würde den Wert verkleinern.")]},
     {frage:`Und das ergibt?`,
      tipp:`${ziffer} mal ${z(st.wert)}.`,
      optionen:[R(z(erg), "Fertig."),
                F(z(ziffer), "Das ist nur die Ziffer selbst, ohne ihren Stellenwert."),
                F(z(erg*10), "Eine Stelle zu weit.")]}]};
 }
],

"Grundrechenarten":[

 /* Punkt vor Strich */
 () => {
   const a = rnd(5, 30), b = rnd(2, 9), c = rnd(2, 9);
   const erg = a + b*c, falsch = (a + b) * c;
   return {
    typ:"formel", text:`${a} + ${b} · ${c}`, loesung: z(erg),
    schluss:"Punkt vor Strich — Mal und Geteilt kommen immer vor Plus und Minus.",
    schritte:[
     {frage:"Welche Rechnung machst du <b>zuerst</b>?",
      tipp:"Es gibt eine feste Reihenfolge, egal wie die Aufgabe dasteht.",
      optionen:[R(`${b} · ${c}`, "Richtig — Punkt vor Strich."),
                F(`${a} + ${b}`, `Das wäre von links nach rechts. Dann käme ${z(falsch)} heraus, und das ist falsch.`)]},
     {frage:`Was ergibt <b>${b} · ${c}</b>?`,
      tipp:`${b} mal die ${c}.`,
      optionen:[R(z(b*c), "Ja."),
                F(z(b+c), "Das wäre plus statt mal."),
                F(z(b*c + 1), "Rechne das kleine Einmaleins noch mal nach.")]},
     {frage:`Jetzt steht da <b>${a} + ${z(b*c)}</b>. Wie viel ist das?`,
      tipp:"Ganz normal zusammenzählen.",
      optionen:(() => {
        const kand = [a*b*c, erg-2, erg+2, erg-1].filter((x,i,arr) => x !== erg && arr.indexOf(x) === i);
        return [R(z(erg), "Genau."),
                F(z(kand[0]), kand[0] === a*b*c ? "Hier wird zum Schluss addiert, nicht multipliziert."
                                                : `Rechne noch mal nach: ${a} + ${z(b*c)}.`),
                F(z(kand[1]), `Rechne noch mal nach: ${a} + ${z(b*c)}.`)];
      })()}]};
 },

 /* Klammer, dann Punkt, dann Strich */
 () => {
   let a, b;
   do { a = rnd(2, 12); b = rnd(2, 12); } while (a + b === a * b);
   const c = rnd(2, 8), d = rnd(2, 20);
   const erg = (a + b) * c - d;
   return {
    typ:"formel", text:`(${a} + ${b}) · ${c} − ${d}`, loesung: z(erg),
    schluss:"Erst Klammer, dann Punkt, dann Strich. In dieser Reihenfolge, immer.",
    schritte:[
     {frage:"Womit fängst du an?",
      tipp:"Eine Sache hat immer Vorrang, sogar vor dem Malzeichen.",
      optionen:[R("Mit der Klammer", "Richtig. Klammer schlägt alles."),
                F(`Mit ${b} · ${c}`, `Die ${b} steht in der Klammer und gehört zur ${a}.`),
                F(`Mit ${c} − ${d}`, "Minus kommt zuletzt.")]},
     {frage:"Was kommt in der Klammer heraus?",
      tipp:`${a} plus ${b}.`,
      optionen:[R(z(a+b), `Ja. Jetzt heißt die Aufgabe ${z(a+b)} · ${c} − ${d}.`),
                F(z(a*b), "Das wäre mal statt plus.")]},
     {frage:`Jetzt <b>${z(a+b)} · ${c} − ${d}</b>. Was kommt zuerst?`,
      tipp:"Punkt vor Strich.",
      optionen:[R(`${z(a+b)} · ${c} = ${z((a+b)*c)}`, "Genau."),
                F(`${c} − ${d} = ${z(c-d)}`, "Mal geht vor Minus.")]},
     {frage:`Letzter Schritt: <b>${z((a+b)*c)} − ${d}</b>`,
      tipp:"Einfach abziehen.",
      optionen:[R(z(erg), "Fertig."),
                F(z((a+b)*c + d), "Da wurde addiert statt abgezogen.")]}]};
 }
],

 () => {

"Brüche":[

 /* Brüche addieren */
 () => {
   const nenner = [2,3,4,6,8,12];
   let b, d, a, c, summe;
   do {
     [b, d] = zieheVerschiedene(nenner, 2);
     a = rnd(1, b-1); c = rnd(1, d-1);
     summe = a/b + c/d;
   } while (summe >= 1 || kgv(b,d) === Math.max(b,d));
   const n = kgv(b, d), fb = n/b, fd = n/d;
   const zaehler = a*fb + c*fd;
   return {
    typ:"formel", text:`${a}/${b} + ${c}/${d}`, loesung:`${zaehler}/${n}`,
    schluss:"Brüche addieren ist immer derselbe Ablauf: gleicher Nenner, dann Zähler addieren.",
    schritte:[
     {frage:`Warum kannst du hier nicht einfach ${a} + ${c} rechnen?`,
      tipp:"Schau auf die Zahlen unter dem Strich.",
      optionen:[R("Weil die Nenner verschieden sind", "Genau. Die Stücke sind unterschiedlich groß."),
                F("Weil die Zähler verschieden sind", "Die oberen Zahlen dürfen ruhig verschieden sein."),
                F("Weil man Brüche nie addieren kann", "Doch — man muss sie nur erst passend machen.")]},
     {frage:`Du brauchst einen gemeinsamen Nenner für ${b} und ${d}. Welcher ist der <b>kleinste</b>?`,
      tipp:`Such die kleinste Zahl, in der ${b} und ${d} ohne Rest aufgehen.`,
      optionen: zieheVerschiedene([
        R(String(n), `Richtig — ${b} · ${fb} = ${n} und ${d} · ${fd} = ${n}.`),
        F(String(b*d === n ? n + b : b*d), "Das ist zwar ein gemeinsamer Nenner, aber nicht der kleinste."),
        F(String(b + d), "Einfach addieren ergibt keinen gemeinsamen Nenner.")], 3)},
     {frage:`Was wird aus <b>${a}/${b}</b> mit dem Nenner ${n}?`,
      tipp:`Der Nenner wird mal ${fb} genommen. Mit dem Zähler machst du dasselbe.`,
      optionen:[R(`${a*fb}/${n}`, `Ja — oben und unten mal ${fb}.`),
                F(`${a}/${n}`, "Du hast nur unten erweitert. Oben muss dasselbe passieren."),
                F(`${n}/${n}`, "Das wäre genau 1.")]},
     {frage:`Und <b>${c}/${d}</b> mit dem Nenner ${n}? Dann kannst du addieren.`,
      tipp:`Der Nenner wird mal ${fd} genommen — der Zähler auch.`,
      optionen:(() => {
        const richtigZ = c*fd;
        const kand = [c, fd, richtigZ+1, richtigZ-1].filter((x,i,arr) => x > 0 && x !== richtigZ && arr.indexOf(x) === i);
        return [R(`${richtigZ}/${n} — zusammen also ${zaehler}/${n}`, "Genau. Gleiche Nenner, dann Zähler addieren."),
                F(`${kand[0]}/${n} — zusammen also ${a*fb + kand[0]}/${n}`, `Der Zähler muss auch mal ${fd} genommen werden.`),
                F(`${kand[1]}/${n} — zusammen also ${a*fb + kand[1]}/${n}`, "Nicht ganz — rechne die Erweiterung noch einmal nach.")];
      })()}]};
 },

 /* Bruchteil von einer Zahl */
 () => {
   const b = pick([3,4,5,6,8]);
   const a = rnd(1, b-1);
   const teil = rnd(2, 12);
   const N = b * teil;
   const erg = a * teil;
   return {
    typ:"text", text:`Wie viel sind <b>${a}/${b} von ${z(N)}</b>?`, loesung: z(erg),
    schluss:"„von“ heißt beim Rechnen immer: mal. Am einfachsten gehst du über einen einzelnen Teil.",
    schritte:[
     {frage:"Was bedeutet das Wort <b>von</b> in dieser Aufgabe?",
      tipp:"Es ist eine Rechenanweisung.",
      optionen:[R("Mal", `Richtig: ${a}/${b} · ${z(N)}.`),
                F("Minus", "Nein, abgezogen wird hier nichts."),
                F("Plus", "Addiert wird hier auch nichts.")]},
     {frage:`Rechne zuerst <b>ein ${b}tel</b> von ${z(N)}. Wie kommst du da hin?`,
      tipp:"Der Nenner sagt dir, in wie viele gleiche Teile du zerlegst.",
      optionen:[R(`${z(N)} : ${b}`, "Genau — durch den Nenner teilen."),
                F(`${z(N)} · ${b}`, "Dann würde es größer statt kleiner."),
                F(`${z(N)} : ${a}`, `Die ${a} ist der Zähler, nicht der Nenner.`)]},
     {frage:`<b>${z(N)} : ${b}</b> ergibt?`,
      tipp:"Kleines Einmaleins rückwärts.",
      optionen:[R(z(teil), `Ja, ein ${b}tel von ${z(N)} sind ${z(teil)}.`),
                F(z(teil + 1), "Rechne noch mal nach."),
                F(z(N - b), "Hier wird geteilt, nicht abgezogen.")]},
     {frage:`Du brauchst aber <b>${a}</b> davon. Letzter Schritt?`,
      tipp:"Der Zähler sagt, wie viele dieser Teile du nimmst.",
      optionen:[R(`${z(teil)} · ${a} = ${z(erg)}`, "Fertig."),
                F(`${z(teil)} : ${a} = ${z(teil/a)}`, `${a} Teile sind mehr als einer, nicht weniger.`)]}]};
 }
],

"Dezimalzahlen":[

 /* Addition mit unterschiedlich vielen Nachkommastellen */
 () => {
   const a = rnd(1, 9) / 10;                 // z. B. 0,7
   const b = rnd(11, 89) / 100;              // z. B. 0,25
   const erg = Math.round((a + b) * 100) / 100;
   const fehlerhaft = Number(String(rnd(1,9)) + String(rnd(10,99))) / 100;
   return {
    typ:"formel", text:`${z(a)} + ${z(b)}`, loesung: z(erg),
    schluss:"Bei Dezimalzahlen zählt die Stelle, nicht die Ziffernanzahl — Komma unter Komma.",
    schritte:[
     {frage:`Warum darfst du die Ziffern nicht einfach von rechts untereinanderschreiben?`,
      tipp:`Was bedeutet die ${Math.round(a*10)} bei ${z(a)} — Zehntel oder Hundertstel?`,
      optionen:[R("Weil sonst Zehntel und Hundertstel zusammengezählt würden", "Genau. Man darf nur Gleiches mit Gleichem zusammenzählen."),
                F("Weil man Kommazahlen nicht addieren darf", "Doch, man darf — nur stellenrichtig."),
                F("Weil eine Zahl größer ist als die andere", "Damit hat es nichts zu tun.")]},
     {frage:`Wie schreibst du <b>${z(a)}</b>, damit beide gleich viele Nachkommastellen haben?`,
      tipp:"Eine Null hinten ändert den Wert nicht.",
      optionen:[R(z(a).padEnd(4, "0"), `Richtig, ${Math.round(a*10)} Zehntel sind ${Math.round(a*100)} Hundertstel.`),
                F("0,0" + Math.round(a*10), "Das wäre zehnmal kleiner."),
                F(Math.round(a*10) + ",0", "Das wäre zehnmal größer.")]},
     {frage:`Jetzt <b>${z(a).padEnd(4,"0")} + ${z(b)}</b>. Was kommt heraus?`,
      tipp:`${Math.round(a*100)} Hundertstel plus ${Math.round(b*100)} Hundertstel.`,
      optionen: zieheVerschiedene([
        R(z(erg), "Genau."),
        F(z(fehlerhaft), "Das entsteht, wenn man die Stellen falsch untereinanderschreibt."),
        F(z(Math.round((a + b) * 100) / 100 + 0.1), "Knapp daneben — rechne noch mal nach.")], 3)}]};
 },

 /* Multiplikation mit Stufenzahlen */
 () => {
   const grund = rnd(11, 989) / 10;                       // z. B. 3,6
   const faktor = pick([10, 100, 1000]);
   const erg = Math.round(grund * faktor * 100) / 100;
   const stellen = String(faktor).length - 1;
   return {
    typ:"formel", text:`${z(grund)} · ${z(faktor)}`, loesung: z(erg),
    schluss:"Mal 10 heißt: Komma eine Stelle nach rechts. Bei 100 zwei Stellen, bei 1000 drei.",
    schritte:[
     {frage:`Was passiert mit dem <b>Komma</b>, wenn du mal ${z(faktor)} rechnest?`,
      tipp:"Die Zahl wird größer.",
      optionen:[R(`Es wandert ${stellen} ${stellen === 1 ? "Stelle" : "Stellen"} nach rechts`, "Genau, dadurch wird die Zahl größer."),
                F(`Es wandert ${stellen} ${stellen === 1 ? "Stelle" : "Stellen"} nach links`, "Nach links würde die Zahl kleiner — das wäre geteilt."),
                F("Es bleibt, wo es ist", "Dann würde sich die Zahl nicht ändern.")]},
     {frage:`Verschieb es bei <b>${z(grund)}</b> entsprechend.`,
      tipp:`Aus ${z(grund)} wird ${z(erg)}.`,
      optionen:[R(z(erg), "Richtig."),
                F(z(Math.round(grund / faktor * 10000) / 10000), "Das wäre nach links, also geteilt."),
                F(z(Math.round(grund * faktor * 10) / 10 * 10), "Eine Stelle zu weit.")]},
     {frage:`Kontrolle: Ist <b>${z(erg)}</b> ungefähr ${z(faktor)}-mal so groß wie ${z(grund)}?`,
      tipp:`${z(grund)} ist ungefähr ${Math.round(grund)} — mal ${z(faktor)} sind das etwa ${z(Math.round(grund)*faktor)}.`,
      optionen:[R("Ja, das passt", "Diese Abschätzung solltest du dir angewöhnen — sie fängt fast alle Kommafehler ab."),
                F("Nein", `Doch: ${z(grund)} · ${z(faktor)} liegt in der Nähe von ${z(Math.round(grund)*faktor)}.`)]}]};
 }
],

"Teilbarkeit":[

 /* Teilbarkeit durch 3 */
 () => {
   const teilbar = Math.random() < 0.5;
   let n;
   do { n = rnd(100, 999); } while ((n % 3 === 0) !== teilbar);
   const q = String(n).split("").reduce((s,x) => s + Number(x), 0);
   return {
    typ:"text", text:`Ist <b>${z(n)}</b> ohne Rest durch <b>3</b> teilbar?`,
    loesung: teilbar ? "Ja" : "Nein",
    schluss:"Für die 3 gibt es eine Abkürzung: die Quersumme. Damit sparst du dir das Ausrechnen.",
    schritte:[
     {frage:"Es gibt eine Regel für die 3. Welche?",
      tipp:"Man addiert etwas an der Zahl.",
      optionen:[R("Die Quersumme muss durch 3 teilbar sein", "Genau — alle Ziffern zusammenzählen."),
                F("Die letzte Ziffer muss durch 3 teilbar sein", "Das gilt bei 2, 5 und 10 — bei der 3 nicht."),
                F("Die Zahl muss gerade sein", "Das ist die Regel für die 2.")]},
     {frage:`Wie groß ist die <b>Quersumme von ${z(n)}</b>?`,
      tipp: String(n).split("").join(" + "),
      optionen: zieheVerschiedene([
        R(String(q), "Richtig."),
        F(String(q + 1), `Rechne noch mal: ${String(n).split("").join(" + ")}.`),
        F(String(n), "Die Quersumme ist die Summe der einzelnen Ziffern, nicht die Zahl selbst.")], 3)},
     {frage:`Ist <b>${q}</b> durch 3 teilbar?`,
      tipp:"3, 6, 9, 12, 15, 18, 21 …",
      optionen: q % 3 === 0
        ? [R("Ja", `Ja — 3 · ${q/3} = ${q}.`), F("Nein", `Doch, ${q} : 3 = ${q/3} geht glatt auf.`)]
        : [R("Nein", `Richtig, ${q} liegt zwischen ${Math.floor(q/3)*3} und ${Math.ceil(q/3)*3}.`),
           F("Ja", `Nein, ${q} : 3 geht nicht ohne Rest auf.`)]},
     {frage:`Also ist ${z(n)} …`,
      tipp:"Quersumme teilbar heißt Zahl teilbar.",
      optionen: teilbar
        ? [R("durch 3 teilbar", `Richtig. ${z(n)} : 3 = ${z(n/3)}.`), F("nicht durch 3 teilbar", "Die Quersumme sagt eindeutig ja.")]
        : [R("nicht durch 3 teilbar", "Richtig."), F("durch 3 teilbar", "Die Quersumme geht nicht auf, also die Zahl auch nicht.")]}]};
 },

 /* Teilbarkeit durch 4 */
 () => {
   const teilbar = Math.random() < 0.5;
   let n;
   do { n = rnd(1000, 9999); } while ((n % 4 === 0) !== teilbar);
   const letzte = n % 100;
   const letzteText = String(letzte).padStart(2, "0");
   return {
    typ:"text", text:`Ist <b>${z(n)}</b> ohne Rest durch <b>4</b> teilbar?`,
    loesung: teilbar ? "Ja" : "Nein",
    schluss:"Bei der 4 musst du nie die ganze Zahl anschauen — die letzten beiden Ziffern genügen.",
    schritte:[
     {frage:"Welche Regel gilt für die <b>4</b>?",
      tipp:"Es reicht ein kleiner Teil der Zahl.",
      optionen:[R("Die letzten beiden Ziffern müssen durch 4 teilbar sein", "Genau, alles davor ist immer durch 4 teilbar."),
                F("Die Quersumme muss durch 4 teilbar sein", "Die Quersumme hilft bei 3 und 9, nicht bei 4."),
                F("Die letzte Ziffer muss gerade sein", "Das ist nur die Regel für 2.")]},
     {frage:`Welche Zahl bilden die <b>letzten beiden Ziffern</b> von ${z(n)}?`,
      tipp:"Die beiden ganz rechts.",
      optionen: zieheVerschiedene([
        R(letzteText, "Richtig."),
        F(String(Math.floor(n/100)), "Das sind die ersten beiden."),
        F(String(n % 10), "Es sind zwei Ziffern, nicht eine.")], 3)},
     {frage:`Ist <b>${letzteText}</b> durch 4 teilbar?`,
      tipp:"4, 8, 12, 16, 20, 24 …",
      optionen: letzte % 4 === 0
        ? [R("Ja", `Ja — 4 · ${letzte/4} = ${letzte}.`), F("Nein", `Doch: ${letzte} : 4 = ${letzte/4}.`)]
        : [R(`Nein, es bleibt ein Rest von ${letzte % 4}`, `Genau — ${letzte} liegt zwischen ${Math.floor(letzte/4)*4} und ${Math.ceil(letzte/4)*4}.`),
           F("Ja", `${letzte} : 4 geht nicht glatt auf.`)]},
     {frage:`Also ist ${z(n)} …`,
      tipp:"Letzte zwei Ziffern teilbar heißt Zahl teilbar.",
      optionen: teilbar
        ? [R("durch 4 teilbar", `Richtig. ${z(n)} : 4 = ${z(n/4)}.`), F("nicht durch 4 teilbar", "Die letzten beiden Ziffern gehen auf.")]
        : [R("nicht durch 4 teilbar", "Richtig."), F("durch 4 teilbar", "Der Rest überträgt sich auf die ganze Zahl.")]}]};
 }
],

"Dreisatz":[

 /* Preis über den Einzelwert */
 () => {
   const ware = pick([
     {ein:"Heft", mehr:"Hefte"}, {ein:"Brötchen", mehr:"Brötchen"},
     {ein:"Stift", mehr:"Stifte"}, {ein:"Apfel", mehr:"Äpfel"}
   ]);
   const stueck = pick([0.25, 0.35, 0.5, 0.75, 1.2, 1.5, 2.5]);
   const k = rnd(3, 6), m = rnd(7, 12);
   const preisK = Math.round(stueck * k * 100) / 100;
   const erg = Math.round(stueck * m * 100) / 100;
   return {
    typ:"text",
    text:`${k} ${ware.mehr} kosten ${eur(preisK)}. Was kosten <b>${m} ${ware.mehr}</b>?`,
    loesung: eur(erg),
    schluss:"Der Dreisatz geht immer über den Einzelwert: erst herunter auf eins, dann hoch auf die gesuchte Anzahl.",
    schritte:[
     {frage:"Was ist der übliche <b>erste Schritt</b> beim Dreisatz?",
      tipp:"Eine bestimmte Menge ist besonders praktisch.",
      optionen:[R(`Ausrechnen, was ein einzelnes ${ware.ein} kostet`, "Genau — über den Einzelwert geht es immer."),
                F(`Sofort mal ${m} rechnen`, `Dann hättest du den Preis für ${k*m} ${ware.mehr}.`),
                F(`${eur(preisK)} und ${m} addieren`, "Preise und Stückzahlen kann man nicht addieren.")]},
     {frage:`Wie kommst du auf den Preis für <b>ein</b> ${ware.ein}?`,
      tipp:`Aus ${k} ${ware.mehr} wird 1 ${ware.ein}.`,
      optionen:[R(`${eur(preisK)} : ${k}`, "Richtig."),
                F(`${eur(preisK)} · ${k}`, `Ein ${ware.ein} ist billiger als ${k}, nicht teurer.`)]},
     {frage:`<b>${eur(preisK)} : ${k}</b> ergibt?`,
      tipp:`${Math.round(preisK*100)} Cent durch ${k}.`,
      optionen: zieheVerschiedene([
        R(eur(stueck), "Genau."),
        F(eur(Math.round(stueck*100 + 10)/100), "Rechne noch mal in Cent nach."),
        F(eur(Math.round(preisK*k*100)/100), "Das wäre mal statt geteilt.")], 3)},
     {frage:`Letzter Schritt: ${m} ${ware.mehr} zu je ${eur(stueck)}`,
      tipp:"Jetzt wird multipliziert.",
      optionen: zieheVerschiedene([
        R(eur(erg), "Fertig."),
        F(eur(Math.round(stueck*(m-1)*100)/100), `Das wären ${m-1} ${ware.mehr}.`),
        F(eur(Math.round(stueck*(m+2)*100)/100), `Das wären ${m+2} ${ware.mehr}.`)], 3)}]};
 },

 /* Mengen umrechnen */
 () => {
   const proStueck = rnd(2, 9);
   const k = rnd(3, 8), m = rnd(9, 15);
   const gesamtK = proStueck * k, erg = proStueck * m;
   const sache = pick([
     {ding:"Packungen", inhalt:"Kekse"}, {ding:"Kisten", inhalt:"Flaschen"},
     {ding:"Beutel", inhalt:"Murmeln"}, {ding:"Tüten", inhalt:"Bonbons"}
   ]);
   return {
    typ:"text",
    text:`In ${k} ${sache.ding} sind ${z(gesamtK)} ${sache.inhalt}. Wie viele ${sache.inhalt} sind in <b>${m} ${sache.ding}</b>?`,
    loesung: z(erg) + " " + sache.inhalt,
    schluss:"Immer derselbe Weg: durch die gegebene Anzahl teilen, mal die gesuchte Anzahl nehmen.",
    schritte:[
     {frage:"Womit fängst du an?",
      tipp:"Wieder über den Wert für ein einzelnes Stück.",
      optionen:[R(`${z(gesamtK)} : ${k}`, `Genau, die Anzahl pro ${sache.ding.slice(0,-1)}.`),
                F(`${z(gesamtK)} · ${m}`, "Das wäre viel zu viel."),
                F(`${m} − ${k}`, "Die Differenz hilft hier nicht weiter.")]},
     {frage:`<b>${z(gesamtK)} : ${k}</b> ergibt?`,
      tipp:"Einmaleins rückwärts.",
      optionen: zieheVerschiedene([
        R(z(proStueck), "Richtig."),
        F(z(proStueck + 1), "Rechne noch mal nach."),
        F(z(gesamtK - k), "Hier wird geteilt, nicht abgezogen.")], 3)},
     {frage:`Und ${m} ${sache.ding} zu je ${z(proStueck)} ${sache.inhalt}?`,
      tipp:"Jetzt multiplizieren.",
      optionen: zieheVerschiedene([
        R(z(erg), "Fertig."),
        F(z(proStueck * (m - 1)), `Das wären ${m-1} ${sache.ding}.`),
        F(z(erg + proStueck * 2), `Das wären ${m+2} ${sache.ding}.`)], 3)}]};
 }
],

"Winkel messen":[

 /* Winkelart bestimmen */
 () => {
   const art = pick(["spitz","recht","stumpf","gestreckt"]);
   const w = art === "recht" ? 90 : art === "gestreckt" ? 180
           : art === "spitz" ? rnd(5, 89) : rnd(91, 179);
   const namen = {spitz:"Ein spitzer Winkel", recht:"Ein rechter Winkel",
                  stumpf:"Ein stumpfer Winkel", gestreckt:"Ein gestreckter Winkel"};
   const andere = zieheVerschiedene(Object.keys(namen).filter(a => a !== art), 2);
   return {
    typ:"text", text:`Ein Winkel misst <b>${w}°</b>. Welche Art von Winkel ist das?`,
    loesung: namen[art],
    schluss:"Spitz unter 90°, recht genau 90°, stumpf zwischen 90° und 180°, gestreckt genau 180°.",
    schritte:[
     {frage:"Wie viel Grad hat ein <b>rechter</b> Winkel?",
      tipp:"Die Ecke eines Blatt Papiers.",
      optionen:[R("90°", "Richtig — das ist die wichtigste Grenze."),
                F("180°", "180° ist ein gestreckter Winkel, also eine gerade Linie."),
                F("45°", "45° ist ein halber rechter Winkel.")]},
     {frage:`Vergleich: Ist <b>${w}°</b> kleiner, gleich oder größer als 90°?`,
      tipp:"Reiner Zahlenvergleich.",
      optionen: zieheVerschiedene([
        R(w < 90 ? "Kleiner" : w === 90 ? "Genau 90°" : "Größer", "Genau."),
        F(w < 90 ? "Größer" : "Kleiner", `${w} und 90 noch mal vergleichen.`),
        F(w === 90 ? "Größer" : "Genau 90°", `${w}° ist nicht genau 90°.`)], 3)},
     {frage:`Und im Vergleich zu <b>180°</b>?`,
      tipp:"180° wäre eine ganz gerade Linie.",
      optionen: zieheVerschiedene([
        R(w < 180 ? "Kleiner als 180°" : "Genau 180°", "Richtig."),
        F(w < 180 ? "Genau 180°" : "Kleiner als 180°", `${w}° noch mal mit 180 vergleichen.`)], 2)},
     {frage:"Wie heißt so ein Winkel?",
      tipp: art === "spitz" ? "Unter 90°." : art === "recht" ? "Genau 90°."
          : art === "stumpf" ? "Zwischen 90° und 180°." : "Genau 180°.",
      optionen: zieheVerschiedene([
        R(namen[art], "Richtig."),
        F(namen[andere[0]], "Das passt zu einem anderen Bereich."),
        F(namen[andere[1]], "Auch das ist ein anderer Bereich.")], 3)}]};
 },

 /* Ergänzungswinkel */
 () => {
   const ganz = pick([90, 180]);
   const a = rnd(10, ganz - 10);
   const erg = ganz - a;
   return {
    typ:"text",
    text:`Zwei Winkel ergänzen sich zu <b>${ganz}°</b>. Einer misst ${a}°. Wie groß ist der andere?`,
    loesung: erg + "°",
    schluss:"Ergänzen heißt schlicht: Rest ausrechnen. Das brauchst du später bei Dreiecken ständig.",
    schritte:[
     {frage:`Was heißt „ergänzen sich zu ${ganz}°“?`,
      tipp:"Beide zusammen ergeben etwas Bestimmtes.",
      optionen:[R(`Beide zusammen ergeben ${ganz}°`, "Genau."),
                F(`Jeder ist ${ganz}° groß`, `Dann wären es zusammen ${ganz*2}°.`),
                F(`Der Unterschied beträgt ${ganz}°`, "Es geht um die Summe, nicht um die Differenz.")]},
     {frage:"Welche Rechnung führt zum zweiten Winkel?",
      tipp:"Vom Ganzen den bekannten Teil abziehen.",
      optionen:[R(`${ganz}° − ${a}°`, "Richtig."),
                F(`${ganz}° + ${a}°`, `Dann wäre die Summe größer als ${ganz}°.`),
                F(`${a}° · 2`, "Es gibt keinen Grund, den Winkel zu verdoppeln.")]},
     {frage:`<b>${ganz} − ${a}</b> ergibt?`,
      tipp:`Von ${ganz} die ${a} abziehen.`,
      optionen: zieheVerschiedene([
        R(erg + "°", "Fertig."),
        F((erg + 10) + "°", "Zehn zu wenig abgezogen."),
        F((erg - 10) + "°", "Zehn zu viel abgezogen.")], 3)}]};
 }
],

"Gleichungen umstellen":[

    schritte:[

      optionen:[R(`Die + ${b}`, "Genau. Erst das, was addiert wird."),

/* Fach und Klasse zu einem Thema finden */
function themaInfo(name){
  for (const [fk, f] of Object.entries(KATALOG))
    for (const [kl, liste] of Object.entries(f.themen))
      if (liste.includes(name)) return {fach: fk, klasse: Number(kl)};
  return {fach:"mathe", klasse:5};
}
function anzahlAufgaben(name){ return AUFGABEN[name] ? AUFGABEN[name].length : 0; }
/* Sicherheitsnetz: entfernt Antwortmöglichkeiten, die zufällig gleich lauten.
   Beim Würfeln kann es passieren, dass eine falsche Antwort denselben Wert
   trifft wie die richtige — dann wäre die Frage nicht lösbar. */
function entdoppeln(aufgabe){
  (aufgabe.schritte || []).forEach(s => {
    const gesehen = new Set(), behalten = [];
    const schluessel = o => String(o.t).replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
    s.optionen.filter(o => o.ok).forEach(o => { gesehen.add(schluessel(o)); behalten.push(o); });
    s.optionen.filter(o => !o.ok).forEach(o => {
      const k = schluessel(o);
      if (!gesehen.has(k)){ gesehen.add(k); behalten.push(o); }
    });
    s.optionen = behalten;
  });
  return aufgabe;
}

/* erzeugt eine frische Aufgabe (Zahlen und Wörter jedes Mal neu) */
function baueAufgabe(name, welche){
  const liste = AUFGABEN[name];
  const bauer = liste[welche % liste.length];
  const aufgabe = typeof bauer === "function" ? bauer() : JSON.parse(JSON.stringify(bauer));
  return entdoppeln(aufgabe);
}

function hatErklaerung(thema){ return !!ERKLAERUNGEN[thema]; }
/* ---------- Dashboard und Hilfe-Formular ---------- */

let istAdmin = false;
let statistik = null;
let meldungen = [];
let ladeFehler = "";
let meldungGesendet = false;
let vorMelden = "willkommen";

async function pruefeAdmin(){
  istAdmin = false;
  if (!benutzer) return;
  try {
    const {data, error} = await db.rpc("ist_admin");
    istAdmin = !error && data === true;
  } catch(e){ istAdmin = false; }
}

async function ladeDashboard(){
  ladeFehler = "";
  try {
    const {data, error} = await db.rpc("statistik");
    if (error) throw error;
    statistik = data;
  } catch(e){
    statistik = null;
    ladeFehler = "Die Zahlen konnten nicht geladen werden. Ist der SQL-Befehl schon ausgeführt?";
  }
  try {
    const {data} = await db.from("meldungen").select("*").order("erstellt", {ascending:false}).limit(50);
    meldungen = data || [];
  } catch(e){ meldungen = []; }
}

async function zeigeDashboard(){
  ansicht = "dashboard"; statistik = null; render();
  await ladeDashboard();
  render();
}

async function meldungAbhaken(id, erledigt){
  await db.from("meldungen").update({erledigt: !erledigt}).eq("id", id);
  await ladeDashboard();
  render();
}

function zeigeMelden(){
  if (ansicht !== "melden") vorMelden = ansicht;
  meldungGesendet = false;
  ansicht = "melden"; render();
}
function zurueckVonMelden(){ ansicht = vorMelden === "melden" ? "willkommen" : vorMelden; render(); }

async function meldungSenden(){
  const bereich = document.getElementById("mBereich").value;
  const nachricht = document.getElementById("mText").value.trim();
  const email = document.getElementById("mMail").value.trim();
  if (nachricht.length < 5){ ladeFehler = "Bitte schreib kurz, worum es geht."; return render(); }
  ladeFehler = "";
  const {error} = await db.from("meldungen").insert({
    bereich: bereich,
    nachricht: nachricht,
    email: email || (benutzer ? benutzer.email : null)
  });
  if (error){ ladeFehler = "Das Absenden hat nicht geklappt. Versuch es später noch einmal."; return render(); }
  meldungGesendet = true;
  render();
}

/* ---------- Ansichten ---------- */

function dashboardHtml(){
  if (ladeFehler && !statistik){
    return `<div class="card">
      <button class="zurueck" onclick="zurFachwahl()">← Zurück</button>
      <h1>Dashboard</h1>
      <div class="feedback nope">${ladeFehler}</div>
    </div>`;
  }
  if (!statistik){
    return `<div class="card"><p class="laden">Zahlen werden geladen …</p></div>`;
  }
  const s = statistik;
  const themen = (s.themen || []).slice(0, 12);
  const maxAnzahl = Math.max(1, ...themen.map(t => t.anzahl));
  const schwer = themen.slice().sort((a,b) => b.fehlerquote - a.fehlerquote).slice(0, 5);
  const tage = s.tage || [];
  const maxTag = Math.max(1, ...tage.map(t => t.anzahl));

  return `
    <div class="card">
      <button class="zurueck" onclick="zurFachwahl()">← Zurück zum Üben</button>
      <span class="tag">Nur für dich sichtbar</span>
      <h1>Dashboard</h1>
      <p class="soft">Ausschließlich Zahlen — keine Namen, keine E-Mail-Adressen, keine einzelnen Personen.</p>
    </div>

    <div class="card">
      <div class="zahlen">
        <div><b>${s.nutzer_gesamt}</b><span>Nutzer gesamt</span></div>
        <div><b>${s.nutzer_neu_7t}</b><span>neu (7 Tage)</span></div>
        <div><b>${s.nutzer_aktiv_7t}</b><span>aktiv (7 Tage)</span></div>
        <div><b>${s.uebungen_gesamt}</b><span>Übungen gesamt</span></div>
      </div>
    </div>

    <div class="card">
      <p class="ueberschrift">Übungen der letzten 14 Tage</p>
      ${tage.length
        ? `<div class="balken">${tage.map(t => `
            <div class="balkensaeule" title="${t.tag}: ${t.anzahl}">
              <div class="saeule" style="height:${Math.round(t.anzahl / maxTag * 100)}%"></div>
              <span>${t.tag}</span>
            </div>`).join("")}</div>`
        : `<p class="small soft" style="margin:0">Noch keine Übungen aufgezeichnet.</p>`}
    </div>

    <div class="card">
      <p class="ueberschrift">Daran scheitern die meisten</p>
      ${schwer.length
        ? schwer.map(t => `
            <div class="zeile">
              <div><b>${t.thema}</b><span>${KATALOG[t.fach] ? KATALOG[t.fach].name : t.fach} ${t.klasse} · ${t.anzahl}× geübt</span></div>
              <div class="wann ${t.fehlerquote >= 50 ? "" : "spaeter"}">${t.fehlerquote} % Fehler</div>
            </div>`).join("")
        : `<p class="small soft" style="margin:0">Noch keine Daten.</p>`}
      <p class="small soft" style="margin-top:14px">Hohe Werte heißen nicht, dass das Thema schlecht ist — es heißt, dass die Erklärung dort am meisten bringt.</p>
    </div>

    <div class="card">
      <p class="ueberschrift">Am häufigsten geübt</p>
      ${themen.length
        ? themen.map(t => `
            <div class="rangzeile">
              <span class="rangname">${t.thema}</span>
              <span class="rangbalken"><i style="width:${Math.round(t.anzahl / maxAnzahl * 100)}%"></i></span>
              <span class="rangzahl">${t.anzahl}</span>
            </div>`).join("")
        : `<p class="small soft" style="margin:0">Noch keine Daten.</p>`}
    </div>

    <div class="card">
      <p class="ueberschrift">Meldungen aus dem Hilfe-Formular ${s.offene_meldungen ? `· ${s.offene_meldungen} offen` : ""}</p>
      ${meldungen.length
        ? meldungen.map(m => `
            <div class="meldung ${m.erledigt ? "erledigt" : ""}">
              <div class="meldungkopf">
                <b>${m.bereich || "Sonstiges"}</b>
                <span>${new Date(m.erstellt).toLocaleDateString("de-DE")}</span>
              </div>
              <p class="meldungtext">${(m.nachricht || "").replace(/</g, "&lt;")}</p>
              ${m.email ? `<a class="meldungmail" href="mailto:${m.email}">Antworten an ${m.email}</a>` : ""}
              <button class="wechseln" onclick="meldungAbhaken(${m.id}, ${m.erledigt})">
                ${m.erledigt ? "wieder öffnen" : "als erledigt abhaken"}
              </button>
            </div>`).join("")
        : `<p class="small soft" style="margin:0">Noch keine Meldungen.</p>`}
    </div>`;
}

/* ---------- Hilfsfunktionen ---------- */
/* Mischt die Positionen 0..n-1 zufällig (Fisher-Yates).
   Wird einmal pro Schritt gezogen, damit sich die Reihenfolge
   beim erneuten Zeichnen nach einer falschen Antwort nicht ändert. */
function mischeReihenfolge(anzahl){
  const a = Array.from({length: anzahl}, (_, i) => i);
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function neueReihenfolge(){
  reihenfolge = mischeReihenfolge(aktuell.schritte[schrittNr].optionen.length);
}
function tageBis(z){ return Math.ceil((new Date(z).getTime() - Date.now()) / TAG); }
function wannText(z){
  const t = tageBis(z.naechste_wiederholung);
  if (z.stufe >= 4 && t > 20) return {text:"sitzt", stil:"sitzt"};
  if (t <= 0) return {text:"jetzt fällig", stil:""};
  if (t === 1) return {text:"morgen", stil:"spaeter"};
  if (t < 14) return {text:`in ${t} Tagen`, stil:"spaeter"};
  return {text:`in ${Math.round(t/7)} Wochen`, stil:"spaeter"};
}
function faellig(){ return fortschritt.filter(z => tageBis(z.naechste_wiederholung) <= 0).length; }
function zeileZu(thema){ return fortschritt.find(z => z.thema === thema); }
function anzahlGeplant(){
  let n = 0;
  for (const f of Object.values(KATALOG))
    for (const l of Object.values(f.themen)) n += l.length;

}

function uebersetze(m){
  const t = (m||"").toLowerCase();
  if (t.includes("invalid login")) return "E-Mail oder Passwort stimmt nicht.";
  if (t.includes("already registered")) return "Für diese E-Mail gibt es schon ein Konto. Melde dich einfach an.";

  if (t.includes("valid email")) return "Diese E-Mail-Adresse sieht nicht richtig aus.";

}

async function ladeFortschritt(){
  if (!benutzer){ fortschritt = []; return; }
  const {data, error} = await db.from("fortschritt").select("*")
    .order("naechste_wiederholung", {ascending:true});
  fortschritt = error ? [] : (data || []);
}

async function speichereErgebnis(){
  if (!benutzer) return;
  const info = themaInfo(aktuellName);

  await db.from("uebungen").insert({
    user_id: benutzer.id, fach: info.fach, klasse: info.klasse, thema: aktuellName,
    geschafft: true, fehlversuche: fehlversuche
  });

  const alt = zeileZu(aktuellName);
  let stufe;
  if (!alt) stufe = fehlversuche === 0 ? 1 : 0;
  else if (fehlversuche === 0) stufe = Math.min(alt.stufe + 1, INTERVALLE.length - 1);
  else stufe = Math.max(alt.stufe - 1, 0);

  await db.from("fortschritt").upsert({
    user_id: benutzer.id, fach: info.fach, klasse: info.klasse, thema: aktuellName,
    stufe: stufe,
    versuche: (alt ? alt.versuche : 0) + 1,
    fehler: (alt ? alt.fehler : 0) + (fehlversuche > 0 ? 1 : 0),
    zuletzt_geuebt: new Date().toISOString(),
    naechste_wiederholung: new Date(Date.now() + INTERVALLE[stufe] * TAG).toISOString()
  }, {onConflict:"user_id,fach,thema"});

  await ladeFortschritt();
}

  aktuellName = name;

  if (welche === undefined){
    const alt = zeileZu(name);
    const basis = alt ? alt.versuche : (gastZaehler[name] || 0);
    welche = basis % anzahl;
  }

  gastZaehler[name] = (gastZaehler[name] || 0) + 1;

}

function antwort(i){
  if (beantwortet) return;
  if (falschGeklickt.includes(i)) return;          // dieselbe falsche Antwort nicht zweimal
  if (aktuell.schritte[schrittNr].optionen[i].ok){
    beantwortet = true;
    render(i);
    return;
  }
  falschGeklickt.push(i);
  fehlerImSchritt++;
  fehlversuche++;
  /* Stufe 1: Tipp erscheint von allein */
  if (fehlerImSchritt === 1 && einstellungen.autoTipp) tippOffen = true;
  /* Stufe 2: Erklärung zum Thema wird angeboten */
  if (fehlerImSchritt === 2) erklaerungAngeboten = true;
  /* Stufe 3: Lösung wird gezeigt, damit niemand hängen bleibt */
  if (fehlerImSchritt >= 3){ aufgeloest = true; beantwortet = true; }
  render(i);
}
function schrittZuruecksetzen(){
  falschGeklickt = []; fehlerImSchritt = 0; aufgeloest = false; erklaerungAngeboten = false;
}
async function weiter(){
  schrittNr++; beantwortet = false; tippOffen = false;
  schrittZuruecksetzen();
  if (schrittNr < aktuell.schritte.length) neueReihenfolge();
  if (schrittNr >= aktuell.schritte.length){
    ansicht = "fertig"; render();
    await speichereErgebnis();
    render();
    return;
  }
  render();
}

        <span class="tag">Erklärung</span>
        <h1>${aktuellName}</h1>
        <p class="soft">${e.worum}</p>
      </div>
      <div class="card">
        <p class="ueberschrift">Von vorn erklärt</p>
        ${e.einfach.map(t => `<p class="einfachtext">${t}</p>`).join("")}
      </div>
      ${e.begriffe ? `<div class="card">
        <p class="ueberschrift">Wörter, die du kennen musst</p>
        <div class="begriffe">${e.begriffe.map(([w,b]) => `<div class="begriff"><b>${w}</b><span>${b}</span></div>`).join("")}</div>
      </div>` : ""}
      ${e.bild ? `<div class="card"><p class="ueberschrift">Zum Anschauen</p>${e.bild}</div>` : ""}
      <div class="card">
        <p class="ueberschrift">Das Wichtigste</p>
        <ul class="liste">${e.regeln.map(r => `<li>${r}</li>`).join("")}</ul>
      </div>
      <div class="card">
        <p class="ueberschrift">Ein Beispiel</p>
        <div class="probe">
          <div class="auf" style="font-size:20px">${e.beispiel.aufgabe}</div>
          <ol class="beispielschritte">${e.beispiel.schritte.map(x => `<li>${x}</li>`).join("")}</ol>
          <div class="ergebnis">${e.beispiel.ergebnis}</div>
        </div>
      </div>
      <div class="card" style="text-align:center">
        <p class="soft" style="margin:0 auto 16px;max-width:42ch">Alles klar? Dann probier es an einer Aufgabe — du wirst Schritt für Schritt hingeführt.</p>
        <button class="btn" onclick="starte(aktuellName)">Jetzt üben</button>
      </div>`;
    return;
  }

  /* ---- Fertig ---- */
  if (ansicht === "fertig"){
    const n = anzahlAufgaben(aktuellName);
    const gespeichert = benutzer
      ? `<div class="feedback ok" style="margin-bottom:18px"><b>${aktuellName}</b> ist gespeichert. Du siehst dieses Thema automatisch wieder — je sicherer du wirst, desto später.</div>`
      : `<div class="feedback tipp" style="margin-bottom:18px">Ohne Konto wird nichts gespeichert. Mit Konto käme <b>${aktuellName}</b> jetzt auf deinen Wiederholungsplan.</div>`;
    el.innerHTML = `
      <div class="card">
        <span class="tag">Geschafft</span>
        <h1>${aktuell.loesung}</h1>
        <p class="soft">${aktuell.schluss}</p>
      </div>
      <div class="card">
        <h2>Was du gemacht hast</h2>
        <ul class="schritte-log">
          ${aktuell.schritte.map(s => `<li>${s.frage.replace(/<[^>]+>/g,"")}</li>`).join("")}
        </ul>
        ${gespeichert}
        ${n > 1 ? `<button class="btn full" onclick="naechsteVariante()">Noch eine Aufgabe zu diesem Thema</button>
                   <button class="btn ghost full" style="margin-top:10px" onclick="zeigePlan()">Meinen Plan ansehen</button>`
                : `<button class="btn full" onclick="zeigePlan()">Meinen Plan ansehen</button>`}
        <button class="btn ghost full" style="margin-top:10px" onclick="ansicht='start';render()">Anderes Thema</button>
      </div>`;
    return;
  }

  /* ---- Aufgabe lösen ---- */
  const s = aktuell.schritte[schrittNr];
  const balken = aktuell.schritte.map((_,i) => `<i class="${i <= schrittNr ? "an" : ""}"></i>`).join("");
  if (reihenfolge.length !== s.optionen.length) neueReihenfolge();
  const optionenHtml = reihenfolge.map(i => {
    const o = s.optionen[i];
    let cls = "";
    if (falschGeklickt.includes(i)) cls = "falsch";
    else if (beantwortet && o.ok) cls = "richtig";
    const gesperrt = beantwortet || falschGeklickt.includes(i);
    return `<button class="pick ${cls}" ${gesperrt ? "disabled" : ""} onclick="antwort(${i})">${o.t}</button>`;
  }).join("");

  let fb = "";
  if (gewaehlt !== undefined){
    const o = s.optionen[gewaehlt];
    fb = `<div class="feedback ${o.ok ? "ok" : "nope"}">${o.fb}</div>`;
  }
  if (tippOffen && !aufgeloest) fb += `<div class="feedback tipp"><b>Tipp:</b> ${s.tipp}</div>`;
  if (erklaerungAngeboten && !beantwortet && hatErklaerung(aktuellName))
    fb += `<div class="feedback hilfe">
             <b>Kommst du nicht weiter?</b> Dann liegt es vielleicht am Thema, nicht an der Aufgabe.
             <button class="btn ghost full" style="margin-top:12px" onclick="zeigeErklaerung()">${aktuellName} von vorn erklärt</button>
           </div>`;
  if (aufgeloest)
    fb += `<div class="feedback ok"><b>Kein Problem.</b> Die richtige Antwort ist grün markiert — schau sie dir in Ruhe an und geh dann weiter.</div>`;

  const anz = anzahlAufgaben(aktuellName);
  el.innerHTML = `
    <div class="card">
      <button class="zurueck" onclick="ansicht='start';render()">← Zurück zur Übersicht</button>
      <div class="fortschritt">${balken}</div>
      <div class="kopf">
        <span class="tag" style="margin-bottom:0">${aktuellName}${anz > 1 ? ` · Aufgabe ${variante + 1} von ${anz}` : ""}</span>
        <span class="small soft">Schritt ${schrittNr + 1} von ${aktuell.schritte.length}</span>
      </div>
      <div class="aufg ${aktuell.typ === "text" ? "text" : ""}"><div class="zeile1">${aktuell.text}</div></div>
      <p class="frage">${s.frage}</p>
      <div class="optionen breit">${optionenHtml}</div>
      ${fb}
      ${beantwortet
        ? `<button class="btn full" id="weiterBtn" style="margin-top:18px" onclick="weiter()">Weiter</button>`
        : `<button class="btn ghost full" id="tippBtn" style="margin-top:12px" onclick="tippOffen=true;render()">Ich weiß nicht weiter</button>`}
      ${hatErklaerung(aktuellName) && !beantwortet
        ? `<button class="btn ghost full" id="erklBtn" style="margin-top:10px" onclick="zeigeErklaerung()">Ich verstehe das Thema gar nicht</button>` : ""}
    </div>
    <div class="card">
      <p class="small soft" style="margin:0">Auch beim Tipp bekommst du keine Lösung — nur einen Hinweis. Den letzten Schritt machst immer du.</p>
    </div>`;
}
