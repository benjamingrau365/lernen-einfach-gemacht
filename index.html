<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endlich kapiert</title>
<meta name="description" content="Endlich kapiert: Du bekommst nie die Lösung, nur Fragen, die dich hinführen. Mathe und Deutsch, Klasse 5 bis 10.">
<meta name="theme-color" content="#10a37f">
<style>
  :root{
    --bg:#f4f8f7; --card:#ffffff; --ink:#16211e; --soft:#5b6b66; --line:#dfe8e5;
    --ac:#10a37f; --ac-soft:#e4f5ef; --ac-dark:#0b7a5f;
    --red:#b3382f; --red-soft:#fdecea;
    --amber:#8a5a09; --amber-soft:#fdf3e0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}

  .shell{max-width:1140px;margin:0 auto;padding:0 20px 64px;display:grid;grid-template-columns:1fr;gap:0}

  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;
    letter-spacing:-.01em;padding:20px 2px 18px;line-height:1.25}
  .logo .dot{width:30px;height:30px;border-radius:9px;background:var(--ac);flex:none;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:800;letter-spacing:.02em}

  .side{align-self:start}
  .sidebox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .sidelabel{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--soft);margin:0 0 9px 2px}

  .fachliste{display:flex;gap:8px}
  .fachliste button{flex:1;border:1.5px solid var(--line);background:var(--card);font:inherit;
    font-size:16px;font-weight:600;color:var(--soft);padding:11px 8px;border-radius:11px;
    cursor:pointer;text-align:center}
  .fachliste button.an{border-color:var(--ac);background:var(--ac-soft);color:var(--ac-dark)}
  .fachliste button:hover:not(.an){border-color:var(--ac)}

  .klassenliste{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:14px}
  .klassenliste button{border:1.5px solid var(--line);background:var(--card);font:inherit;
    font-size:15.5px;font-weight:600;color:var(--soft);padding:10px 2px;border-radius:10px;cursor:pointer}
  .klassenliste button.an{border-color:var(--ac);background:var(--ac-soft);color:var(--ac-dark)}
  .klassenliste button:hover:not(.an){border-color:var(--ac)}

  .planbtn{display:block;width:100%;text-align:left;background:var(--card);
    border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;
    font-size:16px;font-weight:600;color:var(--ink);cursor:pointer}
  .planbtn:hover{border-color:var(--ac);background:var(--ac-soft)}
  .planbtn small{display:block;font-weight:400;font-size:13.5px;color:var(--soft)}

  main{min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:26px;margin-bottom:14px}
  h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 10px}
  h2{font-size:20px;margin:0 0 16px}
  p{margin:0 0 14px} p:last-child{margin-bottom:0}
  .soft{color:var(--soft)} .small{font-size:14.5px}

  .tag{display:inline-block;background:var(--ac-soft);color:var(--ac-dark);font-size:12.5px;
    font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;
    border-radius:999px;margin-bottom:12px}

  .kopf{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}

  /* Aufgabe: ganz ohne Kasten */
  .aufg{padding:14px 0 22px;border-bottom:1px solid var(--line);margin-bottom:24px}
  .aufg .zeile1{font-size:38px;font-weight:600;text-align:center;letter-spacing:-.01em;line-height:1.25}
  .aufg.text .zeile1{font-size:22px;font-weight:500;text-align:left;line-height:1.5;letter-spacing:0}
  .aufg .luecke{color:var(--ac);font-weight:700}

  .frage{font-size:19.5px;margin:0 0 18px;line-height:1.45}

  .optionen{display:grid;gap:10px}
  button.pick{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
    border-radius:13px;padding:15px 17px;font:inherit;font-size:16.5px;color:var(--ink);
    cursor:pointer;transition:border-color .12s,background .12s;line-height:1.4}
  button.pick:not(:disabled):not(.richtig):not(.falsch):hover{border-color:var(--ac);background:var(--ac-soft)}
  button.pick:disabled{cursor:default;opacity:.5}
  button.pick.richtig{border-color:var(--ac);background:var(--ac-soft);opacity:1}
  button.pick.falsch{border-color:var(--red);background:var(--red-soft);opacity:1}

  .btn{display:inline-block;background:var(--ac);color:#fff;border:none;border-radius:12px;
    padding:14px 24px;font:inherit;font-weight:600;font-size:16.5px;cursor:pointer}
  .btn:hover{background:var(--ac-dark)}
  .btn.ghost{background:none;color:var(--soft);border:1.5px solid var(--line);font-weight:500}
  .btn.ghost:hover{color:var(--ac-dark);border-color:var(--ac);background:none}
  .btn.full{display:block;width:100%;text-align:center}

  .fortschritt{display:flex;gap:5px;margin-bottom:18px}
  .fortschritt i{flex:1;height:5px;border-radius:3px;background:var(--line)}
  .fortschritt i.an{background:var(--ac)}

  .feedback{border-radius:12px;padding:15px 17px;margin:16px 0 0;font-size:16px}
  .feedback.ok{background:var(--ac-soft);color:var(--ac-dark)}
  .feedback.nope{background:var(--red-soft);color:var(--red)}
  .feedback.tipp{background:var(--amber-soft);color:var(--amber)}

  .themen{display:grid;gap:9px}
  .thema{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
    text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:13px;
    padding:14px 16px;font:inherit;font-size:16.5px;color:var(--ink);cursor:pointer}
  .thema:hover{border-color:var(--ac);background:var(--ac-soft)}
  .thema.aus{cursor:default;color:var(--soft);background:var(--bg);border-style:dashed}
  .thema.aus:hover{border-color:var(--line);background:var(--bg)}
  .pill{font-size:12px;font-weight:700;white-space:nowrap;padding:5px 11px;border-radius:999px;
    background:var(--ac-soft);color:var(--ac-dark)}
  .pill.bald{background:var(--bg);color:var(--soft);border:1px solid var(--line)}

  .zeile{display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:14px 0;border-bottom:1px solid var(--line)}
  .zeile:last-child{border-bottom:none}
  .zeile b{display:block;font-size:16.5px}
  .zeile span{font-size:13.5px;color:var(--soft)}
  .wann{font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--amber-soft);
    color:var(--amber);padding:6px 12px;border-radius:999px}
  .wann.spaeter{background:var(--bg);color:var(--soft);border:1px solid var(--line)}
  .wann.sitzt{background:var(--ac-soft);color:var(--ac-dark)}

  .schritte-log{margin:0 0 18px;padding:0;list-style:none}
  .schritte-log li{font-size:15px;color:var(--soft);padding:7px 0 7px 27px;position:relative}
  .schritte-log li::before{content:"✓";position:absolute;left:0;top:6px;color:var(--ac);font-weight:700}

  .zahlen{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
  .zahlen div{background:var(--bg);border-radius:13px;padding:16px 8px}
  .zahlen b{display:block;font-size:26px;line-height:1.1}
  .zahlen span{font-size:12.5px;color:var(--soft)}

  .demo{text-align:center;font-size:13px;color:var(--soft);padding:18px 10px 0;line-height:1.5}

  input.feld{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;
    font:inherit;font-size:16.5px;margin-bottom:10px;background:var(--card);color:var(--ink)}
  input.feld:focus{outline:none;border-color:var(--ac)}
  .userbox{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 15px;margin-bottom:12px;font-size:14.5px}
  .userbox b{display:block;font-size:15px;overflow-wrap:anywhere;margin-bottom:6px}
  .userbox button{background:none;border:none;padding:0;font:inherit;font-size:14px;
    color:var(--soft);text-decoration:underline;cursor:pointer}
  .userbox button:hover{color:var(--ac-dark)}
  .gast{background:var(--amber-soft);border-color:#f0dcae;color:var(--amber)}
  .gast b{color:var(--amber)}
  .laden{text-align:center;color:var(--soft);padding:40px 0}
  .zurueck{background:none;border:none;font:inherit;font-size:15px;color:var(--soft);
    cursor:pointer;padding:0;margin-bottom:14px;text-decoration:underline}
  .zurueck:hover{color:var(--ac-dark)}

  /* ---------- breiter Bildschirm ---------- */
  @media(min-width:900px){
    .shell{grid-template-columns:262px 1fr;gap:32px;align-items:start}
    .side{position:sticky;top:20px}
    .logo{padding-top:24px}
    .fachliste{flex-direction:column}
    .optionen.breit{grid-template-columns:repeat(auto-fit,minmax(215px,1fr));align-items:stretch}
    .optionen.breit button.pick{height:100%}
    .card{padding:30px 32px}
    h1{font-size:32px}
    .aufg .zeile1{font-size:44px}
    .aufg.text .zeile1{font-size:24px;text-align:center}
    .themen{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="logo"><span class="dot">EK</span> <span>Endlich kapiert</span></div>
    <div id="seite"></div>
  </aside>
  <main>
    <div id="screen"></div>
    <p class="demo">Prototyp · Themen mit „üben“ sind fertig gebaut, der Rest zeigt den geplanten Umfang.</p>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------- Themenkatalog: das Gerüst, an dem später alles hängt ---------- */
const KATALOG = {
  mathe: {
    name:"Mathe",
    themen:{
      5:["Natürliche Zahlen","Grundrechenarten","Größen und Einheiten","Flächen und Umfang","Symmetrie"],
      6:["Brüche","Dezimalzahlen","Teilbarkeit","Dreisatz","Winkel messen"],
      7:["Gleichungen umstellen","Prozent und Zinsen","Zuordnungen","Dreiecke","Wahrscheinlichkeit"],
      8:["Terme umformen","Binomische Formeln","Lineare Funktionen","Kreis","Gleichungssysteme"],
      9:["Quadratische Gleichungen","Satz des Pythagoras","Potenzen und Wurzeln","Körper berechnen","Strahlensätze"],
      10:["Quadratische Funktionen","Trigonometrie","Exponentielles Wachstum","Kugel und Kegel","Statistik"]
    }
  },
  deutsch: {
    name:"Deutsch",
    themen:{
      5:["Wortarten erkennen","Satzglieder bestimmen","Groß- und Kleinschreibung","Wörtliche Rede","Erzählen"],
      6:["das oder dass","Zeitformen","Kommas bei Aufzählungen","Berichten","Adjektive steigern"],
      7:["Nominalisierung","Kommas bei Nebensätzen","Aktiv und Passiv","Inhaltsangabe","Argumentieren"],
      8:["Konjunktiv","Satzreihe und Satzgefüge","Kommas bei Infinitivgruppen","Erörterung","Sachtexte auswerten"],
      9:["Stilmittel erkennen","Gedichte deuten","Bewerbung schreiben","Textgebundene Erörterung","Fremdwörter"],
      10:["Literaturepochen","Interpretation","Sprachwandel","Rede und Rhetorik","Facharbeit"]
    }
  }
};

/* ---------- Fertig gebaute Aufgaben ---------- */
const AUFGABEN = {
  "Gleichungen umstellen":{
    fach:"mathe", klasse:7, typ:"formel", text:"3x + 5 = 20", loesung:"x = 5",
    schluss:"Du hast die Gleichung selbst gelöst — ich habe dir nur Fragen gestellt.",
    schritte:[
      {frage:"Am Ende soll nur noch <b>x</b> alleine dastehen. Was steht ihm auf der linken Seite gerade im Weg?",
       tipp:"Schau dir die linke Seite an: 3x + 5. Da klebt noch etwas am 3x dran.",
       optionen:[{t:"Die + 5",ok:1,fb:"Genau. Die + 5 muss zuerst weg."},
                 {t:"Die 3 vor dem x",ok:0,fb:"Die 3 kommt dran — aber erst später. Zuerst das, was addiert wird."},
                 {t:"Die 20 auf der rechten Seite",ok:0,fb:"Die 20 steht auf der anderen Seite, die stört das x nicht."}]},
      {frage:"Wie wirst du die <b>+ 5</b> los?",
       tipp:"Was du auf einer Seite machst, musst du auf beiden Seiten machen. Das Gegenteil von „plus 5“ ist …",
       optionen:[{t:"Auf beiden Seiten 5 abziehen",ok:1,fb:"Richtig — auf beiden Seiten dasselbe, dann bleibt es im Gleichgewicht."},
                 {t:"Auf beiden Seiten 5 addieren",ok:0,fb:"Dann hättest du + 10 statt + 5. Du brauchst das Gegenteil."},
                 {t:"Beide Seiten durch 5 teilen",ok:0,fb:"Teilen hilft gegen Mal-Rechnen, nicht gegen Plus."}]},
      {frage:"Du ziehst auf beiden Seiten 5 ab. Was steht jetzt da?",
       tipp:"Links: 3x + 5 − 5. Rechts: 20 − 5.",
       optionen:[{t:"3x = 15",ok:1,fb:"Sauber. Jetzt ist nur noch die 3 im Weg."},
                 {t:"3x = 25",ok:0,fb:"Du hast rechts addiert statt abgezogen. 20 − 5 = 15."},
                 {t:"x = 15",ok:0,fb:"Noch nicht — die 3 vor dem x steht ja noch da."}]},
      {frage:"Letzter Schritt: <b>3x = 15</b>. Wie kommst du auf das x?",
       tipp:"3x heißt „3 mal x“. Das Gegenteil von mal ist …",
       optionen:[{t:"Beide Seiten durch 3 teilen",ok:1,fb:"Genau — und damit hast du es."},
                 {t:"Auf beiden Seiten 3 abziehen",ok:0,fb:"Abziehen hilft gegen Plus. Hier wird mal gerechnet."},
                 {t:"Beide Seiten mit 3 multiplizieren",ok:0,fb:"Dann wird es größer statt kleiner."}]}
    ]},

  "Prozent und Zinsen":{
    fach:"mathe", klasse:7, typ:"text",
    text:"Ein Handy kostet 480 €. Im Angebot ist es 15 % günstiger. Was kostet es jetzt?",
    loesung:"408 €",
    schluss:"Der schwierige Teil war nicht das Rechnen — sondern herauszufinden, was überhaupt gerechnet werden muss.",
    schritte:[
      {frage:"Bevor du rechnest: Was ist überhaupt <b>gesucht</b>?",
       tipp:"Lies den letzten Satz der Aufgabe. Dort steht fast immer, was raus soll.",
       optionen:[{t:"Der neue Preis",ok:1,fb:"Richtig. Nicht der Rabatt — der neue Preis."},
                 {t:"Wie viel Euro gespart wird",ok:0,fb:"Das ist ein Zwischenschritt, aber nicht die Frage."},
                 {t:"Wie viel Prozent Rabatt es gibt",ok:0,fb:"Die 15 % stehen schon da, die sind gegeben."}]},
      {frage:"Bei Prozent gilt immer: irgendetwas sind die <b>100 %</b>. Was ist hier 100 %?",
       tipp:"100 % ist immer der volle Wert — bevor sich etwas ändert.",
       optionen:[{t:"Die 480 €",ok:1,fb:"Genau. Der alte Preis ist der ganze Kuchen."},
                 {t:"Die 15 %",ok:0,fb:"Das ist der Anteil, der wegfällt — nicht das Ganze."},
                 {t:"Der neue Preis",ok:0,fb:"Den suchen wir gerade, der kann nicht der Ausgangswert sein."}]},
      {frage:"15 % gehen weg. <b>Wie viel Prozent zahlst du dann noch?</b>",
       tipp:"Das Ganze sind 100 %. Davon fallen 15 % weg.",
       optionen:[{t:"85 %",ok:1,fb:"Ja. Damit rechnest du weiter — in einem Schritt statt in zweien."},
                 {t:"15 %",ok:0,fb:"Das ist der Rabatt, nicht der Rest."},
                 {t:"115 %",ok:0,fb:"Es wird günstiger, nicht teurer."}]},
      {frage:"Du zahlst 85 % von 480 €. <b>Welche Rechnung</b> ist das?",
       tipp:"85 % = 0,85. Und „von“ heißt beim Rechnen: mal.",
       optionen:[{t:"480 · 0,85",ok:1,fb:"Perfekt. Das ist der ganze Trick bei Prozent-Textaufgaben."},
                 {t:"480 · 0,15",ok:0,fb:"Das wäre der Rabatt in Euro — nur ein Zwischenschritt."},
                 {t:"480 : 0,85",ok:0,fb:"Geteilt brauchst du, wenn du rückwärts rechnest."}]}
    ]},

  "Brüche":{
    fach:"mathe", klasse:6, typ:"formel", text:"3/4 + 1/6", loesung:"11/12",
    schluss:"Brüche addieren ist immer derselbe Ablauf: gleicher Nenner, dann Zähler addieren.",
    schritte:[
      {frage:"Warum kannst du hier nicht einfach 3 + 1 rechnen?",
       tipp:"Schau auf die Zahlen unter dem Strich.",
       optionen:[{t:"Weil die Nenner verschieden sind",ok:1,fb:"Genau. Viertel und Sechstel sind unterschiedlich große Stücke."},
                 {t:"Weil die Zähler verschieden sind",ok:0,fb:"Die oberen Zahlen dürfen ruhig verschieden sein."},
                 {t:"Weil man Brüche nie addieren kann",ok:0,fb:"Doch — man muss sie nur erst passend machen."}]},
      {frage:"Du brauchst einen <b>gemeinsamen Nenner</b> für 4 und 6. Welcher passt?",
       tipp:"Such die kleinste Zahl, in der 4 und 6 ohne Rest aufgehen.",
       optionen:[{t:"12",ok:1,fb:"Richtig — 4 · 3 = 12 und 6 · 2 = 12."},
                 {t:"10",ok:0,fb:"4 geht nicht in 10 auf."},
                 {t:"24",ok:0,fb:"Funktioniert, ist aber unnötig groß. 12 reicht."}]},
      {frage:"Was wird aus <b>3/4</b>, wenn der Nenner 12 sein soll?",
       tipp:"Der Nenner wird mal 3 genommen. Mit dem Zähler machst du dasselbe.",
       optionen:[{t:"9/12",ok:1,fb:"Ja — oben und unten mal 3."},
                 {t:"3/12",ok:0,fb:"Du hast nur unten erweitert."},
                 {t:"12/12",ok:0,fb:"Das wäre genau 1."}]},
      {frage:"Und <b>1/6</b> mit dem Nenner 12? Dann kannst du addieren.",
       tipp:"Der Nenner wird mal 2 genommen — der Zähler auch.",
       optionen:[{t:"2/12 — zusammen also 11/12",ok:1,fb:"Genau. Gleiche Nenner, dann Zähler addieren."},
                 {t:"1/12 — zusammen also 10/12",ok:0,fb:"Oben muss auch mal 2 gerechnet werden."},
                 {t:"6/12 — zusammen also 15/12",ok:0,fb:"Da hast du Zähler und Nenner vertauscht."}]}
    ]},

  "das oder dass":{
    fach:"deutsch", klasse:6, typ:"text",
    text:"Ich hoffe, <span class='luecke'>___</span> du morgen kommst.", loesung:"dass",
    schluss:"Diesen Test kannst du bei jedem einzelnen Satz anwenden — du musst dir keine Regel merken.",
    schritte:[
      {frage:"Es gibt einen einfachen Test. <b>Welcher ist es?</b>",
       tipp:"Man versucht, das Wort durch ein anderes zu ersetzen.",
       optionen:[{t:"Man ersetzt es durch „dieses“, „jenes“ oder „welches“",ok:1,fb:"Genau das ist der Test. Klappt immer."},
                 {t:"Man schaut, ob ein Komma davorsteht",ok:0,fb:"Ein Komma steht in beiden Fällen — hilft nicht."},
                 {t:"Man zählt die Wörter im Satz",ok:0,fb:"Damit hat es nichts zu tun."}]},
      {frage:"Setz den Test ein: <b>„Ich hoffe, dieses du morgen kommst.“</b> Ergibt das Sinn?",
       tipp:"Lies den Satz laut. Klingt er richtig oder falsch?",
       optionen:[{t:"Nein, das klingt falsch",ok:1,fb:"Richtig. Und wenn der Test nicht klappt, ist es „dass“ mit zwei s."},
                 {t:"Ja, das geht",ok:0,fb:"Lies ihn noch mal laut — „dieses du kommst“ ergibt keinen Sinn."}]},
      {frage:"Der Test klappt also nicht. <b>Welche Aufgabe hat das Wort dann im Satz?</b>",
       tipp:"Es verbindet zwei Satzteile miteinander.",
       optionen:[{t:"Es leitet einen Nebensatz ein",ok:1,fb:"Genau — es ist ein Bindewort, kein Begleiter eines Nomens."},
                 {t:"Es gehört zu einem Nomen",ok:0,fb:"Dann wäre es „das“ mit einem s. Hier steht aber kein Nomen dahinter."}]},
      {frage:"Also: <b>Wie schreibst du es?</b>",
       tipp:"Test klappt nicht → zwei s.",
       optionen:[{t:"dass",ok:1,fb:"Richtig."},
                 {t:"das",ok:0,fb:"Das wäre nur richtig, wenn der Ersetz-Test funktioniert hätte."}]}
    ]},

  "Kommas bei Nebensätzen":{
    fach:"deutsch", klasse:7, typ:"text",
    text:"Ich rufe dich an <span class='luecke'>___</span> wenn ich zu Hause bin.", loesung:"Komma vor „wenn“",
    schluss:"Zwei Verben, zwei Sätze — und dazwischen gehört ein Komma. Mehr steckt nicht dahinter.",
    schritte:[
      {frage:"Zähl nach: <b>Wie viele Verben</b> stehen in dem Satz?",
       tipp:"Verben sind Tuwörter: rufe … an, bin.",
       optionen:[{t:"Zwei: „rufe an“ und „bin“",ok:1,fb:"Genau. Zwei Verben heißt: zwei Satzteile."},
                 {t:"Eines: „rufe an“",ok:0,fb:"„bin“ am Ende ist auch ein Verb."},
                 {t:"Drei",ok:0,fb:"„zu Hause“ ist kein Verb."}]},
      {frage:"Zwei Verben, also zwei Satzteile. <b>Welcher davon ist der Nebensatz?</b>",
       tipp:"Im Nebensatz rutscht das Verb ganz ans Ende.",
       optionen:[{t:"„wenn ich zu Hause bin“",ok:1,fb:"Richtig — „bin“ steht ganz hinten, typisch Nebensatz."},
                 {t:"„Ich rufe dich an“",ok:0,fb:"Der steht für sich allein, das ist der Hauptsatz."}]},
      {frage:"<b>Was gehört zwischen Hauptsatz und Nebensatz?</b>",
       tipp:"Es ist ein Satzzeichen.",
       optionen:[{t:"Ein Komma",ok:1,fb:"Ja — und zwar immer, ohne Ausnahme."},
                 {t:"Gar nichts",ok:0,fb:"Zwischen Haupt- und Nebensatz steht im Deutschen immer ein Komma."},
                 {t:"Ein Doppelpunkt",ok:0,fb:"Der käme nur vor einer Aufzählung oder wörtlicher Rede."}]},
      {frage:"<b>Wo genau</b> steht das Komma?",

      {frage:"Schau dir das Wort <b>vor</b> der Lücke an: „beim“. <b>Was steckt da drin?</b>",
       tipp:"„beim“ ist eine Zusammenziehung aus zwei Wörtern.",
       optionen:[{t:"„bei“ und „dem“",ok:1,fb:"Genau — und „dem“ ist ein Artikel, ein Begleiter."},
                 {t:"„bei“ und „im“",ok:0,fb:"Fast — es ist „bei dem“."},
                 {t:"Nur „bei“",ok:0,fb:"Da steckt noch ein „dem“ mit drin."}]},
      {frage:"Da steht also ein <b>Artikel</b>. Was bedeutet das für das Wort dahinter?",
       tipp:"Artikel stehen immer vor einer bestimmten Wortart.",
       optionen:[{t:"Es ist ein Nomen geworden",ok:1,fb:"Richtig. Artikel + Verb = das Verb wird zum Nomen."},
                 {t:"Es bleibt ein Verb",ok:0,fb:"Ein Verb hätte nie einen Artikel vor sich."},
                 {t:"Es ist ein Adjektiv",ok:0,fb:"Adjektive beschreiben, hier wird das Laufen selbst zur Sache."}]},
      {frage:"<b>Wie schreibt man Nomen</b> im Deutschen?",
       tipp:"Das ist die Regel, die es nur im Deutschen gibt.",
       optionen:[{t:"Groß",ok:1,fb:"Ja — und das gilt auch für Verben, die zu Nomen werden."},
                 {t:"Klein",ok:0,fb:"Nomen werden im Deutschen immer großgeschrieben."}]},
      {frage:"Also: <b>Wie steht es richtig im Satz?</b>",
       tipp:"Artikel davor → Nomen → groß.",
       optionen:[{t:"Beim Laufen höre ich Musik.",ok:1,fb:"Richtig."},
                 {t:"Beim laufen höre ich Musik.",ok:0,fb:"Das „dem“ in „beim“ macht daraus ein Nomen — also groß."}]}

const PLAN = [
  {thema:"Gleichungen umstellen", fach:"Mathe 7", info:"Beim 2. Versuch gelöst", wann:"in 3 Tagen", stil:"bald"},
  {thema:"das oder dass", fach:"Deutsch 6", info:"Beim 1. Versuch gelöst", wann:"in 6 Tagen", stil:"bald"},
  {thema:"Prozent und Zinsen", fach:"Mathe 7", info:"Zweimal richtig hintereinander", wann:"in 2 Wochen", stil:""},
  {thema:"Brüche", fach:"Mathe 6", info:"Viermal sicher gelöst", wann:"sitzt", stil:"sitzt"}
];

/* ---------- Verbindung zur Datenbank ---------- */
const SUPABASE_URL = "https://ygiouoxwuupkbjepqhxm.supabase.co";
const SUPABASE_KEY = "sb_publishable_3EHXsWVndJyI5h3gxYGCqQ_a1SCx4il";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* Abstände der Wiederholungen in Tagen, je nach Sicherheitsstufe */
const INTERVALLE = [1, 3, 7, 14, 30, 90];
const TAG = 86400000;

/* ---------- Zustand ---------- */
let ansicht = "laden";      // laden | anmelden | start | loesen | fertig | plan
let benutzer = null;        // eingeloggter Nutzer, sonst null
let gast = false;           // ohne Konto ausprobieren
let fortschritt = [];       // Zeilen aus der Datenbank
let fach = "mathe", klasse = 7;
let aktuell = null, aktuellName = "", schrittNr = 0;
let beantwortet = false, tippOffen = false, fehlversuche = 0;
let anmeldeModus = "anmelden";  // anmelden | registrieren
let hinweis = "";

const el = document.getElementById("screen");
const seiteEl = document.getElementById("seite");

/* ---------- Hilfsfunktionen ---------- */
function tageBis(zeitpunkt){
  return Math.ceil((new Date(zeitpunkt).getTime() - Date.now()) / TAG);
}
function wannText(zeile){
  const t = tageBis(zeile.naechste_wiederholung);
  if (zeile.stufe >= 4 && t > 20) return {text:"sitzt", stil:"sitzt"};
  if (t <= 0) return {text:"jetzt fällig", stil:""};
  if (t === 1) return {text:"morgen", stil:"spaeter"};
  if (t < 14) return {text:`in ${t} Tagen`, stil:"spaeter"};
  return {text:`in ${Math.round(t/7)} Wochen`, stil:"spaeter"};
}
function faellig(){
  return fortschritt.filter(z => tageBis(z.naechste_wiederholung) <= 0).length;
}

/* ---------- Anmeldung ---------- */
async function pruefeAnmeldung(){
  const {data} = await db.auth.getSession();
  benutzer = data.session ? data.session.user : null;
  if (benutzer){ await ladeFortschritt(); ansicht = "start"; }
  else { ansicht = "anmelden"; }
  render();
}

async function anmelden(){
  hinweis = "";
  const mail = document.getElementById("mail").value.trim();
  const pw = document.getElementById("pw").value;
  if (!mail || !pw){ hinweis = "Bitte E-Mail und Passwort ausfüllen."; return render(); }

  if (anmeldeModus === "registrieren"){
    if (pw.length < 6){ hinweis = "Das Passwort muss mindestens 6 Zeichen haben."; return render(); }
    const {data, error} = await db.auth.signUp({email:mail, password:pw});
    if (error){ hinweis = uebersetze(error.message); return render(); }
    if (!data.session){
      hinweis = "Fast geschafft! Wir haben dir eine E-Mail geschickt — klick den Link darin an und melde dich dann hier an.";
      anmeldeModus = "anmelden";
      return render();
    }
    benutzer = data.user;
  } else {
    const {data, error} = await db.auth.signInWithPassword({email:mail, password:pw});
    if (error){ hinweis = uebersetze(error.message); return render(); }
    benutzer = data.user;
  }
  gast = false;
  await ladeFortschritt();
  ansicht = "start";
  render();
}

async function abmelden(){
  await db.auth.signOut();
  benutzer = null; gast = false; fortschritt = []; hinweis = "";
  ansicht = "anmelden";
  render();
}

function alsGast(){
  gast = true; benutzer = null; fortschritt = []; ansicht = "start"; render();
}

function uebersetze(m){
  const t = (m||"").toLowerCase();
  if (t.includes("invalid login")) return "E-Mail oder Passwort stimmt nicht.";
  if (t.includes("already registered")) return "Für diese E-Mail gibt es schon ein Konto. Melde dich einfach an.";
  if (t.includes("email not confirmed")) return "Bestätige zuerst den Link in deiner E-Mail.";
  if (t.includes("valid email")) return "Diese E-Mail-Adresse sieht nicht richtig aus.";
  if (t.includes("password")) return "Das Passwort muss mindestens 6 Zeichen haben.";
  return "Da ist etwas schiefgegangen: " + m;
}

/* ---------- Daten lesen und schreiben ---------- */
async function ladeFortschritt(){
  if (!benutzer) { fortschritt = []; return; }
  const {data, error} = await db.from("fortschritt").select("*")
    .order("naechste_wiederholung", {ascending:true});
  fortschritt = error ? [] : (data || []);
}

async function speichereErgebnis(){
  if (!benutzer) return;   // Gäste speichern nichts
  const a = aktuell;

  await db.from("uebungen").insert({
    user_id: benutzer.id, fach: a.fach, klasse: a.klasse, thema: aktuellName,
    geschafft: true, fehlversuche: fehlversuche
  });

  const alt = fortschritt.find(z => z.fach === a.fach && z.thema === aktuellName);
  let stufe;
  if (!alt) stufe = fehlversuche === 0 ? 1 : 0;
  else if (fehlversuche === 0) stufe = Math.min(alt.stufe + 1, INTERVALLE.length - 1);
  else stufe = Math.max(alt.stufe - 1, 0);

  const naechste = new Date(Date.now() + INTERVALLE[stufe] * TAG).toISOString();
  const zeile = {
    user_id: benutzer.id, fach: a.fach, klasse: a.klasse, thema: aktuellName,
    stufe: stufe,
    versuche: (alt ? alt.versuche : 0) + 1,
    fehler: (alt ? alt.fehler : 0) + (fehlversuche > 0 ? 1 : 0),
    zuletzt_geuebt: new Date().toISOString(),
    naechste_wiederholung: naechste
  };
  await db.from("fortschritt").upsert(zeile, {onConflict:"user_id,fach,thema"});
  await ladeFortschritt();
}

/* ---------- Bedienung ---------- */
function setFach(f){ fach=f; if(ansicht!=="start") ansicht="start"; render(); }
function setKlasse(k){ klasse=k; if(ansicht!=="start") ansicht="start"; render(); }
function zeigePlan(){ ansicht = ansicht==="plan" ? "start" : "plan"; render(); }
function starte(name){
  aktuellName=name; aktuell=AUFGABEN[name];
  schrittNr=0; beantwortet=false; tippOffen=false; fehlversuche=0;
  ansicht="loesen"; render();
}
function antwort(i){
  if(beantwortet) return;
  if(aktuell.schritte[schrittNr].optionen[i].ok) beantwortet=true;
  else fehlversuche++;
  render(i);
}
async function weiter(){
  schrittNr++; beantwortet=false; tippOffen=false;
  if(schrittNr >= aktuell.schritte.length){
    ansicht="fertig"; render();
    await speichereErgebnis();
    render();
    return;
  }
  render();
}
function wechsleModus(){
  anmeldeModus = anmeldeModus==="anmelden" ? "registrieren" : "anmelden";
  hinweis=""; render();
}
function anzahlGeplant(){
  let n=0;
  for(const f of Object.values(KATALOG))
    for(const liste of Object.values(f.themen)) n+=liste.length;
  return n;
}

/* ---------- Seitenleiste ---------- */
function renderSeite(){
  if (ansicht === "anmelden" || ansicht === "laden"){ seiteEl.innerHTML = ""; return; }

  const kopfBox = benutzer
    ? `<div class="userbox"><b>${benutzer.email}</b>
         <button onclick="abmelden()">Abmelden</button></div>`
    : `<div class="userbox gast"><b>Du übst ohne Konto</b>
         <button onclick="ansicht='anmelden';render()">Konto anlegen und Fortschritt speichern</button></div>`;

  const offen = benutzer ? faellig() : 0;
  const planText = benutzer
    ? (offen > 0 ? `${offen} ${offen===1?"Thema ist":"Themen sind"} fällig` : `${fortschritt.length} Themen gespeichert`)
    : "Nur mit Konto";

  seiteEl.innerHTML = `
    ${kopfBox}
    <div class="sidebox">
      <p class="sidelabel">Fach</p>
      <div class="fachliste">
        ${Object.entries(KATALOG).map(([k,v])=>
          `<button class="${fach===k?"an":""}" onclick="setFach('${k}')">${v.name}</button>`).join("")}
      </div>
      <p class="sidelabel" style="margin-top:16px">Klasse</p>
      <div class="klassenliste">
        ${[5,6,7,8,9,10].map(k=>
          `<button class="${klasse===k?"an":""}" onclick="setKlasse(${k})">${k}</button>`).join("")}
      </div>
    </div>
    <button class="planbtn" onclick="zeigePlan()">
      ${ansicht==="plan" ? "Zurück zu den Themen" : "Mein Plan"}
      <small>${ansicht==="plan" ? "Themenübersicht öffnen" : planText}</small>
    </button>`;
}

/* ---------- Hauptbereich ---------- */
function render(gewaehlt){
  renderSeite();

  if(ansicht === "laden"){
    el.innerHTML = `<div class="card"><p class="laden">Einen Moment …</p></div>`;
    return;
  }

  if(ansicht === "anmelden"){
    const reg = anmeldeModus === "registrieren";
    el.innerHTML = `
      <div class="card">
        <span class="tag">Endlich kapiert</span>
        <h1>${reg ? "Konto anlegen" : "Willkommen zurück"}</h1>
        <p class="soft">${reg
          ? "Mit einem Konto merkt sich die App, was du nicht konntest, und legt es dir später wieder vor."
          : "Melde dich an, damit dein Wiederholungsplan wieder da ist."}</p>
      </div>
      <div class="card">
        <input class="feld" id="mail" type="email" placeholder="E-Mail-Adresse" autocomplete="email">
        <input class="feld" id="pw" type="password" placeholder="Passwort (mindestens 6 Zeichen)"
               autocomplete="${reg?"new-password":"current-password"}"
               onkeydown="if(event.key==='Enter')anmelden()">
        ${hinweis ? `<div class="feedback ${hinweis.startsWith("Fast")?"ok":"nope"}" style="margin-top:4px">${hinweis}</div>` : ""}
        <button class="btn full" style="margin-top:14px" onclick="anmelden()">
          ${reg ? "Konto anlegen" : "Anmelden"}
        </button>
        <button class="btn ghost full" style="margin-top:10px" onclick="wechsleModus()">
          ${reg ? "Ich habe schon ein Konto" : "Noch kein Konto? Hier anlegen"}
        </button>
      </div>
      <div class="card">
        <h4 style="margin:0 0 8px">Erst mal nur anschauen?</h4>
        <p class="small soft">Du kannst alles ausprobieren, ohne dich anzumelden. Dann wird allerdings nichts gespeichert — und der Wiederholungsplan ist genau der Teil, der etwas bringt.</p>
        <button class="btn ghost full" style="margin-top:12px" onclick="alsGast()">Ohne Konto ausprobieren</button>
      </div>`;
    return;
  }

  if(ansicht === "start"){
    const themen = KATALOG[fach].themen[klasse];
    el.innerHTML = `
      <div class="card">
        <span class="tag">Klasse 5 bis 10</span>
        <h1>Such dir dein Thema</h1>
        <p class="soft">Du bekommst nie die Lösung — nur Fragen, die dich hinführen. Und was du nicht konntest, kommt später von allein wieder.</p>
      </div>

      <div class="card">
        <div class="kopf"><h2 style="margin:0">${KATALOG[fach].name}, Klasse ${klasse}</h2></div>
        <div class="themen">
          ${themen.map(t=>{
            const da = !!AUFGABEN[t];
            const gespeichert = fortschritt.find(z => z.fach===fach && z.thema===t);
            let pille = `<span class="pill bald">kommt</span>`;
            if (da){
              if (gespeichert){
                const w = wannText(gespeichert);
                pille = `<span class="pill" style="${w.stil==="spaeter"?"background:var(--bg);color:var(--soft);border:1px solid var(--line)":""}">${w.text}</span>`;
              } else {
                pille = `<span class="pill">üben</span>`;
              }
            }
            return da
              ? `<button class="thema" onclick="starte('${t.replace(/'/g,"\\'")}')"><span>${t}</span>${pille}</button>`
              : `<div class="thema aus"><span>${t}</span>${pille}</div>`;
          }).join("")}
        </div>
        <p class="small soft" style="margin-top:16px">Später tippst du hier einfach deine eigene Aufgabe ein — die App erkennt selbst, zu welchem Thema sie gehört.</p>
      </div>

      <div class="card">
        <div class="zahlen">
          <div><b>2</b><span>Fächer</span></div>
          <div><b>6</b><span>Klassenstufen</span></div>
          <div><b>${anzahlGeplant()}</b><span>Themen geplant</span></div>
          <div><b>${Object.keys(AUFGABEN).length}</b><span>schon fertig</span></div>
        </div>
        <p class="small soft" style="margin-top:14px">Englisch, Französisch, Geschichte und Erdkunde kommen nach demselben Muster dazu. Das Gerüst steht schon.</p>
      </div>`;
    return;
  }

  if(ansicht === "plan"){
    let inhalt;
    if (!benutzer){
      inhalt = `<div class="card">
        <h4 style="margin:0 0 8px">Dafür brauchst du ein Konto</h4>
        <p class="small soft">Ohne Anmeldung kann sich die App nicht merken, was du geübt hast.</p>
        <button class="btn full" style="margin-top:12px" onclick="ansicht='anmelden';render()">Konto anlegen</button>
      </div>`;
    } else if (fortschritt.length === 0){
      inhalt = `<div class="card">
        <h4 style="margin:0 0 8px">Noch nichts drin</h4>
        <p class="small soft">Sobald du dein erstes Thema durchgearbeitet hast, taucht es hier auf — mit dem Datum, an dem es wieder dran ist.</p>
        <button class="btn full" style="margin-top:12px" onclick="ansicht='start';render()">Erstes Thema üben</button>
      </div>`;
    } else {
      inhalt = `<div class="card">
        ${fortschritt.map(z=>{
          const w = wannText(z);
          const info = `${KATALOG[z.fach]?KATALOG[z.fach].name:z.fach} ${z.klasse} · ${z.versuche}× geübt${z.fehler?`, ${z.fehler}× gehakt`:""}`;
          return `<div class="zeile">
            <div><b>${z.thema}</b><span>${info}</span></div>
            <div class="wann ${w.stil}">${w.text}</div>
          </div>`;
        }).join("")}
      </div>`;
    }
    el.innerHTML = `
      <div class="card">
        <span class="tag">Der eigentliche Trick</span>
        <h1>Dein Wiederholungsplan</h1>
        <p class="soft">Alles, woran du hängengeblieben bist, kommt von allein wieder — nach einem Tag, nach drei Tagen, nach einer Woche, immer weiter auseinander. So lange, bis es sitzt.</p>
      </div>
      ${inhalt}`;
    return;
  }

  if(ansicht === "fertig"){
    const gespeichert = benutzer
      ? `<div class="feedback ok" style="margin-bottom:18px"><b>${aktuellName}</b> ist gespeichert. Du siehst dieses Thema automatisch wieder — je sicherer du wirst, desto später.</div>`
      : `<div class="feedback tipp" style="margin-bottom:18px">Ohne Konto wird nichts gespeichert. Mit Konto käme <b>${aktuellName}</b> jetzt automatisch auf deinen Wiederholungsplan.</div>`;
    el.innerHTML = `
      <div class="card">
        <span class="tag">Geschafft</span>
        <h1>${aktuell.loesung}</h1>
        <p class="soft">${aktuell.schluss}</p>
      </div>
      <div class="card">
        <h2>Was du gemacht hast</h2>
        <ul class="schritte-log">
          ${aktuell.schritte.map(s=>`<li>${s.frage.replace(/<[^>]+>/g,"")}</li>`).join("")}
        </ul>
        ${gespeichert}
        <button class="btn full" onclick="zeigePlan()">Meinen Plan ansehen</button>
        <button class="btn ghost full" style="margin-top:10px" onclick="ansicht='start';render()">Nächstes Thema</button>
      </div>`;
    return;
  }

  /* ansicht === "loesen" */
  const s = aktuell.schritte[schrittNr];
  const balken = aktuell.schritte.map((_,i)=>`<i class="${i<=schrittNr?"an":""}"></i>`).join("");
  const optionenHtml = s.optionen.map((o,i)=>{
    let cls="";
    if(gewaehlt!==undefined && i===gewaehlt) cls = o.ok?"richtig":"falsch";
    else if(beantwortet && o.ok) cls="richtig";
    return `<button class="pick ${cls}" ${beantwortet?"disabled":""} onclick="antwort(${i})">${o.t}</button>`;
  }).join("");

  let fb="";
  if(gewaehlt!==undefined){
    const o=s.optionen[gewaehlt];
    fb=`<div class="feedback ${o.ok?"ok":"nope"}">${o.fb}</div>`;
  }
  if(tippOffen && !beantwortet) fb += `<div class="feedback tipp"><b>Tipp:</b> ${s.tipp}</div>`;

  el.innerHTML = `
    <div class="card">
      <button class="zurueck" onclick="ansicht='start';render()">← Zurück zur Übersicht</button>
      <div class="fortschritt">${balken}</div>
      <div class="kopf">
        <span class="tag" style="margin-bottom:0">${KATALOG[aktuell.fach].name} ${aktuell.klasse} · ${aktuellName}</span>
        <span class="small soft">Schritt ${schrittNr+1} von ${aktuell.schritte.length}</span>
      </div>
      <div class="aufg ${aktuell.typ==="text"?"text":""}"><div class="zeile1">${aktuell.text}</div></div>
      <p class="frage">${s.frage}</p>
      <div class="optionen breit">${optionenHtml}</div>
      ${fb}
      ${beantwortet
        ? `<button class="btn full" id="weiterBtn" style="margin-top:18px" onclick="weiter()">Weiter</button>`
        : `<button class="btn ghost full" id="tippBtn" style="margin-top:12px" onclick="tippOffen=true;render()">Ich weiß nicht weiter</button>`}
    </div>
    <div class="card">
      <p class="small soft" style="margin:0">Auch beim Tipp bekommst du keine Lösung — nur einen Hinweis. Den letzten Schritt machst immer du.</p>
    </div>`;
}

render();
pruefeAnmeldung();
</script>
