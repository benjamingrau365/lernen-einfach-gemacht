"Potenzen und Wurzeln":[

 /* Potenzgesetze: mal und geteilt */
 () => {
   /* 2+2 = 2·2 — dieser Fall würde zwei Antworten gleich machen */
   let m, n;
   do { m = rnd(2, 7); n = rnd(2, 6); } while (m + n === m * n);
   const malRechnen = rnd(0, 1) === 1;
   const gross = Math.max(m, n) + 3, klein = Math.min(m, n);
   const e1 = malRechnen ? m : gross, e2 = malRechnen ? n : klein;
   const erg = malRechnen ? m + n : gross - klein;
   return {
    typ:"formel",
    text: malRechnen ? `a<sup>${m}</sup> · a<sup>${n}</sup>` : `a<sup>${gross}</sup> : a<sup>${klein}</sup>`,
    loesung:`a<sup>${erg}</sup>`,
    schluss:"Gleiche Grundzahl mal genommen: Hochzahlen addieren. Geteilt: Hochzahlen abziehen. Die Grundzahl bleibt immer stehen.",
    schritte:[
     {frage:`Was bedeutet <b>a<sup>${e1}</sup></b> ausgeschrieben?`,
      tipp:"Die Hochzahl sagt, wie oft die Grundzahl als Faktor auftritt.",
      optionen:[R(`a mal a mal a … insgesamt ${e1}-mal`, "Genau. Mehr steckt hinter einer Potenz nicht."),
                F(`a mal ${e1}`, "Die Hochzahl ist kein Faktor, sondern eine Anzahl."),
                F(`${e1} mal ${e1}`, "Die Grundzahl ist a, nicht die Hochzahl.")]},
     {frage: malRechnen
        ? `Wenn du <b>${m} Stück a</b> und <b>${n} Stück a</b> aneinanderhängst — wie viele sind es dann?`
        : `Wenn du von <b>${gross} Stück a</b> jeweils <b>${klein} Stück a</b> wegkürzt — wie viele bleiben?`,
      tipp: malRechnen ? "Einfach zusammenzählen." : "Einfach abziehen.",
      optionen: zieheVerschiedene([
        R(String(erg), "Richtig."),
        F(String(malRechnen ? m * n : gross * klein), malRechnen ? "Die Hochzahlen werden addiert, nicht malgenommen." : "Die Hochzahlen werden abgezogen, nicht malgenommen."),
        F(String(malRechnen ? Math.abs(m - n) : gross + klein), malRechnen ? "Beim Malnehmen kommen sie dazu." : "Beim Teilen gehen sie weg.")], 3)},
     {frage:"<b>Was passiert mit der Grundzahl a?</b>",
      tipp:"Sie ist bei beiden Potenzen dieselbe.",
      optionen:[R("Sie bleibt einfach a", "Genau — nur die Hochzahl ändert sich."),
                F(malRechnen ? "Sie wird zu a²" : "Sie fällt weg", "Die Grundzahl bleibt immer unverändert stehen."),
                F("Sie wird auch malgenommen", "Nur die Hochzahlen werden verrechnet.")]},
     {frage:"<b>Wie lautet das Ergebnis?</b>",
      tippAntwort:`a hoch ${erg}`,
      tipp:"Grundzahl a, dazu die neue Hochzahl.",
      optionen:[R(`a<sup>${erg}</sup>`, "Fertig."),
                F(`a<sup>${malRechnen ? m*n : gross+klein}</sup>`, malRechnen ? "Beim Malnehmen werden die Hochzahlen addiert." : "Beim Teilen werden sie abgezogen."),
                F(`${erg}a`, "Die Hochzahl darf nicht nach vorne rutschen — das wäre etwas ganz anderes.")]}]};
 },

 /* Wurzel als Umkehrung */
 () => {
   const w = rnd(4, 20), q = w*w;
   const stoerer = q + rnd(1, 6);
   return {
    typ:"formel", text:`√${q}`, loesung:String(w),
    schluss:"Die Wurzel fragt: welche Zahl mit sich selbst malgenommen ergibt das? Deshalb macht sie das Quadrieren rückgängig.",
    schritte:[
     {frage:`<b>Was fragt die Wurzel eigentlich?</b>`,
      tipp:"Denk daran, was sie rückgängig macht.",
      optionen:[R("Welche Zahl mit sich selbst malgenommen ergibt " + q + "?", "Genau — die Wurzel ist die Umkehrung des Quadrierens."),
                F("Welche Zahl mal 2 ergibt " + q + "?", "Das wäre die Hälfte, nicht die Wurzel."),
                F("Welche Zahl geteilt durch 2 ergibt " + q + "?", "Das wäre das Doppelte.")]},
     {frage:`Probier es ein: Ist <b>${w - 1} · ${w - 1}</b> schon ${q}?`,
      tipp:`${w-1} mal ${w-1} ausrechnen.`,
      optionen:[R(`Nein, das ergibt ${(w-1)*(w-1)} — zu klein`, "Richtig, also muss die Zahl größer sein."),
                F(`Ja, genau ${q}`, `Nein, ${w-1} · ${w-1} ist ${(w-1)*(w-1)}.`),
                F(`Nein, das ist zu groß`, `${(w-1)*(w-1)} ist kleiner als ${q}, nicht größer.`)]},
     {frage:`Und <b>${w} · ${w}</b>?`,
      tipp:"Jetzt sollte es passen.",
      optionen: zieheVerschiedene([
        R(`Das ergibt genau ${q}`, "Damit ist die Wurzel gefunden."),
        F(`Das ergibt ${stoerer}`, `Nein, ${w} · ${w} ist ${q}.`),
        F(`Das ergibt ${w*2}`, "Das wäre das Doppelte, nicht das Quadrat.")], 3)},
     {frage:`<b>Wie groß ist √${q}?</b>`,
      tippAntwort:String(w),
      tipp:"Die Zahl, die eben aufgegangen ist.",
      optionen:[R(String(w), `Richtig, denn ${w}² = ${q}.`),
                F(String(q / 2), "Halbieren ist nicht Wurzelziehen."),
                F(String(q), "Das ist die Zahl unter der Wurzel selbst — die Wurzel macht sie ja gerade kleiner.")]}]};
 }
],

"Quadratische Funktionen":[

 /* Scheitelpunkt aus der Scheitelform ablesen */
 () => {
   /* d und e verschieden und nicht null, damit x- und y-Wert unterscheidbar bleiben */
   let d, e;
   do { d = rnd(-7, 7); e = rnd(-8, 8); } while (d === 0 || e === 0 || d === e);
   const innen = d < 0 ? `x + ${Math.abs(d)}` : `x − ${d}`;
   const hinten = e < 0 ? `− ${Math.abs(e)}` : `+ ${e}`;
   return {
    typ:"formel", text:`f(x) = (${innen})² ${hinten}`, loesung:`S(${d} | ${e})`,
    schluss:"In der Scheitelform steht der Scheitelpunkt direkt da — man muss nur beim x-Wert das Vorzeichen umdrehen.",
    schritte:[

 /* Öffnung und Verschiebung deuten */
 () => {

"Exponentielles Wachstum":[

 /* Zunahme mit festem Prozentsatz */
 () => {
   const start = pick([200, 500, 800, 1000, 1500, 2000]);
   const p = pick([5, 8, 10, 20, 25]);
   const faktor = 1 + p/100;
   const jahre = rnd(2, 4);
   const ende = Math.round(start * Math.pow(faktor, jahre));
   const linear = start + start * p/100 * jahre;
   return {
    typ:"formel",
    text:`Ein Betrag von ${z(start)} € wächst jedes Jahr um ${p} %. Wie viel sind es nach ${jahre} Jahren?`,
    loesung:`etwa ${z(ende)} €`,
    schluss:"Beim exponentiellen Wachstum wird jedes Jahr mit demselben Faktor malgenommen — nicht immer derselbe Betrag addiert.",
    schritte:[
     {frage:`Nach einem Jahr sind ${p} % dazugekommen. <b>Mit welcher Zahl nimmt man dafür mal?</b>`,
      tipp:"Das Ganze bleibt erhalten (100 %) und " + p + " % kommen dazu.",
      optionen: zieheVerschiedene([
        R(z(faktor), `Richtig: 100 % + ${p} % = ${100+p} %, also mal ${z(faktor)}.`),
        F(z(p/100), `Das wären nur die ${p} % Zuwachs — der ursprüngliche Betrag fehlt.`),
        F(String(p), "Das ist die Prozentzahl selbst, kein Faktor.")], 3)},
     {frage:`Und im <b>zweiten</b> Jahr — wovon werden die ${p} % berechnet?`,
      tipp:"Der Betrag ist ja inzwischen größer geworden.",
      optionen:[R("Vom neuen, bereits gewachsenen Betrag", "Genau das macht den Unterschied zum gleichmäßigen Wachstum."),
                F("Immer vom ursprünglichen Betrag", `Dann wäre es lineares Wachstum und es käme ${z(linear)} € heraus.`),
                F("Von der Differenz des ersten Jahres", "Nein, immer vom aktuellen Gesamtbetrag.")]},
     {frage:`<b>Wie rechnet man ${jahre} Jahre auf einmal?</b>`,
      tipp:"Jedes Jahr derselbe Faktor.",
      optionen:[R(`${z(start)} · ${z(faktor)}<sup>${jahre}</sup>`, "Richtig — der Faktor kommt in die Hochzahl."),
                F(`${z(start)} · ${z(faktor)} · ${jahre}`, "Hier würde der Faktor nur einmal wirken und dann verdoppelt — das ist lineares Denken."),
                F(`${z(start)} + ${z(faktor)}<sup>${jahre}</sup>`, "Der Startwert wird malgenommen, nicht addiert.")]},
     {frage:"<b>Wie viel ist es am Ende ungefähr?</b>",
      tippAntwort:z(ende),
      tipp:`${z(start)} mal ${z(faktor)}, und das ${jahre}-mal hintereinander.`,
      optionen: zieheVerschiedene([
        R(`etwa ${z(ende)} €`, "Richtig — und mehr als bei gleichmäßigem Wachstum, weil der Zuwachs mitwächst."),
        F(`${z(linear)} €`, "Das wäre gleichmäßiges Wachstum, bei dem jedes Jahr derselbe Betrag dazukommt."),
        F(`${z(start)} €`, "Das ist der Startwert, da ist noch nichts gewachsen.")], 3)}]};
 },

 /* Abnahme / Halbierung */
 () => {
   const start = pick([400, 600, 800, 1200, 1600]);
   const p = pick([10, 20, 25, 40]);   /* nicht 50: dann wären „bleibt" und „geht weg" beide 50 % */
   const faktor = 1 - p/100;
   const schritte = rnd(2, 3);
   const ende = Math.round(start * Math.pow(faktor, schritte));
   return {
    typ:"formel",
    text:`Ein Bestand von ${z(start)} nimmt pro Jahr um ${p} % ab. Wie groß ist er nach ${schritte} Jahren?`,
    loesung:`etwa ${z(ende)}`,
    schluss:"Auch beim Abnehmen wird malgenommen — nur mit einem Faktor kleiner als 1. Deshalb wird nie ganz null erreicht.",
    schritte:[
     {frage:`Der Bestand nimmt um ${p} % <b>ab</b>. <b>Wie viel Prozent bleiben übrig?</b>`,
      tipp:`Von 100 % gehen ${p} % weg.`,
      optionen: zieheVerschiedene([
        R(`${100 - p} %`, "Richtig — und genau damit wird gerechnet."),
        F(`${p} %`, `Das ist der Teil, der verschwindet, nicht der, der bleibt.`),
        F(`${100 + p} %`, "Bei einer Abnahme wird es weniger, nicht mehr.")], 3)},
     {frage:"<b>Welcher Faktor gehört dazu?</b>",
      tipp:`${100 - p} % als Kommazahl.`,
      optionen: zieheVerschiedene([
        R(z(faktor), "Genau — kleiner als 1, deshalb wird es weniger."),
        F(z(1 + p/100), "Das wäre ein Wachstum."),
        F(z(p/100), `Das sind die ${p} %, die wegfallen.`)], 3)},
     {frage:`<b>Wie rechnet man ${schritte} Jahre?</b>`,
      tipp:"Denselben Faktor mehrfach anwenden.",
      optionen:[R(`${z(start)} · ${z(faktor)}<sup>${schritte}</sup>`, "Richtig."),
                F(`${z(start)} − ${p} · ${schritte}`, "Es wird malgenommen, nicht abgezogen."),
                F(`${z(start)} : ${schritte}`, "Teilen durch die Jahre hat damit nichts zu tun.")]},
     {frage:"<b>Wie groß ist der Bestand ungefähr?</b>",
      tippAntwort:z(ende),
      tipp:`${z(start)} mal ${z(faktor)}, ${schritte}-mal hintereinander.`,
      optionen: zieheVerschiedene([
        R(`etwa ${z(ende)}`, "Richtig."),
        F(`${z(Math.round(start - start * p/100 * schritte))}`, "Das wäre gleichmäßige Abnahme mit immer demselben Betrag."),
        F("0", "Bei prozentualer Abnahme wird es zwar immer weniger, aber nie ganz null.")], 3)}]};
 }
],

     {haupt:"Er verließ den Raum", wort:"ohne", rest:"etwas zu sagen"},

     {haupt:"Ich stand früh auf", wort:"um", rest:"pünktlich zu sein"},
     {haupt:"Sie unterschrieb", wort:"ohne", rest:"den Vertrag zu lesen"},
     {haupt:"Er hat den ganzen Abend gespielt", wort:"anstatt", rest:"für die Arbeit zu lernen"},
     {haupt:"Wir blieben stehen", wort:"um", rest:"uns den Weg erklären zu lassen"},
     {haupt:"Sie ging weiter", wort:"ohne", rest:"sich umzudrehen"},

    loesung:"Komma",
    schluss:`Bei „um zu“, „ohne zu“, „statt zu“, „anstatt zu“, „außer zu“ und „als zu“ steht immer ein Komma — das sind die sicheren Fälle, die man sich merken kann.`,
    schritte:[

                F("Ein Satz mit eigenem Subjekt und eigenem Verb", "Genau das hat eine Infinitivgruppe nicht — sie hat kein eigenes Subjekt."),
                F("Eine Aufzählung von Verben", "Es geht nicht um eine Aufzählung.")]},
     {frage:`Die Gruppe wird mit <b>„${f.wort}“</b> eingeleitet. <b>Was bedeutet das für das Komma?</b>`,

                F("Das Komma ist freigestellt", `Freigestellt ist es bei manchen Infinitivgruppen — aber nicht bei „${f.wort}“.`),

     {frage:"<b>Wie steht der Satz richtig?</b>",

     {satz:"Das Herz der Stadt schlägt am Marktplatz.", mittel:"Metapher", warum:"Die Stadt bekommt bildlich ein Herz, ohne „wie“.", wirkung:"Die Stadt wirkt lebendig."},

      optionen: zieheVerschiedene([

 }
],

function anzahlAufgaben(name){ return AUFGABEN[name] ? AUFGABEN[name].length : 0; }
/* Sicherheitsnetz: entfernt Antwortmöglichkeiten, die zufällig gleich lauten.
   Beim Würfeln kann es passieren, dass eine falsche Antwort denselben Wert
   trifft wie die richtige — dann wäre die Frage nicht lösbar. */
function entdoppeln(aufgabe){
  (aufgabe.schritte || []).forEach(s => {
    const gesehen = new Set(), behalten = [];
    const schluessel = o => String(o.t).replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
    s.optionen.filter(o => o.ok).forEach(o => { gesehen.add(schluessel(o)); behalten.push(o); });
    s.optionen.filter(o => !o.ok).forEach(o => {
      const k = schluessel(o);
      if (!gesehen.has(k)){ gesehen.add(k); behalten.push(o); }
    });
    s.optionen = behalten;
  });
  return aufgabe;
}

/* ---------- Antwortmöglichkeiten auffüllen ----------
   Bei Zahlenantworten ergänzen wir automatisch weitere, knapp danebenliegende
   Werte, damit man sich nicht mit einem Drittel Wahrscheinlichkeit durchraten kann. */

const ZIEL_ANTWORTEN = 6;

/* Zerlegt "3.800 g" in {wert: 3800, suffix: " g", stellen: 0} — oder null, wenn es keine reine Zahl ist. */
function zahlTeile(text){
  const roh = String(text).replace(/<[^>]+>/g, "").trim();
  const m = roh.match(/^(-?\d{1,3}(?:\.\d{3})*(?:,\d+)?|-?\d+(?:,\d+)?)(\s*(?:cm²|cm³|cm|mm|km|m|kg|g|l|ml|min|h|s|°|%|€|Grad)?)$/);
  if (!m) return null;
  const zahlText = m[1];
  const wert = Number(zahlText.replace(/\./g, "").replace(",", "."));
  if (!Number.isFinite(wert)) return null;
  const komma = zahlText.split(",")[1];
  return {wert, suffix: m[2] || "", stellen: komma ? komma.length : 0};
}
function formatiereWie(wert, teile){
  const zahl = wert.toLocaleString("de-DE", {minimumFractionDigits: teile.stellen, maximumFractionDigits: teile.stellen});
  return zahl + teile.suffix;
}

function fuelleAuf(schritt, ziel){
  if (schritt.optionen.length >= ziel) return;
  const richtig = schritt.optionen.find(o => o.ok);
  if (!richtig) return;
  const teile = zahlTeile(richtig.t);
  if (!teile) return;                                   // keine reine Zahlenantwort
  const alleTeile = schritt.optionen.map(o => zahlTeile(o.t));
  if (!alleTeile.every(t => t && t.suffix === teile.suffix)) return;   // gleiche Einheit genügt

  const w = teile.wert;
  const b = Math.abs(w);
  /* Abstände passend zur Größenordnung, damit keine Ein-Cent-Ablenker entstehen */
  const spruenge = b >= 1000 ? [100, 200, 50, 500]
                 : b >= 100  ? [10, 20, 5, 50]
                 : b >= 10   ? [1, 2, 5, 10]
                 : b >= 1    ? [1, 2, 0.5, 3]
                 : [0.1, 0.05, 0.2, 0.5];
  const kandidaten = [];
  spruenge.forEach(d => { kandidaten.push(w + d, w - d); });
  kandidaten.push(w * 10, w / 10, w * 2, w / 2);
  const genutzteTexte = new Set(schritt.optionen.map(o => String(o.t).replace(/<[^>]+>/g, "").trim()));
  const genutzteWerte = alleTeile.map(t => t.wert);
  for (const k of kandidaten){
    if (schritt.optionen.length >= ziel) break;
    if (!Number.isFinite(k)) continue;
    if (w > 0 && k <= 0) continue;
    if (Math.abs(k) > 1e9) continue;
    const gerundet = Number(k.toFixed(teile.stellen + 2));
    if (genutzteWerte.some(v => Math.abs(v - gerundet) < 1e-9)) continue;   // Wert schon vorhanden
    const text = formatiereWie(gerundet, teile);
    if (genutzteTexte.has(text)) continue;
    genutzteTexte.add(text); genutzteWerte.push(gerundet);
    schritt.optionen.push({t: text, ok: 0, fb: "Knapp daneben — rechne den letzten Schritt noch einmal nach."});
  }
}

/* Kann man die Antwort dieses Schrittes auch eintippen? Nur bei reinen Werten. */
function istEintippbar(schritt){
  if (schritt.tippAntwort) return true;
  const richtig = schritt.optionen.find(o => o.ok);
  if (!richtig) return false;
  const roh = String(richtig.t).replace(/<[^>]+>/g, "").trim();
  if (/^\d+\/\d+$/.test(roh)) return true;             // Bruch wie 11/12
  if (/^x = -?\d+$/.test(roh)) return true;             // Gleichungslösung
  return !!zahlTeile(roh);
}
/* Vergleicht eine eingetippte Antwort mit der richtigen — großzügig bei Schreibweise. */
function eingabePasst(eingabe, richtigText){
  const putzen = t => String(t).replace(/<[^>]+>/g, "").replace(/\s/g, "").toLowerCase();
  const a = putzen(eingabe), b = putzen(richtigText);
  if (!a) return false;
  if (a === b) return true;
  const bruch = t => { const m = t.match(/^(\d+)\/(\d+)$/); return m ? Number(m[1])/Number(m[2]) : null; };
  const ba = bruch(a), bb = bruch(b);
  if (ba !== null && bb !== null) return Math.abs(ba - bb) < 1e-9;
  const zahl = t => {
    const m = t.replace(/x=/, "").match(/-?\d{1,3}(?:\.\d{3})+(?:,\d+)?|-?\d+(?:[.,]\d+)?/);
    if (!m) return null;
    return Number(m[0].replace(/\.(?=\d{3}\b)/g, "").replace(",", "."));
  };
  const za = zahl(a), zb = zahl(b);
  if (za === null || zb === null) return false;
  return Math.abs(za - zb) < 1e-6;
}

/* erzeugt eine frische Aufgabe (Zahlen und Wörter jedes Mal neu) */
function baueAufgabe(name, welche){
  const liste = AUFGABEN[name];
  const bauer = liste[welche % liste.length];
  const aufgabe = typeof bauer === "function" ? bauer() : JSON.parse(JSON.stringify(bauer));
  entdoppeln(aufgabe);
  (aufgabe.schritte || []).forEach(s => fuelleAuf(s, ZIEL_ANTWORTEN));
  return aufgabe;
}

    "Zinsen = Kapital · Zinssatz."

  beispiel:{aufgabe:"Ein Handy kostet 480 €, im Angebot 15 % günstiger.",

  einfach:[

    "„dass“ mit zwei s verbindet zwei Satzteile. Es leitet einen Nebensatz ein: Ich hoffe, dass du kommst.",
    "Beim Sprechen hört man keinen Unterschied. Deshalb braucht man einen Test.",
    "Der Test: Versuch, das Wort durch „dieses“, „jenes“ oder „welches“ zu ersetzen.",

    "Klingt es falsch? Dann ist es „dass“ mit zwei s."

  begriffe:[

  ],
  regeln:[

  einfach:[

    "Ein Nebensatz kann das nicht: „wenn ich zu Hause bin“ — allein klingt das unfertig.",
    "Wie erkennt man, dass ein Satz aus zwei Teilen besteht? An den Verben. Jeder Satzteil hat sein eigenes Verb.",
    "„Ich rufe dich an, wenn ich zu Hause bin.“ Hier stecken zwei Verben: „rufe an“ und „bin“. Also zwei Satzteile.",
    "Im Nebensatz rutscht das Verb ans Ende. Das ist das sicherste Erkennungszeichen.",
    "Zwischen die beiden Teile gehört ein Komma — und zwar direkt vor das einleitende Wort."
  ],
  begriffe:[
    ["Hauptsatz","Kann allein stehen."],
    ["Nebensatz","Kann nicht allein stehen, das Verb steht am Ende."],
    ["Verb","Das Tuwort: laufen, sein, rufen."]
  ],
  regeln:[
    "Zwei Verben heißt: zwei Satzteile.",
    "Im Nebensatz steht das Verb ganz hinten.",
    "Typische Einleitungswörter: weil, wenn, dass, obwohl, damit, bevor, ob, bis.",
    "Das Komma steht direkt vor diesem Wort."
  ],
  beispiel:{aufgabe:"Ich rufe dich an ___ wenn ich zu Hause bin.",
    schritte:["Verben: „rufe an“ und „bin“ → zwei Satzteile.","Nebensatz: „wenn ich zu Hause bin“."],
    ergebnis:"Komma direkt vor „wenn“"}
},

    "Erkennen kannst du das an dem kleinen Wort davor: der, die, das, dem. Solche Wörter heißen Artikel.",
    "Ein Artikel steht immer vor einem Nomen. Steht er also vor einem Verb, ist aus dem Verb ein Nomen geworden.",
    "Achtung bei zusammengezogenen Formen: „beim“ ist „bei dem“, „zum“ ist „zu dem“, „vom“ ist „von dem“. Da versteckt sich der Artikel."
  ],
  begriffe:[

    ["Artikel","Begleiter des Nomens: der, die, das, ein, dem."],

  regeln:[
    "Artikel davor → Nomen → groß.",
    "Versteckte Artikel: beim, zum, vom, im, am.",
    "Auch nach „etwas“, „nichts“, „viel“, „alles“ wird großgeschrieben.",
    "Test: Kannst du ein „das“ davorsetzen? Dann groß."
  ],
  beispiel:{aufgabe:"Beim ___ (laufen) höre ich Musik.",
    schritte:["„Beim“ enthält den Artikel „dem“.","Artikel + Verb → Nomen."],
    ergebnis:"Beim Laufen höre ich Musik."}

"Satzglieder bestimmen": {

  einfach:[

"Groß- und Kleinschreibung": {
  worum:"Im Deutschen werden Nomen großgeschrieben. Der Rest folgt wenigen Regeln.",
  einfach:[
    "Das Deutsche ist damit fast allein auf der Welt: Bei uns werden alle Nomen großgeschrieben, nicht nur Namen.",

    "Der sicherste Test ist deshalb immer derselbe: Steht ein Begleiter davor oder könnte einer davorstehen? Dann groß.",
    "Und natürlich: Am Satzanfang wird immer großgeschrieben."
  ],
  begriffe:[
    ["Nomen","Ding, Lebewesen, Begriff — immer groß."],
    ["Begleiter","Artikel wie der, die, das, ein, dem."]

    "Test: Artikel davor möglich? Dann groß."
  ],
  beispiel:{aufgabe:"Wir haben viel ___ (gelacht) — das ___ (lachen) tat gut.",
    schritte:["„gelacht“ steht allein als Verb → klein","„das lachen“ hat einen Artikel davor → Nomen → groß"],
    ergebnis:"gelacht · Lachen"}
},

"Wörtliche Rede": {
  worum:"Wenn du aufschreibst, was jemand wörtlich gesagt hat, kommt das in Anführungszeichen — mit festen Regeln für die Satzzeichen.",
  einfach:[

    "Diese Worte kommen in Anführungszeichen: „Ich komme gleich.“",
    "Dazu gehört meistens ein Begleitsatz, der sagt, wer spricht: Anna sagt … / … sagt Anna.",
    "Steht der Begleitsatz vorne, kündigt er die Rede an. Dann kommt ein Doppelpunkt: Anna sagt: „Ich komme gleich.“",
    "Steht der Begleitsatz hinten, muss er von der Rede getrennt werden. Dann kommt ein Komma: „Ich komme gleich“, sagt Anna.",
    "Frage- und Ausrufezeichen bleiben immer innerhalb der Anführungszeichen, weil sie zum Gesagten gehören."
  ],
  begriffe:[

  regeln:[
    "Wörtliche Rede steht in Anführungszeichen: „…“",
    "Begleitsatz vorne → Doppelpunkt davor.",
    "Begleitsatz hinten → Komma nach der Rede.",
    "Frage- und Ausrufezeichen bleiben innerhalb der Anführungszeichen."
  ],
  beispiel:{aufgabe:"Anna sagt ___ „Ich habe keine Zeit.“",
    schritte:["Der Begleitsatz „Anna sagt“ steht vorne.","Vor der Rede steht dann ein Doppelpunkt."],
    ergebnis:"Anna sagt: „Ich habe keine Zeit.“"}
},

"Zeitformen": {

  einfach:[
    "Ein Verb ist ein Tuwort: gehen, lesen, sein. Es verändert seine Form, je nachdem wann etwas passiert.",
    "Diese verschiedenen Formen heißen Zeitformen.",
    "Passiert es jetzt gerade, ist es die Gegenwart: ich gehe. Der Fachbegriff dafür ist Präsens.",
    "Ist es vorbei, gibt es zwei Möglichkeiten. Beim Schreiben und Erzählen nimmt man meistens: ich ging. Das heißt Präteritum.",
    "Beim Sprechen sagt man eher: ich bin gegangen. Das heißt Perfekt. Es besteht aus zwei Teilen — einem Hilfsverb (haben oder sein) und einer zweiten Verbform.",
    "War etwas noch früher als etwas anderes Vergangenes, nimmt man: ich war gegangen. Das heißt Plusquamperfekt, also Vorvergangenheit.",
    "Für die Zukunft nimmt man werden: ich werde gehen. Das ist das Futur.",
    "Merkhilfe: Besteht die Form aus einem Wort, ist es Präsens oder Präteritum. Besteht sie aus zwei, ist es Perfekt, Plusquamperfekt oder Futur."
  ],
  begriffe:[
    ["Verb","Das Tuwort: gehen, lesen, sein."],
    ["Hilfsverb","haben, sein oder werden — hilft beim Bilden der Zeitform."],
    ["Präsens","Gegenwart: ich gehe."],
    ["Präteritum","Einfache Vergangenheit: ich ging."],
    ["Perfekt","Vollendete Gegenwart: ich bin gegangen."],
    ["Plusquamperfekt","Vorvergangenheit: ich war gegangen."],
    ["Futur I","Zukunft: ich werde gehen."]
  ],
  regeln:[
    "Ein Wort → Präsens oder Präteritum.",
    "haben/sein in der Gegenwart + Partizip → Perfekt.",
    "haben/sein in der Vergangenheit + Partizip → Plusquamperfekt.",
    "werden + Grundform → Futur I."
  ],
  beispiel:{aufgabe:"„Ich habe das Buch gelesen.“ Welche Zeitform?",
    schritte:["Zwei Teile: „habe“ + „gelesen“.","„habe“ ist die Gegenwart von haben.","haben in der Gegenwart + Partizip → Perfekt."],
    ergebnis:"Perfekt"}
},

"Kommas bei Aufzählungen": {
  worum:"Bei Aufzählungen trennt ein Komma die Glieder — mit einer wichtigen Ausnahme.",
  einfach:[
    "Eine Aufzählung ist, wenn du mehrere Dinge hintereinander nennst: Äpfel, Birnen und Bananen.",
    "Damit man beim Lesen weiß, wo ein Ding aufhört und das nächste anfängt, setzt man Kommas dazwischen.",
    "Das letzte Glied wird aber nicht mit Komma angehängt, sondern mit „und“ oder „oder“.",
    "Und genau davor steht kein Komma. Das ist der Punkt, an dem die meisten Fehler passieren.",
    "Im Englischen ist das übrigens anders — dort darf ein Komma vor „and“ stehen. Im Deutschen nicht."
  ],
  begriffe:[
    ["Aufzählung","Mehrere Dinge hintereinander genannt."],
    ["Glied","Ein einzelner Teil der Aufzählung."]
  ],
  regeln:[
    "Zwischen den Gliedern steht ein Komma.",
    "Vor „und“ und vor „oder“ steht kein Komma.",
    "Das gilt für Nomen, Adjektive und ganze Satzteile gleichermaßen."
  ],
  beispiel:{aufgabe:"Ich kaufe Äpfel ___ Birnen ___ und Bananen.",
    schritte:["Zwischen Äpfel und Birnen: Komma.","Vor „und“: kein Komma."],

"Adjektive steigern": {
  worum:"Adjektive kann man vergleichen. Dafür gibt es drei Stufen.",
  einfach:[
    "Ein Adjektiv beschreibt, wie etwas ist: schnell, groß, gut.",
    "Wenn du zwei Dinge vergleichst, brauchst du eine gesteigerte Form: Das Auto ist schneller als das Fahrrad.",
    "Und wenn etwas das Äußerste ist, brauchst du die Höchstform: Das Flugzeug ist am schnellsten.",
    "Die drei Stufen heißen Grundform, Vergleichsform und Höchstform. Die Fachwörter dafür sind Positiv, Komparativ und Superlativ.",
    "Meistens hängt man einfach an: schnell – schneller – am schnellsten.",
    "Bei manchen kurzen Wörtern kommt zusätzlich ein Umlaut dazu: alt – älter – am ältesten.",
    "Und ein paar wichtige Wörter ändern sich ganz: gut – besser – am besten. Die muss man auswendig können."
  ],
  begriffe:[
    ["Adjektiv","Beschreibt, wie etwas ist."],
    ["Grundform","Die einfache Form: schnell."],
    ["Vergleichsform","Mit „als“: schneller als …"],
    ["Höchstform","Mit „am“: am schnellsten."]
  ],
  regeln:[
    "Grundform – Vergleichsform – Höchstform",
    "Meistens: -er und am -sten anhängen.",
    "Manchmal zusätzlich ein Umlaut: alt – älter.",
    "Unregelmäßig: gut – besser – am besten · viel – mehr – am meisten · gern – lieber – am liebsten"
  ],
  beispiel:{aufgabe:"gut → ? → ?",
    schritte:["„guter“ gibt es nicht — das Wort ist unregelmäßig.","Die Formen muss man kennen."],
    ergebnis:"gut – besser – am besten"}
},
"Terme umformen": {
  worum:"Ein Term ist eine Rechnung mit Buchstaben. Umformen heißt: kürzer schreiben, ohne den Wert zu verändern.",
  einfach:[
    "Ein x ist einfach eine Zahl, die man noch nicht kennt. Rechnen darf man damit trotzdem.",
    "3x heißt „drei Stück x“. Genauso wie drei Äpfel. Und drei Äpfel plus zwei Äpfel sind fünf Äpfel — also 3x + 2x = 5x.",
    "Aber: Äpfel und Birnen kann man nicht zusammenzählen. Genauso wenig x und reine Zahlen. 3x + 5 bleibt 3x + 5.",
    "Steht eine Zahl vor einer Klammer, betrifft sie alles in der Klammer — nicht nur den ersten Teil."
  ],
  begriffe:[
    ["Term","Eine Rechnung mit Zahlen und Buchstaben, ohne Gleichheitszeichen."],
    ["Gleichartig","Teile mit demselben Buchstaben und derselben Hochzahl — nur die darf man zusammenfassen."],
    ["Ausmultiplizieren","Die Klammer auflösen, indem man die Zahl davor mit jedem Teil darin malnimmt."]
  ],
  regeln:[
    "Nur Gleichartiges zusammenfassen: x zu x, Zahl zu Zahl.",
    "Beim Zusammenfassen ändert sich nur die Anzahl vor dem x, nie das x selbst.",
    "Vor einer Klammer gilt: die Zahl trifft jeden einzelnen Teil in der Klammer.",
    "Zur Probe eine beliebige Zahl für x einsetzen — vorher und nachher muss dasselbe herauskommen."
  ],
  beispiel:{aufgabe:"4 · (x + 3) + 2",
    schritte:["Klammer auflösen: 4 · x = 4x und 4 · 3 = 12.","Jetzt steht da: 4x + 12 + 2.","12 und 2 sind beides reine Zahlen, die gehen zusammen."],
    ergebnis:"4x + 14"}
},

"Binomische Formeln": {
  worum:"Drei Formeln, die einem das Ausmultiplizieren zweier gleicher Klammern abnehmen.",
  einfach:[
    "(a + b)² sieht so aus, als wäre es a² + b². Das ist der häufigste Fehler in der ganzen Mittelstufe.",
    "Denn (a + b)² heißt: (a + b) · (a + b). Und beim Ausmultiplizieren trifft jeder Teil der ersten Klammer jeden Teil der zweiten — das sind vier Produkte, nicht zwei.",
    "Zwei dieser vier Produkte sind gleich (a·b und b·a). Zusammen ergeben sie den mittleren Teil: 2ab.",
    "Bei (a + b)(a − b) sind diese beiden mittleren Teile einmal plus und einmal minus — sie löschen sich aus. Deshalb bleibt nur a² − b² übrig."
  ],
  begriffe:[
    ["Binom","Ein Term aus zwei Gliedern, zum Beispiel a + b."],
    ["Doppeltes Produkt","Der mittlere Teil 2ab — er entsteht, weil a·b zweimal vorkommt."]
  ],
  regeln:[
    "1. binomische Formel: (a + b)² = a² + 2ab + b²",
    "2. binomische Formel: (a − b)² = a² − 2ab + b²",
    "3. binomische Formel: (a + b)(a − b) = a² − b²",
    "Merkhilfe: erstes Quadrat, doppeltes Produkt, zweites Quadrat.",
    "Zur Probe eine Zahl einsetzen — zum Beispiel a = 1."
  ],
  beispiel:{aufgabe:"(x + 5)²",
    schritte:["Erstes Quadrat: x².","Doppeltes Produkt: 2 · x · 5 = 10x.","Zweites Quadrat: 5² = 25."],
    ergebnis:"x² + 10x + 25"}
},

"Lineare Funktionen": {
  worum:"Eine lineare Funktion ist eine Gerade. Zwei Zahlen beschreiben sie vollständig: wie steil sie ist und wo sie startet.",
  einfach:[
    "y = mx + b. Mehr steckt nicht dahinter. Das m ist die Steigung, das b der Startwert auf der y-Achse.",
    "Die Steigung sagt: gehe ich einen Schritt nach rechts, wie viel geht es dann nach oben? Bei m = 3 geht es drei nach oben.",
    "Ist m negativ, fällt die Gerade. Ist m null, verläuft sie waagerecht.",
    "Das b ist der Punkt, an dem die Gerade die senkrechte Achse schneidet — dort, wo x = 0 ist."
  ],
  begriffe:[
    ["Steigung m","Höhenunterschied geteilt durch Schritt nach rechts."],
    ["y-Achsenabschnitt b","Der y-Wert an der Stelle x = 0."],
    ["Punktprobe","Einen Punkt einsetzen und schauen, ob die Gleichung aufgeht."]
  ],
  regeln:[
    "Steigung aus zwei Punkten: m = (y₂ − y₁) : (x₂ − x₁)",
    "Nach oben geteilt durch nach rechts — immer in dieser Reihenfolge.",
    "Ein Punkt liegt auf der Geraden, wenn seine Werte die Gleichung erfüllen.",
    "Positives m steigt, negatives m fällt."
  ],
  beispiel:{aufgabe:"Steigung durch P(1 | 3) und Q(4 | 12)",
    schritte:["Nach rechts: 4 − 1 = 3.","Nach oben: 12 − 3 = 9.","Steigung: 9 geteilt durch 3."],
    ergebnis:"m = 3"}
},

"Quadratische Gleichungen": {
  worum:"Gleichungen, in denen ein x² vorkommt. Sie haben meist zwei Lösungen statt einer.",
  einfach:[
    "Bei 2x = 6 gibt es genau eine Lösung. Bei x² = 9 gibt es zwei: 3 und −3, denn beide ergeben quadriert 9.",
    "Deshalb liefert die p-q-Formel auch immer zwei Werte — einmal mit Plus, einmal mit Minus vor der Wurzel.",
    "Wichtig: Die Formel funktioniert nur, wenn vor dem x² nichts steht. Steht dort eine Zahl, teilt man zuerst die ganze Gleichung durch sie.",
    "Steht ein Produkt auf null, geht es viel schneller: Dann muss einer der Faktoren null sein — jede Klammer einzeln betrachten."
  ],
  begriffe:[
    ["p","Die Zahl vor dem x — mit ihrem Vorzeichen."],
    ["q","Die Zahl ganz hinten — mit ihrem Vorzeichen."],
    ["Diskriminante","Das, was unter der Wurzel steht. Ist sie negativ, gibt es keine Lösung."]
  ],
  regeln:[
    "Normalform herstellen: x² + px + q = 0 (vor dem x² darf keine Zahl stehen).",
    "p-q-Formel: x = −p/2 ± √((p/2)² − q)",
    "p und q immer mit Vorzeichen ablesen — dort passieren die meisten Fehler.",
    "Satz vom Nullprodukt: Steht ein Produkt auf null, ist mindestens ein Faktor null.",
    "Probe: Die beiden Lösungen malgenommen ergeben q, addiert ergeben sie −p."
  ],
  beispiel:{aufgabe:"x² − 5x + 6 = 0",
    schritte:["p = −5 und q = 6 ablesen.","−p/2 = 2,5","Unter der Wurzel: 2,5² − 6 = 0,25 → √0,25 = 0,5","2,5 + 0,5 = 3 und 2,5 − 0,5 = 2"],
    ergebnis:"x₁ = 2, x₂ = 3"}
},

"Satz des Pythagoras": {
  worum:"In jedem rechtwinkligen Dreieck hängen die drei Seitenlängen fest zusammen. Kennt man zwei, kann man die dritte ausrechnen.",
  einfach:[
    "Die Formel a² + b² = c² gilt nur, wenn im Dreieck ein rechter Winkel steckt. Sonst stimmt sie nicht.",
    "Die beiden Seiten, die den rechten Winkel bilden, heißen Katheten. Die Seite gegenüber heißt Hypotenuse — sie ist immer die längste.",
    "In der Formel steht c immer für die Hypotenuse. Wer hier vertauscht, bekommt Unsinn heraus.",
    "Suchst du die Hypotenuse, wird addiert. Suchst du eine Kathete, wird abgezogen."
  ],
  begriffe:[
    ["Kathete","Eine der beiden Seiten, die den rechten Winkel bilden."],
    ["Hypotenuse","Die Seite gegenüber dem rechten Winkel — immer die längste."]
  ],
  regeln:[
    "a² + b² = c² — nur im rechtwinkligen Dreieck.",
    "c ist immer die Hypotenuse.",
    "Hypotenuse gesucht: c = √(a² + b²)",
    "Kathete gesucht: b = √(c² − a²)",
    "Prüfen: Die Hypotenuse muss länger sein als jede Kathete."
  ],
  beispiel:{aufgabe:"a = 3 cm, b = 4 cm, c = ?",
    schritte:["3² = 9 und 4² = 16.","9 + 16 = 25, also c² = 25.","Wurzel ziehen: √25 = 5."],
    ergebnis:"c = 5 cm"}
},

"Potenzen und Wurzeln": {
  worum:"Eine Potenz ist eine Kurzschreibweise für wiederholtes Malnehmen. Die Wurzel macht das rückgängig.",
  einfach:[
    "a⁵ heißt: a mal a mal a mal a mal a. Die Hochzahl sagt nur, wie oft.",
    "Deshalb ist a³ · a² = a⁵ — man hängt drei Stück und zwei Stück aneinander, macht fünf. Die Hochzahlen werden addiert.",
    "Beim Teilen kürzt sich entsprechend etwas weg, also werden die Hochzahlen abgezogen.",
    "Die Wurzel fragt umgekehrt: welche Zahl mit sich selbst malgenommen ergibt das? √49 = 7, weil 7 · 7 = 49."
  ],
  begriffe:[
    ["Basis","Die Zahl, die malgenommen wird — bei a⁵ ist das a."],
    ["Exponent","Die Hochzahl — sie sagt, wie oft."],
    ["Quadratwurzel","Die Umkehrung des Quadrierens."]
  ],
  regeln:[
    "aᵐ · aⁿ = aᵐ⁺ⁿ (gleiche Basis: Hochzahlen addieren)",
    "aᵐ : aⁿ = aᵐ⁻ⁿ (gleiche Basis: Hochzahlen abziehen)",
    "(aᵐ)ⁿ = aᵐ·ⁿ (Potenz einer Potenz: Hochzahlen malnehmen)",
    "a⁰ = 1 für jedes a außer null.",
    "Die Basis bleibt immer stehen — nur die Hochzahlen werden verrechnet."
  ],
  beispiel:{aufgabe:"a⁴ · a³",
    schritte:["a⁴ sind vier Stück a, a³ sind drei Stück a.","Zusammen sind das sieben Stück a."],
    ergebnis:"a⁷"}
},

    "Steht vor dem x² ein Minus, kippt die Parabel und ist nach unten geöffnet.",

    "Betrag größer als 1: schmaler. Betrag kleiner als 1: breiter.",
    "Scheitelform y = (x − d)² + e → Scheitelpunkt S(d | e).",
    "Beim x-Wert des Scheitels dreht sich das Vorzeichen gegenüber der Klammer um, beim y-Wert nicht."

  beispiel:{aufgabe:"f(x) = (x − 3)² + 2",

function hatErklaerung(thema){ return !!ERKLAERUNGEN[thema]; }
/* Themen einer Klasse, für die es schon Aufgaben gibt */
function fertigeThemen(f, k){
  return (KATALOG[f] && KATALOG[f].themen[k] ? KATALOG[f].themen[k] : []).filter(t => anzahlAufgaben(t) > 0);
}
/* Für eine noch leere Klasse: die nächstgelegenen fertigen Themen aus den
   Klassen darunter — die Grundlagen, die man dafür ohnehin braucht.
   Es wird von unmittelbar darunter nach unten gesucht, damit die
   Vorschläge möglichst nah an der gewählten Klasse liegen. */
function grundlagenThemen(f, k, anzahl){
  const raus = [];
  for (let stufe = k - 1; stufe >= 5 && raus.length < anzahl; stufe--)
    for (const t of fertigeThemen(f, stufe)){
      raus.push({thema: t, klasse: stufe});
      if (raus.length >= anzahl) break;
    }
  return raus;
}
/* startet ein Thema und stellt Fach und Klasse passend dazu ein
   (nötig, wenn aus einer leeren Klasse ein Grundlagen-Thema geübt wird) */
function starteThemaAusKlasse(name){
  const info = themaInfo(name);
  fach = info.fach; klasse = info.klasse;
  starte(name);
}

/* Was war der Nutzer gerade am Tun? Das hängen wir an die Meldung an. */
function meldeKontext(){
  const k = {};
  if (fach && KATALOG[fach]) k.fach = KATALOG[fach].name;
  if (klasse) k.klasse = klasse;
  if (aktuellName) k.thema = aktuellName;
  if (aktuell){
    k.aufgabe = (variante + 1) + " von " + anzahlAufgaben(aktuellName);
    k.schritt = (schrittNr + 1) + " von " + aktuell.schritte.length;
    k.aufgabentext = String(aktuell.text).replace(/<[^>]+>/g, "").slice(0, 160);
  }
  const ua = navigator.userAgent;
  k.geraet = /Android/i.test(ua) ? "Android" : /iPhone|iPad/i.test(ua) ? "iPhone oder iPad"
           : /Windows/i.test(ua) ? "Windows" : /Mac/i.test(ua) ? "Mac" : "unbekannt";
  k.browser = /Edg\//.test(ua) ? "Edge" : /Chrome/.test(ua) ? "Chrome"
            : /Firefox/.test(ua) ? "Firefox" : /Safari/.test(ua) ? "Safari" : "anderer";
  k.breite = window.innerWidth + " px";
  return k;
}

/* ---------- Admin-Helfer: CSV, Filter, Bauplan ---------- */
function csvExport(dateiname, kopf, zeilen){
  const esc = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const txt = [kopf.map(esc).join(";"), ...zeilen.map(r => r.map(esc).join(";"))].join("\r\n");
  const blob = new Blob(["﻿" + txt], {type: "text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = dateiname;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* Status einer Meldung ableiten (offen / beantwortet / erledigt) */
function ticketStatus(m){
  return m.status || (m.erledigt ? "erledigt" : (m.antwort ? "beantwortet" : "offen"));
}

/* Tickets live filtern (Reiter + Suche) — ohne render(), damit die Suche den Fokus behält */
function ticketFiltern(tab){
  if (tab){
    ticketTab = tab;
    document.querySelectorAll(".tickettab").forEach(b => b.classList.toggle("an", b.dataset.tab === tab));
  }
  const q = (document.getElementById("ticketsuche") ? document.getElementById("ticketsuche").value : "").toLowerCase().trim();
  let n = 0;
  document.querySelectorAll(".meldung[data-status]").forEach(el => {
    const okTab = ticketTab === "alle" || el.dataset.status === ticketTab;
    const okQ = !q || (el.dataset.text || "").indexOf(q) !== -1;
    const zeigen = okTab && okQ;
    el.style.display = zeigen ? "" : "none";
    if (zeigen) n++;
  });
  const leer = document.getElementById("ticketleer");
  if (leer) leer.style.display = n ? "none" : "";
}

/* Nutzerliste live durchsuchen — ohne render() */
function nutzerFiltern(){
  const q = (document.getElementById("nutzersuche") ? document.getElementById("nutzersuche").value : "").toLowerCase().trim();
  let n = 0;
  document.querySelectorAll(".nutzerzeile[data-text]").forEach(el => {
    const zeigen = !q || (el.dataset.text || "").indexOf(q) !== -1;
    el.style.display = zeigen ? "" : "none";
    if (zeigen) n++;
  });
  const leer = document.getElementById("nutzerleer");
  if (leer) leer.style.display = n ? "none" : "";
}

/* Bauplan: alle Themen, für die es noch keine Aufgaben gibt */
function bauplanLuecken(){
  const raus = [];
  for (const [fk, f] of Object.entries(KATALOG)){
    for (const [kl, liste] of Object.entries(f.themen)){
      const offen = liste.filter(t => !AUFGABEN[t]);
      if (offen.length) raus.push({fach: f.name, klasse: Number(kl), offen});
    }
  }
  return raus;
}
function bauplanCsvExport(){
  const l = bauplanLuecken();
  const zeilen = [];
  l.forEach(g => g.offen.forEach(t => zeilen.push([t, g.fach, g.klasse])));
  if (!zeilen.length) return;
  csvExport("bauplan.csv", ["Thema", "Fach", "Klasse"], zeilen);
}
function bauplanHtml(){
  const l = bauplanLuecken();
  const gesamtOffen = l.reduce((a, g) => a + g.offen.length, 0);
  return `
    <div class="card">
      <p class="ueberschrift">Was fehlt noch · ${gesamtOffen} Themen ohne Aufgaben</p>
      ${gesamtOffen === 0
        ? `<p class="small soft" style="margin:0">Stark — jedes Thema im Katalog hat schon Aufgaben. 🎉</p>`
        : `<p class="small soft" style="margin:0 0 12px">Das sind die Themen, für die es noch keine Aufgaben gibt — deine To-do-Liste zum Bauen.</p>
           ${l.map(g => `
             <div class="luecke">
               <div class="lueckekopf">${g.fach} · Klasse ${g.klasse} <span>${g.offen.length} offen</span></div>
               <div class="lueckechips">${g.offen.map(t => `<span class="chip">${t}</span>`).join("")}</div>
             </div>`).join("")}
           <button class="btn ghost full" style="margin-top:14px" onclick="bauplanCsvExport()">Als CSV herunterladen</button>`}
    </div>`;
}

/* Inhaltsübersicht — rein aus dem Katalog, ohne Server */
function inhaltsUebersicht(){
  const raus = [];
  for (const [fk, f] of Object.entries(KATALOG)){
    for (const [kl, liste] of Object.entries(f.themen)){
      const fertig = liste.filter(t => AUFGABEN[t]).length;
      raus.push({fach: f.name, klasse: Number(kl), fertig, gesamt: liste.length});
    }
  }
  return raus;

/* ---------- Wann wird geübt ---------- */
function wannHtml(s){
  const tage = ["So","Mo","Di","Mi","Do","Fr","Sa"];
  const w = s.wochentage || [], h = s.stunden || [];
  if (!w.length && !h.length) return `
    <div class="card"><p class="ueberschrift">Wann wird geübt</p>
    <p class="small soft" style="margin:0">Sobald geübt wird, siehst du hier, an welchen Tagen und zu welchen Uhrzeiten.</p></div>`;
  const maxW = Math.max(1, ...w.map(x => x.anzahl));
  const maxH = Math.max(1, ...h.map(x => x.anzahl));
  const proStunde = nr => (h.find(x => x.stunde === nr) || {anzahl:0}).anzahl;
  const spitze = h.length ? h.slice().sort((a,b) => b.anzahl - a.anzahl)[0].stunde : null;
  return `
    <div class="card">
      <p class="ueberschrift">Wann wird geübt</p>
      <div class="wochentage">
        ${[1,2,3,4,5,6,0].map(nr => {
          const e = w.find(x => x.nr === nr) || {anzahl:0};
          return `<div class="wtag"><span class="wname">${tage[nr]}</span>
                   <span class="wbalken"><i style="width:${Math.round(e.anzahl/maxW*100)}%"></i></span>
                   <span class="wzahl">${e.anzahl}</span></div>`;
        }).join("")}
      </div>
      <p class="ueberschrift" style="margin-top:22px">Nach Uhrzeit</p>
      <div class="balken">
        ${Array.from({length:24}, (_,nr) => `
          <div class="balkensaeule" title="${nr}:00 — ${proStunde(nr)}">
            <div class="saeule" style="height:${Math.round(proStunde(nr)/maxH*100)}%"></div>
            <span>${nr % 3 === 0 ? nr : ""}</span>
          </div>`).join("")}
      </div>
      ${spitze !== null ? `<p class="small soft" style="margin-top:12px">Spitzenzeit: gegen ${spitze} Uhr. Dann lohnt es sich, Neues zu veröffentlichen.</p>` : ""}
    </div>`;
}

  const text = feld.value.trim();

  await db.from("meldungen").update({antwort: text, status: "beantwortet", beantwortet_am: new Date().toISOString()}).eq("id", id);

/* Echte Links: normaler Klick -> schnelle App-Navigation; Strg/Cmd/Mittelklick
   oder Long-Press/Rechtsklick -> der Browser öffnet die Adresse ganz normal
   (neuer Tab, Link kopieren, Kontextmenü …). */
function navKlick(e, fn){
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || (typeof e.button === "number" && e.button > 0)) return true;
  e.preventDefault();
  fn();
  return false;
}

  return `<a class="${klassen || ""}" href="${pfad}"${stil ? ` style="${stil}"` : ""} onclick="return navKlick(event, () => { ${jsCode} })">${inhalt}</a>`;
}

async function passwortAendern(){
  const neu = document.getElementById("neuesPw").value;
  if (!neu || neu.length < 6){ kontoHinweis = "Das neue Passwort muss mindestens 6 Zeichen haben."; return render(); }
  const {error} = await db.auth.updateUser({password: neu});
  kontoHinweis = error ? "Das hat nicht geklappt: " + error.message : "Dein Passwort wurde geändert.";
  render();
}
function frageNach(was){ kontoFrage = was; kontoHinweis = ""; render(); }
function frageAbbrechen(){ kontoFrage = ""; render(); }

async function fortschrittZuruecksetzen(){
  const {error} = await db.rpc("fortschritt_zuruecksetzen");
  if (error){ kontoHinweis = "Das hat nicht geklappt. Ist die SQL-Erweiterung schon ausgeführt?"; }
  else { await ladeFortschritt(); kontoHinweis = "Dein Fortschritt wurde gelöscht. Du fängst wieder bei null an."; }
  kontoFrage = ""; render();
}
async function kontoLoeschen(){
  const {error} = await db.rpc("konto_loeschen");
  if (error){ kontoHinweis = "Das hat nicht geklappt: " + error.message; kontoFrage = ""; return render(); }
  await db.auth.signOut();
  benutzer = null; istAdmin = false; fortschritt = []; kontoFrage = "";
  ansicht = "willkommen"; render();
}

      <p class="einfachtext">Über „Hilfe und Feedback“ kannst du uns eine Nachricht schicken. Gespeichert werden dein Text, die angegebene E-Mail-Adresse für die Antwort und einige technische Angaben, die bei der Fehlersuche helfen: auf welcher Seite du warst, welches Thema geöffnet war, Gerätetyp, Browser und Fensterbreite. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO (Bearbeitung deiner Anfrage). Erledigte Anfragen löschen wir, sobald sie nicht mehr gebraucht werden.</p>

      <p class="ueberschrift" style="margin-top:26px">7. Support-Freigabe — nur, wenn du sie erteilst</p>
      <p class="einfachtext">Standardmäßig kann niemand in deinen Lernfortschritt sehen. Wenn du bei einem Problem Hilfe brauchst, kannst du unter <b>Mein Konto</b> eine Freigabe erteilen. Dann darf der Support <b>24 Stunden lang</b> deinen Lernfortschritt einsehen — nicht dein Passwort. Jeder Zugriff wird protokolliert, und du kannst die Freigabe jederzeit sofort wieder beenden. Rechtsgrundlage ist deine Einwilligung nach Art. 6 Abs. 1 lit. a DSGVO, die du jederzeit für die Zukunft widerrufen kannst.</p>

      <p class="ueberschrift" style="margin-top:26px">8. Wer die Daten sonst noch bekommt</p>
      <p class="einfachtext">Wir verkaufen keine Daten und geben sie nicht zu Werbezwecken weiter. Werbung gibt es auf dieser Seite nicht. Wir setzen aber zwei technische Dienstleister ein, die die Daten in unserem Auftrag und nach unseren Weisungen verarbeiten (Auftragsverarbeitung nach Art. 28 DSGVO):</p>
      <ul class="liste">
        <li><b>Vercel Inc.</b>, 340 S Lemon Ave #4133, Walnut, CA 91789, USA — liefert die Webseite aus. Dabei fallen die unter Punkt 2 genannten technischen Daten an.</li>
        <li><b>Supabase Inc.</b>, 970 Toa Payoh North #07-04, Singapur — betreibt die Datenbank und die Anmeldung. Hier liegen dein Konto und dein Lernfortschritt. Der von uns gewählte Serverstandort ist ${PLATZ} (Region im Supabase-Konto nachsehen und eintragen).</li>
        <li><b>ImprovMX Incorporated</b>, 8 The Green STE D, Dover, Delaware 19901, USA — leitet E-Mails an hilfe@endlichkapiert.com an unser Postfach weiter. Betroffen ist also nur Post, die du uns selbst schreibst. Die Zustellung läuft über Server in Frankreich.</li>
      </ul>
      <p class="einfachtext">Mit beiden Anbietern bestehen Verträge zur Auftragsverarbeitung.</p>

      <p class="ueberschrift" style="margin-top:26px">9. Übermittlung in Länder außerhalb der EU</p>
      <p class="einfachtext">Beide Anbieter sind Unternehmen außerhalb der EU. Auch wenn die Server in Europa stehen, lässt sich ein Zugriff aus dem Ausland — etwa im Rahmen von Wartung und Support — nicht vollständig ausschließen. Die Übermittlung wird abgesichert durch die Standardvertragsklauseln der EU-Kommission nach Art. 46 Abs. 2 lit. c DSGVO und, soweit einschlägig, durch die Zertifizierung nach dem EU-US Data Privacy Framework. In Drittländern gilt möglicherweise nicht dasselbe Datenschutzniveau wie in der EU; insbesondere können dort Behörden weitergehende Zugriffsrechte haben.</p>

      <p class="ueberschrift" style="margin-top:26px">10. Cookies und Speicherung im Browser</p>
      <p class="einfachtext">Wir verwenden <b>keine</b> Werbe-, Marketing- oder Analyse-Cookies und binden keine Zählpixel oder Social-Media-Buttons ein. Deshalb gibt es hier auch kein Cookie-Banner.</p>
      <p class="einfachtext">Gespeichert wird in deinem Browser nur, was für den Betrieb nötig ist: deine Einstellungen (Hell- oder Dunkelmodus, Schriftgröße, Art der Antwortabfrage), der Hinweis, dass du den Baustellen-Hinweis gesehen hast, und — wenn du angemeldet bist — die Information, die dich angemeldet hält. Das fällt unter § 25 Abs. 2 TDDDG (unbedingt erforderliche Speicherung). Du kannst das jederzeit über die Einstellungen deines Browsers löschen.</p>

      <p class="ueberschrift" style="margin-top:26px">11. Wie lange wir speichern</p>
      <ul class="liste">
        <li><b>Konto und Lernfortschritt:</b> solange dein Konto besteht.</li>
        <li><b>Löschst du dein Konto</b>, werden alle zugehörigen Daten sofort und vollständig gelöscht — nicht nur ausgeblendet.</li>
        <li><b>Support-Anfragen:</b> bis sie erledigt sind, danach werden sie gelöscht.</li>
        <li><b>Technische Protokolle des Hosters:</b> kurzfristig, automatisch.</li>
      </ul>

      <p class="ueberschrift" style="margin-top:26px">12. Kinder und Jugendliche</p>
      <p class="einfachtext">Diese Seite richtet sich an Schülerinnen und Schüler ab Klasse 5. Wenn du jünger als 16 Jahre bist, dürfen wir dein Konto nur mit Einverständnis deiner Eltern oder Erziehungsberechtigten anlegen (Art. 8 DSGVO). Frag sie also bitte vorher. <b>Ohne Konto kannst du die ganze Seite nutzen, ohne dass irgendetwas gespeichert wird</b> — das ist der einfachste Weg, wenn du dir unsicher bist.</p>

      <p class="ueberschrift" style="margin-top:26px">13. Deine Rechte</p>
      <p class="einfachtext">Du hast jederzeit das Recht auf:</p>
      <ul class="liste">
        <li><b>Auskunft</b> darüber, welche Daten wir zu dir gespeichert haben (Art. 15)</li>
        <li><b>Berichtigung</b> falscher Daten (Art. 16)</li>
        <li><b>Löschung</b> (Art. 17)</li>
        <li><b>Einschränkung der Verarbeitung</b> (Art. 18)</li>
        <li><b>Datenübertragbarkeit</b> — deine Daten in einem gängigen Format zu erhalten (Art. 20)</li>
        <li><b>Widerspruch</b> gegen Verarbeitungen, die auf berechtigtem Interesse beruhen (Art. 21)</li>
        <li><b>Widerruf</b> einer erteilten Einwilligung, mit Wirkung für die Zukunft (Art. 7 Abs. 3)</li>
      </ul>
      <p class="einfachtext">Für Auskunft oder Löschung reicht eine formlose Nachricht an hilfe@endlichkapiert.com. Löschen kannst du auch selbst und sofort: unter <b>Mein Konto → Konto löschen</b>.</p>

      <p class="ueberschrift" style="margin-top:26px">14. Beschwerderecht</p>
      <p class="einfachtext">Wenn du der Meinung bist, dass wir mit deinen Daten nicht richtig umgehen, kannst du dich bei einer Datenschutz-Aufsichtsbehörde beschweren. Zuständig für uns ist ${PLATZ} (Aufsichtsbehörde des Bundeslandes eintragen). Du kannst dich aber auch an die Behörde deines eigenen Wohnorts wenden.</p>

      <p class="ueberschrift" style="margin-top:26px">15. Änderungen dieser Erklärung</p>
      <p class="einfachtext">Die Seite wird weiterentwickelt. Ändert sich etwas an der Datenverarbeitung, passen wir diese Erklärung an. Es gilt jeweils die hier veröffentlichte Fassung.</p>
      <p class="einfachtext small soft" style="margin-top:22px">Stand: ${PLATZ} (Datum eintragen)</p>
    </div>`;
}

/* ---------- Aktivität: Serie und Tagesziel ---------- */
let aktivitaet = {serie: 0, heute: 0, geladen: false};
const TAGESZIEL = 5;
const MEILENSTEINE = [3, 7, 14, 30, 50, 100, 200, 365];
let neuerMeilenstein = 0;   // frisch erreichter Meilenstein für die Feier-Anzeige
function meilensteinPruefen(){
  const erreicht = MEILENSTEINE.filter(m => (aktivitaet.serie || 0) >= m);
  const hoechste = erreicht.length ? erreicht[erreicht.length - 1] : 0;
  let gefeiert = 0;
  try { gefeiert = parseInt(window.localStorage.getItem("ek_meilenstein") || "0", 10) || 0; } catch(e){}
  if (hoechste > gefeiert){
    neuerMeilenstein = hoechste;
    try { window.localStorage.setItem("ek_meilenstein", String(hoechste)); } catch(e){}
  }
}
function meilensteinWeg(){ neuerMeilenstein = 0; render(); }

async function ladeAktivitaet(){
  aktivitaet = {serie: 0, heute: 0, geladen: false};
  if (!benutzer) { aktivitaet.geladen = true; return; }
  try {
    const {data} = await db.from("uebungen").select("erstellt")
      .order("erstellt", {ascending:false}).limit(400);
    const zeilen = data || [];
    const tagText = d => new Date(d).toLocaleDateString("de-DE");
    const heuteText = new Date().toLocaleDateString("de-DE");
    aktivitaet.heute = zeilen.filter(z => tagText(z.erstellt) === heuteText).length;

    const tage = [...new Set(zeilen.map(z => tagText(z.erstellt)))];
    let serie = 0, joker = 1, jokerGenutzt = false;
    const pruef = new Date();
    /* Wer heute noch nicht geübt hat, verliert die Serie nicht — wir fangen bei gestern an. */
    if (!tage.includes(pruef.toLocaleDateString("de-DE"))) pruef.setDate(pruef.getDate() - 1);
    /* Streak-Schutz: ein ausgelassener Tag mitten in der Serie darf sie nicht sofort beenden. */
    while (true){
      const t = pruef.toLocaleDateString("de-DE");
      if (tage.includes(t)){ serie++; pruef.setDate(pruef.getDate() - 1); }
      else if (joker > 0 && serie > 0){ joker--; jokerGenutzt = true; pruef.setDate(pruef.getDate() - 1); }
      else break;
    }
    aktivitaet.serie = serie;
    aktivitaet.jokerGenutzt = jokerGenutzt;
  } catch(e){ /* dann eben ohne */ }
  aktivitaet.geladen = true;
  meilensteinPruefen();
}

/* ---------- Merksatz des Tages ---------- */
function merksatzDesTages(){
  const alle = [];
  for (const [thema, e] of Object.entries(ERKLAERUNGEN))
    (e.regeln || []).forEach(r => { if (r.length > 20 && r.length < 110) alle.push({thema, satz: r}); });
  if (!alle.length) return null;
  const tag = Math.floor(Date.now() / 86400000);
  return alle[tag % alle.length];
}

/* ---------- Empfehlung aus den eigenen Daten ---------- */
function empfehlung(){
  if (!benutzer || !fortschritt.length) return null;
  const mit = fortschritt.filter(z => (z.fehler || 0) > 0);
  if (!mit.length) return null;
  return mit.slice().sort((a,b) =>
    (b.fehler / Math.max(1,b.versuche)) - (a.fehler / Math.max(1,a.versuche)) || b.fehler - a.fehler)[0];
}

/* ---------- Überrasch mich ---------- */
function ueberraschMich(){
  const mitFehlern = fortschritt.filter(z => (z.fehler || 0) > 0 && AUFGABEN[z.thema]);
  if (mitFehlern.length && Math.random() < 0.6){
    starte(pick(mitFehlern).thema); return;
  }
  const alle = Object.keys(AUFGABEN);
  starte(pick(alle));
}

/* ---------- Fortschritt je Fach ---------- */
function fachFortschritt(){
  return Object.entries(KATALOG).map(([fk, f]) => {
    let moeglich = 0;
    for (const liste of Object.values(f.themen)) moeglich += liste.filter(t => AUFGABEN[t]).length;
    const zeilen = fortschritt.filter(z => z.fach === fk);
    const sicher = zeilen.filter(z => z.stufe >= 4).length;
    const begonnen = zeilen.length;
    return {schluessel: fk, name: f.name, moeglich, sicher, begonnen};
  });
}

function begruessung(){
  const h = new Date().getHours();
  if (h < 5)  return "Noch wach";
  if (h < 11) return "Guten Morgen";
  if (h < 14) return "Mahlzeit";
  if (h < 18) return "Guten Tag";
  return "Guten Abend";
}

/* ---------- Was ist wirklich fertig? ----------
   Wird aus dem Katalog und den vorhandenen Aufgaben ausgerechnet.
   Du musst hier also nichts von Hand nachpflegen: sobald du Aufgaben
   für eine Klasse ergänzt, ändert sich der Stand auf der Seite mit. */
function baustelleStand(){
  const faecher = Object.entries(KATALOG).map(([schluessel, f]) => {
    const klassen = [5,6,7,8,9,10].map(k => {
      const liste = f.themen[k] || [];
      const fertig = liste.filter(t => AUFGABEN[t]).length;
      const stand = fertig === 0 ? "geplant" : (fertig < liste.length ? "arbeit" : "fertig");
      return {klasse: k, fertig, gesamt: liste.length, stand};
    });
    const fertig = klassen.reduce((a,z) => a + z.fertig, 0);
    const gesamt = klassen.reduce((a,z) => a + z.gesamt, 0);
    return {schluessel, name: f.name, klassen, fertig, gesamt};
  });
  const fertig = faecher.reduce((a,f) => a + f.fertig, 0);
  const gesamt = faecher.reduce((a,f) => a + f.gesamt, 0);
  return {faecher, fertig, gesamt, prozent: gesamt ? Math.round(fertig / gesamt * 100) : 0};
}

function setSchriftSkala(v){
  const regler = document.querySelector(".schriftregler");
  const vorher = regler ? regler.getBoundingClientRect().top : null;
  einstellungen.schriftSkala = begrenzeSkala(v);
  document.documentElement.style.setProperty("--fs", einstellungen.schriftSkala);
  speichereEinstellungen();
  const anz = document.getElementById("schriftwert");
  if (anz) anz.textContent = Math.round(einstellungen.schriftSkala * 100) + " %";
  if (regler && vorher !== null){
    const diff = regler.getBoundingClientRect().top - vorher;
    if (diff) window.scrollBy(0, diff);
  }
}

function ladebalkenStart(){
  const b = document.getElementById("ladebalken");
  if (!b) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  clearTimeout(ladeT1); clearTimeout(ladeT2); clearTimeout(ladeT3); clearTimeout(ladeT4);
  const z = (min, max) => min + Math.random() * (max - min);   // Zufallswert
  b.style.transition = "none"; b.style.opacity = "1"; b.style.width = "0%";
  void b.offsetWidth;   // Neustart der Animation erzwingen
  /* Stufe 1: zügig auf einen zufälligen Anfangswert */
  b.style.transition = `width ${z(0.2, 0.35).toFixed(2)}s ease, opacity .35s ease`;
  b.style.width = z(30, 55).toFixed(0) + "%";
  /* Stufe 2: langsamer weiter — stockt zufällig bei ~80–92 % (wie echtes Laden) */
  const tMitte = Math.round(z(280, 620));
  const tVoll  = tMitte + Math.round(z(280, 700));
  const tWeg   = tVoll + Math.round(z(160, 320));
  const tReset = tWeg + 400;
  ladeT1 = setTimeout(() => {
    b.style.transition = `width ${z(0.35, 0.7).toFixed(2)}s ease`;
    b.style.width = z(80, 92).toFixed(0) + "%";
  }, tMitte);
  ladeT2 = setTimeout(() => { b.style.transition = "width .2s ease"; b.style.width = "100%"; }, tVoll);
  ladeT3 = setTimeout(() => { b.style.opacity = "0"; }, tWeg);
  ladeT4 = setTimeout(() => { b.style.transition = "none"; b.style.width = "0%"; }, tReset);

/* Adresse zu einer Ansicht (rein, ohne Nebenwirkung) — auch für „Zurück"-Links genutzt */
function pfadFuer(a, f, k){

    case "start":
    case "loesen":
    case "erklaerung":
    case "fertig":       return (f && k) ? "/" + f + "/" + k : "/start";
    case "plan":         return "/plan";
    case "einstellungen":return "/einstellungen";
    case "melden":       return "/hilfe";
    case "feedback":     return "/feedback";
    case "faq":          return "/faq";

    case "anfragen":     return "/anfragen";
    case "serie":        return "/serie";
    case "dashboard":    return "/dashboard";
    case "baustelle":    return "/baustelle";
    case "passwortNeu":  return "/passwort-neu";
    default:             return "/";
  }
}

/* ---------- Hilfsfunktionen ---------- */
/* Mischt die Positionen 0..n-1 zufällig (Fisher-Yates).
   Wird einmal pro Schritt gezogen, damit sich die Reihenfolge
   beim erneuten Zeichnen nach einer falschen Antwort nicht ändert. */
function mischeReihenfolge(anzahl){
  const a = Array.from({length: anzahl}, (_, i) => i);
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function neueReihenfolge(){
  reihenfolge = mischeReihenfolge(aktuell.schritte[schrittNr].optionen.length);
}
function tageBis(z){ return Math.ceil((new Date(z).getTime() - Date.now()) / TAG); }
function wannText(z){
  const t = tageBis(z.naechste_wiederholung);
  if (z.stufe >= 4 && t > 20) return {text:"sitzt", stil:"sitzt"};
  if (t <= 0) return {text:"jetzt fällig", stil:""};
  if (t === 1) return {text:"morgen", stil:"spaeter"};
  if (t < 14) return {text:`in ${t} Tagen`, stil:"spaeter"};
  return {text:`in ${Math.round(t/7)} Wochen`, stil:"spaeter"};
}
function faellig(){ return fortschritt.filter(z => tageBis(z.naechste_wiederholung) <= 0).length; }
function zeileZu(thema){ return fortschritt.find(z => z.thema === thema); }
function anzahlGeplant(){
  let n = 0;
  for (const f of Object.values(KATALOG))
    for (const l of Object.values(f.themen)) n += l.length;
  return n;
}
function anzahlFertig(){ return Object.keys(AUFGABEN).length; }

function uebersetze(m){
  const t = (m||"").toLowerCase();
  if (t.includes("invalid login")) return "E-Mail oder Passwort stimmt nicht.";
  if (t.includes("already registered")) return "Für diese E-Mail gibt es schon ein Konto. Melde dich einfach an.";

async function speichereErgebnis(){

  await db.from("uebungen").insert({
    user_id: benutzer.id, fach: info.fach, klasse: info.klasse, thema: aktuellName,
    geschafft: true, fehlversuche: fehlversuche
  });

  const alt = zeileZu(aktuellName);
  let stufe;
  if (!alt) stufe = fehlversuche === 0 ? 1 : 0;
  else if (fehlversuche === 0) stufe = Math.min(alt.stufe + 1, INTERVALLE.length - 1);
  else stufe = Math.max(alt.stufe - 1, 0);

  await db.from("fortschritt").upsert({
    user_id: benutzer.id, fach: info.fach, klasse: info.klasse, thema: aktuellName,
    stufe: stufe,
    versuche: (alt ? alt.versuche : 0) + 1,
    fehler: (alt ? alt.fehler : 0) + (fehlversuche > 0 ? 1 : 0),
    zuletzt_geuebt: new Date().toISOString(),
    naechste_wiederholung: new Date(Date.now() + INTERVALLE[stufe] * TAG).toISOString()
  }, {onConflict:"user_id,fach,thema"});

  await ladeFortschritt();
  await ladeAktivitaet();

function starte(name, welche){
  aktuellName = name;
  const anzahl = anzahlAufgaben(name);
  if (welche === undefined){
    const alt = zeileZu(name);
    const basis = alt ? alt.versuche : (gastZaehler[name] || 0);
    welche = basis % anzahl;
  }
  variante = welche % anzahl;
  aktuell = baueAufgabe(name, variante);   // Zahlen werden hier frisch gewürfelt
  gastZaehler[name] = (gastZaehler[name] || 0) + 1;
  schrittNr = 0; beantwortet = false; tippOffen = false; fehlversuche = 0;

function antwort(i){
  if (beantwortet) return;
  if (falschGeklickt.includes(i)) return;          // dieselbe falsche Antwort nicht zweimal
  if (aktuell.schritte[schrittNr].optionen[i].ok){
    beantwortet = true;
    render(i);
    return;
  }
  falschGeklickt.push(i);
  fehlerImSchritt++;
  fehlversuche++;
  /* Stufe 1: Tipp erscheint von allein */
  if (fehlerImSchritt === 1 && einstellungen.autoTipp) tippOffen = true;
  /* Stufe 2: Erklärung zum Thema wird angeboten */
  if (fehlerImSchritt === 2) erklaerungAngeboten = true;
  /* Stufe 3: Lösung wird gezeigt, damit niemand hängen bleibt */
  if (fehlerImSchritt >= 3){ aufgeloest = true; beantwortet = true; }
  render(i);
}
function tippModus(){
  if (!aktuell) return false;
  const s = aktuell.schritte[schrittNr];
  if (!istEintippbar(s)) return false;
  if (einstellungen.eingabe === "auswahl") return false;
  if (einstellungen.eingabe === "tippen") return true;
  return schrittNr === aktuell.schritte.length - 1;   // gemischt: nur der letzte Schritt
}

function eingabePruefen(){
  const feld = document.getElementById("antwortFeld");
  if (!feld) return;
  const wert = feld.value.trim();
  if (!wert) return;
  const schritt = aktuell.schritte[schrittNr];
  const erwartet = schritt.tippAntwort || schritt.optionen.find(o => o.ok).t;
  if (eingabePasst(wert, erwartet)){
    beantwortet = true;
    letzteEingabe = wert;
    render();
    return;
  }
  letzteEingabe = wert;
  fehlerImSchritt++;
  fehlversuche++;
  if (fehlerImSchritt === 1 && einstellungen.autoTipp) tippOffen = true;
  if (fehlerImSchritt === 2) erklaerungAngeboten = true;
  if (fehlerImSchritt >= 3){ aufgeloest = true; beantwortet = true; }
  render();
}

function schrittZuruecksetzen(){
  falschGeklickt = []; fehlerImSchritt = 0; aufgeloest = false; erklaerungAngeboten = false; letzteEingabe = "";
}
async function weiter(){
  schrittNr++; beantwortet = false; tippOffen = false;
  schrittZuruecksetzen();
  if (schrittNr < aktuell.schritte.length) neueReihenfolge();
  if (schrittNr >= aktuell.schritte.length){
    ansicht = "fertig"; render();
    await speichereErgebnis();
    render();
    return;
  }
  render();
}

/* ---------- Hauptbereich ---------- */
function render(gewaehlt){
  const kopf = document.getElementById("kopf");
  const fussEl = document.getElementById("fussleiste");

  /* Harte Wartung: gar nichts anderes zeigen. */
  if (WARTUNG_HART){
    if (kopf) kopf.innerHTML = "";
    if (fussEl) fussEl.innerHTML = "";
    const sh = document.getElementById("shell");
    if (sh) sh.classList.add("voll");
    const demo = document.querySelector(".demo");
    if (demo) demo.style.display = "none";
    el.innerHTML = wartungSeiteHtml();
    return;
  }

  if (kopf) kopf.innerHTML = wartungBandHtml() + kopfleisteHtml() + menueHtml() + wartungTorHtml();
  if (fussEl) fussEl.innerHTML = fussleisteHtml();

  /* Der Satz unter dem Inhalt soll den echten Stand zeigen, nicht einen fest
     eingetippten — sonst stimmt er nach dem nächsten Umbau nicht mehr. */
  const demoEl = document.querySelector(".demo");
  if (demoEl){
    const st = baustelleStand();
    demoEl.textContent = WARTUNG
      ? `Stand heute: ${st.fertig} von ${st.gesamt} Themen sind fertig — die übrigen kommen nach und nach.`
      : "";
  }

  /* Wer unten in der Fußleiste etwas anklickt, soll die neue Seite auch sehen
     und nicht erst nach oben wischen müssen. */
  const ansichtWechsel = ansicht !== letzteAnsicht;
  if (ansichtWechsel){
    letzteAnsicht = ansicht;

     auch wenn die Ansicht gleich bleibt (z. B. Klassenwechsel über das Menü). */
  if (ansicht !== "laden"){
    const pfad = aktuellerPfad();
    if (navPop){ letzterPfad = pfad; ladebalkenStart(); }
    else if (ansichtWechsel || pfad !== letzterPfad){ navSpeichern(); letzterPfad = pfad; ladebalkenStart(); }
  }
  renderSeite();
  const shell = document.getElementById("shell");
  shell.classList.toggle("voll", ["laden","willkommen","anmelden","uebersicht","fachwahl","klassenwahl","melden","feedback","faq","ueber","impressum","datenschutz","agb","konto","anfragen","baustelle","serie","passwortNeu","registrieren"].includes(ansicht));

  if (ansicht === "laden"){
    el.innerHTML = `<div class="card"><p class="laden">Einen Moment …</p></div>`;
    return;
  }

  if (ansicht === "willkommen"){ el.innerHTML = willkommenHtml(); return; }
  if (ansicht === "anmelden"){ el.innerHTML = anmeldenHtml(); return; }
  if (ansicht === "registrieren"){ el.innerHTML = registrierenHtml(); return; }

  /* ---- Übersicht: die Startseite der App (siehe start.js) ---- */
  if (ansicht === "uebersicht"){
    el.innerHTML = uebersichtHtml();
    if (benutzer && !aktivitaet.geladen) ladeAktivitaet().then(() => { if (ansicht === "uebersicht") render(); });
    return;
  }

  /* ---- Fachwahl ---- */
  if (ansicht === "fachwahl"){
    el.innerHTML = `
      <div class="card">
        ${navLink("/start", "zurUebersicht()", "← Zur Übersicht", "zurueck")}

      <div class="wahlgitter">

            fertig += liste.filter(t => AUFGABEN[t]).length;
          }
          return navLink(`/${k}`, `waehleFach('${k}')`, `
            <b>${v.name}</b>
            <span>${fertig} von ${gesamt} Themen fertig</span>

        }).join("")}

      <div class="card">
        <p class="small soft" style="margin:0 0 12px">Englisch, Französisch, Geschichte und Erdkunde kommen nach demselben Muster dazu.</p>
        ${navLink("/einstellungen", "zeigeEinstellungen()", "Einstellungen", "btn ghost full")}
        ${navLink("/hilfe", "zeigeMelden()", "Hilfe", "btn ghost full", "margin-top:10px")}
        ${navLink("/feedback", "zeigeFeedback()", "Feedback", "btn ghost full", "margin-top:10px")}
        ${istAdmin ? navLink("/dashboard", "zeigeDashboard()", "Dashboard öffnen", "btn full admin planbtn", "margin-top:10px;text-align:center") : ""}
      </div>`;
    return;
  }

  /* ---- Klassenwahl ---- */
  if (ansicht === "klassenwahl"){
    const themen = KATALOG[fach].themen;
    el.innerHTML = `

  }

  /* ---- Themenliste ---- */
  if (ansicht === "start"){

            zwei Dinge kannst du hier gerade machen.</p>
        </div>

        ${grundlagen.length ? `
        <div class="card">
          <p class="ueberschrift">${SYM.ziel} Damit kommst du jetzt schon weiter</p>
          <p class="small soft" style="margin:0 0 14px">Fast alles in Klasse ${klasse} baut auf diesen Themen auf.
            Wer sie sicher kann, tut sich später deutlich leichter — und genau das kannst du hier schon üben.</p>
          <div class="themen">
            ${grundlagen.map(g => {
              const sicher = g.thema.replace(/'/g,"\\'");
              const n = anzahlAufgaben(g.thema);
              return `<div class="themazeile">
                ${navLink(`/${fach}/${g.klasse}`, `starteThemaAusKlasse('${sicher}')`,
                  `<span>${g.thema}</span><span class="pill neutral">Klasse ${g.klasse}</span>`, "thema")}
                ${hatErklaerung(g.thema) ? `<button class="erklknopf" title="Erklärung" onclick="zeigeErklaerung('${sicher}')">?</button>` : ""}
              </div>`;
            }).join("")}
          </div>
        </div>` : ""}

        ${themenwunschHtml()}`;
      return;
    }

    /* ---- normale Themenliste (mit Wunsch-Feld, wenn noch etwas fehlt) ---- */
    el.innerHTML = `
      <div class="card">
        ${kopf}
        <h1>Such dir dein Thema</h1>
        <p class="soft">Du bekommst nie die Lösung — nur Fragen, die dich hinführen.</p>
      </div>

      <div class="card">
        <div class="themen">
          ${themen.map(t=>{
            const n = anzahlAufgaben(t);
            if (!n) return `<div class="thema aus"><span>${t}</span><span class="pill bald">kommt</span></div>`;
            const z = zeileZu(t);
            let pille;
            if (z){
              const w = wannText(z);
              pille = `<span class="pill ${w.stil === "sitzt" ? "" : "neutral"}">${w.text}</span>`;
            } else {
              pille = `<span class="pill">${n} ${n === 1 ? "Aufgabe" : "Aufgaben"}</span>`;
            }
            const sicher = t.replace(/'/g,"\\'");
            return `<div class="themazeile">
              <button class="thema" onclick="starte('${sicher}')"><span>${t}</span>${pille}</button>
              ${hatErklaerung(t) ? `<button class="erklknopf" title="Erklärung" onclick="zeigeErklaerung('${sicher}')">?</button>` : ""}
            </div>`;
          }).join("")}
        </div>
      </div>

      ${fertig.length < themen.length ? themenwunschHtml(true) : ""}`;
    return;
  }

  /* ---- Plan ---- */
  if (ansicht === "plan"){
    let inhalt;
    if (!benutzer){
      inhalt = `<div class="card">
        <h4 style="margin:0 0 8px">Dafür brauchst du ein Konto</h4>
        <p class="small soft">Ohne Anmeldung kann sich die App nicht merken, was du geübt hast.</p>
        ${navLink("/registrieren", "zeigeRegistrierung()", "Konto anlegen", "btn full", "margin-top:12px")}
      </div>`;
    } else if (!fortschritt.length){
      inhalt = `<div class="card">
        <h4 style="margin:0 0 8px">Noch nichts drin</h4>
        <p class="small soft">Sobald du dein erstes Thema durchgearbeitet hast, taucht es hier auf — mit dem Datum, an dem es wieder dran ist.</p>
        ${navLink("/start", "zurUebersicht()", "Erstes Thema üben", "btn full", "margin-top:12px")}
      </div>`;
    } else {
      inhalt = `<div class="card">
        ${fortschritt.map(z=>{
          const w = wannText(z);
          const fname = KATALOG[z.fach] ? KATALOG[z.fach].name : z.fach;
          return `<div class="zeile">
            <div><b>${z.thema}</b><span>${fname} ${z.klasse} · ${z.versuche}× geübt${z.fehler ? `, ${z.fehler}× gehakt` : ""}</span></div>
            <div class="wann ${w.stil}">${w.text}</div>
          </div>`;
        }).join("")}
      </div>`;
    }
    el.innerHTML = `
      <div class="card">
        <span class="tag">Der eigentliche Trick</span>
        <h1>Dein Wiederholungsplan</h1>
        <p class="soft">Alles, woran du hängengeblieben bist, kommt von allein wieder — nach einem Tag, nach drei Tagen, nach einer Woche, immer weiter auseinander. So lange, bis es sitzt.</p>
      </div>
      ${inhalt}`;
    return;
  }

  if (ansicht === "dashboard"){ el.innerHTML = dashboardHtml(); return; }
  if (ansicht === "konto"){ el.innerHTML = kontoHtml(); return; }
  if (ansicht === "anfragen"){ el.innerHTML = anfragenHtml(); return; }
  if (ansicht === "baustelle"){ el.innerHTML = baustelleSeiteHtml(); return; }
  if (ansicht === "faq"){ el.innerHTML = faqHtml(); return; }
  if (ansicht === "ueber"){ el.innerHTML = ueberHtml(); return; }
  if (ansicht === "impressum"){ el.innerHTML = impressumHtml(); return; }
  if (ansicht === "datenschutz"){ el.innerHTML = datenschutzHtml(); return; }
  if (ansicht === "agb"){ el.innerHTML = agbHtml(); return; }
  if (ansicht === "melden"){ el.innerHTML = meldenHtml(); return; }
  if (ansicht === "feedback"){ el.innerHTML = feedbackHtml(); return; }

  if (ansicht === "passwortNeu"){ el.innerHTML = passwortNeuHtml(); return; }

        <b>${titel}</b>${unter ? `<span>${unter}</span>` : ""}
      </button>`;
    el.innerHTML = `
      <div class="card">
        ${navLink(pfadFuer(vorEinstellungen, fach, klasse), "zurueckVonEinstellungen()", "← Zurück", "zurueck")}
        <span class="tag">Einstellungen</span>
        <h1>Wie hättest du es gern?</h1>
        <p class="soft">Alles hier lässt sich jederzeit wieder ändern.</p>
      </div>

      <div class="card">
        <p class="ueberschrift">Aussehen</p>
        <div class="optionen3">
          ${wahl("modus","hell","Hell","Heller Hintergrund")}
          ${wahl("modus","dunkel","Dunkel","Schont die Augen abends")}
          ${wahl("modus","auto","Automatisch","Wie dein Gerät eingestellt ist")}
        </div>
      </div>

      <div class="card">
        <p class="ueberschrift">Schriftgröße</p>
        <div class="reglerreihe">
          <span class="reglerklein">A</span>
          <input class="schriftregler" type="range" min="${SCHRIFT_MIN}" max="${SCHRIFT_MAX}" step="0.05"
                 value="${einstellungen.schriftSkala || 1}" oninput="setSchriftSkala(this.value)"
                 aria-label="Schriftgröße einstellen">
          <span class="reglergross">A</span>
        </div>
        <p class="small soft" style="margin:12px 0 0;text-align:center">
          Nach rechts wischen = größer, nach links = kleiner · <b id="schriftwert">${Math.round((einstellungen.schriftSkala || 1) * 100)} %</b>
        </p>
        <div class="schriftvorschau">So sieht dein Text in dieser Größe aus.</div>
      </div>

      <div class="card">
        <p class="ueberschrift">Bundesland</p>
        <p class="small soft" style="margin:0 0 12px">Damit wir die Themen später an deinen Lehrplan anpassen können.</p>
        <select class="feld" onchange="setBundesland(this.value)">${bundeslandOptionen()}</select>
      </div>

      <div class="card">
        <p class="ueberschrift">Antworten</p>
        <div class="optionen3">
          ${wahl("eingabe","gemischt","Gemischt","Zwischenschritte auswählen, Ergebnis selbst eintippen")}
          ${wahl("eingabe","auswahl","Immer auswählen","Aus mehreren Möglichkeiten anklicken")}
          ${wahl("eingabe","tippen","Immer eintippen","Schwerer, aber ohne Rateglück")}
        </div>
      </div>

      <div class="card">
        <p class="ueberschrift">Hilfe beim Üben</p>
        <div class="optionen3">
          ${wahl("autoTipp",true,"Tipp kommt von allein","Nach dem ersten Fehler")}
          ${wahl("autoTipp",false,"Tipp nur auf Knopfdruck","Ich will es erst selbst versuchen")}
        </div>
        <p class="small soft" style="margin-top:14px">Nach dem zweiten Fehler wird dir die Erklärung zum Thema angeboten. Nach dem dritten wird die Lösung gezeigt, damit du nicht stecken bleibst.</p>
      </div>`;
    return;
  }

  /* ---- Erklärung ---- */
  if (ansicht === "erklaerung"){
    const e = ERKLAERUNGEN[aktuellName];
    if (!e){
      el.innerHTML = `<div class="card"><h2>Für dieses Thema gibt es noch keine Erklärung</h2>
        ${navLink(pfadFuer(vorErklaerung === "erklaerung" ? "start" : vorErklaerung, fach, klasse), "zurueckVonErklaerung()", "Zurück", "btn full", "margin-top:12px")}</div>`;
      return;
    }
    el.innerHTML = `
      <div class="card">
        ${navLink(pfadFuer(vorErklaerung === "erklaerung" ? "start" : vorErklaerung, fach, klasse), "zurueckVonErklaerung()", "← Zurück", "zurueck")}

        <p class="soft">${e.worum}</p>
      </div>
      <div class="card">
        <p class="ueberschrift">Von vorn erklärt</p>
        ${e.einfach.map(t => `<p class="einfachtext">${t}</p>`).join("")}
      </div>
      ${e.begriffe ? `<div class="card">
        <p class="ueberschrift">Wörter, die du kennen musst</p>

      ${e.bild ? `<div class="card"><p class="ueberschrift">Zum Anschauen</p>${e.bild}</div>` : ""}
      <div class="card">

        <div class="probe">
          <div class="auf" style="font-size:20px">${e.beispiel.aufgabe}</div>

          <div class="ergebnis">${e.beispiel.ergebnis}</div>
        </div>
      </div>
      <div class="card" style="text-align:center">

        <button class="btn" onclick="starte(aktuellName)">Jetzt üben</button>
      </div>`;

  }

  /* ---- Fertig ---- */

      : `<div class="feedback tipp" style="margin-bottom:18px">Ohne Konto wird nichts gespeichert. Mit Konto käme <b>${aktuellName}</b> jetzt auf deinen Wiederholungsplan.</div>`;
    el.innerHTML = `
      <div class="card">
        <span class="tag">Geschafft</span>
        <h1>${aktuell.loesung}</h1>
        <p class="soft">${aktuell.schluss}</p>
